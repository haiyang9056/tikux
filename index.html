过氧化物酶的矿物质是？","o":["碘","铁","硒","锌"],"a":0,"e":"比如铁构成血红蛋白和细胞色素酶系，碘构成甲状腺素和谷胱甘肽过氧化物酶。"},{"q":"书中把激素和酶比作什么？","o":["扩音器","开关","钥匙","发动机"],"a":0,"e":"这些物质就是一些激素和酶。打个比方，激素和酶就相当于“扩音器”，把信息扩大后传出去，让身体内更多的细胞能感知到这个信号。"},{"q":"矿物质构成的“扩音器”开关，其名称是？","o":["酶系统的活化剂","细胞膜的受体","基因的表达子","激素的前体"],"a":0,"e":"矿物质还会构成“扩音器”的开关，这个开关的名称就叫作酶系统的活化剂，如氯离子会激活唾液淀粉酶，盐酸会激活胃蛋白酶，镁离子会激活氧化磷酸化酶类等。"},{"q":"根据原文，氯离子会激活？","o":["唾液淀粉酶","胃蛋白酶","氧化磷酸化酶类","脂肪酶"],"a":0,"e":"这个开关的名称就叫作酶系统的活化剂，如氯离子会激活唾液淀粉酶，盐酸会激活胃蛋白酶，镁离子会激活氧化磷酸化酶类等。"},{"q":"根据原文，盐酸会激活？","o":["胃蛋白酶","唾液淀粉酶","胰蛋白酶","淀粉酶"],"a":0,"e":"如氯离子会激活唾液淀粉酶，盐酸会激活胃蛋白酶，镁离子会激活氧化磷酸化酶类等。"},{"q":"根据原文，镁离子会激活？","o":["氧化磷酸化酶类","胃蛋白酶","唾液淀粉酶","凝血酶"],"a":0,"e":"如氯离子会激活唾液淀粉酶，盐酸会激活胃蛋白酶，镁离子会激活氧化磷酸化酶类等。"},{"q":"矿物质平衡主要强调什么？","o":["种类全面，摄入的数量要与人体需求量相当","只补钙和铁","越多越好","只从药品补充"],"a":0,"e":"矿物质平衡主要强调种类全面，摄入的数量要与人体需求量相当。"},{"q":"补充矿物质的第一条注意事项是？","o":["不要过量，尤其是微量元素","尽量多吃保健品","只补一种即可","饭前空腹补"],"a":0,"e":"第一，不要过量，尤其是微量元素。"},{"q":"微量元素为什么不可过多补充？","o":["其生理剂量与中毒剂量比较接近，摄入过多易产生毒性","价格昂贵","吸收率太低","味道不好"],"a":0,"e":"微量元素在体内虽然需求很少，但其生理剂量与中毒剂量比较接近，摄入过多易产生毒性，如氟中毒、铝中毒、铅中毒。"},{"q":"书中列举的微量元素摄入过多导致的中毒不包括？","o":["钙中毒","氟中毒","铝中毒","铅中毒"],"a":0,"e":"微量元素在体内虽然需求很少，但其生理剂量与中毒剂量比较接近，摄入过多易产生毒性，如氟中毒、铝中毒、铅中毒。"},{"q":"一般认为维持正常生命活动必不可少的微量元素有多少种？","o":["13种","8种","20种","50种"],"a":0,"e":"一般认为维持正常生命活动必不可少的微量元素有铁、锌、碘、氟、铜、钼、锰、铬、镍、钒、锡、硅、钴、硒13种。"},{"q":"以下哪一种不属于书中列出的13种微量元素？","o":["钙","锌","硒","钼"],"a":0,"e":"一般认为维持正常生命活动必不可少的微量元素有铁、锌、碘、氟、铜、钼、锰、铬、镍、钒、锡、硅、钴、硒13种。钙属于常量元素。"},{"q":"补充矿物质的第二条注意事项是？","o":["尽量选择从食物中补充，食补安全吸收好","尽量选择药品补充","选择进口补充剂","按最大剂量补充"],"a":0,"e":"第二，尽量选择从食物中补充。食补安全，吸收好。"},{"q":"补充矿物质的第三条注意事项是？","o":["缺什么补什么","全部补齐","按年龄补","按季节补"],"a":0,"e":"第三，缺什么补什么。一方面，矿物质千万不要乱补，因为吃进去的矿物质要参与生理功能，会对生理代谢产生影响。"},{"q":"多余的矿物质身体努力排出时，首当其冲的器官是？","o":["肾脏","肝脏","肺","脾"],"a":0,"e":"多余的矿物质身体会努力排出，从哪里排呢？首当其冲是肾脏，其次是皮肤。"},{"q":"多余矿物质排出的第二途径是？","o":["皮肤","肾脏","肝脏","肠道"],"a":0,"e":"多余的矿物质身体会努力排出，从哪里排呢？首当其冲是肾脏，其次是皮肤。"},{"q":"矿物质如果在肾脏堆积，轻则和重则分别会怎样？","o":["轻则患上肾结石，重则发生肾功能衰竭、肾癌","轻则乏力，重则发热","轻则浮肿，重则失明","轻则失眠，重则痴呆"],"a":0,"e":"矿物质如果在肾脏堆积，轻则患上肾结石，重则发生肾功能衰竭、肾癌。"},{"q":"书中说汗液中有许多金属毒素，也就是？","o":["矿物质","蛋白质","维生素","脂肪"],"a":0,"e":"所以现在总在讲出汗排毒，汗液中有许多金属毒素就是矿物质。"},{"q":"补充矿物质的第四条注意事项是？","o":["关注自己所处环境","关注自己的年龄","关注自己的体重","关注自己的口味"],"a":0,"e":"第四，关注自己所处环境。地壳中矿物质元素分布不平衡，若表层土壤中某种矿物质元素含量过低或过高，都会导致人群因长期摄入本地的食物或饮用水而引起亚临床症状甚至疾病。"},{"q":"地壳中矿物质元素分布不平衡，若表层土壤中某种元素含量过低或过高，会导致人群？","o":["因长期摄入本地食物或饮用水而引起亚临床症状甚至疾病","立刻发生急性中毒","完全不受影响","对矿物质的吸收能力增强"],"a":0,"e":"若表层土壤中某种矿物质元素含量过低或过高，都会导致人群因长期摄入本地的食物或饮用水而引起亚临床症状甚至疾病。"},{"q":"关于补硒，书中的说法是？","o":["中国硒元素缺乏的地区很少，不是别人要补你就也要补","中国大部分地区都缺硒，人人要补","硒是常量元素，必须大量补","硒只能通过药品补充"],"a":0,"e":"所以不是别人要补硒你也要补硒，实际上中国硒元素缺乏的地区很少。"},{"q":"补充矿物质的第五条注意事项是？","o":["记住自己的基因表达","记住自己的血型","记住自己的体重","记住自己的年龄"],"a":0,"e":"第五，记住自己的基因表达。基因表达能力大多数是从小养成的。"},{"q":"书中说对一个人一生都有影响的是？","o":["妈妈在孕期的食物和婴幼儿时期常吃的食物","成年后的饮食偏好","老年时的饮食习惯","工作后的应酬"],"a":0,"e":"在妈妈肚子里的时候，妈妈爱吃的食物和婴幼儿时期常吃的食物对一个人一生都有影响，这种影响不仅是对味道念念不忘，还表现在吸收和耐受能力上。"},{"q":"根据书中的举例，海边长大的孩子对碘的需求量？","o":["要大于内陆的孩子","要小于内陆的孩子","与内陆的孩子完全相同","完全不需要补碘"],"a":0,"e":"比如从小喝牛奶长大的孩子对各种奶制品都很耐受；海边长大的孩子对碘的需求量要大于内陆的孩子。"},{"q":"从小喝牛奶长大的孩子，其特点是？","o":["对各种奶制品都很耐受","一定不耐受奶制品","对钙的吸收率更低","不需要补充钙"],"a":0,"e":"比如从小喝牛奶长大的孩子对各种奶制品都很耐受；海边长大的孩子对碘的需求量要大于内陆的孩子。"},{"q":"钙在人体内的两种状态是？","o":["游离的和沉积的","离子化的和结晶的","有机的和无机的","水溶的和脂溶的"],"a":0,"e":"钙在人体内有两种状态，即游离的和沉积的。"},{"q":"游离钙（血清钙）约占钙总量的比例是？","o":["1%","10%","50%","99%"],"a":0,"e":"游离的钙简称游离钙，就是在血液中四处飘荡的钙离子，也被称为血清钙，约占钙总量的1%。另外99%的钙沉积在骨骼和牙齿中。"},{"q":"骨骼钙占人体钙总量的比例是？","o":["99%","1%","50%","75%"],"a":0,"e":"另外99%的钙沉积在骨骼和牙齿中，被称为骨骼钙，既起到坚固的作用，同时也是钙的储存形式。"},{"q":"游离钙最重要的功能是？","o":["维持神经肌肉的正常活动","构成骨骼和牙齿","储存钙质","构成细胞膜"],"a":0,"e":"游离的钙虽然只占人体钙总量的1%，却发挥着最重要的功能——维持神经肌肉的正常活动。"},{"q":"如果血清钙浓度下降，会出现什么表现？","o":["神经肌肉的兴奋性增高，表现为肌肉抽搐、神经传导异常","神经肌肉的兴奋性降低，表现为肌肉无力","骨骼立刻变脆","血钙化验结果明显偏低"],"a":0,"e":"如果血清钙浓度下降，神经肌肉的兴奋性会增高，就会表现为肌肉抽搐、神经传导异常。"},{"q":"游离钙除了维持神经肌肉活动，还参与？","o":["凝血过程","氧气的运输","胆汁的分泌","尿液的生成"],"a":0,"e":"此外，游离钙是体内某些重要酶的辅酶，参与凝血过程。如果没有它的参与，血液将不会凝固。"},{"q":"多余的钙主要从哪里排出？","o":["以肠道和汗液排钙为主","以尿液排钙为主","以呼吸排出为主","以头发和指甲排出为主"],"a":0,"e":"多余的钙会通过泌尿系统、肠道和汗腺排出，以肠道和汗液排钙为主。"},{"q":"早期钙缺乏的主要表现是？","o":["神经肌肉的兴奋，但血钙浓度测出来是正常的","骨骼明显变形","血钙浓度明显降低","牙齿全部脱落"],"a":0,"e":"早期钙缺乏主要表现为神经肌肉的兴奋，出现这种症状时身体已缺钙，但是血钙浓度测出来是正常的。"},{"q":"孩子早期钙缺乏的表现不包括？","o":["驼背和身高降低","生长痛","枕秃","出牙晚"],"a":0,"e":"如果是孩子，主要表现为生长痛、枕秃、出汗多、出牙晚。驼背和身高降低属于成年人晚期钙缺乏的表现。"},{"q":"成人和孩子钙缺乏都可能出现的症状是？","o":["腿抽筋、睡眠质量差、烦躁、易怒、出虚汗、过敏","生长痛、枕秃","身材不够高","佝偻病"],"a":0,"e":"成人和孩子都会出现腿抽筋、睡眠质量差、烦躁、易怒、出虚汗、过敏等症状，另外还有一些人会表现为夜里磨牙、肠痉挛等。"},{"q":"以下哪一项属于钙缺乏的表现？","o":["夜里磨牙、肠痉挛","白天嗜睡且不喜活动","面部浮肿","皮肤变黑"],"a":0,"e":"成人和孩子都会出现腿抽筋、睡眠质量差、烦躁、易怒、出虚汗、过敏等症状，另外还有一些人会表现为夜里磨牙、肠痉挛等。"},{"q":"当一个人已经出现骨骼和牙齿缺钙，或因缺钙引起哮喘、血压高等问题时，说明？","o":["身体已经处于晚期钙缺乏","只是早期缺钙","血钙一定正常","与钙无关"],"a":0,"e":"当一个人已经表现出骨骼和牙齿缺钙或者因缺钙引起哮喘、血压高等问题时，说明这个人的身体已经处于晚期钙缺乏。"},{"q":"晚期钙缺乏在儿童主要表现为？","o":["身材不够高，或者佝偻病","生长痛","枕秃","出牙晚"],"a":0,"e":"晚期钙缺乏在儿童主要表现为身材不够高，或者佝偻病。"},{"q":"成年人晚期钙缺乏的表现不包括？","o":["佝偻病","脚后跟疼","驼背、身高降低","胸腰椎的压缩性骨折"],"a":0,"e":"成年人会出现明显的骨质疏松表现，脚后跟疼，驼背，身高降低，髋部的股骨颈骨折，前臂骨折，胸腰椎的压缩性骨折等。佝偻病是儿童晚期钙缺乏的表现。"},{"q":"那位42岁男性崴脚后拍片显示有骨折线，同时还有？","o":["很明显的骨质疏松表现","明显的骨质增生","骨肿瘤","关节脱位"],"a":0,"e":"我有一位朋友，男性，42岁，一次上楼时不小心崴了脚，没想到拍片显示有骨折线，说明有轻度的骨折，同时有很明显的骨质疏松表现。"},{"q":"这位42岁男性认为自己不会骨折的理由是？","o":["不属于老年人或更年期后的女性，且不吃甜食不喝汽水","年轻力壮且天天运动","每天喝牛奶","家族没有骨折史"],"a":0,"e":"他说：“人家说老年人容易骨折，女性更年期后容易骨折，我可不属于这个年龄范围。我还特别注意不吃甜食、不喝汽水，因为人家说吃甜食、喝甜饮料会引起骨质疏松。”"},{"q":"关于喝牛奶，这位42岁男性的观念是？","o":["认为喝牛奶补钙是老年人和小孩的事情","认为牛奶太贵","认为牛奶会引起过敏","认为牛奶影响睡眠"],"a":0,"e":"“我一直认为喝牛奶补钙是老年人和小孩的事情，我这年龄、这身板，正当壮年，所以基本上不喝牛奶。”"},{"q":"作者告诉他，维生素D必须经过哪两个器官的酶转换才能作为激素重新进入循环？","o":["肝脏及肾脏","胃及肠道","脾及胰腺","肺及心脏"],"a":0,"e":"维生素D的活性不高，必须经肝脏及肾脏的酶转换之后作为一种激素重新进入循环，调节钙和磷的吸收，促进骨骼的生长和重构，所以肝脏、肾脏有问题的人也会出现骨质疏松。"},{"q":"为什么肝脏、肾脏有问题的人也会出现骨质疏松？","o":["维生素D必须经肝脏及肾脏的酶转换才能发挥作用","肝脏和肾脏能直接生成钙","肝肾功能差会导致钙摄入减少","肝肾功能差会减少维生素C"],"a":0,"e":"维生素D的活性不高，必须经肝脏及肾脏的酶转换之后作为一种激素重新进入循环，调节钙和磷的吸收，促进骨骼的生长和重构，所以肝脏、肾脏有问题的人也会出现骨质疏松。"},{"q":"作者总结现在中青年出现缺钙的主要原因之一是？","o":["缺乏户外运动，胆固醇不能转化为维生素D3","吃了太多甜食","喝了太多汽水","蛋白质摄入过多"],"a":0,"e":"现在中青年出现缺钙的主要原因一个是缺乏户外运动，胆固醇不能转化为维生素D3，另一个原因是不注意喝牛奶。"},{"q":"晒太阳帮助补钙的原理是？","o":["日光是获取维生素D的简易方法，而维生素D能促进钙沉积在骨头上","阳光能直接把钙送进骨头","晒太阳可增加钙的摄入量","阳光能替代牛奶"],"a":0,"e":"现在的年轻人在室内活动多，缺乏户外运动的机会，而多晒日光是获取维生素D的简易方法。另外钙充足也不一定就不患骨质疏松，人体中要有一定的维生素D才能使吸收的钙质沉积在骨头上。"},{"q":"钙在代谢过程中需要的“合作成员”不包括？","o":["铅","蛋白质","镁、磷、锰、硅、铁","维生素A"],"a":0,"e":"钙在代谢的过程中，以及在保持骨骼健康的过程中需要许多其他营养素的参与，比如蛋白质、维生素D、维生素A、镁、磷、锰、硅、铁，还有肠道微生物的参与，每一个成员都不可缺少。"},{"q":"钙在骨骼健康中需要肠道微生物的参与吗？","o":["需要，肠道微生物也是不可缺少的成员","不需要，只与矿物质有关","只在老年时需要","只在儿童期需要"],"a":0,"e":"钙在代谢的过程中，以及在保持骨骼健康的过程中需要许多其他营养素的参与，比如蛋白质、维生素D、维生素A、镁、磷、锰、硅、铁，还有肠道微生物的参与，每一个成员都不可缺少。"},{"q":"在钙缺乏的六大原因中，“药物影响”指的是？","o":["肾上腺皮质激素","维生素C","胰岛素","葡萄糖"],"a":0,"e":"钙缺乏的原因很多，主要有以下6种情况：……第四，药物影响。比如肾上腺皮质激素的影响。"},{"q":"以下哪些疾病会导致人体出现骨质疏松？","o":["肾功能衰竭和肝功能衰竭","感冒和鼻炎","胃炎和肠炎","近视和远视"],"a":0,"e":"第五，疾病影响。肾功能衰竭和肝功能衰竭时。"},{"q":"在补钙方法上，作者认为非常错误的做法是？","o":["用无机钙代替有机钙","随餐服用钙片","同时补充维生素D","从奶制品中补钙"],"a":0,"e":"第六，补钙方法不对。用无机钙代替有机钙就是非常错误的做法。"},{"q":"根据脚注，无机钙的特点是？","o":["不含蛋白质和营养元素，容易受重金属污染，不容易被人体吸收","含丰富蛋白质，吸收率高","直接从牛奶中提取","专供婴幼儿使用"],"a":0,"e":"无机钙主要有碳酸钙、氯化钙、磷酸钙等，不含蛋白质和营养元素，容易受重金属污染，与人体细胞缺乏亲和力，不容易被人体吸收。"},{"q":"如果一个人的血钙低于正常水平，说明？","o":["人体的代偿能力已经基本失灵","只是轻微缺钙","钙摄入过多","血钙化验不准确"],"a":0,"e":"一个人的血钙低于正常水平时，说明人体的这种代偿能力已经基本失灵，很多症状开始出现。"},{"q":"根据脚注，“代偿能力”是指？","o":["当人体某个器官或组织发生病变时，由原器官的健全部分或其他器官来代替补偿它的功能","人体对药物的解毒能力","人体储存营养素的能力","人体对食物的消化能力"],"a":0,"e":"代偿能力：当人体某个器官或组织发生病变时，由原器官的健全部分或其他器官来代替补偿它的功能。"},{"q":"当身体某种营养素总量不够时，人体的自我调节机制会？","o":["先供给重要器官用，相对不重要的器官组织只好被牺牲掉","平均分配给所有器官","优先储存在脂肪中","完全停止消耗"],"a":0,"e":"人的自我调节机制是当身体中某种营养素总量不够时，要先供给重要器官用，相对不重要的器官组织只好被牺牲掉。于是缺钙时首先是骨头和牙齿做些牺牲，释放出一些钙，保证游离钙的正常。"},{"q":"为什么有的人血钙化验正常却已骨质疏松？","o":["缺钙时骨头和牙齿释放钙来保证游离钙正常","化验结果一定出错","骨质疏松与钙无关","骨骼钙不参与调节"],"a":0,"e":"于是缺钙时首先是骨头和牙齿做些牺牲，释放出一些钙，保证游离钙的正常。所以即使此时这个人血钙检查正常，也可以表现为骨质疏松或牙齿不够坚固。"},{"q":"中国人目前平均每日钙摄入量为？","o":["400毫克","800毫克","1200毫克","1500毫克"],"a":0,"e":"中国人目前平均每日钙摄入量为400毫克，只达到《中国居民膳食指南（2016）》中钙摄入推荐量的一半。"},{"q":"《中国居民膳食指南（2016）》中成人钙摄入推荐量是？","o":["800毫克／日","400毫克／日","1200毫克／日","2000毫克／日"],"a":0,"e":"《中国居民膳食指南（2016）》中成人钙摄入推荐量是800毫克／日，美国的推荐量是1200毫克／日。"},{"q":"美国的钙摄入推荐量是？","o":["1200毫克／日","800毫克／日","400毫克／日","600毫克／日"],"a":0,"e":"《中国居民膳食指南（2016）》中成人钙摄入推荐量是800毫克／日，美国的推荐量是1200毫克／日。"},{"q":"日本从“二战”后就鼓励喝牛奶，其结果是？","o":["现在日本年轻人的身高高出老一辈很多","日本人的钙推荐量最低","日本人普遍缺钙","日本人不吃奶制品"],"a":0,"e":"日本从“二战”后就鼓励喝牛奶，因而现在日本年轻人的身高高出老一辈很多。"},{"q":"钙的最好来源是？","o":["奶和奶制品","红肉","绿叶蔬菜","海产品"],"a":0,"e":"钙的最好来源是奶和奶制品，奶中不但钙含量丰富，而且吸收率也很高，具体包括牛奶、羊奶、驴奶、酸奶、奶酪、奶片，等等。"},{"q":"一般人每天最好喝多少牛奶？","o":["300毫升","100毫升","800毫升","1200毫升"],"a":0,"e":"一般人每天最好喝300毫升牛奶。"},{"q":"在所有奶制品中含钙量最高、同时也好消化的是？","o":["奶酪","牛奶","酸奶","奶片"],"a":0,"e":"如果能够吃奶酪就更好了，因为在所有的奶制品中奶酪含钙量最高，同时也好消化。"},{"q":"不能耐受奶制品的人，可以选择的含钙食物不包括？","o":["精白米面","芝麻、芝麻酱","虾皮、海藻类","大杏仁、西蓝花"],"a":0,"e":"还有一些食物含钙较高，要注意经常摄取，包括芝麻、芝麻酱、虾皮、海藻类（海带、紫菜、裙带菜）、大杏仁、西蓝花、豆类、瓜子，等等。"},{"q":"关于钙的吸收率，书中指出？","o":["动物类食品中的钙比植物类食品中的钙吸收率高","植物类食品中的钙吸收率更高","两者完全相同","与食物种类无关"],"a":0,"e":"需要注意的是动物类食品中的钙比植物类食品中的钙吸收率高。"},{"q":"婴儿对钙的吸收率是？","o":["超过50%","约40%","约20%","约10%"],"a":0,"e":"婴儿对钙的吸收率超过50%，儿童约为40%，成年人仅20%左右。"},{"q":"成年人补钙的吸收率大约是？","o":["20%左右","40%左右","50%以上","80%左右"],"a":0,"e":"婴儿对钙的吸收率超过50%，儿童约为40%，成年人仅20%左右。所以大人和孩子喝同等量的牛奶，大人实际上只吸收了孩子的一半。"},{"q":"作者说“补钙也是有窗口期的”，依据是？","o":["不同年龄对钙的吸收率差别很大","钙的价格随年龄变化","钙的需求随季节变化","钙片有保质期"],"a":0,"e":"婴儿对钙的吸收率超过50%，儿童约为40%，成年人仅20%左右。所以大人和孩子喝同等量的牛奶，大人实际上只吸收了孩子的一半。因此，补钙也是有窗口期的。"},{"q":"菠菜、苋菜、竹笋和葱中的什么物质会影响钙的吸收？","o":["草酸","蛋白质","膳食纤维","维生素C"],"a":0,"e":"比如菠菜、苋菜、竹笋和葱中的草酸可在肠腔内与钙结合成不溶解的钙盐，经肠道排出体外。"},{"q":"关于“吃小葱拌豆腐会得肾结石”的说法，作者认为？","o":["这是错误认知，豆腐中的钙与草酸在胃肠道结合后排出，反而减少得肾结石的机会","完全正确，一定要避免","只对老年人成立","只对儿童成立"],"a":0,"e":"其实这个认知是错误的。豆腐中的钙与草酸会在胃肠道里结合，之后从肠道排出，钙吸收虽然少了，但是也减少了得肾结石的机会。"},{"q":"脂肪影响钙吸收的原因是？","o":["脂肪酶不足时脂肪不被消化形成脂肪泻，脂肪会与钙结合排出体外","脂肪会破坏钙的结构","脂肪会促进钙的排出而不结合","脂肪会阻碍胃酸分泌"],"a":0,"e":"脂肪应该在空肠吸收，但是当脂肪酶不足时，一些脂肪不被消化就会形成脂肪泻，这些脂肪会与钙结合排出体外，影响钙的吸收。"},{"q":"以下哪种药物会影响钙的吸收？","o":["四环素、肝素、抗酸药","维生素D","葡萄糖","氯化钠"],"a":0,"e":"第四，药物。如抗酸药、四环素、肝素会影响钙的吸收。"},{"q":"以下哪种激素会影响钙的吸收？","o":["甲状旁腺素、降钙素和钙调素","胰岛素","肾上腺素","生长激素"],"a":0,"e":"第五，激素。例如，维生素D、甲状旁腺素、降钙素和钙调素等都会影响钙的吸收。"},{"q":"作者总结补钙效果不好，真正的原因是？","o":["与自身的吸收能力有关，跟同时摄入的其他食物或药物有关","食物中钙的含量不够","钙片都是假的","喝水太少"],"a":0,"e":"事实上，补钙效果不好并不是因为食物中钙的含量不够，而是跟自身的吸收能力有关，跟一块儿摄入的其他食物或者药物有关。"},{"q":"成人体内含镁约多少克？","o":["20～30克","2～2.5克","4～5克","20～50毫克"],"a":0,"e":"成人体内含镁20～30克，其中60%以上的镁集中在骨骼和牙齿中，25%分布在肌肉组织中，细胞外液中的镁仅占1%。"},{"q":"人体中的镁主要分布在？","o":["60%以上集中在骨骼和牙齿中","仅占骨骼的1%","全部在细胞外液中","主要储存在肝脏"],"a":0,"e":"成人体内含镁20～30克，其中60%以上的镁集中在骨骼和牙齿中，25%分布在肌肉组织中，细胞外液中的镁仅占1%。"},{"q":"国外科学家研究发现，镁可激活多少个酶系统？","o":["325个","130个","50个","1000个"],"a":0,"e":"国外科学家研究发现，镁可激活325个酶系统，因此把镁称为生命活动的激活剂是当之无愧的。"},{"q":"镁被称为什么？","o":["生命活动的激活剂","生命的燃料","细胞的骨架","代谢的开关"],"a":0,"e":"国外科学家研究发现，镁可激活325个酶系统，因此把镁称为生命活动的激活剂是当之无愧的。"},{"q":"镁主要浓集于哪里，通过消耗镁来促进能量产生？","o":["线粒体","细胞核","高尔基体","溶酶体"],"a":0,"e":"镁，主要浓集于线粒体中，线粒体通过消耗镁来促进能量产生。"},{"q":"细胞外液中的镁虽然只占体内镁总量的1%，其作用是？","o":["与钙、钾、钠离子共同维持神经肌肉的兴奋性，维持心肌正常结构功能与心脏节律","没有任何作用","只参与骨骼构成","只负责储存能量"],"a":0,"e":"细胞外液中的镁虽然只占体内镁总量的1%，却与钙、钾、钠离子共同维持着神经肌肉的兴奋性，维持心肌的正常结构和功能以及心脏活动的正常节律。"},{"q":"镁的排泄以什么为主？","o":["尿液中排出为主，肠道和汗液为辅","汗液中排出为主","肠道排出为主","呼吸排出为主"],"a":0,"e":"当然，镁也是要排泄的，以尿液中排出为主，肠道和汗液排出为辅。"},{"q":"早期缺镁常表现为？","o":["胃肠道的症状，比如厌食、恶心、呕吐","明显的骨痛","皮肤脱皮","视力下降"],"a":0,"e":"早期缺镁常表现为胃肠道的症状，比如厌食、恶心、呕吐等。"},{"q":"镁缺乏加重时出现的神经症状不包括？","o":["嗜睡和昏睡不醒","记忆力减退","精神紧张、易激动","烦躁不安、手足徐动"],"a":0,"e":"镁缺乏加重时会出现相应的神经症状，比如记忆力减退、精神紧张、易激动、神志不清、烦躁不安、手足徐动等症状。严重时，可有癫痫和心律失常发作。"},{"q":"镁缺乏严重时可能出现的后果是？","o":["癫痫和心律失常发作","失明","耳聋","瘫痪"],"a":0,"e":"严重时，可有癫痫和心律失常发作。"},{"q":"书中特别提醒哪类人容易缺镁？","o":["长跑运动员或在闷热潮湿环境中体力活动过多的人","久坐办公的人","不爱喝水的人","素食者"],"a":0,"e":"喜欢长跑的人需要格外注意，因为长跑运动员或在闷热潮湿的环境中体力活动过多的人会出大量的汗，大量的镁随汗液排出，容易引起缺镁，引发上述症状。"},{"q":"含镁多的食物多为？","o":["植物性食物，特别是新鲜的绿叶蔬菜","动物内脏","奶制品","精白米面"],"a":0,"e":"含镁多的食物多为植物性食物，特别是新鲜的绿叶蔬菜。"},{"q":"想补镁，吃绿叶蔬菜时最好怎么处理？","o":["用开水焯一下，以去除草酸、植酸等阻止镁吸收的物质","生吃","长时间炖煮","加醋凉拌"],"a":0,"e":"但是由于新鲜绿叶蔬菜中还含有草酸、植酸等物质，这些物质会阻止镁的吸收，所以想补镁，在吃绿叶蔬菜时最好用开水焯一下。"},{"q":"以下哪类食物含镁丰富且容易吸收？","o":["海带、紫菜和裙带菜等海产品","精米白面","肥肉","甜点"],"a":0,"e":"坚果、粗粮和豆类也不错，海产品中的镁不仅含量高，而且容易吸收，所以大家可以多吃一些海带、紫菜和裙带菜。"},{"q":"为什么爱吃蛋白质和乳类制品的人常常不缺镁？","o":["多摄食蛋白质所分解的氨基酸有利于镁的吸收","乳制品本身含镁极多","蛋白质能替代镁","蛋白质能阻止镁的排出"],"a":0,"e":"蛋白质类也要多吃，因为多摄食蛋白质所分解的氨基酸有利于镁的吸收，临床上爱吃蛋白质和乳类制品的人就常常不缺镁。"},{"q":"镁中毒容易发生在什么情况下？","o":["肾功能不全又需要服用大剂量的药物性镁时","正常人吃含镁食物过多时","吃绿叶蔬菜过多时","喝水过多时"],"a":0,"e":"另外，对正常人来说，由于肾的调节作用，食物中的镁摄入过多一般不会发生镁中毒。但当一个患者肾功能不全，又需要服用大剂量的药物性镁时，就容易发生镁中毒。"},{"q":"对正常人来说，为什么食物中的镁摄入过多一般不会中毒？","o":["由于肾的调节作用","由于肠道的阻挡","由于镁的吸收率极低","由于汗液能全部排出"],"a":0,"e":"对正常人来说，由于肾的调节作用，食物中的镁摄入过多一般不会发生镁中毒。"},{"q":"出现肌肉抽搐（抽筋）时，作者提醒我们脑海中要反应？","o":["一定缺钙，还有可能缺镁","一定是缺钾","一定是受凉","一定是缺钠"],"a":0,"e":"所以如果患者出现肌肉抽搐，就是咱们平时所说的“抽筋”，我们脑海中要反应的是“一定缺钙，还有可能缺镁”。"},{"q":"补钙效果不好时，还应该关注是不是缺？","o":["镁","铁","锌","碘"],"a":0,"e":"所以一来一定要补充钙，二来看看补钙效果；如果补钙效果不好，还要关注是不是缺镁。"},{"q":"人体中铁总量为？","o":["4～5克","2～2.5克","20～30克","20～50毫克"],"a":0,"e":"人体中铁总量为4～5克，包括功能性铁和储存铁。"},{"q":"人体中的铁分为哪两类？","o":["功能性铁和储存铁","血红素铁和非血红素铁","游离铁和结合铁","有机铁和无机铁"],"a":0,"e":"人体中铁总量为4～5克，包括功能性铁和储存铁。"},{"q":"血红蛋白中的铁占铁总量的比例是？","o":["60%～75%","3%～5%","1%","25%"],"a":0,"e":"功能性铁就是身体内正在用的铁，包括血红蛋白（占铁总量60%～75%）、肌红蛋白（占铁总量3%～5%）和各种含铁酶类（占总量1%）中的铁。"},{"q":"肌红蛋白中的铁占铁总量的比例是？","o":["3%～5%","60%～75%","1%","25%"],"a":0,"e":"包括血红蛋白（占铁总量60%～75%）、肌红蛋白（占铁总量3%～5%）和各种含铁酶类（占总量1%）中的铁。"},{"q":"血红蛋白和肌红蛋白在功能上的区别是？","o":["血红蛋白在血液中运输氧气，肌红蛋白在肌肉中运输和储存氧气","血红蛋白储存氧气，肌红蛋白运输氧气","两者都在肝脏中工作","两者都只参与免疫"],"a":0,"e":"它们的功能不同，血红蛋白在血液中运输氧气，肌红蛋白在肌肉中运输和储存氧气，各种酶参与体内的生化反应。"},{"q":"还有近25%的铁以什么形式存在于肝、脾和骨髓中？","o":["铁蛋白和含铁血黄素","血红蛋白和肌红蛋白","氧化铁和氢氧化铁","草酸铁和植酸铁"],"a":0,"e":"除了这些正在用的铁，还有近25%的铁在肝、脾和骨髓中以铁蛋白和含铁血黄素的形式存在。"},{"q":"“没有氧则窒息”的下一句是？","o":["没有铁则缺氧","没有铁则贫血","没有铁则乏力","没有铁则消瘦"],"a":0,"e":"有了氧，三大产能营养素才能燃烧产生能量，维持生命的基本运转。“没有氧则窒息，没有铁则缺氧。”"},{"q":"为什么说铁决定着人体的代谢速度？","o":["铁参与人体很多酶的组成，尤其是氧化呼吸酶类，而酶决定着化学反应的进程","铁直接参与能量的燃烧","铁能提高体温","铁能加速血液循环"],"a":0,"e":"第二，功能性铁参与人体很多酶的组成，尤其是氧化呼吸酶类，而酶决定着化学反应的进程。所以，从这个层面来说，铁决定着人体的代谢速度。"},{"q":"脱氧核糖核酸（DNA）是什么的遗传物质？","o":["细胞","血浆","骨骼","肌肉"],"a":0,"e":"第三，铁还影响蛋白质和脱氧核糖核酸的合成。脱氧核糖核酸其实就是众所周知的DNA——细胞的遗传物质。"},{"q":"若因为缺铁导致遗传物质合成不足，会出现？","o":["肝脏的发育会减慢，影响生长期孩子的身高发育，严重者会导致贫血","骨骼变长","皮肤变白","视力提高"],"a":0,"e":"若因为缺铁导致遗传物质合成不足，则肝脏的发育会减慢，肝细胞及其他细胞内的线粒体与微粒体发生异常，影响生长期孩子的身高发育，严重者会导致贫血。"},{"q":"实验表明缺铁时会出现？","o":["中性粒细胞的杀菌能力降低，淋巴细胞的作用受损","白细胞数量激增","血小板功能增强","红细胞体积增大"],"a":0,"e":"第四，铁和免疫功能也息息相关。实验表明缺铁时，中性粒细胞的杀菌能力降低，淋巴细胞的作用受损，在补充铁后免疫功能可以得到改善。所以，凡是贫血的人，感冒发烧会经常发生。"},{"q":"缺铁最常见的临床症状是？","o":["贫血","骨质疏松","甲状腺肿","夜盲症"],"a":0,"e":"缺铁的临床症状很多，最常见的是贫血。"},{"q":"书中说贫血的发生特点是？","o":["隐伏的，进展缓慢，患者常能很好地适应，不易察觉","突发性的，症状剧烈","一定伴随高热","只在儿童身上出现"],"a":0,"e":"贫血的发生是隐伏的，进展缓慢，患者常能很好地适应，并能继续从事工作，不易察觉。"},{"q":"贫血患者日常可能出现的不适不包括？","o":["血压急剧升高","头晕、头痛","乏力、易倦、心悸","活动后气短、眼花、耳鸣"],"a":0,"e":"但在日常生活中还是会有一些不适，表现出来的症状有头晕、头痛、乏力、易倦、心悸，活动后气短、眼花、耳鸣等。"},{"q":"以下哪一项是缺铁容易被忽视的特殊表现？","o":["匙状指甲（反甲）、口角炎、舌炎","皮肤发黄","眼球突出","关节红肿"],"a":0,"e":"还有一些特殊表现会被忽视：口角炎、舌乳突萎缩、舌炎，严重的缺铁可有匙状指甲（反甲）、食欲减退、恶心及便秘等。"},{"q":"儿童缺铁会导致什么后果？","o":["生长发育迟缓或行为异常，如烦躁、易怒、注意力不集中及学习成绩下降","身高超出同龄人","食欲亢进","睡眠时间延长"],"a":0,"e":"若是儿童缺铁则常发生生长发育迟缓或行为异常，表现为烦躁、易怒、上课注意力不集中及学习成绩下降。"},{"q":"异食癖（如吃冰块、黏土、淀粉）是哪一种营养素缺乏的特殊表现？","o":["铁","钙","锌","碘"],"a":0,"e":"还有一种比较极端的异食癖，是缺铁的特殊表现，但目前其发生的机制仍然不是很清楚。患者常控制不住地拼命进食一种“食物”，如冰块、黏土、淀粉等。"},{"q":"缺铁时身体发出的提醒特征不包括？","o":["皮肤红润有光泽","皮肤黏膜苍白","毛发干枯，口唇角化","指甲扁平、易碎裂"],"a":0,"e":"缺铁不易被察觉，但其实有很多身体特征会提醒我们，如皮肤黏膜苍白，毛发干枯，口唇角化，指甲扁平、失光泽、易碎裂，约18%的患者有反甲，约10%的患者脾脏轻度肿大。"},{"q":"缺铁患者中出现反甲的比例约为？","o":["18%","10%","50%","80%"],"a":0,"e":"约18%的患者有反甲，约10%的患者脾脏轻度肿大。"},{"q":"那位48岁女患者的血色素只有多少克？","o":["8.9克","12克","14克","6克"],"a":0,"e":"淋巴细胞比值很低，说明此患者平时的免疫力很低；血色素只有8.9克，诊断结果很清楚，是营养不良伴有贫血。"},{"q":"那位48岁女患者被诊断为？","o":["营养不良伴有贫血","单纯性肥胖","甲状腺功能亢进","糖尿病"],"a":0,"e":"血色素只有8.9克，诊断结果很清楚，是营养不良伴有贫血。"},{"q":"那位48岁女患者为什么缺铁？","o":["出血多并且不吃红肉，导致身体缺乏蛋白质和卟啉铁","吃得太多","运动过量","睡眠不足"],"a":0,"e":"我明白了，她是出血多并且不吃红肉，导致身体缺乏蛋白质和卟啉铁。"},{"q":"关于鱼虾与铁的关系，正确说法是？","o":["鱼虾里只有很少的铁，总是吃海鲜不吃红肉的人容易出现缺铁性贫血","鱼虾含铁比牛肉高","鱼虾是完全不含铁的","鱼虾的铁最容易被吸收"],"a":0,"e":"第一，鱼虾里只有很少的铁，所以总是吃海鲜不吃红肉的人容易出现缺铁性贫血。"},{"q":"每100克牛肉、鸡肉、鱼肉的含铁量分别是？","o":["3.2毫克、1.4毫克、0.8毫克","0.8毫克、1.4毫克、3.2毫克","1.4毫克、3.2毫克、0.8毫克","3.2毫克、0.8毫克、1.4毫克"],"a":0,"e":"而每100克牛肉里含铁3.2毫克，每100克鸡肉含铁1.4毫克，每100克鱼肉含铁0.8毫克，这说明什么？牛肉含铁量是鱼肉的4倍。"},{"q":"牛肉的含铁量是鱼肉的多少倍？","o":["4倍","2倍","10倍","一样多"],"a":0,"e":"牛肉含铁量是鱼肉的4倍，所以要补铁就要多吃牛肉，而不是像这位患者一样不吃红肉。"},{"q":"法莫替丁这类抑酸药对铁的影响是？","o":["会抑制铁的吸收，缺铁的患者要注意避免服用","会促进铁的吸收","对铁完全没有影响","会增加铁的需要量"],"a":0,"e":"第二，法莫替丁这类抑酸药会抑制铁的吸收，所以缺铁的患者要注意避免服用这类药。"},{"q":"关于鸡蛋补铁，正确说法是？","o":["鸡蛋里的铁含量比较低，不足以满足需求","鸡蛋含铁极高，是最佳补铁食物","鸡蛋中的铁吸收率为100%","鸡蛋不含铁"],"a":0,"e":"第三，鸡蛋里的铁含量比较低，不足以满足患者的需求。因为受到草酸和植酸的影响，植物中的铁吸收率也很低。"},{"q":"血红素铁的吸收特点是？","o":["吸收率比较高，既不受植酸等抑制因素的影响，也不受维生素C等促进因素的影响","吸收率低，需要维生素C辅助","吸收率随植酸含量升高而提高","只能通过药品补充"],"a":0,"e":"血红素铁的吸收率比较高。此种类型的铁既不受植酸等抑制因素的影响，也不受维生素C等促进因素的影响，所以我们会建议贫血的患者首先选择补充血红素铁。"},{"q":"血红素铁存在于哪里？","o":["红细胞和红色的肌肉中，即各类血制品、红肉和肝脏","菠菜等绿叶蔬菜中","牛奶中","豆类和粮食中"],"a":0,"e":"血红素铁存在于红细胞和红色的肌肉中，也就是各类血制品，比如鸭血、血豆腐，以及红肉和肝脏。"},{"q":"铁离子必须与什么结合才能被吸收？","o":["蛋白质等有机物","碳水化合物","脂肪","维生素C"],"a":0,"e":"铁离子必须与蛋白质等有机物结合才能被吸收，而蛋白质普遍存在于肉、蛋、奶等荤腥中，所以吃素的人很容易贫血。"},{"q":"为什么吃素的人很容易贫血？","o":["铁离子必须与蛋白质等有机物结合才能被吸收，而蛋白质普遍存在于肉蛋奶等荤腥中","素食中的铁一定会被草酸破坏","素食者吃得少","素食者不缺维生素C"],"a":0,"e":"铁离子必须与蛋白质等有机物结合才能被吸收，而蛋白质普遍存在于肉、蛋、奶等荤腥中，所以吃素的人很容易贫血。"},{"q":"菠菜中的铁为什么不太容易被吸收利用？","o":["植物中的铁是非血红素铁，菠菜中的植酸、草酸、鞣酸可与非血红素铁形成不溶性的铁盐","菠菜中的铁是血红素铁","菠菜中的铁含量太低","菠菜中的铁被维生素C破坏"],"a":0,"e":"因为植物中的铁是非血红素铁，菠菜中的植酸、草酸、鞣酸等可与非血红素铁形成不溶性的铁盐而阻止铁的吸收，所以植物中的铁吸收利用率比较低。"},{"q":"书中提到的“024”中，“0”指的是？","o":["没有腿的鱼要多吃","不吃任何肉类","零脂肪食物","零糖食物"],"a":0,"e":"我们经常提到的“024”是什么意思呢？0就是没有腿的鱼要多吃，2就是鸡鸭这样的禽类排第二位吃，最后才选择四条腿的猪、牛、羊。"},{"q":"“024”中，“2”指的是？","o":["鸡鸭这样的禽类排第二位吃","每天吃2两肉","只吃2种食物","两周吃一次肉"],"a":0,"e":"0就是没有腿的鱼要多吃，2就是鸡鸭这样的禽类排第二位吃，最后才选择四条腿的猪、牛、羊。"},{"q":"作者希望以后大家能把红肉和鱼肉的摄入比例调整为？","o":["1∶1，贫血的人红肉甚至要更多些","1∶3","3∶1","完全不吃红肉"],"a":0,"e":"但是希望以后大家可以做到将红肉和鱼肉的摄入比例调整为1∶1，对贫血的人来讲红肉甚至要更多些。"},{"q":"碱性药物阻碍铁吸收的机制是？","o":["使非血红素铁形成难溶的氢氧化铁","使铁直接排出体外","破坏血红蛋白","减少铁的摄入"],"a":0,"e":"碱性药物可使非血红素铁形成难溶的氢氧化铁，阻碍铁的吸收。比如一些人有反酸症状时常常服用碳酸氢钠或者抑酸药，升高胃酸的pH值，让胃里不那么酸的同时也阻碍了铁的吸收。"},{"q":"服用碳酸氢钠或抑酸药升高胃酸pH值，容易引起？","o":["缺铁性贫血","高钙血症","碘缺乏","锌中毒"],"a":0,"e":"比如一些人有反酸症状时常常服用碳酸氢钠或者抑酸药，升高胃酸的pH值，让胃里不那么酸的同时也阻碍了铁的吸收，这样容易引起缺铁性贫血。"},{"q":"维生素C与铁同吃的作用是？","o":["促进铁的吸收，是铁吸收的助力剂","阻碍铁的吸收","对铁没有影响","使铁变成氢氧化铁"],"a":0,"e":"维生素C与铁同吃也会促进铁的吸收，它是铁吸收的助力剂。所以补铁的人还要看看自己平时吃水果了吗？B族维生素有没有补充？"},{"q":"成人体内含锌量为？","o":["2～2.5克","4～5克","20～30克","20～50毫克"],"a":0,"e":"成人体内含锌2～2.5克，主要分布于肌肉、骨骼、皮肤，眼组织的视网膜、脉络膜、前列腺以及精液中。"},{"q":"锌在人体中主要分布于？","o":["肌肉、骨骼、皮肤，眼组织的视网膜、脉络膜、前列腺以及精液中","全部集中在血液中","只存在于甲状腺","只储存在肝脏"],"a":0,"e":"成人体内含锌2～2.5克，主要分布于肌肉、骨骼、皮肤，眼组织的视网膜、脉络膜、前列腺以及精液中。"},{"q":"锌的作用不包括？","o":["直接合成维生素D","促进生长发育和组织再生","维持味觉功能与促进食欲","促进胰岛素的正常分泌"],"a":0,"e":"锌的作用非常重要……因为它能促进生长发育和组织再生，对伤口愈合、毛发、指甲及口腔黏膜等多处部位有修补作用，并且可以调节基因表现，维持味觉功能与促进食欲，促进胰岛素的正常分泌，支持增强大脑记忆系统，影响体内维生素A的代谢，参与机体的免疫功能，还是酵素的重要组成成分。"},{"q":"人体内的锌主要从哪里排出？","o":["肠道、泌尿系统和汗腺","只从肾脏排出","只从呼吸排出","只从头发排出"],"a":0,"e":"人体内的锌主要从肠道、泌尿系统和汗腺排出。"},{"q":"锌缺乏的表现不包括？","o":["骨骼过度钙化","生长发育迟缓、食欲不振","味觉减退甚至异食癖","性成熟推迟、第二性征发育不全"],"a":0,"e":"锌缺乏的表现有很多，如生长发育迟缓、食欲不振、味觉减退甚至异食癖（吃一些很怪的东西，比如吃土、吃墙皮）等，还有性成熟推迟、第二性征发育不全、性机能低下。"},{"q":"如果孕妇缺锌，会导致？","o":["胎儿畸形","胎儿过大","孕妇高血压","孕妇贫血"],"a":0,"e":"如果孕妇缺锌，还会导致胎儿畸形。另外，胰岛素功能减退也与锌元素缺乏有关。"},{"q":"补锌首选的食物是？","o":["牡蛎","菠菜","牛奶","米饭"],"a":0,"e":"锌主要存在于动物性食物中，含量最高的是牡蛎，其次是动物内脏，再者是牛、猪、羊肉，蛋类也不错，豆类、粮食、蔬菜、水果中锌含量则很低。"},{"q":"锌含量最高的食物是？","o":["牡蛎","牛肉","鸡蛋","牛奶"],"a":0,"e":"锌主要存在于动物性食物中，含量最高的是牡蛎，其次是动物内脏，再者是牛、猪、羊肉，蛋类也不错。"},{"q":"肉类中锌的吸收率约为？","o":["30%～40%","10%～20%","50%～60%","80%以上"],"a":0,"e":"动物性食物中锌不仅含量高，而且吸收率也比植物性食品高，如肉类中锌的吸收率高达30%～40%，而植物性食物中的锌的吸收率一般只有10%～20%。"},{"q":"植物性食物中锌的吸收率一般为？","o":["10%～20%","30%～40%","50%以上","与肉类相同"],"a":0,"e":"如肉类中锌的吸收率高达30%～40%，而植物性食物中的锌的吸收率一般只有10%～20%。"},{"q":"人体每天对锌的需求量是？","o":["不到15毫克","不到1克","30毫克以上","2.5克"],"a":0,"e":"锌是微量元素，人体每天的需求量不到15毫克。"},{"q":"吃太多补锌保健品会造成什么后果？","o":["锌会在肾脏沉积，造成肾损伤","锌会全部随尿液排出","锌会转化为钙","没有任何影响"],"a":0,"e":"有的人以为锌摄入越多越好，大家千万别忘了，锌是由肾和汗腺排出的，如果吃太多补锌的保健品，锌会在肾脏沉积，造成肾损伤。"},{"q":"以下哪些因素会妨碍锌的吸收？","o":["植酸、膳食纤维以及过多的铜、镉、钙和亚铁离子","维生素D和柠檬酸盐","蛋白质和氨基酸","维生素C"],"a":0,"e":"膳食因素中的植酸、膳食纤维以及过多的铜、镉、钙和亚铁离子等会妨碍锌的吸收，而维生素D、柠檬酸盐等则有利于锌的吸收。"},{"q":"以下哪些因素有利于锌的吸收？","o":["维生素D、柠檬酸盐","植酸、膳食纤维","过多的钙和亚铁离子","过多的铜和镉"],"a":0,"e":"膳食因素中的植酸、膳食纤维以及过多的铜、镉、钙和亚铁离子等会妨碍锌的吸收，而维生素D、柠檬酸盐等则有利于锌的吸收。"},{"q":"成人体内约含碘多少？","o":["20～50毫克","2～2.5克","4～5克","150微克"],"a":0,"e":"成人体内约含碘20～50毫克，其中50%分布在肌肉，20%分布在甲状腺，10%分布在皮肤，6%分布在骨骼。"},{"q":"人体中的碘主要分布在？","o":["50%分布在肌肉，20%分布在甲状腺","全部集中在甲状腺","全部集中在血液","主要分布在骨骼"],"a":0,"e":"成人体内约含碘20～50毫克，其中50%分布在肌肉，20%分布在甲状腺，10%分布在皮肤，6%分布在骨骼，其余存在于其他内分泌腺及中枢神经系统。"},{"q":"血液中的碘主要为蛋白结合碘（PBI），含量为？","o":["40～80微克／升","150微克／升","20～50毫克／升","2～2.5克／升"],"a":0,"e":"血液中的碘主要为蛋白结合碘（PBI），含量为40～80微克／升。"},{"q":"碘在体内主要参与？","o":["甲状腺素的合成","血红蛋白的合成","胰岛素的合成","胃蛋白酶的合成"],"a":0,"e":"碘是大家非常熟悉的一种微量元素，它在体内主要参与甲状腺素的合成。"},{"q":"甲状腺素的生理功能不包括？","o":["合成血红蛋白运输氧气","维持和调节机体的代谢","促进生长发育","对蛋白质、碳水化合物、脂肪的代谢以及水盐代谢都有重要影响"],"a":0,"e":"甲状腺素的生理功能是维持和调节机体的代谢，促进生长发育。它能促进生物氧化，协调氧化磷酸化过程，调节能量的转化，并且对蛋白质、碳水化合物、脂肪的代谢以及水盐代谢都有重要影响。"},{"q":"甲状腺的碘含量为血浆的多少倍以上？","o":["25倍","5倍","100倍","2倍"],"a":0,"e":"甲状腺摄碘能力最强，因此甲状腺碘含量为血浆的25倍以上，可用于合成甲状腺素（T4）和三碘甲状腺原氨酸（T3）。"},{"q":"甲状腺素被分解代谢后，其余碘主要经哪里排出体外？","o":["肾脏","肝脏","皮肤","肺"],"a":0,"e":"甲状腺素被分解代谢后，部分碘被重新利用，其余碘主要经肾脏排出体外。"},{"q":"与其他元素相比，碘的特殊之处是？","o":["缺乏和过量的人群都存在","只会出现缺乏症状","只会出现过量的症状","人体可以自行合成"],"a":0,"e":"其他元素大多只会出现缺乏的症状，而碘不同，缺乏和过量的人群都存在。"},{"q":"缺碘会导致的基础代谢变化是？","o":["生物氧化过程受到抑制，基础代谢率降低","基础代谢率升高","基础代谢完全停止","基础代谢不受影响"],"a":0,"e":"缺碘会使甲状腺素分泌不足，生物氧化过程受到抑制，基础代谢率降低，并可引起甲状腺代偿性增生、肥大，出现甲状腺肿，多见于青春期、妊娠期和哺乳期。"},{"q":"甲状腺肿多见于？","o":["青春期、妊娠期和哺乳期","婴幼儿期","老年期","成年男性"],"a":0,"e":"并可引起甲状腺代偿性增生、肥大，出现甲状腺肿，多见于青春期、妊娠期和哺乳期。"},{"q":"胎儿期和新生儿期缺碘可引起？","o":["呆小症，又称克汀病","佝偻病","夜盲症","坏血病"],"a":0,"e":"胎儿期和新生儿期缺碘还可引起呆小症，又称克汀病。患儿表现为生长停滞、发育不全、智力低下、聋哑，形似侏儒。"},{"q":"呆小症（克汀病）患儿的表现不包括？","o":["身材异常高大","生长停滞","智力低下、聋哑","发育不全、形似侏儒"],"a":0,"e":"患儿表现为生长停滞、发育不全、智力低下、聋哑，形似侏儒。"},{"q":"碘缺乏常具有地区性特点，称为？","o":["地方性甲状腺肿","地方性克汀病","大骨节病","地方性氟中毒"],"a":0,"e":"碘缺乏常具有地区性特点，称为地方性甲状腺肿。内陆山区的土壤和水中含碘较少，食物中碘的含量不高，属于碘缺乏比较高发的地区。"},{"q":"碘缺乏比较高发的地区是？","o":["内陆山区","沿海地区","平原地区","沿海渔村"],"a":0,"e":"内陆山区的土壤和水中含碘较少，食物中碘的含量不高，属于碘缺乏比较高发的地区。"},{"q":"长期大量摄入含碘高的食物以及过量的碘剂，可致？","o":["高碘性甲状腺肿","呆小症","佝偻病","贫血"],"a":0,"e":"如果长期大量摄入含碘高的食物，以及摄入过量的碘剂，均可致高碘性甲状腺肿。"},{"q":"我国建议每日膳食中碘的供给量，成人为？","o":["150微克","200微克","400微克","1200微克"],"a":0,"e":"我国建议每日膳食中碘的供给量为成人150微克，孕妇和哺乳期女性为200微克。"},{"q":"我国建议孕妇和哺乳期女性每日碘的供给量为？","o":["200微克","150微克","100微克","300微克"],"a":0,"e":"我国建议每日膳食中碘的供给量为成人150微克，孕妇和哺乳期女性为200微克。"},{"q":"含碘较多的食物是？","o":["海产食物，如海带、紫菜、海参、海鱼、海虾等","淡水鱼","绿叶蔬菜","精白米面"],"a":0,"e":"含碘较多的食物是海产食物，如海带、紫菜、海发菜、贻贝、海参、干贝、海鱼、海虾、蚶等。"},{"q":"矿物质平衡小结的第一条是？","o":["矿物质必须来自外界，不注意摄入就很容易缺乏","矿物质可以由人体自行合成","矿物质不需要每天补充","矿物质只在生病时才需要"],"a":0,"e":"第一，矿物质因为必须来自外界，所以如果不注意摄入就很容易缺乏，需要重视。"},{"q":"矿物质在人体中的含量是多少，但涉及哪些功能？","o":["含量不到5%，但人体的几乎所有重要功能都会涉及","含量超过50%，只涉及骨骼功能","含量不到1%，只涉及免疫功能","含量约20%，只涉及神经功能"],"a":0,"e":"第二，矿物质在人体中的含量不到5%，但是人体的几乎所有重要功能都会涉及，必须重视。"},{"q":"食物与药品中矿物质营养素的区别是？","o":["从食物中摄取的矿物质一般不会中毒，而通过药品补充的微量元素短时间摄入过多易中毒","两者完全相同","药品比食物更安全","食物比药品更容易中毒"],"a":0,"e":"第三，食物与药品中矿物质营养素的区别。从食物中摄取的矿物质一般不会中毒；而一些微量元素（也属于矿物质），尤其是通过药品来补充的，如果短时间摄入过多易中毒，甚至成为潜在的致癌物质。"},{"q":"微量元素指的是？","o":["占生物体总质量的0.01%以下且为生物体所必需的一些元素","占生物体总质量5%以下的元素","人体内含量最多的元素","只能通过药品补充的元素"],"a":0,"e":"微量元素指的就是占生物体总质量的0.01%以下且为生物体所必需的一些元素，如铁、硅、锌、铜、碘、溴、硒、锰等。"},{"q":"作者说给孩子补充微量元素，家长要做的不是去药店，而是？","o":["平时多下厨房","多买保健品","多做化验","多吃药片"],"a":0,"e":"人体所需的微量元素大多都能在食物中找到。一瓶补铁的口服液其铁元素含量不见得比一根鸡腿的铁含量多，而且鸡肉中的铁是血红素铁，很容易被人体吸收利用。所以，给孩子补充微量元素，家长要做的不是去药店，而是平时多下厨房。"},{"q":"一瓶补铁口服液的铁元素含量与一根鸡腿相比？","o":["不见得比一根鸡腿的铁含量多","一定比鸡腿多好几倍","两者完全相同","鸡腿中不含铁"],"a":0,"e":"一瓶补铁的口服液其铁元素含量不见得比一根鸡腿的铁含量多，而且鸡肉中的铁是血红素铁，很容易被人体吸收利用。"},{"q":"关于植物性与动物性矿物质的差别，书中的结论是？","o":["来自动物类食物中的矿物质更好吸收","来自植物类食物中的矿物质更好吸收","两者吸收率相同","与食物来源无关"],"a":0,"e":"第四，注意食物中植物性与动物性矿物质的差别。矿物质既来自植物类食物，也来自动物类食物。相对来说，来自动物类食物中的矿物质更好吸收。"},{"q":"矿物质平衡小结中提到的两张表格，相关数据引自？","o":["人民卫生出版社2004年出版的《中国营养科学全书》","《中国居民膳食指南（2016）》","美国膳食指南","日本营养学会年报"],"a":0,"e":"注：相关数据均引自人民卫生出版社2004年出版的《中国营养科学全书》。"},{"q":"很多年前，人们对膳食纤维的认识偏颇，认为它是？","o":["食物中最“没营养”的成分","食物中最重要的成分","只能给动物吃的成分","一种药物成分"],"a":0,"e":"很多年前，人们对膳食纤维的认识还有偏颇，认为它是食物中最“没营养”的成分。这些年随着营养学的发展，人们越来越重视膳食纤维在平衡膳食中的作用。"},{"q":"蔬菜里的维生素、矿物质和水在肠道被吸收后，余下的是什么？","o":["膳食纤维","蛋白质","脂肪","淀粉"],"a":0,"e":"蔬菜里的维生素、矿物质和水在肠道被吸收，进入血液，余下的是什么？是膳食纤维。它穿过小肠，来到了大肠。"},{"q":"膳食纤维在大肠里扮演的角色是？","o":["肠道细菌的食物","人体的能量来源","维生素的载体","水分的储存库"],"a":0,"e":"这里有许许多多的细菌开着欢迎大会，喜笑颜开，口水横流，因为它是细菌的食物。"},{"q":"在肠道中能够被细菌发酵分解的膳食纤维被称为？","o":["可溶性膳食纤维","非可溶性膳食纤维","抗性淀粉","纤维素"],"a":0,"e":"在肠道中能够被细菌发酵分解的膳食纤维称为可溶性膳食纤维，它们是肠道细菌的食物，可促进细菌的繁殖，增加粪便中的细菌数量。"},{"q":"不能被细菌发酵、穿肠而过、可以促进肠蠕动加速粪便排泄的是？","o":["非可溶性膳食纤维","可溶性膳食纤维","低聚糖","菊粉"],"a":0,"e":"还有一类膳食纤维不能被细菌发酵，穿肠而过，可以促进肠蠕动，加速粪便的排泄。"},{"q":"可溶性膳食纤维包括？","o":["胶质、树脂、菊粉、低聚糖等","纤维素、半纤维素、木质素、抗性淀粉等","蛋白质、脂肪、维生素","淀粉和糖"],"a":0,"e":"这种可溶性膳食纤维包括胶质、树脂、菊粉、低聚糖等，主要存在于水果、蔬菜、海带、紫菜及豆类中。"},{"q":"非可溶性膳食纤维包括？","o":["纤维素、半纤维素、木质素、抗性淀粉等","胶质、树脂、菊粉、低聚糖等","果胶和树胶","寡糖和糖醇"],"a":0,"e":"它不易被细菌发酵，包括纤维素、半纤维素、木质素、抗性淀粉等，主要存在于粗粮、豆类种子的外皮、植物的茎和叶中。"},{"q":"可溶性膳食纤维主要存在于？","o":["水果、蔬菜、海带、紫菜及豆类中","粗粮和豆类种子的外皮中","精米白面中","肉、鱼、奶中"],"a":0,"e":"这种可溶性膳食纤维包括胶质、树脂、菊粉、低聚糖等，主要存在于水果、蔬菜、海带、紫菜及豆类中。"},{"q":"非可溶性膳食纤维主要存在于？","o":["粗粮、豆类种子的外皮、植物的茎和叶中","水果和蔬菜的果肉中","精白面粉中","动物内脏中"],"a":0,"e":"包括纤维素、半纤维素、木质素、抗性淀粉等，主要存在于粗粮、豆类种子的外皮、植物的茎和叶中。"},{"q":"膳食纤维的四大功能不包括？","o":["提高食物的能量密度","有利于通便","有利于减肥","有利于预防结肠癌"],"a":0,"e":"膳食纤维的四大功能：第一，有利于通便。第二，有利于减肥。第三，有利于预防结肠癌。第四，有利于降低餐后血糖。"},{"q":"不可溶性膳食纤维有利于通便的原理是？","o":["可以加速肠道内容物的排泄","可以杀灭肠道细菌","可以软化粪便中的脂肪","可以增加肠道水分吸收"],"a":0,"e":"第一，有利于通便。不可溶性膳食纤维可以加速肠道内容物的排泄。"},{"q":"膳食纤维有利于减肥的原因是？","o":["膳食纤维多的食物能量密度低，并且有饱腹感","膳食纤维能燃烧脂肪","膳食纤维能抑制食欲中枢","膳食纤维能减少运动量"],"a":0,"e":"第二，有利于减肥。由于膳食纤维多的食物能量密度低，并且有饱腹感，因此适用于减肥。"},{"q":"膳食纤维有利于预防结肠癌的原理是？","o":["益生菌的增加具有保护肠道黏膜和滋养结肠的功效，并可抑制致病菌对结肠黏膜的伤害","膳食纤维能直接杀死癌细胞","膳食纤维能稀释血液","膳食纤维能加快胃排空"],"a":0,"e":"第三，有利于预防结肠癌。益生菌的增加具有保护肠道黏膜和滋养结肠的功效，并且可以抑制致病菌对结肠黏膜的伤害。当结肠细菌得不到可溶性膳食纤维时，会造成益生菌减少，结肠癌的发生率增加。"},{"q":"当结肠细菌得不到可溶性膳食纤维时，会怎样？","o":["益生菌减少，结肠癌的发生率增加","益生菌大量繁殖","结肠蠕动加快","粪便量增加"],"a":0,"e":"当结肠细菌得不到可溶性膳食纤维时，会造成益生菌减少，结肠癌的发生率增加。"},{"q":"膳食纤维有利于降低餐后血糖的原因是？","o":["膳食纤维会减缓食物的吸收速度，从而减缓血糖上升的速度","膳食纤维能分解血糖","膳食纤维能促进胰岛素分泌","膳食纤维能减少糖的摄入"],"a":0,"e":"第四，有利于降低餐后血糖。膳食纤维会减缓食物的吸收速度，因此有利于减缓血糖上升的速度，所以糖尿病人要多吃一些蔬菜、薯类这些含膳食纤维多的食物。"},{"q":"糖尿病人应多吃哪类食物？","o":["蔬菜、薯类这些含膳食纤维多的食物","精白米饭","甜点","肥肉"],"a":0,"e":"所以糖尿病人要多吃一些蔬菜、薯类这些含膳食纤维多的食物。"},{"q":"膳食纤维平衡失调表现为？","o":["摄入过多和摄入不足两种情况","只有摄入过多","只有摄入不足","与摄入量无关"],"a":0,"e":"膳食纤维平衡失调表现为两种情况：摄入过多和摄入不足。"},{"q":"膳食纤维摄入过多主要出现在哪类人群中？","o":["减肥人群","老年人群","婴幼儿","运动员"],"a":0,"e":"摄入过多主要出现在减肥人群中。没错，是减肥，因为食用这样的食物可以增加饱腹感。"},{"q":"长期大量摄入膳食纤维的后果是？","o":["造成身体中其他重要营养素的缺乏，容易造成营养不良","身体越来越健康","血糖持续升高","肠道菌群消失"],"a":0,"e":"的确，这样很快就会瘦下去，但是长期这样会造成身体中其他重要营养素的缺乏。也就是说，如果只想着给细菌吃饭，却忽略了自己身体细胞的需求，容易造成营养不良，严重者会因为缺乏人体必需的营养素而生病。"},{"q":"现在人们容易出现膳食纤维缺乏，与哪些饮食习惯相关？","o":["吃细粮较多、肉类增加、吃菜少、吃水果时削皮","只吃粗粮","只吃蔬菜","不吃主食"],"a":0,"e":"现在人们吃细粮较多，肉类较以前也增加许多。一些人的日常饮食中粮食类只选择米饭、馒头，或者面包、面条，吃菜少，吃水果时还削皮，大大减少了对膳食纤维的摄入。"},{"q":"膳食纤维摄入不足的典型症状不包括？","o":["体重过轻、消瘦乏力","腹胀、肥胖","血糖高","大便干或大便黏"],"a":0,"e":"非常容易出现腹胀，肥胖，血糖高，大便干，或者大便黏的症状。"},{"q":"书中那位32岁男性患者的膳食纤维摄入不到多少克？","o":["10克","25克","30克","35克"],"a":0,"e":"我算了一下，他一天的膳食纤维摄入不到10克（正常人一天要吃30克左右），这种饮食习惯很容易出现大便问题，应该会有便秘腹胀的症状。"},{"q":"书中那位32岁男性患者把以下哪些食物当作蔬菜？","o":["土豆、黄瓜和西红柿","菠菜和油菜","白菜和芹菜","韭菜和豆芽"],"a":0,"e":"他偏爱吃各种粮食类食物，比如米饭一天能吃500克（1斤）。问及蔬菜，他说他可爱吃蔬菜了，比如土豆、黄瓜和西红柿，每次在外面吃饭必点这三样。"},{"q":"《中国居民膳食指南（2016）》要求中国成年人每天应摄入膳食纤维？","o":["25～35克","10克以上","50克以上","4～6克"],"a":0,"e":"《中国居民膳食指南（2016）》要求中国成年人每天应摄入膳食纤维25～35克，而目前中国人平均摄入量仅为13.3克，存在严重不足。"},{"q":"目前中国人膳食纤维的平均摄入量仅为？","o":["13.3克","25克","30克","35克"],"a":0,"e":"《中国居民膳食指南（2016）》要求中国成年人每天应摄入膳食纤维25～35克，而目前中国人平均摄入量仅为13.3克，存在严重不足。"},{"q":"美国人平均每人每天膳食纤维摄入量只有？","o":["4～6克","13.3克","25～35克","50克"],"a":0,"e":"美国人在这方面问题更严重，平均每人每天膳食纤维摄入量只有4～6克，所以美国人结肠癌的发生率很高。"},{"q":"膳食纤维主要分布在哪些食物中？","o":["蔬菜、水果中，精米精面中很少，肉、鱼、奶中没有","肉类中","奶制品中","精米白面中"],"a":0,"e":"膳食纤维主要存在于蔬菜、水果中，精米、精面中很少，肉、鱼、奶中没有。"},{"q":"100克西红柿中膳食纤维只有多少克？","o":["0.5克","2克","5克","10克"],"a":0,"e":"其中，瓜类、茎类蔬菜含水量高，膳食纤维含量并不高，100克西红柿中膳食纤维只有0.5克。"},{"q":"为什么作者建议大家尽量选择叶菜类和菇类蔬菜？","o":["瓜类、茎类蔬菜含水量高，膳食纤维含量并不高","叶菜类蔬菜能量更高","菇类蔬菜含有更多脂肪","茎类蔬菜不能食用"],"a":0,"e":"其中，瓜类、茎类蔬菜含水量高，膳食纤维含量并不高……因此大家还是尽量选择叶菜类和菇类蔬菜。"},{"q":"关于紫菜、海带的膳食纤维含量，说法正确的是？","o":["计算膳食纤维时是在晒干状态下计算的，水泡发后含量会大打折扣","水泡发后含量会成倍增加","晒干状态下含量很低","不受泡发影响"],"a":0,"e":"有一些属于蔬菜但不是新鲜蔬菜的菜类，比如紫菜、海带，计算膳食纤维的时候是在晒干的状态下去计算的，经过水泡发之后，含量也会大打折扣。"},{"q":"作者建议每个人一天最好吃多少蔬菜，其中叶菜占多少？","o":["1斤蔬菜，其中叶菜最好占一半","半斤蔬菜，其中叶菜占三分之一","2斤蔬菜，全部是叶菜","1斤蔬菜，全部是瓜类"],"a":0,"e":"所以，我们每个人一天最好吃1斤蔬菜，其中叶菜最好占一半。"},{"q":"关于水果的吃法，作者建议？","o":["最好是连皮吃，这样膳食纤维可以多吃一些","一定要削皮吃","榨成果汁喝","煮熟了吃"],"a":0,"e":"水果最好是连皮吃，这样膳食纤维可以多吃一些。"},{"q":"主食应选择什么？","o":["全谷类、薯类、根茎类食物","精米精面","面包、蛋糕、饼干","油炸面食"],"a":0,"e":"主食应选择全谷类、薯类、根茎类食物，少吃精米、精面和精面加工制品，比如面包、蛋糕、饼干等。"},{"q":"作者在门诊调查发现，吃蔬菜每天250克以上的人有多少？","o":["不到一半","超过八成","几乎全部","没有一个人"],"a":0,"e":"我在门诊做了些调查，十有八九的人膳食纤维不足，吃蔬菜每天250克以上的人不到一半，大概有一半人做不到每天吃水果。"},{"q":"人的身体中大约有多少是水？","o":["60%左右","30%左右","80%以上","90%以上"],"a":0,"e":"人的身体中60%左右都是水，细胞的新陈代谢、微循环中的物质交换都是在水溶液中进行的。"},{"q":"水在人体内的作用不包括？","o":["直接提供能量","调节体温","运送营养和氧气，排出废物和毒素","润滑和保护组织器官"],"a":0,"e":"在人体内，水还可以调节体温，运送营养和氧气，排出废物和毒素，润滑和保护组织器官。"},{"q":"一个人每日的摄水量总和约为？","o":["2500毫升","1500毫升","1200毫升","500毫升"],"a":0,"e":"一个人每日的摄水量总和约为2500毫升。"},{"q":"人体水来源的三个途径是？","o":["饮水、食物、物质代谢","饮水、呼吸、皮肤","食物、肾脏、大便","呼吸、皮肤、大便"],"a":0,"e":"一个人每日的摄水量总和约为2500毫升，来源有3个：第一，饮水。第二，食物。第三，物质代谢。"},{"q":"通过饮水获得的水大约有多少？","o":["1200毫升","1000毫升","300毫升","1500毫升"],"a":0,"e":"第一，饮水。包括各种各样的水，比如白开水、矿泉水、饮料、茶水，大概有1200毫升。"},{"q":"通过食物获得的水大约有多少？","o":["1000毫升","1200毫升","300毫升","350毫升"],"a":0,"e":"第二，食物。比如萝卜、西红柿等食物中都含有水分，米饭里也含有水分。中国人喜欢喝汤和吃热汤面，还有喝粥，这些食物含水都很多，大约有1000毫升。"},{"q":"通过物质代谢产生的水大约有多少？","o":["300毫升","1000毫升","1200毫升","500毫升"],"a":0,"e":"第三，物质代谢。葡萄糖在线粒体内产生能量的同时会产生水，这些水可以被人体再利用，大约为300毫升。"},{"q":"葡萄糖在线粒体内产生能量的同时会产生？","o":["水","二氧化碳和酒精","乳酸","尿素"],"a":0,"e":"第三，物质代谢。葡萄糖在线粒体内产生能量的同时会产生水，这些水可以被人体再利用，大约为300毫升。"},{"q":"在标准室温20℃左右，水的输出渠道有？","o":["4个：肾脏、呼吸、皮肤、大便","3个：饮水、食物、代谢","2个：尿液和汗液","5个：肾脏、呼吸、皮肤、大便、头发"],"a":0,"e":"在标准室温20℃左右，水的输出总和同样约为2500毫升，渠道有4个：第一，肾脏。第二，呼吸。第三，皮肤。第四，大便。"},{"q":"以尿液形式排出的水一天一般是？","o":["1500毫升左右","500毫升","350毫升","150毫升"],"a":0,"e":"第一，肾脏。以尿液的形式排出，一天一般是1500毫升左右。"},{"q":"人呼吸时从肺脏呼出的水分每天大约是多少？","o":["350毫升","500毫升","150毫升","1500毫升"],"a":0,"e":"第二，呼吸。人呼吸的时候从肺脏会呼出一些水分，每天大约350毫升。"},{"q":"在室温下，人一般一天会通过皮肤蒸发掉多少水分？","o":["500毫升","350毫升","150毫升","1500毫升"],"a":0,"e":"第三，皮肤。在室温下，人一般一天会通过皮肤蒸发掉500毫升水分。夏天多，冬天少，运动量不同，蒸发的水分也不一样，差异很大。"},{"q":"人每天通过大便排出多少水分？","o":["150毫升","350毫升","500毫升","1500毫升"],"a":0,"e":"第四，大便。人每天通过大便排出150毫升水分，但是便秘和腹泻的人差异很大。"},{"q":"当人体中缺水量达到体重的多少时会感到口渴？","o":["2%","10%","20%","50%"],"a":0,"e":"当人体中缺水量达到人体体重的2%时，会感到口渴；到10%时，会烦躁无力，体温升高，血压下降；达到20%就会有生命危险。"},{"q":"当人体缺水量达到体重的10%时，会出现？","o":["烦躁无力，体温升高，血压下降","只有轻微口渴","生命危险","完全无症状"],"a":0,"e":"到10%时，会烦躁无力，体温升高，血压下降；达到20%就会有生命危险。"},{"q":"当人体缺水量达到体重的多少时会有生命危险？","o":["20%","10%","5%","2%"],"a":0,"e":"达到20%就会有生命危险。"},{"q":"哪些人在特殊疾病情况下要注意水是否摄入过多？","o":["肾功能不全的人、心功能不好的人","脑缺血的人","运动中出汗多的人","高血压的人"],"a":0,"e":"比如肾功能不全的人、心功能不好的人要注意水是否摄入过多，因为体内水多了会加重心、肾的负担。"},{"q":"哪类人群最需要水，要注意水是否摄入过少？","o":["脑缺血、运动中出汗多的人","肾功能不全的人","心功能不好的人","甲状腺功能低下的人"],"a":0,"e":"而脑缺血、运动中出汗多的人，要注意水是否摄入过少，因为他们正是最需要水的人群。"},{"q":"那位50多岁男性在爬山途中突发的是什么病？","o":["脑血栓","心肌梗死","低血糖","中暑"],"a":0,"e":"可就在离山顶还有300米的时候，他的左腿开始变得无力，紧接着左胳膊也抬不起来了。他感到头晕目眩，被同事扶着坐到地上，随后立即被用担架抬到附近医院，一检查是脑血栓。"},{"q":"这位50多岁男性脑血栓的病因是？","o":["缺水，没有及时补水","吃得太多","睡眠不足","缺乏锻炼"],"a":0,"e":"我告诉他，病因很清楚，只是缺水，以后不再出现类似缺水的情况就可以了。"},{"q":"一个正常人血管里的血液大概有多少？","o":["5升左右","1升左右","10升左右","2升左右"],"a":0,"e":"一个正常人血管里的血液大概有5升左右，其中将近一半是红细胞、白细胞、血小板，剩下的是血浆。血浆中90%是水。"},{"q":"血浆中水分占多少？","o":["90%","50%","60%","99%"],"a":0,"e":"血浆中90%是水，如果缺水，血浆总量首先会减少，从而引起血容量减少和血液黏度增加。"},{"q":"缺水时血浆总量减少，会引起？","o":["血容量减少和血液黏度增加","血容量增加和血液黏度降低","血压升高","血糖升高"],"a":0,"e":"如果缺水，血浆总量首先会减少，从而引起血容量减少和血液黏度增加。"},{"q":"大脑两个血管交界区容易缺血的原因是什么？","o":["是两个大血管之间的小血管集中部位，缺水时血管中液体量少、压力达不到顶部、黏度高","该区域没有血管","该区域血管特别粗","该区域血液流动最快"],"a":0,"e":"大脑的两个血管交界区是两个大血管之间的小血管集中部位，就很容易发生缺血。"},{"q":"正常情况下，普通人每天应该饮水多少？","o":["1200～1500毫升","2500毫升","500毫升","3000毫升"],"a":0,"e":"正常情况下，普通人每天应该饮水1200～1500毫升，但是天热时要注意多喝水，排汗多或者运动较多的人也要多喝水。"},{"q":"中国人喜欢喝粥、喝汤、吃热汤面，对饮水量的影响是？","o":["能在饮食中摄入较多的水分，单纯从饮水中获得的水可以相应减少","需要喝更多的水","对饮水量没有影响","会让人缺水"],"a":0,"e":"中国人喜欢喝粥、喝汤、吃热汤面，这样能在饮食中摄入较多的水分，那么单纯从饮水中获得的水可以相应减少。"},{"q":"判断一天饮水量是否合适，主要观察哪两项指标？","o":["渴不渴，以及尿液的颜色和排尿量","体重和血压","体温和心率","食欲和睡眠"],"a":0,"e":"主要观察两项指标：一个是看自己渴不渴……另一个是观察尿液的颜色和排尿量。"},{"q":"关于口渴，正确的做法是？","o":["渴了才喝水是不对的，饮水量合适的情况下人不应感觉口渴","一定要等到口渴才喝水","口渴说明身体正常","口渴与饮水无关"],"a":0,"e":"一个是看自己渴不渴，渴了才喝水是不对的。饮水量合适的情况下，人是不应该感觉口渴的。"},{"q":"正常情况下尿液的颜色和一天的排尿量是？","o":["尿液是淡黄色的，一天的排尿量是1500毫升左右","尿液无色，排尿量500毫升","尿液深黄，排尿量2500毫升","尿液红色，排尿量1000毫升"],"a":0,"e":"另一个是观察尿液的颜色和排尿量。正常情况下尿液是淡黄色的，一天的排尿量是1500毫升左右，一般3～4小时排尿一次。"},{"q":"如果半天不想上厕所，或者排出的尿液是深黄色的，说明？","o":["饮水量不足了","饮水过多了","肾功能衰竭","血糖过高"],"a":0,"e":"如果半天不想上厕所，或者排出的尿液是深黄色的，那就说明饮水量不足了；反之，如果频频如厕，且尿液像水一样清，那就喝得有些过多了。"},{"q":"如果频频如厕，且尿液像水一样清，说明？","o":["喝得有些过多了","饮水严重不足","肾脏出现病变","这是正常现象"],"a":0,"e":"反之，如果频频如厕，且尿液像水一样清，那就喝得有些过多了。"},{"q":"关于“每天喝8杯水还是12杯水”，作者的回答是？","o":["因人而异，没有放之四海而皆准的数量，看口渴感觉和尿液的颜色与排尿频率","必须是8杯","必须是12杯","越多越好"],"a":0,"e":"可是到底是8杯水还是12杯水，这是因人而异的，没有放之四海而皆准的数量。我的回答很简单：看自己的口渴感觉，看自己尿的颜色和排尿频率。"},{"q":"人类每一天身体的输出按照基因赋予的任务执行，包括哪四个方面？","o":["能量输出、新陈代谢、修复自身结构、免疫防卫","呼吸、心跳、消化、排汗","运动、思考、睡眠、进食","生长、发育、繁殖、衰老"],"a":0,"e":"人类每一天身体的输出都是按照基因赋予我们的任务去执行，包括四个方面：能量输出、新陈代谢、修复自身结构和免疫防卫。"},{"q":"吸烟的人身体中自由基过多，需要多补充什么？","o":["抗氧化剂，最常见的是维生素A、C、E","蛋白质","脂肪","碳水化合物"],"a":0,"e":"也有一些需要额外消耗的事情，比如吸烟的人身体中自由基过多，要多补充抗氧化剂去对抗自由基。最常见的抗氧化剂是维生素A、C、E，所以吸烟的人摄入维生素A、C、E要比一般人多一些。"},{"q":"为什么很多吸烟的人得病概率高？","o":["身体内自由基多，且往往特别不喜欢吃水果，对身体的伤害大","吸烟的人运动少","吸烟的人蛋白质摄入不足","吸烟的人喝水少"],"a":0,"e":"但是我们往往看到很多吸烟的人特别不喜欢吃水果，于是，身体内自由基多，对身体的伤害大，得病的概率就高。"},{"q":"一个人每天的生命原料输入只有一个渠道，就是？","o":["吃，通过每一餐摄取大自然的营养素","呼吸","喝水","睡眠"],"a":0,"e":"一个人每天的生命原料输入只有一个渠道，就是吃，通过每一餐摄取大自然的营养素来满足自己身体输出的需求。"},{"q":"睡眠的作用，从营养角度看是？","o":["让身体放松，给自身身体一个用营养素来修复的时间","让营养素被排出","让身体停止消耗","让营养素转化为脂肪"],"a":0,"e":"睡眠是让身体放松，给自身身体一个用营养素来修复的时间。"},{"q":"人的身体状况平衡可分为哪两种？","o":["高平衡和低平衡","高平衡和负平衡","正平衡和负平衡","快平衡和慢平衡"],"a":0,"e":"人的身体状况平衡可分为两种：高平衡和低平衡。"},{"q":"运动多、思考多、饮食不挑嘴、荤素通吃，能保持标准体重和旺盛精力，这属于？","o":["高平衡","低平衡","出大于入","入大于出"],"a":0,"e":"运动多，思考多，饮食不挑嘴，荤素通吃，能够保持标准的体重和旺盛的工作精力，这叫高平衡。"},{"q":"不爱运动、也不爱动脑子，每样都吃一点、荤素通吃，体重正常化验正常，但动作总像慢半拍，这属于？","o":["低平衡","高平衡","出大于入","不平衡"],"a":0,"e":"不爱运动，也不爱动脑子，吃饭时每样都吃一点，也是荤素通吃，体重正常，化验正常，但是这个人的动作总像是慢半拍，有点与世无争的样子，这叫低平衡。"},{"q":"身体状况不平衡有哪两种？","o":["出大于入和入大于出","高平衡和低平衡","正平衡和反平衡","快和慢"],"a":0,"e":"身体状况不平衡也有两种：出大于入和入大于出。"},{"q":"在能量方面消耗＞摄入，这个人会？","o":["比较瘦","发胖","体重正常","水肿"],"a":0,"e":"出大于入，即消耗＞摄入：在能量方面消耗＞摄入，这个人会比较瘦。"},{"q":"在营养素方面消耗＞摄入，长期的结果是？","o":["体内的营养素亏空，各种疾病随之而来","身体越来越强壮","不会有任何影响","自动提高吸收率"],"a":0,"e":"在营养素方面消耗＞摄入，长此以往，体内的营养素亏空，各种疾病也会随之而来。"},{"q":"在能量方面摄入＞消耗，结果是？","o":["身材肯定会发胖","会变瘦","体重不变","会水肿"],"a":0,"e":"入大于出，即摄入＞消耗：在能量方面摄入＞消耗，身材肯定会发胖。"},{"q":"“如果这顿饭吃肉多了”为什么不用怕吸收不了？","o":["人体有非常精准的自我调整能力，吃不下是胃蛋白酶和脂肪酶饱和的信号","多吃肉不会影响身体","多余的肉会自动排出","人体可以无限分解蛋白质"],"a":0,"e":"很多人之所以有这个顾虑，一个重要的原因是不知道人体有非常精准的自我调整能力：当肉吃多了，吃不下的时候，是因为胃里的胃蛋白酶已经饱和，不能再分解蛋白质；肠道的脂肪酶和胆汁饱和，不能再分解脂肪。"},{"q":"当肉吃多了吃不下时，接下来几天身体会？","o":["自然多吃蔬菜、水果和粮食","继续想吃肉","完全没有食欲","开始腹泻"],"a":0,"e":"此时你的感觉是今天吃顶了，于是后面几天自然会多吃蔬菜、水果和粮食。又过了几天，胃肠道产生了新的蛋白酶和脂肪酶，又想吃肉了，于是就可以继续吃肉类，这样身体才能一直保持总平衡。"},{"q":"孩子一出生就有的自主反射能力是指？","o":["吃奶吃饱了就会立即停止吃奶","必须按时喂奶","只能吃母乳","会自动拒绝所有食物"],"a":0,"e":"是呀，吃不下了，这是人与生俱来的自我调节能力。孩子一出生就有这个自主反射能力，吃奶吃饱了，孩子就会立即停止吃奶，安安静静地去睡觉。"},{"q":"如果一个孩子喊着要吃肉、要吃鸡蛋，吃得比大人多，还消化得了不积食、人也不胖，说明？","o":["这段时间他的需求量大，消化酶也足够","孩子生病了","孩子会发胖","孩子缺乏蛋白质"],"a":0,"e":"如果一个孩子喊着要吃肉、要吃鸡蛋，吃得比大人多，而且消化得了，还不积食，人也不胖，说明这段时间他的需求量大，他的消化酶也足够。"},{"q":"夏天大家都特别想吃西瓜，作者的解释是？","o":["身体在说：“我需要。”","西瓜含糖高","西瓜便宜","西瓜能解暑"],"a":0,"e":"夏天，大家都特别想吃西瓜，为什么？因为身体在说：“我需要。”"},{"q":"夏天吃羊肉、牛肉少，作者的解释是？","o":["身体在说：“我消化不了，秋天再吃吧。”","肉不新鲜","肉太贵","吃肉会中暑"],"a":0,"e":"夏天吃羊肉、牛肉少，也是身体在说：“我消化不了，秋天再吃吧。”"},{"q":"作者说许多人不敢吃这个、不敢吃那个，本质上是？","o":["主观意识控制了人体的自主反射，却忘记了身体拥有自己的智慧","身体真的不能消化","营养学知识丰富","消化酶完全缺乏"],"a":0,"e":"许多人不敢吃这个，不敢吃那个，不是不想吃，是不敢吃，是主观意识控制了人体的自主反射，却忘记了身体拥有自己的智慧。"},{"q":"肠道黏膜铺展开来面积可达多少？","o":["200～400平方米","20～40平方米","2～4平方米","1000平方米"],"a":0,"e":"肠道黏膜有个特殊功能，叫作营养素的调节功能。肠道黏膜铺展开来面积可达200～400平方米，专门负责筛选可以吸收的营养素。"},{"q":"肠道黏膜的特殊功能是？","o":["营养素的调节功能，能判断血液里缺哪种营养素，缺得多的就多吸收","储存粪便","分泌胃酸","过滤毒素"],"a":0,"e":"肠道黏膜有个特殊功能，叫作营养素的调节功能……同时它还能自己判断血液里缺哪种营养素，缺得多的就多吸收，缺得少的就少吸收，因此各种营养素在不同人不同时期之间的吸收率能差很多倍。"},{"q":"血糖高了说明？","o":["碳水化合物吃多了","含嘌呤的食物吃多了","蛋白质吃多了","脂肪吃多了"],"a":0,"e":"还有一些信号会告诉我们吃多了：血糖高了，说明碳水化合物吃多了；尿酸高，说明含嘌呤的食物吃多了；血压高可就不一定，它的影响因素太多了。"},{"q":"尿酸高说明？","o":["含嘌呤的食物吃多了","碳水化合物吃多了","脂肪吃多了","水喝少了"],"a":0,"e":"还有一些信号会告诉我们吃多了：血糖高了，说明碳水化合物吃多了；尿酸高，说明含嘌呤的食物吃多了；血压高可就不一定，它的影响因素太多了。"},{"q":"关于血压高，作者认为？","o":["影响因素太多了，不能简单地归结为某一种食物吃多了","一定是盐吃多了","一定是肉吃多了","一定与饮食无关"],"a":0,"e":"血压高可就不一定，它的影响因素太多了。"}],"multis":[{"q":"按照“寿命等于成熟期的5～7倍者为长寿”的说法，人类应该能活到多少岁？","o":["100岁","175岁","100～175岁","80多岁"],"a":[0,1,2],"e":"国际上有个标准，寿命等于成熟期的5～7倍者为长寿。按照这个说法，长寿之人应该能活到100～175岁。"},{"q":"《世界卫生统计报告（2015）》中的人均寿命数据，正确的有？","o":["中国女性77岁，男性74岁","日本国民平均寿命84岁，全世界排名第一","美国女性81岁，男性76岁","中国人均寿命已经超过日本"],"a":[0,1,2],"e":"中国在此次报告中的人均寿命为：女性77岁，男性74岁。咱们的邻居日本，人均寿命在全世界排名第一，国民平均寿命为84岁……该报告上显示美国女性的平均寿命为81岁，男性为76岁，依然超过了我们。"},{"q":"关于细胞的生命周期，正确的有？","o":["血管的内皮细胞1天就会死亡","胃黏膜细胞3～5天更替一次","肺表面的细胞寿命是2～3周","大脑细胞大约每20年更新一次"],"a":[0,1,2],"e":"比如血管的内皮细胞1天就会死亡；胃黏膜细胞3～5天更替一次；肺表面的细胞寿命是2～3周；皮肤最外面的角质层细胞28天左右就要换新；肝细胞能存活150天左右；心脏细胞更新速度要慢很多，大约需要20年；而大脑细胞一生一世不再更新。"},{"q":"关于人体细胞更新的描述，正确的有？","o":["皮肤最外面的角质层细胞28天左右就要换新","肝细胞能存活150天左右","心脏细胞更新大约需要20年","大脑细胞更新最快，约7天一次"],"a":[0,1,2],"e":"皮肤最外面的角质层细胞28天左右就要换新；肝细胞能存活150天左右；心脏细胞更新速度要慢很多，大约需要20年；而大脑细胞一生一世不再更新。"},{"q":"属于“慢病”的疾病有？","o":["冠心病、高血压、糖尿病","肿瘤、抑郁症","气管炎、哮喘、慢性肾病","车祸造成的骨折"],"a":[0,1,2],"e":"我们最常见的冠心病、高血压、糖尿病、肿瘤、抑郁症、气管炎、哮喘、慢性肾病等疾病，都是由不恰当的生活方式引起的，医学工作者将这些疾病统一归类为慢性非传染性疾病，简称“慢病”。"},{"q":"关于慢病的统计数据，正确的有？","o":["中国每5人中就有1人确诊为慢病患者","慢病导致的死亡人数占中国总死亡人数的85%","慢病的医疗花费大，死亡率、残疾率高","慢病导致的死亡和残疾人数少于车祸和战争"],"a":[0,1,2],"e":"治疗慢病的医疗花费大，死亡率、残疾率高，比车祸、战争造成的死亡和残疾人数还要多得多。据统计，中国每5人中就有1人确诊为慢病患者，慢病导致的死亡人数占中国总死亡人数的85%。"},{"q":"为什么对抗疗法不适用于慢病？","o":["对抗疗法以前是用来针对外来因素给人体造成的疾病","慢病是行为方式错误造成的，矫正错误行为才是根本","慢病源于各种不平衡的长期累加","慢病和生活方式没有关系"],"a":[0,1,2],"e":"治疗方向错了——这种对抗疗法以前是用来针对外来因素给人体造成的疾病……慢病是行为方式错误造成的，矫正错误行为才是根本。"},{"q":"属于身体向我们发出的亚健康求救信号的有？","o":["易疲劳、疼痛、过敏","咳嗽、便秘、腹泻","血压增高、血糖上升","身高突然变高"],"a":[0,1,2],"e":"此时会出现一些我们常说的亚健康状态，正是身体向我们发出的求救信号，如易疲劳、疼痛、过敏、咳嗽、便秘、腹泻、血压增高、血糖上升……"},{"q":"在细胞损伤与修复的“天平”中，属于左边砝码（损伤和消耗）的有？","o":["睡眠","运动","吸烟、饮酒","饮食"],"a":[0,1,2],"e":"就如同一个天平，左边有五个砝码——睡眠、运动、吸烟、饮酒、心态，右边只有一个砝码——饮食，左边的错误累加都会要求右边砝码加重。"},{"q":"人体细胞的自我修复能力取决于？","o":["与生俱来的细胞生命周期（先天因素），决定修复速度","后天的营养状况（后天因素），决定修复质量","每天的喝水量","居住地的气候"],"a":[0,1],"e":"人体细胞的自我修复能力取决于两个主要因素，一个是与生俱来的细胞生命周期，另一个是后天的营养状况，即先天因素和后天因素。先天因素（细胞固有的更新周期）决定了修复速度，后天因素（营养状态）决定了修复质量。"},{"q":"以下哪些情况属于“细胞损伤程度已到无可挽回”的严重损伤？","o":["肾功能衰竭","已经心肌梗死的组织","脑血栓之后坏死的脑组织","普通感冒引起的暂时乏力"],"a":[0,1,2],"e":"当然这里有一个前提，就是细胞损伤程度还不到无可挽回的情况下。有些严重损伤是无法再修复的，比如肾功能衰竭、已经心肌梗死的组织、脑血栓之后坏死的脑组织等。"},{"q":"七大营养素包括？","o":["碳水化合物、蛋白质、脂类","维生素、矿物质","膳食纤维、水","酒精和咖啡因"],"a":[0,1,2],"e":"这些营养，从临床医学角度准确地描述，叫作七大营养素，包括：碳水化合物……蛋白质……脂类……维生素……矿物质……膳食纤维……水。"},{"q":"关于脂类的分类，正确的有？","o":["分为脂肪和类脂","脂肪又叫甘油三酯，分为必需脂肪酸和非必需脂肪酸","类脂包括磷脂、胆固醇、胆固醇脂、糖脂","类脂占脂类的绝大部分"],"a":[0,1,2],"e":"脂类（分为脂肪和类脂，脂肪又叫甘油三酯，分为必需脂肪酸和非必需脂肪酸；类脂包括磷脂、胆固醇、胆固醇脂、糖脂）。脂类中包括脂肪和类脂，其中类脂只占5%。"},{"q":"基础代谢是指？","o":["一个人躺着不动、室温保持在20～25℃时测出来的能量消耗","一般男性为1400千卡／天左右","一般女性在1300千卡／天左右","运动时消耗的能量"],"a":[0,1,2],"e":"一个人如果躺着不动，室温保持在20～25℃，测出来的能量消耗称为基础代谢。一般来讲，男性为1400千卡／天左右，女性在1300千卡／天左右。"},{"q":"用脑越多，越需要多补充哪些营养素？","o":["蛋白质、维生素、矿物质","脂类中的胆固醇、磷脂","DHA和EPA","酒精"],"a":[0,1,2],"e":"第二，心理方面。大脑消耗的营养素与肌肉消耗的营养素不一样，用脑越多越需要多补充蛋白质、维生素、矿物质，还有脂类中的胆固醇、磷脂和大家都很关注的DHA和EPA。"},{"q":"熬夜会额外消耗哪些营养素？","o":["维生素A","维生素B族","磷脂和蛋白质","膳食纤维"],"a":[0,1,2],"e":"第三，熬夜。消耗的营养素会更多，如维生素A、维生素B族、磷脂和蛋白质等。"},{"q":"关于吸烟与喝酒对营养素的影响，正确的有？","o":["吸烟需要更多的抗氧化剂来对抗尼古丁等毒素的伤害","喝酒伤肝，需要更多营养素来修复肝脏细胞","喝酒需要补充维生素B族和蛋白质","喝酒有益于肝脏细胞的修复"],"a":[0,1,2],"e":"第四，吸烟。需要更多的抗氧化剂来对抗尼古丁等毒素对人体的伤害。第五，喝酒。伤肝，需要更多的营养素来修复肝脏细胞，如维生素B族和蛋白质。"},{"q":"关于每天吃盐不超过6克的说法，作者的观点是？","o":["这个标准不能一概而论","在南方潮湿闷热的地区，尤其是夏天，就不能要求一定要低于6克","北方人以及整天在空调房间里工作不出汗的人一定要减少盐的摄入","无论什么地区都必须严格执行6克标准"],"a":[0,1,2],"e":"比如，我们现在都提倡低盐，要求每天吃盐不要超过6克。但是，在南方潮湿闷热的地区，尤其是夏天，就不能要求一定要低于6克了……但是北方人以及整天在空调房间里工作不出汗的人就一定要减少盐的摄入。"},{"q":"福建地区急诊室出现较多低钠血症老年患者的原因包括？","o":["当地潮湿闷热，人们本来就出汗多","许多老年人不习惯家里开空调，还每天出去运动","随汗液流失的钠盐多，又讲究吃少盐清淡的食物","当地食物中普遍不含有钠"],"a":[0,1,2],"e":"就是因为福建地区潮湿闷热，人们本来就出汗多，再加上许多老年人不习惯家里开空调，而且每天出去运动，随汗液流失的钠盐就多。老年人又讲究要吃少盐清淡的食物，如果不注意及时补充钠盐，人们很容易在大汗后出现低钠血症。"},{"q":"关于细胞膜的成分，正确的有？","o":["磷脂所占的比例较高，占50%～70%","胆固醇占30%左右","蛋白质占20%左右","糖类物质占膜重的50%以上"],"a":[0,1,2],"e":"如果我们把一个人身上所有细胞的膜收集起来进行检测，我们会发现里面实际上主要是三种成分：蛋白质、磷脂、胆固醇。磷脂所占的比例较高，占50%～70%，胆固醇占30%左右，蛋白质占20%左右。还有一点糖类物质，如糖蛋白或糖脂，占膜重的2%～10%。"},{"q":"关于线粒体产生能量，正确的有？","o":["线粒体一般情况下燃烧的是葡萄糖","当葡萄糖不足时燃烧脂肪","蛋白质不能直接被燃烧，要在肝脏中转化成葡萄糖以后才能成为能量","蛋白质可以直接在线粒体中被燃烧供能"],"a":[0,1,2],"e":"所有的细胞工作都需要能量，负责产生能量的线粒体很像工厂的大锅炉，这个大锅炉里一般情况下燃烧的是葡萄糖（碳水化合物中的一种）。当葡萄糖不足时燃烧脂肪，蛋白质不能直接被燃烧，要在肝脏中转化成葡萄糖以后才能成为能量。"},{"q":"七大营养素为细胞新陈代谢提供的支持包括？","o":["为细胞新陈代谢提供能量","为新生细胞更新提供结构原料","为新陈代谢提供媒介","直接替代DNA的遗传功能"],"a":[0,1,2],"e":"第一，为细胞新陈代谢提供能量。第二，为新生细胞更新提供结构原料。第三，为新陈代谢提供媒介。第四，养肠道细菌。"},{"q":"关于酶和辅酶，正确的有？","o":["酶的主体部分是蛋白质","辅酶的主要成分是维生素和矿物质","新陈代谢速度越快，需要的酶越多","辅酶的主体部分是脂类"],"a":[0,1,2],"e":"人的新陈代谢是在酶的催化下完成的。新陈代谢速度越快，需要的酶越多。酶是从哪里来的呢？是食物中的营养转化的。酶的主体部分是蛋白质，辅助部分叫作辅酶，辅酶的主要成分是维生素和矿物质。"},{"q":"关于激素的分类，正确的有？","o":["甲状腺素、胰岛素属于蛋白质类激素","肾上腺素属于胆固醇类激素","吃鸡蛋、内脏、肉类可提供形成激素的前体","激素全部属于蛋白质类"],"a":[0,1,2],"e":"内分泌系统是调节细胞代谢的重要角色，而激素分为蛋白质类激素和胆固醇类激素，比如甲状腺素、胰岛素都属于蛋白质类激素，肾上腺素就属于胆固醇类激素。所以说一个人吃动物性食品，比如鸡蛋、内脏、肉类，里面有蛋白质和胆固醇，这些正好是形成激素的前体。"},{"q":"关于人体内的细菌，正确的有？","o":["人体由40万亿～60万亿个细胞组成","人身上的细菌数量是人体细胞数量的10倍","细菌主要在肠道里","肠道里的细菌靠食物中的蛋白质养活"],"a":[0,1,2],"e":"人体由40万亿～60万亿个细胞组成，而我们身上的细菌数量是人体细胞数量的10倍，并且主要在肠道里，肠道里的细菌靠食物中的膳食纤维养活。"},{"q":"食物进到人体中有哪几个主要去向？","o":["给细胞提供能量","成为细胞结构","调节细胞代谢、养肠道菌群","直接变成人体的遗传物质"],"a":[0,1,2],"e":"总结起来，食物进到人体中有四个主要去向：给细胞提供能量、成为细胞结构、调节细胞代谢、养肠道菌群。"},{"q":"以下对应关系正确的有？","o":["给细胞提供能量——主要靠碳水化合物类","成为细胞结构——主要靠蛋白质类和脂类","调节细胞代谢——蛋白质类和胆固醇类，还有维生素、矿物质","养肠道菌群——主要靠蛋白质"],"a":[0,1,2],"e":"给细胞提供能量——主要靠碳水化合物类，也就是粮食、水果等。成为细胞结构——主要靠蛋白质类和脂类，主要存在于肉、蛋、奶、鱼中。调节细胞代谢——蛋白质类和胆固醇类，还有维生素、矿物质。养肠道菌群——食物中的膳食纤维。"},{"q":"关于基因与生活方式的关系，作者的观点是？","o":["基因决定了人应该睡多长时间、应该吃多少食物以及运动的时间和程度","顺应基因确定好的细胞需求去生活，就能长寿","生活方式与基因编码不对等，疾病就会找上门来","基因完全不能影响人的饮食需求"],"a":[0,1,2],"e":"基因决定了心脏怎样跳、肝脏做什么功、肾脏干什么活，决定了人应该睡多长时间、应该几点起床几点睡觉、应该喝多少水、应该吃多少食物以及运动的时间和程度。当人们顺应基因确定好的细胞需求去生活，就能长寿；如果一味地任性，想吃什么就吃什么，想几点睡就几点睡，生活方式与基因编码不对等，疾病就会找上门来。"},{"q":"关于旧石器时代的饮食变化，正确的有？","o":["大约距今250万年开始，古猿下地寻找食物，开始了荤素搭配的饮食结构","大约80多万年前，部分人种把火种引进山洞，开始吃熟肉","把动物煮熟或烤熟后吃，蛋白质和脂类更容易消化吸收","此时人类已经学会种植大麦和小麦"],"a":[0,1,2],"e":"从大约距今250万年开始，非洲东部地壳发生变化，完全靠采集植物为生的古猿只好下地寻找食物，就此开始了荤素搭配的饮食结构……大约80多万年前，有部分人种发现野火烧过的动物肉既好吃，又好消化，于是把火种引进了山洞……把打来的动物煮熟或者烤熟了吃，摄入的蛋白质和脂类更容易消化吸收，大脑获得了更多滋养。"},{"q":"远古人类在外形上的重要特点包括？","o":["脑容量显著增大","下巴逐渐收缩进去","牙齿变小","身高迅速降低"],"a":[0,1,2],"e":"这时的人类在外形上有一些非常重要的特点：脑容量显著增大（由于大脑获得了更多的营养素，从而促进了大脑的快速发育），下巴逐渐收缩进去，牙齿也变小了（由于食物煮熟后容易咀嚼和消化）。"},{"q":"关于农牧时代（农业革命），正确的有？","o":["人类开始种植大麦、小麦、豆类、蔬菜和水果等农作物","不再四处迁徙，不再居无定所","从营养素的获取来讲，农业革命的开始实际上是食物营养下降的开始","食谱变得更宽，动物类食品比例增加"],"a":[0,1,2],"e":"人们种植大麦、小麦、豆类、蔬菜和水果等农作物，不再为驯化猪、牛、羊、马、骆驼等动物四处迁徙，不再居无定所……但是从营养素的获取来讲，农业革命的开始实际上是食物营养下降的开始……由于植物类食物的增加……动物类食品开始减少。"},{"q":"农业革命给人类带来的变化包括？","o":["食谱变窄","粮食、蔬菜、水果从种植到收获到储存都变得越来越容易","人们不再需要在自然界追逐猎物和主动采集，体质逐渐衰退","人类大脑增容和体质增强持续加速"],"a":[0,1,2],"e":"人类不再需要与大型动物搏杀，每天吃的食物是主动种植的植物或者饲养的动物，食谱变窄了……再加上人们不再需要像一万年前那样在自然界追逐猎物和主动采集各种食物，而是去附近交换或购买，体质逐渐衰退……定居生活带来的是人类大脑增容和体质增强的戛然而止。"},{"q":"工业革命后出现的新食物包括？","o":["各种添加剂：口味剂、防腐剂、保鲜剂、色素等","工业生产的反式脂肪酸（人造黄油、起酥油）","精米、精面及其衍生出的点心、面条、米粉","天然采摘的野菜和野果"],"a":[0,1,2],"e":"一些从未在我们生活中出现的食物出现了，比如：各种添加剂：口味剂、防腐剂、保鲜剂、色素等。工业生产的反式脂肪酸（人造黄油、起酥油）。精米、精面……精米、精面衍生出的各种食物，比如各种点心、面条、米粉等。"},{"q":"工业革命对食物营养素的影响包括？","o":["几乎所有食物中的营养素都在贬值","据日本2006年调查，和20年前相比菠菜的营养素只剩下了不到20%","新鲜食物反而变得稀少","食物中的营养素含量大幅提高"],"a":[0,1,2],"e":"这一切带来的后果是，几乎所有食物中的营养素都在贬值。据日本2006年发布的一则调查显示，和20年前相比，菠菜的营养素只剩下了不到20%……冰箱、食品添加剂和特殊的食品加工方法，解决了食物储存中的困难，新鲜食物反而变得稀少。"},{"q":"关于人类食物种类的变化，正确的有？","o":["老祖宗可以从自然界摄取7000多种食物","随着农牧业开展及工业加工食品出现，人们常吃的食物只有500多种","有6000多种老祖宗吃的食物都从餐桌上消失了","现代人常吃的食物种类比老祖宗更多"],"a":[0,1,2],"e":"我们的老祖宗可以从自然界摄取7000多种食物……但是，随着农牧业的开展以及工业加工食品的出现，人们常吃的食物只有500多种。也就是说，有6000多种我们老祖宗吃的食物都从我们的餐桌上消失了。"},{"q":"关于2万～1万年前（旧石器时代向新石器时代转化时期）的完美饮食结构，正确的有？","o":["植物性食物占65%左右，主要是水果、蔬菜、坚果、豆类和蜂蜜","动物性食物占35%左右，主要是肉类、蛋类、鱼和虾贝类","这种结构带来低钠高钾、高纤维素、高蛋白质以及ω-3脂肪酸高含量","动物性食物占65%左右"],"a":[0,1,2],"e":"植物性食物占65%左右，主要是水果、蔬菜、坚果、豆类和蜂蜜。动物性食物占35%左右，主要是肉类、蛋类、鱼和虾贝类。这样完美的饮食结构带来了大量的维生素和矿物质，低钠高钾、高纤维素、高蛋白质以及脂肪酸中ω-3脂肪酸的高含量。"},{"q":"针对现代人，作者提出的饮食原则包括？","o":["尽量摄入天然食物，动物类、植物类食物每天都要吃，减少加工食品摄入","动物类食物最好占一天食物的35%","植物类食物占一天食物的65%，种类尽量多样化","粮食类食物以精米、精面为主"],"a":[0,1,2],"e":"第二，尽量摄入天然食物，动物类、植物类食物每天都要吃，注意减少加工食品摄入量。第三，动物类食物（肉、蛋、奶、鱼等）最好占一天食物的35%……植物类食物包括蔬菜、水果和粮食，占一天食物的65%……最不好的是精米、精面，因为精米、精面是工业化的产物。"},{"q":"关于“一盘土豆炖牛肉”与“白菜炖粉条＋土豆炖牛肉＋红薯＋凉拌山药”的对比，正确的有？","o":["第二种搭配看上去有6种食物，其实主要含有同一种营养素——碳水化合物","粉条、土豆、红薯和山药主要含有同一种营养素","食物丰富并不能等同于营养素丰富","第二种搭配的营养素种类明显多于第一种"],"a":[0,1,2],"e":"第二种搭配看上去有6种食物，好像很丰富了，其实粉条、土豆、红薯和山药主要含有同一种营养素——碳水化合物。4个菜用营养素一评估，其实只有3种，并不比第一种搭配好多少。所以食物丰富并不能等同于营养素丰富，这是两件事，需要我们科学地对待。"},{"q":"那个10岁女孩不长个儿，她的日常饮食特点是？","o":["早餐一个馒头，一碗白米粥","中午和晚上都是一碗米饭加上1～2种蔬菜","1个月吃一两个鸡蛋，不吃肉，不吃鱼，不喝牛奶","每天喝牛奶并吃大量肉类"],"a":[0,1,2],"e":"一了解，孩子每天的饮食如下：早餐一个馒头，一碗白米粥；中午和晚上都是一碗米饭加上1～2种蔬菜。1个月吃一两个鸡蛋，不吃肉，不吃鱼，不喝牛奶。"},{"q":"那个10岁女孩不长个儿的原因包括？","o":["馒头、粥和米饭都是碳水化合物，只提供能量","蔬菜提供维生素，提供蛋白质的鸡蛋几乎没有","脂类完全缺席","碳水化合物吃得不够多"],"a":[0,1,2],"e":"从营养素角度看，馒头、粥和米饭都是碳水化合物，蔬菜提供维生素，提供蛋白质的鸡蛋几乎没有，而脂类是完全缺席的。"},{"q":"关于结构物质与能量物质，正确的有？","o":["结构物质主要指磷脂、蛋白质、胆固醇","粮食的主要成分是碳水化合物，提供的是能量","吃得太多碳水化合物只会转化成脂肪，变不成细胞的结构","碳水化合物可以直接变成细胞膜"],"a":[0,1,2],"e":"结构物质主要指磷脂、蛋白质、胆固醇。如果这些结构性营养缺失了，细胞无法按照DNA的指令完成增生和修复，身体发育就会受到限制。粮食的主要成分是碳水化合物，提供的是能量，是葡萄糖，吃得太多只会转化成脂肪，变不成细胞的结构。"},{"q":"关于蛋白质、脂肪和碳水化合物之间的转化，正确的有？","o":["碳水化合物能转化成脂肪，脂肪也能转化成碳水化合物","蛋白质可以转化成碳水化合物","碳水化合物和脂肪在体内只能转化为非必需氨基酸","碳水化合物和脂肪可以直接转化为必需氨基酸"],"a":[0,1,2],"e":"碳水化合物能转化成脂肪，脂肪也能转化成碳水化合物。蛋白质可以转化成碳水化合物。但不是所有的蛋白质都能由碳水化合物和脂肪直接转化而来。蛋白质是由氨基酸构成的，而碳水化合物和脂肪在体内只能转化为非必需氨基酸，必需氨基酸是必须要从外界摄取的。"},{"q":"那位伤口长不上的患者，作者解释的正确内容包括？","o":["主食是碳水化合物，会转化为脂肪存在肚子上，所以肚子大","皮肤、肌肉、骨头等部位的细胞主要成分是磷脂、蛋白质和胆固醇","应多吃肉类、鸡蛋、酸奶和猪肝，伤口才能快点儿长好","多吃主食就能让伤口快速愈合"],"a":[0,1,2],"e":"“您平时特爱吃主食，对吧？主食是碳水化合物，吃到身体中会转化为脂肪存在肚子上，所以您的肚子大。但是皮肤、肌肉、骨头等部位的细胞主要成分是磷脂、蛋白质和胆固醇，您吃的食物没有这些营养，细胞就长不出来……这种情况下，多吃肉类、鸡蛋、酸奶和猪肝，伤口才能快点儿长好。”"},{"q":"关于吃进去的胆固醇与肝脏造的胆固醇，作者的解释是？","o":["吃进去的胆固醇会成为人体细胞结构的一部分","肝脏造的胆固醇才与动脉粥样硬化有关","两者不是一回事儿","吃进去的胆固醇会直接造成动脉粥样硬化"],"a":[0,1,2],"e":"吃进去的胆固醇会成为人体细胞结构的一部分，肝脏造的胆固醇才与动脉粥样硬化有关，不是一回事儿。"},{"q":"关于同样多的鸡肉和鸡汤，作者的观点是？","o":["鸡肉更有营养","心脏手术后要限制进入身体的液体量","心脏手术后要保证磷脂、蛋白质、胆固醇和各种维生素的摄入","鸡汤比鸡肉更有营养"],"a":[0,1,2],"e":"同样多的鸡肉和鸡汤，哪个更有营养？当然是鸡肉。而且心脏手术后不能喝这么多汤汤水水，要限制进入身体的液体量，又要保证磷脂、蛋白质、胆固醇和各种维生素的摄入，所以，每一口饭都非常重要。"},{"q":"关于营养素在细胞中的吸收和释放顺序，正确的有？","o":["食物中的碳水化合物、蛋白质和脂肪一同摄入时，最先被利用的一定是碳水化合物","碳水化合物冲在最前面，进入细胞的线粒体，直接变为能量","蛋白质和脂肪变成细胞膜的结构或者成为某些有生物活性的物质","脂肪永远最先被消耗"],"a":[0,1,2],"e":"营养素在细胞中的吸收和释放都是需要排队的。食物中的碳水化合物、蛋白质和脂肪如果一同被摄入，最先被利用的一定是碳水化合物，它冲在最前面，进入细胞的线粒体，直接变为能量。蛋白质和脂肪变成细胞膜的结构或者成为某些有生物活性的物质，如酶。"},{"q":"关于饥饿时的分解比例，正确的有？","o":["以脂肪分解为主，占80%左右","蛋白质的分解约占20%","脂肪和蛋白质的分解比例约为4∶1","以蛋白质分解为主，占80%左右"],"a":[0,1,2],"e":"一般来讲，人在饥饿时，以脂肪分解为主，占80%左右，蛋白质的分解约占20%，脂肪和蛋白质的分解比例约为4∶1。"},{"q":"那位健身小伙子半年下来不长肌肉、全身无力的原因包括？","o":["碳水化合物摄入不足造成体内蛋白质和脂肪分解","早晨只吃鸡蛋，能量只能从鸡蛋中来","鸡蛋里的蛋白质没有成为肌肉细胞的成分，而是变成能量被燃烧掉了","他吃了太多碳水化合物"],"a":[0,1,2],"e":"很明显，因为碳水化合物摄入不足造成了他体内蛋白质和脂肪分解……第二天早上应该摄入一些碳水化合物，结果他早晨仅仅只吃鸡蛋，于是上午的能量只能从鸡蛋中来。能量不够用，因此鸡蛋里的蛋白质没有成为肌肉细胞的成分，而是变成能量给燃烧掉了。"},{"q":"关于碳水化合物的摄入，作者强调？","o":["不能因为碳水化合物无法转化成蛋白质而轻视碳水化合物的摄入","不要随意减少主食","要掌握好三种营养素的比例","为了长肌肉应尽量不吃主食"],"a":[0,1,2],"e":"所以，并不能因为碳水化合物无法转化成蛋白质而轻视碳水化合物的摄入，随意减少主食，要掌握好三种营养素的比例。"},{"q":"食物摄入不均衡可能造成的后果包括？","o":["碳水化合物摄入太多又消耗不掉，会造成肥胖、糖尿病等疾病","为细胞提供结构和形成调节物质的营养素不足，会导致阿尔茨海默病、呆小症等","该消耗的消耗不掉，形成负担","营养素不足会自动由蛋白质转化补齐，没有任何影响"],"a":[0,1,2],"e":"食物摄入不均衡，如果碳水化合物摄入太多，人体消耗不掉，就会造成肥胖、糖尿病等疾病；而为细胞提供结构和形成调节物质的营养素不足，会导致阿尔茨海默病、呆小症等。该消耗的消耗不掉，形成负担；该形成结构的不足以形成结构；该形成激素等调节物质的营养素也不足，最终造成人体功能缺失，这就是我们常说的“病从口入”。"},{"q":"关于能量密度和营养密度，正确的有？","o":["能量密度指单位体积中所含的提供给细胞的能量营养素有多少","营养密度指单位体积中所含的营养素有多少","对运动量不大的现代人来说，最好的食物选择是低能量密度、高营养密度","体力劳动者更应选择低能量密度、低营养密度的食物"],"a":[0,1,2],"e":"对运动量不大的现代人来说，最好的食物选择是：低能量密度，高营养密度。如果是体力劳动者，那就要高能量密度，高营养密度。"},{"q":"属于“空能量食物”的有？","o":["白米粥","甜饮料","白面馒头和大米饭","鸡蛋"],"a":[0,1,2],"e":"一碗米饭里基本上就只有碳水化合物和少量植物蛋白，缺乏大多数营养素。我们把这种只有能量而没有其他营养素的食物叫作空能量食物，比如白米粥、甜饮料、白面馒头和大米饭。"},{"q":"关于地中海膳食结构，正确的有？","o":["最符合低能量、高营养这一标准的膳食结构","多年的临床研究证明，这是预防高血压、高血脂、糖尿病等现代慢病最有效的饮食方式","澳大利亚一项历时10年的研究表明，最常吃传统地中海式食品的人死于心血管病的风险要低30%","它会明显增加心血管病的死亡率"],"a":[0,1,2],"e":"最符合低能量、高营养这一标准的膳食结构，就是地中海膳食结构。多年的临床研究也证明，这是预防高血压、高血脂、糖尿病等现代慢病最有效的饮食方式。澳大利亚研究人员一项历时10年的研究表明，传统地中海式饮食的确可以避免患心脏病……死于心血管病的风险要低30%。"},{"q":"关于地中海式饮食与糖尿病风险的研究，正确的有？","o":["希腊的研究显示地中海式饮食还可能降低患糖尿病的风险","分析显示富含鱼类、坚果、蔬菜和水果的地中海式饮食可使人们患糖尿病的风险减少21%","对患有心脏病的高危人群，可使患糖尿病的风险减少27%","地中海式饮食只对欧洲人有效"],"a":[0,1,2],"e":"一个来自希腊的研究显示，地中海式饮食还可能降低患糖尿病的风险……分析显示，与其他饮食相比，富含鱼类、坚果、蔬菜和水果的地中海式饮食，可以使人们患糖尿病的风险减少21%。对于患有心脏病的高危人群，地中海式饮食可以使人们患糖尿病的风险减少27%……综合结果表明，地中海式饮食对欧洲人和非洲人同样可以降低糖尿病风险。"},{"q":"关于地中海式饮食的其他研究结论，正确的有？","o":["可以减缓老年痴呆症病情的恶化，可使痴呆患者的死亡风险减少73%","可以保护大脑免受血管损伤，降低发生中风和记忆力减退的风险","可以减少30%的乳腺癌发病率","会显著增加乳腺癌的发病率"],"a":[0,1,2],"e":"美国后来又连续几年做了这方面的对比研究，发现地中海式饮食可以减缓老年痴呆症病情的恶化，可使痴呆患者的死亡风险减少73%。《神经病学文献》发表的一项研究报告称，地中海式饮食可以保护大脑免受血管损伤，降低发生中风和记忆力减退的风险。另外，许多研究还显示地中海式饮食可以起到预防乳腺癌的作用，可以减少30%的乳腺癌发病率。"},{"q":"作者认为评估一个人是否健康，为什么先看能量？","o":["能量比七大营养素更宏观","能量更易辨识","当一个人能量不平衡时，再进一步深挖究竟是哪种营养素不平衡","能量平衡可以完全代表七大营养素平衡"],"a":[0,1,2],"e":"为什么呢？我们看一个人是否健康，最简单的就是先评估能量，因为它比七大营养素更宏观，更易辨识。当一个人能量不平衡时，我们再进一步深挖，去分析究竟是哪种营养素不平衡。"},{"q":"关于能量摄入与消耗的关系，正确的有？","o":["能量的摄入大于消耗时，多余的产能物质会在人体内储存起来，人就会发胖","能量摄入不足时，人会消瘦、全身无力、抵抗力下降","要让摄入和消耗达到平衡，首先要计算清楚消耗，消耗多少补多少","能量摄入不足时人会发胖"],"a":[0,1,2],"e":"能量摄入过多还是不足，有一个相对简单的判断方法：当能量的摄入大于消耗时，多余的产能物质会在人体内储存起来，人就会发胖；反之，人就会消瘦，全身无力，抵抗力下降。要让摄入和消耗达到平衡，我们首先要计算清楚消耗，消耗多少补多少。"},{"q":"一个人每天的能量消耗主要有哪三个方面？","o":["基础代谢","运动","食物消化","情绪波动"],"a":[0,1,2],"e":"一个人每天的能量消耗主要有以下三个方面：基础代谢、运动和食物消化。"},{"q":"关于基础代谢率，正确的有？","o":["是在非常安静的环境中、清醒状态下测定的代谢率","测定时身体不受精神紧张、肌肉活动和环境温度等影响","日常生活中很容易受到其他因素的影响","基础代谢率是一个终生不变的固定值"],"a":[0,1,2],"e":"基础代谢率就是尽量排除其他影响因素，在非常安静的环境中，在清醒的状态下，一个人的身体不受精神紧张、肌肉活动和环境温度等影响测定的代谢率。日常生活中，基础代谢很容易受到其他因素的影响，常见的包括环境温度、激素、年龄、性别、身高和遗传等。"},{"q":"影响基础代谢的常见因素包括？","o":["环境温度","激素","年龄、性别、身高和遗传","血型"],"a":[0,1,2],"e":"日常生活中，基础代谢很容易受到其他因素的影响，常见的包括环境温度、激素、年龄、性别、身高和遗传等。"},{"q":"关于环境温度与基础代谢，正确的有？","o":["环境温度在20～25℃时，人的基础代谢率最低","低温和高温环境中，代谢率都会升高","长期生活在恒温房间里，能量消耗少，很容易发胖","温度越低基础代谢率越低"],"a":[0,1,2],"e":"环境温度在20～25℃时，人的基础代谢率最低；低温和高温环境中，代谢率都会升高。现在大家长期生活在恒温房间里，能量消耗少，很容易发胖。"},{"q":"关于激素与基础代谢，正确的有？","o":["甲状腺激素和肾上腺皮质激素会提高细胞生化反应速度","一些药物及交感神经活动也可以影响能量消耗","精神紧张的人比心情放松的人要多消耗一些能量","心情放松的人比精神紧张的人消耗更多能量"],"a":[0,1,2],"e":"激素也是影响基础代谢的重要因素。甲状腺激素和肾上腺皮质激素会提高细胞生化反应速度，一些药物及交感神经活动等也可以影响能量消耗。比如精神紧张的人比心情放松的人要多消耗一些能量，所以大家看到一天到晚特别爱紧张的人往往比较瘦。"},{"q":"关于性别、身高与基础代谢，正确的有？","o":["男性比女性基础代谢率高","高个子的基础代谢率高于小个子","基础代谢率的高低有一定的遗传倾向","女性基础代谢率高于男性"],"a":[0,1,2],"e":"另外，男性比女性基础代谢率高，高个子的基础代谢率高于小个子，基础代谢率的高低还有一定的遗传倾向。"},{"q":"关于食物的动力效应，正确的有？","o":["消化食物的过程也要消耗能量，这被称作食物的动力效应","蛋白质的动力效应最大，约为30%","碳水化合物和脂肪的动力效应较低，基本在5%左右","脂肪的动力效应最大，约为30%"],"a":[0,1,2],"e":"消化食物的过程也要消耗能量，这被称作食物的动力效应。不同营养素的动力效应是不同的。蛋白质的动力效应最大，约为30%；而碳水化合物和脂肪的动力效应较低，基本在5%左右。"},{"q":"关于100千卡不同营养素的动力效应，正确的有？","o":["吃进去100千卡蛋白质，消化分解自身用掉30%，实际吸收70千卡","100千卡碳水化合物进入人体后，消化分解自身只用掉5%，吸收约95千卡","脂肪的动力效应与碳水化合物同量，也是5%","蛋白质消化分解自身只用掉5%"],"a":[0,1,2],"e":"例如，如果你吃进去的蛋白质热量是100千卡，消化分解自身用掉30%，实际上吸收到机体中的是70千卡。而100千卡的碳水化合物进入人体后，消化分解自身只用掉5%，吸收到身体中的是95千卡左右，脂肪也是同量。"},{"q":"被称为“产能营养素”的有？","o":["碳水化合物","蛋白质","脂类","维生素"],"a":[0,1,2],"e":"在七大营养素中，有三大营养素和能量息息相关，它们分别是碳水化合物、蛋白质和脂类，被称为“产能营养素”。"},{"q":"关于三大产能营养素每克的产能量，正确的有？","o":["碳水化合物每克产生4千卡能量","蛋白质每克产生4千卡能量","脂类每克产生9千卡能量","脂类每克产生4千卡能量"],"a":[0,1,2],"e":"碳水化合物每克产生4千卡能量，蛋白质每克产生4千卡能量，脂类每克产生9千卡能量。"},{"q":"关于酒精产能，正确的有？","o":["常饮酒的人有第四个能量来源——酒精","1克酒精产生7千卡能量","一瓶啤酒500毫升、酒精含量4%，则酒精含量20克","1克酒精产生4千卡能量"],"a":[0,1,2],"e":"大多数情况下，我们每日摄入的总能量等于这三大产能营养素能量的总和。常饮酒的人有第四个能量来源——酒精，1克酒精产生7千卡能量。……一瓶啤酒500毫升，那么酒精含量就是500×4%=20克。啤酒也是碳水化合物做的，按照1克酒精产能7千卡计算，20克酒精产能为20×7=140千卡。换算成碳水化合物的话，140÷4=35克。所以喝一瓶啤酒相当于吃了35克碳水化合物。"},{"q":"关于喝啤酒与肥胖的关系，正确的有？","o":["一瓶啤酒相当于吃了35克碳水化合物","喝啤酒的人往往还要再吃米饭或面条，能量累加","长期代谢不掉，转化成脂肪囤积在腹部周围","啤酒不含任何能量"],"a":[0,1,2],"e":"所以喝一瓶啤酒相当于吃了35克碳水化合物。如果一次喝两三瓶呢？自己算吧。而且大多数人喝了很多啤酒之后，还要再吃一碗米饭或者面条，这些能量累加，长期代谢不掉，转化成脂肪囤积在腹部周围，肚子也就越来越大。"},{"q":"关于能量平衡的公式，正确的有？","o":["总的摄入能量＞消耗的能量＝肥胖","总的摄入能量＜消耗的能量＝消瘦","总的摄入能量＝消耗的能量＝体重正常","摄入能量等于消耗能量就说明质量优良"],"a":[0,1,2],"e":"总的摄入能量＞消耗的能量＝肥胖。总的摄入能量＜消耗的能量＝消瘦。总的摄入能量＝消耗的能量＝体重正常。上述只是“数量”上的一个估计，但是“数量正常”不代表“质量优良”。"},{"q":"书中那位60多岁女患者的情况包括？","o":["BMI是20.1，属于正常范围","人体成分分析仪检测发现体内脂肪超标、肌肉量很低","每天摄入能量的80%左右来自碳水化合物","她每天吃大量肉、蛋、奶"],"a":[0,1,2],"e":"这位患者体重为51.5千克，身高160厘米，BMI是20.1，正常人是18.5～23.9……但是我们在用人体成分分析仪给她做检测时发现，她的体内脂肪超标，肌肉量很低。……发现，她每天所摄入的能量80%左右来自碳水化合物，蛋白质和脂肪合起来才占总能量的20%左右。她不吃肉、蛋、奶。"},{"q":"那位60多岁女患者的症状与病因对应关系，正确的有？","o":["缺乏蛋白质，所以肌肉无力、消化能力差、睡眠不好","缺乏必需脂肪酸，所以皮肤干燥、视力很差、记忆力减退","神经细胞因蛋白质和必需脂肪酸长期缺乏而被损伤","她的问题是碳水化合物摄入不足"],"a":[0,1,2],"e":"这下算是找到病因了：缺乏蛋白质，所以肌肉无力，消化能力差，睡眠不好。缺乏必需脂肪酸，所以皮肤干燥，视力很差，记忆力减退。……这和她消化不良、四肢乏力的原因相同，也是因为蛋白质和必需脂肪酸长期缺乏，神经细胞因此被损伤。"},{"q":"计算摄入能量时的主要参数有？","o":["身高体重，标准体重=身高（厘米）－105","活动量","三大能量之间的比例","血型"],"a":[0,1,2],"e":"摄入多少是根据消耗量来计算的，主要参数有以下三个：第一，身高体重。依据标准体重计算，标准体重=身高（厘米）－105。第二，活动量。第三，三大能量之间的比例。"},{"q":"关于不同活动量的能量消耗标准，正确的有？","o":["轻体力劳动者是标准体重每千克耗能30千卡","中体力劳动者35千卡，重体力劳动者40千卡","长期卧床的人标准体重每千克耗能25千卡","轻体力劳动者是标准体重每千克耗能40千卡"],"a":[0,1,2],"e":"一般来讲轻体力劳动者是标准体重每千克耗能30千卡，中体力劳动者35千卡，重体力劳动者40千卡，长期卧床的人标准体重每千克耗能25千卡。"},{"q":"大多数营养书上三大能量的比例是？","o":["蛋白质为10%～15%","脂类为20%～30%","碳水化合物为55%～65%","碳水化合物为30%～40%"],"a":[0,1,2],"e":"第三，三大能量之间的比例。大多数营养书上三大能量比例是蛋白质为10%～15%，脂类为20%～30%，碳水化合物为55%～65%。"},{"q":"根据作者多年的临床工作经验，能量比例的调整建议是？","o":["碳水化合物的摄入量尽量取其范围的低值","蛋白质和脂类尽量取其范围的高值","如果是脑病患者，脂类比例要远远大于30%","糖尿病患者的碳水化合物比例通常要降到40%～50%","碳水化合物的摄入量尽量取其范围的高值"],"a":[0,1,2,3],"e":"根据多年临床工作经验，如果想让身体保持更好的健康状态，根据中国居民饮食现状和身体状况，碳水化合物的摄入量我们尽量取其范围的低值，蛋白质和脂类我们尽量取其范围的高值……如果是脑病患者，脂类比例要远远大于30%；糖尿病患者的碳水化合物比例，我通常会要求降到40%～50%。"},{"q":"那位54岁男性公务员（175厘米、72千克、轻体力）的能量计算，正确的有？","o":["标准体重是175－105=70千克","每日所需总能量为70×30＝2100千卡","碳水化合物按55%计算是1155千卡，折合288.75克","每日所需总能量为70×35＝2450千卡"],"a":[0,1,2],"e":"标准体重（千克）=身高（厘米）－105，因此这位男士的标准体重是175－105=70（千克）……每日每千克体重所需能量为30千卡，这位男士每日所需总能量为70×30＝2100（千卡）。碳水化合物占总能量的55%：2100×55%＝1155（千卡），每克碳水化合物产生4千卡能量，此人每日应该摄入碳水化合物为1155÷4＝288.75（克）。"},{"q":"关于碳水化合物的分配技巧，正确的有？","o":["可将碳水化合物一分为二，一半是粗粮和谷薯，另一半是米面","体力劳动者、比较瘦的人以及胃肠功能差的人，会加大细粮的比例","肥胖者或运动量很少的人，会加大粗粮的比例","肥胖者应加大细粮的比例"],"a":[0,1,2],"e":"算出288.75克的碳水化合物后，在实际操作中还有一个技巧可以用，就是将这些碳水化合物一分为二，一半是粗粮和谷薯，另一半是米面。如果是体力劳动者或者比较瘦的人，还有胃肠功能差的人，我会把细粮的比例加大；如果是肥胖者或者运动量很少的人，我会把粗粮的比例加大。"},{"q":"关于蛋白质的分配计算，正确的有？","o":["54岁公务员蛋白质占总能量的15%，即315千卡，折合78.75克","其中动植物蛋白质应该各占一半","一个中等大小鸡蛋差不多含有6克蛋白质","200毫升牛奶含有17～20克蛋白质"],"a":[0,1,2],"e":"蛋白质占总能量的15%：2100×15%＝315（千卡），每克蛋白质产生4千卡能量，所需蛋白质315÷4＝78.75（克）。其中动植物蛋白质应该各占一半，即各39.375克。一个中等大小鸡蛋差不多含有6克蛋白质，200毫升牛奶含有6克蛋白质，瘦肉（四条腿或两条腿的动物）以及鱼类基本上含有17%～20%的蛋白质。"},{"q":"关于蛋白质摄入量，作者特别强调？","o":["实际操作时必须注意，蛋白质的摄入量不能打折扣","鼓励尽量多一些，但不要超过20%","可以随意减少以控制体重","蛋白质越少越健康"],"a":[0,1],"e":"实际操作时必须注意，蛋白质的摄入量不能打折扣，鼓励尽量多一些，但不要超过20%。"},{"q":"关于54岁公务员脂类的计算，正确的有？","o":["脂类占总能量的30%，即630千卡，折合70克","其中植物油占一半，为每天35克","动物油在吃鸡蛋、肉类食物和喝牛奶时可以获得，为35克","脂类应全部来自植物油"],"a":[0,1,2],"e":"脂类占总能量的30%：2100×30%＝630（千卡），每克脂类产生9千卡能量，因此需要630÷9＝70（克）。其中植物油占一半，为每天35克。动物油在吃鸡蛋、肉类食物和喝牛奶时可以获得，为35克。"},{"q":"关于脂类的比例，作者强调？","o":["单不饱和脂肪酸和多不饱和脂肪酸要更多一些","鱼、虾和海藻要多吃一些","饱和脂肪酸要尽量多摄入","脂类只需保证数量，不需要注重比例"],"a":[0,1],"e":"脂类的摄入在保证数量的同时还要注重比例，单不饱和脂肪酸和多不饱和脂肪酸要更多一些，因此鱼、虾和海藻要多吃一些。"},{"q":"关于能量与年龄、消耗的关系，正确的有？","o":["消耗能量很大的人，每种营养素的摄入都要相应有一个较大幅度的提高","年龄大的人一般能量消耗少，要相应减少饮食的总能量","年龄大的人三大能量比例不要变","年龄大的人三大能量比例要相应大幅调整"],"a":[0,1,2],"e":"如果平时消耗能量很大，比如送快递的快递员、下地的农民，即使身高、体重不变，但因为能量消耗大大增加了，所以每种营养素的摄入都要相应有一个较大幅度的提高。年龄大的人一般能量消耗少，要相应减少饮食的总能量，但是三大能量比例不要变。"},{"q":"关于蛋白质在人体中的占比，正确的有？","o":["蛋白质是人体最基本的组成成分，占人体重量的20%左右","人的体重中60%左右是水","剩下的40%中蛋白质就占了一半","蛋白质占人体重量的60%"],"a":[0,1,2],"e":"蛋白质是人体最基本的组成成分，占人体重量的20%左右。千万别小看这20%，人的体重中60%左右是水，剩下的40%中蛋白质就占了一半。"},{"q":"以蛋白质为主要成分的人体部分包括？","o":["大脑、神经、皮肤、肌肉","内脏、血液","指甲、头发","尿液和汗液"],"a":[0,1,2],"e":"人体的大脑、神经、皮肤、肌肉、内脏、血液，甚至指甲、头发都以蛋白质为主要成分，同时蛋白质还是身体生长发育、衰老组织更新和损伤组织新生细胞的修补原料。"},{"q":"关于蛋白质的营养价值，正确的有？","o":["蛋白质进入人体后能被利用的氨基酸越多，其营养价值越高","如果所含的氨基酸与人体需求不匹配，蛋白质含量再高也没用","肉蛋类蛋白质的生物利用率高于植物类蛋白质","植物类蛋白质的生物利用率普遍高于肉蛋类"],"a":[0,1,2],"e":"广泛存在于动、植物食物中的蛋白质进入人体后能被利用的氨基酸越多，其营养价值越高，否则蛋白质含量再高，如果所含的氨基酸与人体需求不匹配也没用，甚至还有坏处。从这一点来说，肉蛋类蛋白质的生物利用率高于植物类蛋白质。"},{"q":"关于大豆和豆制品，正确的有？","o":["大豆的蛋白质含量非常高，但它是植物，缺乏某种人体必需的氨基酸","如果只靠喝豆浆、吃大豆来获取蛋白质，代谢产物增多，对肾脏的压力会很大","肾功能有问题的人都不让吃大豆","豆制品最好单吃，不要搭配其他食物"],"a":[0,1,2],"e":"我们都知道大豆的蛋白质含量非常高，但是它是植物，缺乏某种人体必需的氨基酸。如果只靠喝豆浆、吃大豆来获取蛋白质，氨基酸被人体利用会受到影响，代谢产物增多，对肾脏的压力会很大，所以肾功能有问题的人我们都不让吃大豆。对于这种高蛋白质而氨基酸不完整的植物，最好采用食物互补的方法……在这里再叮嘱一句：豆制品不要单吃。"},{"q":"计算蛋白质摄入量时的原则有？","o":["一看总能量：蛋白质一般占总能量的10%～15%，优质蛋白质最好占一半","二看身体需求：低蛋白血症患者、身体虚弱的人蛋白质比例和计量要相对多一些","三看平时习惯：纯吃素的人要设法把几种互补的食物搭配在一起","四看血型：不同血型需求不同"],"a":[0,1,2],"e":"一般来讲，我们在计算蛋白质摄入量时有几个原则：一看总能量……蛋白质一般是占总能量的10%～15%，总能量需要越高，蛋白质需求也就越高。优质蛋白质最好占一半。二看身体需求：低蛋白血症的患者、身体虚弱的人蛋白质的比例和计量都要相对多一些。三看平时习惯：纯吃素的人在配置蛋白质饮食时比较麻烦，为了保证摄入氨基酸的比例与人体所需接近，要想方设法把几种互补的食物搭配在一起。"},{"q":"关于那位58岁患肺癌的男性患者，正确的有？","o":["身高178厘米，体重58千克，平时运动量很大，每天至少运动两个小时","吃饭绝对做到低脂低盐、少糖少油","他一天实际摄入的优质蛋白只有16克","他每天摄入大量动物蛋白，严重超标"],"a":[0,1,2],"e":"我曾经诊疗过一个患者，58岁，男性，身高178厘米，体重58千克，平时运动量很大，每天至少运动两个小时。他吃饭也非常讲究，绝对做到低脂低盐、少糖少油，人也不胖，却在一次体检中发现患了肺癌。……我给他算了一下，他一天实际摄入的优质蛋白是16克。"},{"q":"作者对那位肺癌患者的分析与建议包括？","o":["他每天应摄入蛋白质94.5克，其中一半应是动物蛋白47.25克，实际只吃了16克","运动多的人需要的磷脂、蛋白质、胆固醇以及铁、钙等营养素也要比正常人多","维生素A属脂溶性维生素，必须在有油脂的环境中才能被人体吸收利用","他的癌症与吃得不对有关","他患癌完全是因为运动过量"],"a":[0,1,2,3],"e":"按照前面介绍的能量比例计算，以一个中等体力劳动者为参照，每天应摄入的蛋白质为63×40×15%÷4＝94.5克。算出总量后，其中一半应该是动物蛋白（优质蛋白），是47.25克，可实际上他每天只吃了16克动物蛋白，亏空31克。……运动多的人能量消耗多，肌肉损伤大，修复的速度快，因此需要的磷脂、蛋白质、胆固醇以及铁、钙等营养素也要比正常人多。同时，油脂对人体也非常重要，维生素A属于脂溶性维生素，对上皮细胞的保护以及免疫系统十分重要，而脂溶性维生素必须在有油脂的环境中才能被人体吸收利用。……所以你的癌症与你吃得不对有关。"},{"q":"作者给那位肺癌患者的具体饮食建议是？","o":["每天吃两个鸡蛋","400毫升牛奶","100～150克肉类（包括各种瘦肉、鱼、虾等）","每天只吃一个鸡蛋和一袋牛奶即可"],"a":[0,1,2],"e":"你可以每天吃两个鸡蛋+400毫升牛奶+100～150克肉类（包括各种瘦肉、鱼、虾等）。"},{"q":"关于那位肺癌患者的预后，正确的有？","o":["发现肺癌后过了三年，他长胖了，体质明显变强","这三年里肿瘤没有复发","蛋白质的摄入与免疫系统功能强弱息息相关","他的肿瘤很快复发并恶化"],"a":[0,1,2],"e":"后来我们一直保持着联系，他会定期复诊。发现肺癌后过了三年，他长胖了，体质明显变强。关键是这三年里，肿瘤没有复发。"},{"q":"蛋白质缺乏的慢性表现包括？","o":["儿童生长发育迟缓","成人头发稀少干枯易断","人体代谢率下降、蛋白质类激素减少、新陈代谢所需各种酶的功能减弱","皮肤变得细腻有光泽"],"a":[0,1,2],"e":"如果蛋白质不是缺乏到很严重的程度，是很难表现出来的。通常有儿童生长发育迟缓、成人头发稀少干枯易断、人体代谢率下降、蛋白质类激素减少、新陈代谢所需各种酶的功能减弱等慢性表现。"},{"q":"蛋白质更加缺乏时，身体会出现的症状包括？","o":["抵抗力低下，容易感冒发烧或者发生泌尿系统感染","肌肉无力，容易疲劳；胃肠道蠕动能力下降和消化酶的缺乏，导致消化不良","全身发冷，没有力气，甲状腺功能低下；贫血，双下肢水肿或有腹水，骨质疏松","视力突然提高到2.0"],"a":[0,1,2],"e":"例如，抵抗力低下，容易感冒发烧或者发生泌尿系统感染；肌肉无力，容易疲劳；胃肠道蠕动能力下降和消化酶的缺乏，导致消化不良；全身发冷，没有力气，甲状腺功能低下；贫血，双下肢水肿或有腹水，骨质疏松，等等。"},{"q":"关于骨质疏松与蛋白质的关系，正确的有？","o":["很多人以为骨质疏松只是缺钙，但其实很有可能是缺蛋白质","蛋白质在骨骼中以骨胶原的形式存在，增加了骨骼的韧性","蛋白质还提供矿物质依附，保证骨骼的硬度","骨质疏松与蛋白质完全没有关系"],"a":[0,1,2],"e":"很多人以为骨质疏松只是缺钙，但其实很有可能是缺蛋白质。蛋白质在骨骼中以骨胶原的形式存在，增加了骨骼的韧性。此外，它还提供矿物质依附，保证骨骼的硬度。因此身体缺乏蛋白质，自然就会骨质疏松。"},{"q":"那位70多岁男患者的检查结果包括？","o":["按压胫骨前面出现两个深深的凹陷，是可凹性水肿","血色素数值是8.5克，低于正常值","血浆白蛋白为34毫摩尔／升，低于正常值","血压明显升高"],"a":[0,1,2],"e":"于是，我让他把裤腿提起来，用食指压了压他的胫骨前面，两个深深的凹陷非常明显地显现出来，这是可凹性水肿……血常规里的血色素一项，数值是8.5克，低于正常值；生化项目中的血浆白蛋白一项，化验值为34毫摩尔／升，也低于正常值。"},{"q":"那位70多岁男患者营养不良的原因是？","o":["老伴3年前去世，儿女都在海外工作，自己一个人生活","以前老伴做饭，老伴走了就凑合着吃","长期的饮食单一，营养跟不上","他患有严重的消化系统疾病导致无法进食"],"a":[0,1,2],"e":"我一问，原来老先生的老伴3年前去世了，儿女都在海外工作，无法近身照顾，老先生自己一个人生活。以前老伴做饭，这三年老伴走了，老先生就凑合着吃。长期的饮食单一，营养跟不上，导致了这一系列问题。这样的营养不良在老年人中很常见，而且很容易被误诊。"},{"q":"作者给那位70多岁男患者的建议包括？","o":["一天吃两个鸡蛋，两袋牛奶","平日多吃些肝脏、鸭血，这两种食物好咀嚼，同时补血效果好","肉类中可选择鱼肉，也可以将红肉做成肉馅吃","开了一些浓缩的营养素，按照说明每日服用","让他多吃粗粮和蔬菜，不要吃肉"],"a":[0,1,2,3],"e":"由于老先生咀嚼能力较差，吃肉比较困难，我建议他一天吃两个鸡蛋，两袋牛奶。平日多吃些肝脏、鸭血，这两种食物好咀嚼，同时补血效果好。肉类中可选择鱼肉，也可以将红肉做成肉馅吃。……我又给老人家开了一些浓缩的营养素，按照说明每日服用，在短时间内能迅速补充营养。"},{"q":"蛋白质摄入过多的公认危害包括？","o":["胃肠道功能紊乱","肝脏损伤","肾脏损害","免疫力自动增强"],"a":[0,1,2],"e":"如果蛋白质摄入过多，大多数营养书都会告诉我们以下几种危害：第一，胃肠道功能紊乱。第二，肝脏损伤。第三，肾脏损害。"},{"q":"为什么肝脏会因蛋白质摄入过多而受损？","o":["蛋白质摄入过量，肠道的有毒气体堆积过多","这些气体被吸收入血液，最终到达肝脏进行解毒","超过了肝脏的解毒能力，将会造成肝脏的损害","肝脏会主动储存多余的蛋白质"],"a":[0,1,2],"e":"第二，肝脏损伤。当蛋白质摄入过量，肠道的有毒气体堆积过多，这些气体就会被吸收入血液，最终到达肝脏进行解毒。所以，如果蛋白质摄入过多，超过了肝脏的解毒能力，将会造成肝脏的损害。"},{"q":"为什么肾脏会因蛋白质摄入过多而受损？","o":["不能被人体利用的蛋白质代谢产物如尿素、肌酐、肌酸和尿酸需经肾脏滤过进入尿中","如果代谢废物量大，肾脏滤过量增大","将加重肾脏的负担，造成肾损害","肾脏可以无限量地处理代谢废物"],"a":[0,1,2],"e":"第三，肾脏损害。不能被人体利用的蛋白质代谢产物如尿素、肌酐、肌酸和尿酸需经肾脏滤过进入尿中，继而排出体外。如果代谢废物量大，肾脏滤过量增大，将加重肾脏的负担，造成肾损害。"},{"q":"关于“一碗面条和一碗红烧肉”的对比，正确的有？","o":["肉一次吃不了多少，因为胃里面的胃蛋白酶活性和总量有限","动物性食物里油脂较多，会有种很腻的感觉","植物性蛋白容易吃多，比如豆类，还有一些食用菌","动物蛋白比植物蛋白更容易吃多"],"a":[0,1,2],"e":"肉一次吃不了多少，因为胃里面的胃蛋白酶活性和总量有限，当超过了胃蛋白酶分解能力时，你会觉得“吃不动了”。同时动物性食物里油脂较多，会有种很腻的感觉，因此“吃不动了”。从动物性食物中获得的是优质蛋白，吸收利用率高，而且受身体的限制，很难吃多。但是植物性蛋白容易吃多，比如豆类（各种豆制品），还有一些食用菌。"},{"q":"作者对“吃肉”的态度是？","o":["不赞成一味地去吃肉","一些人吃肉很多出现问题，是因为过于偏食，只吃肉不吃菜","大口吃肉、大口喝酒的生活方式绝对要反对","就蛋白质而言，动物蛋白的生物利用度较高，对肝肾的压力很小","鼓励所有人只吃肉不吃菜"],"a":[0,1,2,3],"e":"我不赞成一味地去吃肉。一些人吃肉很多，出现了问题，是因为这个人过于偏食，只吃肉不吃菜，大口吃肉、大口喝酒的生活方式绝对要反对。我只是强调，就蛋白质而言，动物蛋白很难吃多，而且动物蛋白的生物利用度较高，是细胞非常好的结构成分，对肝肾的压力很小，这些益处大家要清楚。"},{"q":"关于蛋白质平衡的本质，正确的有？","o":["蛋白质平衡本质上是氨基酸的平衡","也就是摄入的蛋白质中所含氨基酸的量和各种氨基酸的比例要与人体所消耗的量和比例基本相当","氨基酸组成与人体所需基本一致的蛋白质被称为优质蛋白","蛋白质平衡本质上就是总量的平衡，与氨基酸种类无关"],"a":[0,1,2],"e":"蛋白质平衡本质上是氨基酸的平衡，也就是摄入的蛋白质中所含的氨基酸的量和各种氨基酸的比例要与人体所消耗的量和比例基本相当。氨基酸组成与人体所需基本一致的蛋白质被称为优质蛋白。"},{"q":"优质蛋白主要包括？","o":["肉，包括四条腿的畜类","两条腿的禽类","没有腿的鱼类，以及蛋、奶","大豆和豆制品"],"a":[0,1,2],"e":"这类蛋白质主要是动物蛋白质，包括肉、蛋、奶，这里的肉包括四条腿的畜类、两条腿的禽类和没有腿的鱼类。"},{"q":"那位30多岁男性（178厘米、78千克）的蛋白质分配，正确的有？","o":["标准体重是178－105=73千克，总能量为73×30=2190千卡","一天所需蛋白质为2190×0.15÷4=82克","每日所需的动物蛋白应该是41克左右","每日所需的动物蛋白应该是82克"],"a":[0,1,2],"e":"标准体重是178－105=73千克，运动量不大，总能量为73×30=2190千卡。此人一天所需的蛋白质为2190×0.15÷4=82克。这样算下来，每日所需的动物蛋白应该是41克左右。"},{"q":"那位30多岁男性的三餐分配，正确的有？","o":["每天需要吃150克左右的瘦肉（大概含30克蛋白）","一个鸡蛋（大概含6克蛋白）","200毫升牛奶（大概含6克蛋白）","100克瘦肉含30克蛋白质"],"a":[0,1,2],"e":"他每天需要吃150克左右的瘦肉（大概含30克蛋白），一个鸡蛋（大概含6克蛋白）和200毫升牛奶（大概含6克蛋白）。"},{"q":"关于几种优质蛋白质食物的互换，正确的有？","o":["100克瘦肉（畜禽类纯瘦肉）或鱼类中基本上有17～20克的蛋白质","今天吃鱼多了，就可以少吃肉类","如果禽类吃多了，就少吃畜类","没有吃鱼、虾时，要相应增多畜禽类瘦肉的摄入量","鱼和肉不能互相替代"],"a":[0,1,2,3],"e":"几种优质蛋白质的食物之间可以互换，100克瘦肉（畜禽类纯瘦肉）或鱼类中基本上有17～20克的蛋白质。今天吃鱼多了，就可以少吃肉类；如果禽类的多吃了，就少吃畜类；如果没有吃鱼、虾，就要相应增多畜禽类瘦肉的摄入量。"},{"q":"作者特别提醒大家的几点包括？","o":["豆浆不能代替牛奶","不必每天一丝不苟坚决执行，1克不能多、1克不能少","最好以一周为一个周期，一段时间内做到总体平衡就可以了","可以在周末做一下“饮食修补”","豆浆完全可以代替牛奶"],"a":[0,1,2,3],"e":"有几点要特别提醒大家：豆浆不能代替牛奶。不必每天一丝不苟坚决执行，1克不能多，1克不能少，这没必要，也不现实。一般来讲，一段时间内做到总体平衡就可以了，最好以一周为一个周期……可以在周末的时候做一下“饮食修补”。"},{"q":"关于特殊人群的蛋白质摄入，正确的有？","o":["运动员、孕妇、少年儿童以及营养不良的患者，需要补充较多的蛋白质","肾衰竭的人要严格控制蛋白质的质量和数量","肝硬化的患者更要注意","肾衰竭患者应大量补充蛋白质"],"a":[0,1,2],"e":"上面介绍的是普通人的蛋白质摄入原则。对于特殊人群，要用特殊标准。比如说，运动员、孕妇、少年儿童以及营养不良的患者，就需要补充较多的蛋白质，以满足身体所需。而对于肾衰竭的人，则要严格控制蛋白质的质量和数量，以防进一步损害肾功能。当然肝硬化的患者更要注意。"},{"q":"关于主食吃多了的后果，正确的有？","o":["并不会生成超多的能量让你力大无穷","而是以化学能的形式储存起来，形式上表现为多余的脂肪","碳水化合物也称糖类，基本上可以等同于我们的主食","主食吃多了会直接变成肌肉"],"a":[0,1,2],"e":"碳水化合物也称糖类，说白了基本上可以等同于我们的主食：米饭、面条、大饼、红薯、土豆等。主食吃多了可不是好事儿，并不会生成超多的能量，让你力大无穷，而是以化学能的形式储存起来，形式上却表现为多余的脂肪。"},{"q":"《中国居民膳食指南（2016）》对谷薯类食物的建议是？","o":["每人每天应摄入谷薯类食物250～400克","其中全谷物和杂豆类50～150克","薯类50～100克","谷薯类每天应摄入1000克以上"],"a":[0,1,2],"e":"《中国居民膳食指南（2016）》指出：每人每天应摄入谷薯类食物250～400克，其中全谷物和杂豆类50～150克，薯类50～100克。"},{"q":"为什么指南给出的碳水化合物摄入量跨度很大？","o":["中国幅员辽阔，经济发展不均衡","人们的劳动强度也不一样","2013年末中国城镇人口占总人口的53.73%，农村和城市人口基本上各占一半","因为每个人对碳水化合物的吸收率完全相同"],"a":[0,1,2],"e":"因为中国幅员辽阔，经济发展不均衡，人们的劳动强度也不一样。国家统计局2014年公布的数据显示，2013年末，中国城镇人口占总人口的53.73%，也就是说农村和城市人口基本上各占一半。再加上环境不同、工种不同、经济水平不同等因素，碳水化合物的摄入自然也会有较大的差别，因此指南给出的摄入量跨度很大。"},{"q":"关于白米、白面的淀粉含量，正确的有？","o":["同样100克，米面的淀粉含量是薯类（土豆、山药、芋头等）的四倍","是豆类（赤小豆、芸豆等）的近两倍","白米、白面中的淀粉含量较高","米面的淀粉含量低于薯类"],"a":[0,1,2],"e":"白米、白面中的淀粉含量较高，同样100克，米面的淀粉含量是薯类（土豆、山药、芋头等）的四倍，是豆类（赤小豆、芸豆等）的近两倍。"},{"q":"关于体力劳动者与碳水化合物的关系，正确的有？","o":["体力劳动者应该多吃一些含淀粉的食物","面条、馒头、米饭都很好","运动量一旦减少，就要立即改变主食的种类和数量，减少淀粉的摄入","运动量减少后仍应保持大量淀粉摄入"],"a":[0,1,2],"e":"体力劳动者应该多吃一些含淀粉的食物，面条、馒头、米饭都很好。但是运动量一旦减少，就要立即改变主食的种类和数量，减少淀粉的摄入。"},{"q":"那位67岁血糖血压高的男患者，原来的饮食习惯是？","o":["每天要吃2～3顿面条，将近500克","早上喝粥，很少吃粗粮","肉一天大概50～100克，蔬菜一天不到半斤，基本不吃水果，不喝牛奶，很少吃鱼","每天大量吃粗粮和水果"],"a":[0,1,2],"e":"他每天要吃2～3顿面条，将近500克（1斤），早上喝粥，很少吃粗粮；肉一天大概50～100克，蔬菜一天不到250克（半斤）；基本不吃水果，不喝牛奶，很少吃鱼。"},{"q":"作者对那位67岁男患者说的话，正确的有？","o":["过去干农活要用力气、耗能量、出汗，多吃面条绝对正确","从地头搬到楼房、运动少了，再这样吃食物就成了负担","以后血压正常、运动量增多而且每天出汗，还是可以多吃些面条的","以后一点儿面条都不能沾了"],"a":[0,1,2],"e":"“过去干农活，要用力气，要耗能量，而且还要出汗。汗水是什么味道的？是咸味，所以多吃面条绝对正确。但是您从地头搬到了楼房，运动少了，再这样吃，食物进到身体中成了负担，血压、血糖就都升高了。”……“不，吃一点儿还是可以的。以后您要是血压正常了，运动量增多，而且每天出汗，还是可以多吃些面条的。”"},{"q":"那位67岁男患者调整饮食后的变化包括？","o":["增加了粗粮，有时把土豆蒸一蒸当主食吃","饮食中增加了绿叶菜，水果也坚持每天吃一个","两个月后肚子小了很多，面色也好了","一年之后降压药从三种减成一种，血糖也很平稳","血糖血压完全没有改善"],"a":[0,1,2,3],"e":"他回去后吃饭时增加了粗粮，有时把土豆蒸一蒸，当主食吃……同时，他饮食中还增加了绿叶菜，水果也坚持每天吃一个。两个月后，他来复查，哇，肚子小了很多，面色也好了。一年之后，他的降压药从三种减成一种，血糖也很平稳。"},{"q":"碳水化合物摄入不足会怎样？","o":["容易出现低血糖症状","皮下脂肪及肌肉也会分解来供能","长期下去就会明显消瘦","会立刻出现腹部肥胖"],"a":[0,1,2],"e":"如果碳水化合物摄入不足，人就容易出现低血糖症状，皮下脂肪及肌肉也会分解来供能，长期下去就会明显消瘦；反之，如果一个人很胖，特别是腹部肥胖，或者血浆中甘油三酯明显增高，排除饮酒的因素，则提示碳水化合物摄入过多。"},{"q":"提示碳水化合物摄入过多的情况包括？","o":["很胖，特别是腹部肥胖","血浆中甘油三酯明显增高，排除饮酒因素","体重正常但小肚子软软的","体型消瘦且全身无力"],"a":[0,1,2],"e":"如果一个人很胖，特别是腹部肥胖，或者血浆中甘油三酯明显增高，排除饮酒的因素，则提示碳水化合物摄入过多。有些人体重正常或者还有些偏低，但是摸摸自己的腹部，总有小肚子，而且软软的，这就提示碳水化合物在饮食中所占的比例较高，应该调整。"},{"q":"那位30多岁女老师的情况包括？","o":["身高160厘米，体重82千克，BMI为32，腰围110厘米，属于向心性肥胖","特别喜欢吃粮食，白米白面、蛋糕面包、粉丝粉条等","平日家里水果不断，每天要吃1斤以上","每天吃大量肉类和牛奶"],"a":[0,1,2],"e":"她的身高160厘米，体重82千克，BMI为32，腰围110厘米，属于向心性肥胖。她特别喜欢吃粮食，白米白面、蛋糕面包、粉丝粉条等，都是她的最爱。平日家里水果不断，每天要吃500克（1斤）以上。"},{"q":"那位30多岁女老师的饮食误区包括？","o":["把土豆当菜，一边吃米饭一边吃土豆丝","再加个黄瓜拌粉丝，其实米饭、土豆、粉丝、粉条都是碳水化合物","几乎不吃肉，不喝牛奶","她的蔬菜摄入量已经远超标准"],"a":[0,1,2],"e":"她尤其喜欢吃土豆，总是把土豆当菜，一边吃米饭，一边吃土豆丝，再加上个黄瓜拌粉丝。其实这些食物中，米饭、土豆、粉丝、粉条都是碳水化合物。……她每天吃一个鸡蛋，几乎不吃肉，不喝牛奶。蔬菜一天250克（半斤）左右。"},{"q":"那位30多岁女老师调整饮食后的效果有？","o":["3个月后体重减了10斤，腰围减了2厘米","又过约8个月，身材匀称，曲线清晰","降糖药只吃二甲双胍，停掉了阿格列汀","她仍然需要两种降糖药"],"a":[0,1,2],"e":"3个月后，我见到她，她高兴地告诉我：“我体重减了10斤，腰围减了2厘米。”……她身材匀称，曲线清晰……“降糖药只吃二甲双胍，停掉了阿格列汀。”"},{"q":"关于碳水化合物的摄入量，作者的建议有？","o":["主要由体力消耗的多少来决定","体力劳动者要多吃些碳水化合物","脑力劳动者同时运动少的人吃的粮食量要少一些，但每天至少要保证150克左右的粮食","正在长身体的少年儿童要多吃粮食，而老年人要相应减少","老年人应比少年儿童吃更多粮食"],"a":[0,1,2,3],"e":"碳水化合物的摄入量，主要是由体力消耗的多少来决定。体力劳动者要多吃些碳水化合物……脑力劳动者同时运动少的人吃的粮食量要少一些，但是每天至少要保证150克左右的粮食。另外，正在长身体的少年儿童要多吃粮食，而老年人要相应减少。"},{"q":"关于碳水化合物的选择，作者的建议有？","o":["平时可以少吃多餐","多吃复合型碳水化合物，比如土豆、燕麦、莲藕等","少吃蔗糖和精米精面","消化能力很差的人可以暂时吃糊精，即白米粥里的汤汁","应尽量多吃蔗糖"],"a":[0,1,2,3],"e":"平时可以少吃多餐，多吃复合型碳水化合物（天然的食物都是复合型，比如土豆、燕麦、莲藕等），少吃蔗糖和精米精面。消化能力很差的人可以暂时吃糊精（白米粥里的汤汁），但是要注意搭配其他营养素，并且时间不要持续太长，摄入量上要注意。"},{"q":"关于“喝粥养人”的说法，作者的观点是？","o":["过去喝的粥和现在的不一样","老祖宗吃的五谷全部是粗粮，煮成糊状才能吃得进去","现在的米是精米，是免淘米，没有麸皮","同样是粥，对人的影响差异巨大","现在的粥比过去的粥更有营养"],"a":[0,1,2,3],"e":"中国人总讲“喝粥养人”，实际上过去喝的粥和现在的不一样，老祖宗吃的五谷全部是粗粮，煮一煮，煮成糊状才能吃得进去。而现在的米是精米，是免淘米，没有麸皮。所以虽然同样是粥，对人的影响却差异巨大。"},{"q":"关于碳水化合物的等量交换，正确的有？","o":["50克白米、白面换算为薯类，大约等于200克","50克白米、白面换算为水果（比如苹果和梨），大约等于400克","吃了薯类或者水果，相应地减少米面，甚至这顿饭可以不吃米面","50克白米等于400克薯类"],"a":[0,1,2],"e":"要学会在碳水化合物之间进行等量交换。一般来讲，50克白米、白面换算为薯类，大约等于200克，换算为水果（比如苹果和梨），大约等于400克。吃了薯类或者水果，相应地减少米面，甚至这顿饭可以不吃米面。"},{"q":"脂类中的脂肪与类脂分别指什么？","o":["脂类包括脂肪和类脂","脂肪是甘油三酯，又称中性脂肪","类脂包括磷脂、胆固醇和糖脂","类脂包括甘油三酯和脂肪酸"],"a":[0,1,2],"e":"脂类包括脂肪和类脂，脂肪是甘油三酯，又称中性脂肪；类脂包括磷脂、胆固醇和糖脂。"},{"q":"脂肪的主要功能有？","o":["供给人体热量","是脂溶性维生素的载体","提供必需脂肪酸","构建细胞膜的主体结构"],"a":[0,1,2],"e":"第一，供给人体热量……第二，是脂溶性维生素的载体……第三，提供必需脂肪酸。"},{"q":"关于脂肪供能的顺序，正确的有？","o":["三大产能营养素供能有先后顺序","先利用的是葡萄糖","脂肪只有在人体中的葡萄糖使用完了以后才会被分解去提供能量","脂肪永远最先被利用"],"a":[0,1,2],"e":"虽然三大产能营养素都能供能，但是有先后顺序。先利用的是葡萄糖，脂肪只有在人体中的葡萄糖使用完了以后才会被分解去提供能量。"},{"q":"为什么竞走运动员都很瘦，而铅球运动员都很胖？","o":["竞走是长时间的运动，葡萄糖被分解完后，运动的后半截靠分解脂肪产生能量","铅球是一瞬间的运动，糖还没有被消耗完，脂肪还留存在皮下","竞走运动员体内的葡萄糖永远用不完","铅球运动员不摄入脂肪"],"a":[0,1,2],"e":"我们看竞走运动员都很瘦，而铅球运动员都很胖，只因竞走是长时间的运动，身体中储存的葡萄糖被分解完后，运动的后半截靠分解脂肪产生能量；而铅球是一瞬间的运动，糖还没有被消耗完，所以脂肪还留存在皮下。"},{"q":"关于脂溶性维生素，正确的有？","o":["维生素A、D、E、K等只有在有油脂的环境下才可以被吸收","不吃油脂的人常会出现脂溶性维生素不足等症状","维生素C也是脂溶性维生素","脂溶性维生素不需要油脂就能吸收"],"a":[0,1],"e":"第二，是脂溶性维生素的载体。维生素A、D、E、K等脂溶性维生素，只有在有油脂的环境下才可以被吸收。因此，不吃油脂的人常会出现脂溶性维生素不足等症状。"},{"q":"人体必需的两种脂肪酸是？","o":["ω-6系列的亚油酸","ω-3系列的亚麻酸","ω-9系列的油酸","饱和脂肪酸"],"a":[0,1],"e":"第三，提供必需脂肪酸。ω-6系列的亚油酸和ω-3系列的亚麻酸是人体必需的两种脂肪酸。这类脂肪酸只能依赖从外界的摄入，且往往在身体里承担了重要的角色，是合成很多生物活性物质的原料，比如：磷脂、前列腺素（PG）、血栓素（TXA）、白三烯（LT）和调节胆固醇等。"},{"q":"必需脂肪酸在身体里可参与合成？","o":["磷脂","前列腺素（PG）、血栓素（TXA）、白三烯（LT）","调节胆固醇","维生素C"],"a":[0,1,2],"e":"这类脂肪酸只能依赖从外界的摄入，且往往在身体里承担了重要的角色，是合成很多生物活性物质的原料，比如：磷脂、前列腺素（PG）、血栓素（TXA）、白三烯（LT）和调节胆固醇等。"},{"q":"那位45岁女患者的检查结果与诊断包括？","o":["反流性食管炎","胃下垂得很厉害","尿常规出现蛋白质阳性和潜血","甲状腺功能亢进"],"a":[0,1,2],"e":"她去消化科做检查，诊断为反流性食管炎；做B超，医生告诉她胃下垂得很厉害；查尿常规，尿液出现蛋白质阳性和潜血等一系列问题。"},{"q":"那位45岁女患者胃下垂的根本原因包括？","o":["脂肪在脏器之间起着无法替代的支撑作用","缺乏脂肪会导致固定胃的韧带和网膜不牢固，胃受重力影响就会发生下垂","饮食结构不平衡，蛋白质、脂肪摄入不足，导致器官功能下降","她平时吃得太多导致胃被撑大"],"a":[0,1,2],"e":"脂肪在脏器之间起着无法替代的支撑作用，缺乏脂肪会导致固定胃的韧带和网膜不牢固，胃受重力影响就会发生下垂，所以她的胃下垂归根结底是缘于饮食中的脂肪缺乏。她怕胖，吃脂肪类食物和主食都非常控制，饮食结构不平衡，蛋白质、脂肪摄入不足，从而导致了器官功能下降，造成贲门括约肌收缩无力，全身肌肉无力。"},{"q":"那位45岁女患者的其他症状包括？","o":["视力下降得快，看一会儿手机眼睛就特别不舒服","皮肤干干的，皮屑很多","出虚汗，记忆力下降","皮肤油脂分泌旺盛"],"a":[0,1,2],"e":"“我这些年视力下降得可快了，看一会儿手机眼睛就特别不舒服。每天要往身上涂许多护肤霜，否则总觉得皮肤干干的，皮屑很多。出虚汗，记忆力下降。”"},{"q":"关于磷脂的作用，正确的有？","o":["对活化细胞，维持细胞新陈代谢、基础代谢及荷尔蒙的均衡分泌有重大作用","在增强人体免疫力和细胞的再生力方面十分关键","在调节血脂、保持血管通畅方面扮演着重要角色","是细胞膜中含量最少的成分"],"a":[0,1,2],"e":"磷脂不仅对活化细胞，维持细胞新陈代谢、基础代谢及荷尔蒙的均衡分泌有重大作用，而且在增强人体免疫力和细胞的再生力方面也十分关键，在调节血脂、保持血管通畅方面更是扮演着重要的角色。"},{"q":"关于磷脂与大脑，正确的有？","o":["人体的神经细胞和大脑细胞结构中大约有一半是磷脂","磷脂的质量和数量决定了大脑细胞间信息传递的速度","具有增强记忆力、预防老年痴呆的功能","大脑细胞结构中不含磷脂"],"a":[0,1,2],"e":"人体的神经细胞和大脑细胞结构中大约有一半是磷脂。磷脂的质量和数量决定了大脑细胞间信息传递的速度，因此具有增强记忆力、预防老年痴呆的功能。"},{"q":"小孩子半岁时开始增加辅食，主要原因是？","o":["大脑的发育很快","鸡蛋里的卵磷脂是孩子需要的营养素","猪肝和肉里的铁、蛋白质及磷脂正是孩子最需要的营养素","增加鱼油类食物如DHA、EPA可以提高脑细胞的磷脂的质量","孩子此时已经长出恒牙"],"a":[0,1,2,3],"e":"大家都知道小孩子半岁时就要开始增加鸡蛋、猪肝、肉类等辅食，主要原因是大脑的发育很快，鸡蛋里的卵磷脂，猪肝和肉里的铁、蛋白质及磷脂正是孩子最需要的营养素。另外，增加鱼油类食物（如DHA、EPA）也可以提高脑细胞的磷脂的质量。"},{"q":"关于胆固醇的作用，正确的有？","o":["胆固醇占人体体重0.2%","增加细胞膜的韧性和坚固度，防止细胞膜损伤","是形成肾上腺皮质激素和性激素的原料","参与合成维生素D3和胆汁酸","只是有害无益的物质"],"a":[0,1,2,3],"e":"胆固醇占人体体重0.2%，和磷脂、蛋白质并肩作战，成为细胞膜的结构成分，它的作用是增加细胞膜的韧性和坚固度，防止细胞膜损伤。另外，它还是形成肾上腺皮质激素和性激素的原料……不仅如此，胆固醇进入人体后还要参与合成维生素D3和胆汁酸，从而防止骨质疏松、低钙，帮助脂类消化和吸收。"},{"q":"临床上不吃肉蛋奶等含胆固醇食物的人，可能患上？","o":["卵巢早衰","性功能障碍","高胆固醇血症","肥胖"],"a":[0,1],"e":"在临床上，我们经常见到很多怕胖、恐慌胆固醇摄入过多的患者，他们不吃肉蛋奶等含胆固醇的食物，却因此患上了卵巢早衰或者性功能障碍。"},{"q":"关于糖脂与神经髓鞘，正确的有？","o":["糖脂在神经髓鞘中分布很广","神经髓鞘的作用是绝缘和增快神经传导速度","三叉神经痛就是三叉神经的髓鞘破损造成了神经短路的结果","糖脂只存在于肝脏中"],"a":[0,1,2],"e":"糖脂在神经髓鞘中分布很广，神经髓鞘的作用是绝缘和增快神经传导速度。大家可能听说过三叉神经痛，就是三叉神经的髓鞘破损造成了神经短路的结果。这种疼痛的感觉非常可怕，有种痛不欲生之感，这与类脂摄入不足息息相关。"},{"q":"神经细胞消耗的营养素包括？","o":["磷脂","蛋白质、胆固醇","脂肪酸、维生素和某种矿物质","只消耗糖"],"a":[0,1,2],"e":"如果你看懂了前文神经细胞所需消耗的营养素，就知道神经细胞消耗的不只是糖，还有磷脂、蛋白质、胆固醇、脂肪酸、维生素和某种矿物质。"},{"q":"食物中含脂类的有？","o":["植物油、动物油、坚果","加工食品中的脂肪","动物的皮下脂肪、动物大脑中的脂质","鱼油","蔬菜和水果"],"a":[0,1,2,3],"e":"食物中含脂类的有植物油、动物油、坚果、加工食品中的脂肪、动物的皮下脂肪、动物大脑中的脂质（磷脂、胆固醇、糖脂），还有鱼油。"},{"q":"关于每日脂类摄入量，正确的有？","o":["应占一天总能量的30%左右","大多数发达国家的摄入量要高于这个数，发展中国家要低于这个数","北方寒冷地区居民的脂类摄入量要多于南方温暖地区居民","南方温暖地区居民摄入量多于北方"],"a":[0,1,2],"e":"一般来讲，我们每天摄入的脂类应占一天总能量的30%左右。大多数发达国家的摄入量要高于这个数，发展中国家要低于这个数。在此范围内，北方寒冷地区居民的脂类摄入量要多于南方温暖地区居民。"},{"q":"关于三种脂肪酸的比例，正确的有？","o":["脂类中饱和脂肪酸、单不饱和脂肪酸和多不饱和脂肪酸应各占10%","在室温下饱和脂肪酸大多处于凝固状态，比如大肥肉、腊肉","植物油中的椰子油和棕榈油也是饱和脂肪酸","椰子油和棕榈油属于多不饱和脂肪酸"],"a":[0,1,2],"e":"在这30%左右的脂类中，饱和脂肪酸、单不饱和脂肪酸和多不饱和脂肪酸这三种脂肪酸应各占10%。有个简单办法可以进行判断：在室温下饱和脂肪酸大多处于凝固状态，比如大肥肉、腊肉。植物油中的椰子油和棕榈油也是饱和脂肪酸。"},{"q":"单不饱和脂肪酸含量在70%以上的两种油是？","o":["橄榄油","茶籽油","大豆油","花生油"],"a":[0,1],"e":"单不饱和脂肪酸含量在70%以上的有两种油：橄榄油和茶籽油。"},{"q":"在室温下呈流动状态、含多不饱和脂肪酸较多的油包括？","o":["大豆油","小麦胚芽油、玉米油","芝麻油和花生油","椰子油"],"a":[0,1,2],"e":"其余的在室温下呈流动状态的油基本上都是含多不饱和脂肪酸较多的油，比如大豆油、小麦胚芽油、玉米油、芝麻油和花生油。"},{"q":"做到三种脂肪酸大致均衡的简单操作方法是？","o":["动物脂肪占一半","植物脂肪占一半","全部用植物油","全部用动物油"],"a":[0,1],"e":"比较简单的操作方法是：动物脂肪占一半，植物脂肪占一半。"},{"q":"那位30岁男性（165厘米、60千克）的脂类计算，正确的有？","o":["一天应该摄入的总能量为35×60=2100千卡","每天摄入脂类应该是2100×30%÷9=70克","70克脂肪中有一半要来自动物脂肪，另一半来自植物脂肪","他应该只摄入植物脂肪"],"a":[0,1,2],"e":"这位男士的体重适中，他在工作中用电脑较多，每天运动1.5个小时，他一天应该摄入的总能量为35×60=2100千卡，每克脂类能够产生9千卡能量，因此他每天摄入脂类应该是2100×30%÷9=70克。这70克脂肪……有一半要来自动物脂肪，从肉、蛋、奶、鱼中获得；另一半来自植物脂肪，从食用油和坚果中获得。"},{"q":"关于植物脂肪的摄入量，正确的有？","o":["主要存在于食用油和坚果中","一个人一天的摄入量在30毫升左右","运动量大的人可以适当增加，比如35毫升","植物脂肪完全不需要控制数量"],"a":[0,1,2],"e":"植物脂肪主要存在于食用油和坚果中。植物脂肪的摄入量特别好计算，看看油壶上的刻度，或者用小勺估量，基本上就差不多了。一个人一天的摄入量在30毫升左右。上面这个患者应该是35毫升（35克），因为他的运动量较大。"},{"q":"关于动物脂肪的来源，正确的有？","o":["在肥肉和瘦肉里都有","鱼肉、牛奶里也有","鸡蛋和内脏里含有许多磷脂和胆固醇，这些类脂参与构成人体的框架结构","每天吃一个鸡蛋、一袋牛奶、100～150克瘦肉，每周吃2～3次鱼，摄入的动物脂肪量基本就够用了","只有肥肉里才有动物脂肪"],"a":[0,1,2,3],"e":"动物脂肪在肥肉和瘦肉里都有，鱼肉、牛奶里也有。鸡蛋和内脏里含有许多磷脂和胆固醇，这些类脂参与构成人体的框架结构，绝对不能缺少。一般来讲，每天吃一个鸡蛋、一袋牛奶、100～150克瘦肉，每周吃2～3次鱼，摄入的动物脂肪量基本就够用了。"},{"q":"关于ω-3和ω-6系列不饱和脂肪酸，正确的有？","o":["都是人体必需脂肪酸，一定要从食物中获得","一般认为应不少于总能量的3%","ω-6系列的不饱和脂肪酸主要存在于植物油中","ω-3系列的脂肪酸只存在于植物油中"],"a":[0,1,2],"e":"ω-3和ω-6系列不饱和脂肪酸都是人体必需脂肪酸，一定要从食物中获得，一般认为应不少于总能量的3%。ω-6系列的不饱和脂肪酸主要存在于植物油中。"},{"q":"ω-3系列的脂肪酸存在于哪里？","o":["动物中有深海鱼、贝类","植物中有亚麻籽、坚果和马齿苋","保健品中品质较好的鱼油中也含有ω-3不饱和脂肪酸","精米白面中"],"a":[0,1,2],"e":"ω-3系列的脂肪酸都在哪里呢？动物中有深海鱼、贝类，植物中有亚麻籽、坚果和马齿苋，保健品中品质较好的鱼油中也含有ω-3不饱和脂肪酸。"},{"q":"关于ω-3与ω-6的比例，正确的有？","o":["比较好的比例是1∶4～6","现实生活中大多数人摄入的实际比例几乎到了1∶20","ω-3脂肪酸的每日摄入量应不低于总能量的0.5%","ω-3越多越好，没有上限要求"],"a":[0,1,2],"e":"ω-3和ω-6之间比较好的比例是1∶4～6。由于大家获取植物油要比获取深海鱼、贝类、坚果以及鱼油等容易得多，所以现实生活中大多数人摄入的实际比例几乎到了1∶20，甚至更夸张。……通常来讲，一个人ω-3脂肪酸的每日摄入量应不低于总能量的0.5%。"},{"q":"ω-6摄入过多会引起哪些问题？","o":["血管炎症、高脂血症、心脑血管病","关节炎症","肥胖、哮喘","夜盲症"],"a":[0,1,2],"e":"研究表明，许多慢性炎症性疾病都与这个比例失调有关。ω-6摄入过多会引起血管炎症、高脂血症、心脑血管病、关节炎症、肥胖、哮喘等问题。"},{"q":"关于反式脂肪酸的来历，正确的有？","o":["20世纪初，德国化学家威廉·诺曼获得了一项将食用油部分“氢化”的发明专利","经过“氢化”的植物油与普通植物油相比更加稳定，呈固体状态","与动物油相比价格还更低廉","它天然存在于所有植物油中"],"a":[0,1,2],"e":"20世纪初，德国化学家威廉·诺曼获得了一项发明专利，将食用油部分“氢化”。经过“氢化”的植物油与普通植物油相比更加稳定，呈固体状态，可以使食品外观更好看，口感更松软，同时，与动物油相比价格还更低廉。"},{"q":"摄入过多反式脂肪酸会引起哪些健康问题？","o":["促进血栓形成，造成冠心病和脑卒中","影响生育能力，减少男性荷尔蒙的分泌，对精子的活跃性产生负面影响","影响胎儿发育；影响大脑功能，降低记忆力","引起肥胖","能增强免疫力"],"a":[0,1,2,3],"e":"科学家们发现，摄入过多反式脂肪酸会引起以下几个严重的健康问题：促进血栓形成，造成冠心病和脑卒中。影响生育能力……影响胎儿发育。影响大脑功能……引起肥胖。"},{"q":"反式脂肪酸在食品标签上常见的名字有？","o":["植物氢化油、氢化油","人造黄（奶）油、人造植物黄（奶）油","人造脂肪、起酥油、植脂末","橄榄油、茶籽油"],"a":[0,1,2],"e":"反式脂肪酸有很多好听的名字，比如：植物氢化油、人造黄（奶）油、人造植物黄（奶）油、人造脂肪、氢化油、起酥油、植脂末等。"},{"q":"以下哪些食物中含有反式脂肪酸？","o":["蛋糕、糕点、饼干、面包、蛋黄派","沙拉酱、炸薯条、炸薯片、爆米花","巧克力、冰淇淋","新鲜蔬菜和水果"],"a":[0,1,2],"e":"哪些食物中含有反式脂肪酸呢？我来列举一些大家特别熟悉的：蛋糕、糕点、饼干、面包、蛋黄派、沙拉酱、炸薯条、炸薯片、爆米花、巧克力、冰淇淋……"},{"q":"关于反式脂肪酸的限量，正确的有？","o":["世界卫生组织、联合国粮农组织建议反式脂肪酸最大摄取量不超过总能量的1%","1%折算出来一个人一天的限量在2克左右","奶茶和咖啡中的“植脂末”也是反式脂肪酸","限量是每天20克"],"a":[0,1,2],"e":"为了控制反式脂肪酸的摄入，世界卫生组织、联合国粮农组织在《膳食营养与慢性疾病（2003）》中建议“反式脂肪酸最大摄取量不超过总能量的1%”，这个1%折算出来一个人一天的限量在2克左右。……大家还要注意奶茶和咖啡中的配料，上面清清楚楚写着“植脂末”，这也是反式脂肪酸。"},{"q":"为什么有些食品标签上标着氢化油，营养成分表却写“反式脂肪酸为0”？","o":["一个人一天摄入反式脂肪酸应低于2克","如果只吃这类包装食品中的一个小食品，绝对没有超标，于是可以忽略不计","但一天吃两三块，再加一个冰淇淋、一杯咖啡，就未必不超标","因为氢化油中确实不含反式脂肪酸"],"a":[0,1,2],"e":"我们经常看到一些食品包装袋的标签上食物成分中明明标有植物氢化油、氢化油、起酥油、植脂末等字样，但是在营养成分表里却写着“反式脂肪酸为0”，这是为什么呢？上面说了，一个人一天摄入反式脂肪酸应低于2克，因此，如果只吃这类包装食品中的一个小食品，绝对没有超标，于是可以忽略不计。但是，大家想一想，吃小食品是不是一天只吃一个？"},{"q":"关于胆固醇的来源，正确的有？","o":["分为外源性胆固醇和内源性胆固醇两种","外源性胆固醇来自每日膳食","内源性胆固醇由肝脏合成，肝脏把摄入的葡萄糖等能量成分转变为胆固醇","胆固醇只能从食物中获得"],"a":[0,1,2],"e":"胆固醇的来源分为外源性胆固醇和内源性胆固醇两种。外源性胆固醇来自每日膳食，内源性胆固醇则是由肝脏合成，肝脏把摄入的葡萄糖等能量成分转变为胆固醇。"},{"q":"关于胆固醇的每日需要量与来源比例，正确的有？","o":["一个人一天需要1300～1500毫克胆固醇供人体细胞使用","每天饮食摄入胆固醇300～500毫克","肝脏合成1000毫克，大部分在晚上合成","肝脏合成的胆固醇比饮食摄入的多","饮食摄入的胆固醇主要来自蔬菜和水果"],"a":[0,1,2,3],"e":"一个人一天需要1300～1500毫克胆固醇供人体细胞使用。正常的比例是每天饮食摄入胆固醇300～500毫克（白天从三顿饭中获得），肝脏合成1000毫克（大部分在晚上合成）。其中通过饮食摄入的胆固醇主要来自动物性食物，包括鸡蛋、内脏、脑和肉类。"},{"q":"关于常见食物中的胆固醇含量，正确的有？","o":["一个中等大小的鸡蛋中胆固醇的含量为250毫克左右","100克畜禽类瘦肉中胆固醇的含量为70毫克左右","鸡蛋和瘦肉都是胆固醇的来源","100克瘦肉含胆固醇250毫克"],"a":[0,1,2],"e":"一个中等大小的鸡蛋中胆固醇的含量为250毫克左右，100克畜禽类瘦肉中胆固醇的含量为70毫克左右。"},{"q":"关于磷脂的摄入，正确的有？","o":["细胞膜当中大约有一半是磷脂","磷脂主要从食物中获得，肝脏也能合成部分磷脂，但是量不能满足人体需求","含磷脂多的动物类食物包括鸡蛋、肝脏、脑、骨髓、肾脏、心脏等","含磷脂多的植物类食物包括芝麻、葵花籽、大豆等","磷脂应尽量限制摄入"],"a":[0,1,2,3],"e":"磷脂是组成人体生命细胞的重要成分，细胞膜当中大约有一半是磷脂。磷脂主要从食物中获得，肝脏也能合成部分磷脂，但是量不能满足人体需求……大家要尽量摄入含磷脂多的食物，如动物类食物中的鸡蛋、肝脏、脑、骨髓、肾脏、心脏等，植物类食物中的芝麻、葵花籽、大豆等。"},{"q":"关于糖脂，正确的有？","o":["糖脂是糖类和脂类结合所形成的物质","糖鞘脂有脑苷脂和神经节苷脂","脑苷脂在脑中含量最多，肺、肾次之","血型就是由红细胞质膜上的糖鞘脂决定的","糖脂在人体中含量最多"],"a":[0,1,2,3],"e":"糖脂是糖类和脂类结合所形成的物质……糖鞘脂有脑苷脂和神经节苷脂。脑苷脂在脑中含量最多，肺、肾次之，肝、脾及血清中也含有。……在细胞膜表面的糖鞘脂主要作为细胞表面的标志物质，比如我们每个人都有一种血型，A型、B型、O型或AB型，这个血型就是由红细胞质膜上的糖鞘脂决定的。"},{"q":"糖脂最主要的功能是？","o":["神经系统中髓鞘的成分","作为细胞表面标志物质","提供大量能量","构成骨骼"],"a":[0,1],"e":"所以糖脂有两个最主要的功能，一个是神经系统中髓鞘的成分，另一个是作为细胞表面标志物质。"},{"q":"关于半乳糖的来源，正确的有？","o":["从牛奶和甜菜里获取","婴儿可以从母乳中获得半乳糖","成年人应适当补充一些奶制品来获得，再增加一些坚果和鱼类食物","只能通过药物补充"],"a":[0,1,2],"e":"我们的身体中一般不会缺乏葡萄糖，那半乳糖从哪里获取呢？从牛奶和甜菜里。婴儿可以从母乳中获得半乳糖，而成年人应适当补充一些奶制品来获得，再增加一些坚果和鱼类食物。"},{"q":"脂类食物摄入大于消耗时，主要表现为？","o":["肥胖","肥胖表现为全身胖，四肢粗壮","同时皮肤细腻、有光泽、有弹性","皮肤干燥脱皮屑"],"a":[0,1,2],"e":"当脂类食物的摄入大于消耗时，主要表现为肥胖。这种肥胖表现为全身胖，四肢粗壮，同时皮肤细腻、有光泽、有弹性。"},{"q":"脂类食物摄入低于消耗时，会表现为？","o":["消瘦","出现脂溶性维生素缺乏的症状","皮肤变得细腻有光泽","体重明显增加"],"a":[0,1],"e":"当脂类食物摄入低于消耗时，就会表现为以下两种情况：第一，消瘦。第二，出现脂溶性维生素缺乏的症状。"},{"q":"关于脂溶性维生素缺乏的症状，正确的有？","o":["缺乏维生素A：皮肤干燥，脱皮屑，出皮疹","缺乏维生素D：骨头和关节疼痛，肌肉萎缩，腹泻等","缺乏维生素E：生育能力下降，免疫力下降，代谢失常，机体衰老等","缺乏维生素K：牙龈出血、流鼻血、尿血、胃出血等各种出血症状","缺乏维生素A：夜盲症和骨痛"],"a":[0,1,2,3],"e":"缺乏维生素A的症状：皮肤干燥，脱皮屑，出皮疹。……缺乏维生素D的症状：骨头和关节疼痛，肌肉萎缩，腹泻等。缺乏维生素E的症状：生育能力下降，免疫力下降，代谢失常，机体衰老等。缺乏维生素K的症状：牙龈出血、流鼻血、尿血、胃出血等各种出血症状。"},{"q":"造成脂类摄入下降的原因有？","o":["食物中缺乏脂肪的素食者","脂肪泻患者","需求量不能得到满足的孩子和孕妇","每天吃大量坚果的人"],"a":[0,1,2],"e":"造成脂类摄入下降的原因有很多，比如食物中缺乏脂肪的素食者、脂肪泻患者，或者需求量不能得到满足的孩子和孕妇等。"},{"q":"关于希腊克里特岛居民的饮食，正确的有？","o":["脂类摄入量占到整体能量摄入的40%，比我们要求的高","癌症死亡率却只有美国的一半","冠心病死亡率是美国的1/20","他们摄入的脂类主要来源于鱼、坚果和橄榄油","他们的冠心病死亡率是美国的20倍"],"a":[0,1,2,3],"e":"希腊克里特岛的居民脂类摄入量占到整体能量摄入的40%，比我们现在要求的高多了，但他们的癌症死亡率却只有美国的一半，冠心病死亡率是美国的1/20。他们摄入的脂类主要来源于鱼、坚果和橄榄油，完全符合我们前面提到的三种类型脂肪酸的比例，所以在脂类摄入中合适的比例要比量的控制重要得多。"},{"q":"那位14岁孩子的情况包括？","o":["个子像10岁，小腿的皮肤像鱼鳞一样","家里从来不喝牛奶，每天吃一个煮鸡蛋，不吃油炸的食物","妈妈一周只让他吃2次肉，一次只能吃一块手机那么大的肉","他每天吃大量鱼肉"],"a":[0,1,2],"e":"这个孩子14岁，个子却像10岁……因为一个十几岁的男孩子，正是长身体的时候……这个孩子从小学一年级开始，小腿的皮肤像鱼鳞一样，抹了药也没有效果……“我们家从来不喝牛奶，每天吃一个煮鸡蛋，不吃油炸的食物。我很喜欢吃肉，但是不爱吃鱼，因为不会挑刺。”……“我妈说要适量，一周让我吃2次，不让吃肥肉。”"},{"q":"作者对这个14岁孩子的判断与建议是？","o":["他的身体严重缺乏蛋白质和脂类，皮肤的角化过程受到影响，个子也长不高","细胞膜最主要的结构成分是磷脂、蛋白质和胆固醇","饮食要因人而异，尤其是孩子、孕妇等特殊人群","对孩子的饮食建议是继续少肉少油"],"a":[0,1,2],"e":"我真为这个孩子感到难过，他的身体那么缺乏蛋白质和脂类，皮肤的角化过程都受到影响，个子也长不高，家长却还不明白是怎么回事。……不仅是因为孩子正在长个子、长身体，更如前面所说的，细胞膜最主要的结构成分是磷脂、蛋白质和胆固醇……可是，饮食要因人而异，尤其是孩子、孕妇等特殊人群，他们对于某些营养的需求更高。"},{"q":"那位50多岁女患者脑萎缩的病因包括？","o":["大多数时候一个人生活，食物只有粮食和蔬菜两部分来源","磷脂、蛋白质、胆固醇、必需脂肪酸这些大脑需要的最基本的养分一样都没有","她本来就有高血压和糖尿病","她每天吃肉过多"],"a":[0,1,2],"e":"说来说去，她的食物只有两部分来源：粮食和蔬菜。磷脂、蛋白质、胆固醇、必需脂肪酸这些大脑需要的最基本的养分一样都没有，脑细胞怎么可能不萎缩？……她以前有高血压和糖尿病，一直吃药，控制得还可以。"},{"q":"关于脂肪摄入量的计算，以那位185厘米的电脑程序员为例，正确的有？","o":["他属于轻体力劳动者，每天所需总能量为（185－105）×30=2400千卡","脂肪提供的能量应该是2400×30%＝720千卡","推算脂肪的摄入量是720÷9＝80克","他每天需要补充160克脂肪"],"a":[0,1,2],"e":"这位程序员身高185厘米……属于轻体力劳动者，那么他每天所需总能量应该是（185－105）×30=2400千卡。每人每天摄入的脂肪量要占人体需要能量的30%，也就是说脂肪提供的能量应该是2400×30%＝720千卡。……即720÷9＝80克。也就是说，对一个185厘米轻体力劳动的男性来说，他每天需要补充80克脂肪。"},{"q":"关于脂肪摄入的执行，作者的观点有？","o":["在脂肪中最需要控制摄入的是反式脂肪酸","肥肉是可以吃的，适量就好","鱼油是多不饱和脂肪酸，而且是必需脂肪酸，最好经常摄入，可以多吃一些深海鱼","必须严格按照计算出来的脂肪摄入量执行，1克不能差","运动较多的人可以多吃一些油性食物，体力劳动者可以多吃一些肥肉"],"a":[0,1,2,4],"e":"在脂肪中最需要控制摄入的是反式脂肪酸，而肥肉是可以吃的，适量就好；鱼油是多不饱和脂肪酸，而且是必需脂肪酸，最好经常摄入，可以多吃一些深海鱼；如果有条件，也可以选择高质量的鱼油。另外，并不是说我们必须严格按照计算出来的脂肪摄入量执行，在不同情况下我们还要灵活调整。例如，运动较多的人可以多吃一些油性食物，包括饱和脂肪，体力劳动者可以多吃一些肥肉，这样可以保证有足够的能量。"},{"q":"关于维生素在人体中的特点，正确的有？","o":["维生素在人体中的含量很少，不到1%","如果没有维生素，人体内很多重要的生命活动都无法完成","所以叫作维持生命的元素，简称“维生素”","维生素是三大产能营养素之一"],"a":[0,1,2],"e":"维生素在人体中的含量很少，不到1%，但如果没有维生素，人体内很多重要的生命活动都无法完成，所以叫作维持生命的元素，简称“维生素”。"},{"q":"人体需要的两大类维生素是？","o":["脂溶性维生素，包括维生素A、D、E、K","水溶性维生素，包括维生素B族和维生素C","脂溶性维生素必须溶解在油脂里才能被吸收","水溶性维生素只能溶解在油脂里"],"a":[0,1,2],"e":"一类叫作脂溶性维生素，包括维生素A、D、E、K。这类维生素必须溶解在油脂里才能被吸收。另一类叫作水溶性维生素，包括维生素B族和维生素C，水溶性维生素可溶解在水中，很容易流失。"},{"q":"为什么从食物中获取的维生素一般不会过量，缺乏的情况居多？","o":["维生素在人体内不能合成，也不能相互转化，只能从食物中获取","尤其是水溶性维生素特别容易流失","如果摄入多了，会马上通过尿液和汗水从体内排出","维生素可以在人体内大量合成"],"a":[0,1,2],"e":"维生素在人体内不能合成，也不能相互转化，只能从食物中获取，所以如果从食物中摄取不足，就会出现维生素缺乏的症状。尤其是水溶性维生素，特别容易流失，如果摄入多了，会马上通过尿液和汗水从体内排出。"},{"q":"关于脂溶性维生素的特点，正确的有？","o":["能在人体的脂肪组织内储存，有“吃一顿，管三天”的特点","抗流失能力较强","如果不良饮食习惯坚持几年、几十年不变，体内储存的维生素被消耗干净，也会出现许多疾病","脂溶性维生素完全不溶于脂肪"],"a":[0,1,2],"e":"脂溶性维生素尽管能在人体的脂肪组织内储存，有“吃一顿，管三天”的特点，抗流失能力较强，但如果不良饮食习惯坚持几年、几十年不变，体内储存的维生素被消耗干净，当细胞缺乏维生素时就会出现许多疾病，甚至会导致死亡。"},{"q":"日常生活中维生素缺乏的主要诱因包括？","o":["膳食中供给不足","食物加工过程中破坏丢失过多","偏食","工作条件限制","每天吃大量新鲜蔬菜水果"],"a":[0,1,2,3],"e":"日常生活中，维生素缺乏主要有以下几种诱因：第一，膳食中供给不足。第二，食物加工过程中破坏丢失过多，如熬煮时间过长，冲洗次数过多，或者油炸温度过高，都会破坏食物中的维生素。第三，偏食。……第四，工作条件限制。"},{"q":"那位患周围神经炎的患者，她的饮食问题是？","o":["每天吃白菜炖豆腐，不爱吃肉，一周吃一个鸡蛋","白菜豆腐每次炖半小时，把蔬菜里的维生素炖没了","偏食导致维生素B族缺乏","她吃了太多油炸食品"],"a":[0,1,2],"e":"有一次，我遇到一位患者，她的周围神经炎特别明显。一般来讲，这个病和维生素B族缺乏关系密切……她说：“不是讲白菜豆腐保平安吗？我每天都吃白菜炖豆腐。不爱吃肉，一周吃一个鸡蛋。”……她的回答让我们诊室的人都吃了一惊：“半小时。”这炖的时间也太长了，好不容易吃点蔬菜，还把里面的一点维生素给炖没了。"},{"q":"补充维生素A、D、E等脂溶性维生素制剂时要注意？","o":["由于脂溶性维生素不溶于水，难以从肾脏排出，易在身体里积存过多产生毒性作用","要注意用量，别过犹不及","给孩子吃鱼肝油要严格按照说明书吃","脂溶性维生素可以随意大量补充"],"a":[0,1,2],"e":"需要提醒的是，由于脂溶性维生素不溶于水，难以从肾脏排出，易在身体里积存过多产生毒性作用，所以我们在补充维生素A、D、E等脂溶性维生素制剂时要注意用量，别过犹不及。比如咱们给孩子吃鱼肝油的时候都要严格按照说明书吃。"},{"q":"作者给出租车司机的饮食建议包括？","o":["在车上备一些煮好的鸡蛋、牛肉干","洗干净的西红柿、黄瓜，拿起来就能吃","准备些奶片或红薯干当零食","晚上回家后好好补补营养，白天没吃什么，晚上就补什么","在车上多备面包和饮料即可"],"a":[0,1,2,3],"e":"建议他们可以在车上备一些煮好的鸡蛋、牛肉干，还有洗干净的西红柿、黄瓜，拿起来就能吃，另外再准备些奶片或红薯干当零食。晚上回家后好好补补营养，白天没吃什么，晚上就补什么。"},{"q":"哪些因素会影响维生素的吸收？","o":["长期腹泻、胆汁分泌受限、胃酸分泌减少造成消化能力变差","膳食中脂肪含量低会影响脂溶性维生素的吸收","膳食中脂肪含量过高会完全阻止维生素吸收","多喝水会影响所有维生素的吸收"],"a":[0,1],"e":"还有一些特殊人群很容易出现维生素缺乏。例如，长期腹泻、胆汁分泌受限、胃酸分泌减少都会造成消化能力变差，影响维生素的吸收；如果膳食中脂肪含量低，也会影响脂溶性维生素的吸收。"},{"q":"会使维生素需求量相对增高的情况包括？","o":["妊娠期与哺乳期妇女","生长发育期儿童","某些疾病，如长期高热、慢性消耗性疾患","服用异烟肼、青霉胺及避孕药等会增加对维生素B6的需求","饭后散步"],"a":[0,1,2,3],"e":"再如妊娠期与哺乳期妇女、生长发育期儿童以及特殊生活环境条件下，某些疾病（长期高热、慢性消耗性疾患等）均会使维生素需求量相对增高。服用异烟肼、青霉胺及避孕药等也会增加对维生素B6的需求。"},{"q":"关于维生素缺乏的过程，正确的有？","o":["开始时体内储备量降低，身体会感觉到不适，但各项检查尚且正常","当体内储备越来越低，生化检查开始出现异常","最后组织病理也发生变化，此时临床上才会表现出相应体征","一旦出现症状，说明缺乏才刚刚开始"],"a":[0,1,2],"e":"维生素缺乏是一个渐进的过程。开始时，体内储备量降低，身体会感觉到不适，但是各项检查尚且正常。当体内储备越来越低，生化检查开始出现异常，最后组织病理也发生变化，此时在临床上才会表现出相应体征，但这时已经晚了。"},{"q":"关于补充维生素的剂量，正确的有？","o":["出现症状或体征时，补给的维生素含量要远大于每日推荐量","因为补进去的量要把身体中的亏空量算进去","随着症状好转，减少摄入量，直到症状完全消失，才调整到正常人的每日推荐量","补充剂量应始终等于每日推荐量"],"a":[0,1,2],"e":"所以当我们看到患者出现症状或者体征时，补给的维生素含量要远大于每日推荐量，因为补进去的量要把身体中的亏空量算进去。随着细胞内的补充剂量进入，症状好转，这时候减少摄入量，直到相应症状完全消失，才把剂量调整到正常人的每日推荐量。"},{"q":"关于维生素补充剂，作者的建议是？","o":["最好选择从食物中提取的天然维生素","化学合成的维生素不要长期摄入","化学合成的维生素效果远好于天然维生素","可以长期大量服用化学合成维生素"],"a":[0,1],"e":"经常吃一些维生素补充片也是很好的选择。但是在这里我要特别强调一下，维生素补充剂最好选择从食物中提取的天然维生素，化学合成的维生素不要长期摄入。"},{"q":"为什么现代人对维生素A的消耗比历史上任何年代都多？","o":["手机和电脑的广泛应用","视神经的光敏感作用需要维生素A","黑暗中的视觉状态与维生素A关系更为密切","现代人吃动物肝脏太多"],"a":[0,1,2],"e":"近些年，由于手机和电脑的广泛应用，人体对维生素A的消耗比历史上任何年代都多。因为视神经的光敏感作用需要维生素A，尤其是黑暗中的视觉状态与维生素A关系更为密切。"},{"q":"维生素
