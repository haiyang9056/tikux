us:8px;padding:8px 10px;font-size:12px;line-height:1.7}.ex-t{color:#14532d;font-weight:700;margin-bottom:3px;display:block}.ex-b{color:#334155}</style></head><body><div class="hdr"><h1>冯雪科学减肥法 · 题库</h1><p>覆盖第三、四章全部内容 | 每次抽60题 | 满分100分 | 70分及格</p><div class="stats"><span>📝 单选414题</span><span>📋 多选163题</span></div></div><div class="container" id="app"></div><div class="result-box" id="resultBox"><div class="container" id="resultContent"></div></div><div class="ftr"><div class="ftr-inner"><div class="ftr-info">已答 <strong id="answeredCount">0</strong>/60 | 得分 <strong id="scoreDisplay">0</strong></div><div class="btn-grp"><button class="btn btn-s" onclick="reshuffle()">🔄 重新抽题</button><button class="btn btn-p" id="submitBtn" onclick="submitQuiz()">📩 提交</button></div></div></div><script>var QB = {"singles":[{"q":"研究表明，减肥一年后复胖的比例高达多少？","o":["50%以上","70%以上","95%以上","99%以上"],"a":2,"e":"研究表明，在减肥一年后，复胖的比例高达95％以上。"},{"q":"从医学角度，肥胖被定义为什么性质的疾病？","o":["急性传染性疾病","慢性渐进性疾病","单纯的心理疾病","遗传性疾病"],"a":1,"e":"从医学上来说，肥胖是一种慢性渐进性疾病，具有很高的复发倾向。"},{"q":"减肥失败者重新开启新一轮减肥时，第一步应该是？","o":["立即加大运动量","找原因","严格节食","购买代餐"],"a":1,"e":"第一步 找原因：'有了这张图，你就可以在里面寻找自己减肥失败的原因了。'【书中三步法以'找原因'为第一步】"},{"q":"对于BMI小于等于35的减肥失败者，6个月减重目标应设定为？","o":["减掉体重的5%~10%","减掉体重的10%~15%","减掉体重的15%~20%","减掉体重的20%以上"],"a":0,"e":"如果你的BMI小于等于35，最好把目标定为6个月内减少现在体重的5%～10%。"},{"q":"对于BMI超过35的减肥失败者，6个月减重目标应设定为？","o":["减掉体重的5%~10%","减掉体重的10%~15%","减掉体重的15%~20%","减掉体重的3%~5%"],"a":1,"e":"如果你的BMI超过35，可以把目标定为6个月内减少体重的10%～15%。"},{"q":"对所有减肥失败者，平均每周减重速度不要超过多少？","o":["0.5千克","1千克","1.5千克","2千克"],"a":0,"e":"对于所有失败过的减肥者，我的建议是，每周称一次体重，平均每周减重不要超过0.5千克。"},{"q":"小满案例中，导致她以往减肥难以维持的优先管理层面是？","o":["饮食管理","运动管理","心理因素管理","睡眠管理"],"a":2,"e":"抑郁症的发生，是让小满体重变化最大的一个因素，而心理因素管理的失败也正是她后面所有减肥尝试都难以维持的原因。"},{"q":"找出减肥失败原因时，只需从哪三个层面中挑选？","o":["饮食、运动、心理因素","睡眠、情绪、工作","药物、手术、代餐","基因、环境、激素"],"a":0,"e":"不用想得很复杂，你只需要在饮食、运动、心理因素这三个层面中挑一个就好。"},{"q":"给小满做心理评估后，医生借助的新工具是？","o":["抗焦虑药物+12次心理治疗","减肥手术","每日代餐","高强度训练营"],"a":0,"e":"于是，我给她开了一些抗焦虑的药物，并且让心理治疗师规律地给她做了12次心理治疗，包括放松、正念进食，等等。"},{"q":"中国人为零食提供了大约多少的总能量摄入？","o":["5%","10%","20%","25%"],"a":1,"e":"最新数据显示，中国是仅次于美国、澳大利亚和墨西哥的零食消费国，零食为中国人提供了大约10％的总能量摄入。"},{"q":"过去一年中至少对一种食物产生过渴望的年轻女性比例是？","o":["70%","85%","100%","90%"],"a":2,"e":"有报告称，100％的年轻女性和70％的年轻男性在过去一年中至少对一种食物产生过渴望。"},{"q":"过去一年中至少对一种食物产生过渴望的年轻男性比例是？","o":["50%","70%","90%","100%"],"a":1,"e":"有报告称，100％的年轻女性和70％的年轻男性在过去一年中至少对一种食物产生过渴望。"},{"q":"成瘾性食物的共同特点不包括？","o":["以碳水化合物为主","混合脂肪","高GI","高蛋白"],"a":3,"e":"研究表明，成瘾性食物存在一些共同特点：以碳水化合物为主、混合脂肪、高GI、深加工。【共同特点中没有'高蛋白'】"},{"q":"需要贴红色标签的零食判断标准中，每100克能量超过多少？","o":["1500千焦","2000千焦（477.8大卡）","2500千焦","3000千焦"],"a":1,"e":"所以，每100克能量超过2000千焦（477.8大卡）的食物，精制碳水化合物占到40％以上且脂肪含量也不低的食物，以及所有的含糖饮料，都需要贴上红色标签。"},{"q":"下列零食中，属于绿色标签的是？","o":["麻辣鸭脖","调味酸奶","不加盐和糖的烘烤坚果","果汁"],"a":2,"e":"什么样的零食可以贴上绿色标签呢？主要包括三类，一类是烘烤坚果，不加盐和糖；一类是奶制品，鲜牛奶、酸奶，不调味；还有一类是完整的水果，或者不加调味品的水果干。"},{"q":"黄色标签零食一周最多吃几次？","o":["1次","2次","3次","5次"],"a":1,"e":"黄色标签的零食可以偶尔吃，一周不要超过两次，每次不要超过50克。"},{"q":"黄色标签零食每次不要超过多少克？","o":["30克","50克","100克","150克"],"a":1,"e":"黄色标签的零食可以偶尔吃，一周不要超过两次，每次不要超过50克。"},{"q":"评价性条件反射训练后，参与者选择水果而非黄油曲奇的可能性是原来的？","o":["2倍","3倍","4倍","5倍"],"a":1,"e":"数据表明，在接受评价性条件反射训练后，参与者选择水果而不是黄油曲奇的可能性，是原来的三倍。"},{"q":"下列属于绿色饮料的是？","o":["含糖奶茶","可乐","无糖苏打水","果汁饮料"],"a":2,"e":"什么是绿色饮料呢？茶、黑咖啡、无糖苏打水，还有牛奶，都算。"},{"q":"点外卖的两个高招不包括？","o":["品种尽量丰富","先喝汤再吃蔬菜然后吃肉最后吃主食","只点打卤面","单加一份沙拉"],"a":2,"e":"不要光点打卤面、盖浇饭这些，不仅蔬菜、蛋白质肯定不够，碳水化合物、油脂也会双双超标。"},{"q":"应酬时的第一选择是？","o":["烧烤","火锅","自助餐","西餐"],"a":1,"e":"①应酬的第一选择：吃火锅。"},{"q":"吃火锅最合适的锅底是？","o":["牛油锅","浓汤锅","清汤锅","麻辣锅"],"a":2,"e":"最合适的是清汤锅，其实就是大葱加水；"},{"q":"吃火锅点菜时，下列哪种食材应尽量不选？","o":["鱼虾","鸡肉","蟹棒","百叶"],"a":2,"e":"蟹棒、鱼豆腐、丸子、虾滑、午餐肉、香肠之类，就尽量不要选了；"},{"q":"辣椒中所含的辣椒素能促进哪种脂肪分解？","o":["白色脂肪","内脏脂肪","皮下脂肪","棕色脂肪"],"a":0,"e":"幸运的是，辣椒中所含的辣椒素能够促进白色脂肪的分解，使其变成棕色脂肪。"},{"q":"约饭时，最不适合大吃大喝的时间段是？","o":["中午12点到下午2点","下午3点到5点","晚上9点到凌晨5点","早上6点到8点"],"a":2,"e":"最不适合大吃大喝的时间，是晚上9点到凌晨5点。"},{"q":"每克酒精含有多少大卡能量？","o":["4大卡","7大卡","9大卡","2大卡"],"a":1,"e":"而想靠喝酒减肥是不可能的，除非你把自己喝到得胃病，大量减少进食，否则酒喝多了不但不会减肥，反而会发胖-因为酒本身就是粮食酿造的，每克酒精含有7大卡能量。"},{"q":"应酬饮酒的中量标准，每天不超过？","o":["500毫升红酒","1000毫升红酒","5两低度白酒","4瓶啤酒"],"a":0,"e":"这里的中量，是每天不超过500毫升红酒，或两瓶啤酒，或3两低度白酒。"},{"q":"吃火锅时建议的小料是？","o":["麻酱","酱油小米辣","油碟","沙拉酱"],"a":1,"e":"小料的选择上，我的建议是酱油小米辣，能吃辣的一定要多来点辣椒。"},{"q":"吃火锅搭配的主食建议是？","o":["麻酱烧饼","红糖糍粑","煮玉米或涮山药","炒饭"],"a":2,"e":"对于减肥人群来说，可以考虑煮个玉米、涮盘山药，喜欢的话，土豆、红薯也行。"},{"q":"情绪化进食的两点判定标准是？","o":["有负面情绪、停不下来","饿了想吃、吃饱就停","无聊加嘴馋","压力大加失眠"],"a":0,"e":"情绪化进食有两点判定标准：第一，有负面情绪；……第二，停不下来。"},{"q":"导致情绪化进食的风险因素包括？","o":["节食","规律运动","吃早餐","午睡"],"a":0,"e":"因此，节食被认为是导致情绪化进食的一个风险因素。"},{"q":"述情障碍是指？","o":["不会表达情绪","有情绪问题不愿表达、不会表达、不知道怎样正确表达","害怕社交","情绪波动大"],"a":1,"e":"简单来说，就是有了情绪问题，不愿表达，不会表达，不知道怎样正确表达。"},{"q":"进食前，判断饥饿级别的方法是？","o":["用1到10给饥饿感打分","看时间","问朋友","称体重"],"a":0,"e":"进食前，把注意力集中在胃部，用1到10给饥饿感打个分，判断一下自己的饥饿级别。"},{"q":"“三口进食法”的正确做法是？","o":["每餐只吃三口","先吃三口再重新评估饥饿感","三口饭一口菜","三口菜一口饭"],"a":1,"e":"人们对于特别想要品尝的食物，往往只在前三口能保持极大的热情，之后就会顺从身体惯性过度摄入。因此，你可以先吃三口，然后重新评估自己的饥饿感，及时在不想吃的时候停下来。"},{"q":"下列不属于“五问反思法”的是？","o":["与谁进餐","吃了些什么","何时进餐","花了多少钱"],"a":3,"e":"用餐结束后，你可以通过'五问反思法'来记录自己的饮食，回答'与谁进餐''吃了些什么''何时进餐''何处进餐''为什么要吃'这五个问题。【'五问'之中没有'花了多少钱'】"},{"q":"进食障碍属于哪类疾病？","o":["消化系统疾病","精神类疾病","代谢性疾病","传染性疾病"],"a":1,"e":"它虽然表现为饮食方面的问题，但其实已经属于精神类疾病。"},{"q":"生理性饥饿通常具有的特点是？","o":["突然出现","逐渐产生并且吃时会感到满足","只想吃特定食物","伴随负罪感"],"a":1,"e":"生理性的饥饿通常是逐渐产生的，并且饿的时候什么东西都想吃，吃的时候会感受到慢慢吃饱，也会感到很满足。"},{"q":"一项系统回顾发现，夜间工作使肥胖风险增加了？","o":["13%","23%","33%","43%"],"a":1,"e":"一项系统回顾在评估了28项研究之后，观察到夜间工作使肥胖的风险增加了23%，其中腹部肥胖的风险增加了35%。"},{"q":"夜间工作使腹部肥胖的风险增加了？","o":["25%","35%","45%","55%"],"a":1,"e":"一项系统回顾在评估了28项研究之后，观察到夜间工作使肥胖的风险增加了23%，其中腹部肥胖的风险增加了35%。"},{"q":"生活作息不规律不包括下列哪项？","o":["24点以后进食","入睡或睡醒时间经常相差4小时以上","睡眠时间少于6小时","每周运动少于3次"],"a":3,"e":"进食不规律（有24点以后进食的习惯）、睡眠不规律（今明两天的入睡时间或睡醒时间，经常相差4小时以上）、睡眠时间少于6个小时、夜间工作（长期工作到24点以后）、长时间夜间光照（24点到凌晨4点），打乱了我们身体最最重要的一个生理时钟——昼夜生物钟。【所列'作息不规律'表现中并没有'每周运动少于3次'】"},{"q":"禁食通常被定义为超过多少小时完全禁食含能量食物和饮料？","o":["6小时","8小时","12小时","24小时"],"a":2,"e":"禁食通常被定义为，在超过12个小时的时间内，完全禁食含能量的食物和饮料。"},{"q":"限时饮食（TRE）要求将每日能量摄入限制在多少小时内完成？","o":["2~6小时","4~12小时","12~16小时","16~20小时"],"a":1,"e":"限时饮食（TRE）是一种模拟禁食的形式，它要求将每日的能量摄入限制在4~12个小时内完成，这样就可以延长空腹状态的时间。"},{"q":"将进食窗口缩短到8小时内（如6~16点），可以达到什么效果？","o":["只避免增重","避免增重且有一定减重效果","完全没有效果","会导致增重"],"a":1,"e":"在这个基础上，如果我们把进食窗口缩短到8个小时内，并且尽量早一点，比如6~16点，就不仅可以避免增重，甚至还有减重的效果。"},{"q":"低碳水饮食方案适合在减肥早期的多长时间使用？","o":["1个月","3~6个月","1年","长期"],"a":1,"e":"我在前面已经介绍过，低碳水饮食方案虽然不适合长期使用，但在早期的3~6个月，还是有非常大的优势。"},{"q":"低碳水饮食要求碳水化合物减少到摄入总能量的？","o":["15%~25%","25%~40%","40%~55%","60%~70%"],"a":1,"e":"（1）将平时摄入的碳水化合物减少到摄入总能量的25%~40％。"},{"q":"低碳水饮食期间应避免的高碳水化合物蔬菜是？","o":["菠菜","红薯","生菜","黄瓜"],"a":1,"e":"蔬菜吃起来越粉糯，可吸收的碳水化合物含量就越高，比如红薯、南瓜、土豆、芋头、山药等，都是高碳水化合物蔬菜。"},{"q":"低碳水饮食期间应避免的甜味水果是？","o":["葡萄","柚子","草莓","牛油果"],"a":0,"e":"水果越甜，可吸收的碳水化合物越多，比如葡萄、苹果、荔枝等，因此要尽量避免。"},{"q":"下列哪种人群不适合低碳水饮食方案？","o":["糖尿病患者","高血脂或心血管疾病患者","肉食爱好者","超重人群"],"a":1,"e":"其次，高血脂或心血管疾病患者不能采用低碳水饮食方案，因为这会使血脂进一步紊乱。"},{"q":"低碳水饮食期间为什么要避免大量剧烈运动？","o":["会降低剧烈运动的耐受能力","会增加食欲","会升高血糖","会导致脱水"],"a":0,"e":"这是真的，因为低碳水饮食会降低剧烈运动的耐受能力。"},{"q":"低碳水饮食时建议“肥肉适当多一些”，其作用不包括？","o":["缓解便秘","提高代谢","促进燃脂","降低血脂"],"a":3,"e":"（4）肥肉适当多一些。这一方面可以缓解因低碳水饮食纤维素摄入减少造成的便秘，另一方面可以提高代谢，促进燃脂。【书中未提及'降低血脂'这一作用】"},{"q":"停不下主食的人在保证能量缺口的前提下，碳水可占到总能量的？","o":["30%左右","40%左右","60%甚至70%","80%以上"],"a":2,"e":"在能量缺口的基础上，热爱碳水化合物的你，可以让摄入的碳水化合物占到总能量的60％甚至70%，同时尽量减少脂肪，并保证最低限度的蛋白质。"},{"q":"改变碳水化合物质量时，应拒绝？","o":["糙米饭","油炸类主食","荞麦面","全麦面"],"a":1,"e":"第一，要拒绝油炸类的主食，如糍粑、油条、薯条、薯片等，因为这种食物碳水化合物高，脂肪也高，肚子还没填饱，能量就超标了。"},{"q":"下列属于低GI主食的是？","o":["大米","白面馒头","糙米和荞麦面","糍粑"],"a":2,"e":"第三，尽量选用低GI食材来制作主食。你可以把原来大米、白面做的主食都替换成糙米、荞麦面、全麦面，然后想吃就吃吧。"},{"q":"停不下主食的人，正确的吃饭顺序是？","o":["先吃主食","先吃肉和菜再吃饭","只吃主食","先喝饮料"],"a":1,"e":"先吃肉和菜，把肚子的饥饿感驱走一些，然后再吃饭。"},{"q":"晚上9、10点特别想吃主食，排除节食诱发的饥饿后，很可能是？","o":["焦虑","缺觉","低血糖","习惯"],"a":0,"e":"有一类特殊的主食爱好者会跟我描述：'晚上，尤其9、10点以后，本来都快睡觉了，突然特别特别想吃主食……'这种情况，如果排除了节食诱发的饥饿，很有可能是焦虑了。"},{"q":"正常亚洲女性的BMI范围是？","o":["16.5~21.9","18.5~24","20.5~25.9","22.5~27.9"],"a":1,"e":"正常亚洲女性的BMI应该在18.5和24之间，这就是我们判断一个人需不需要减肥的最重要指标。"},{"q":"女性BMI小于18.5时，正确做法是？","o":["继续严格减肥","增加一点脂肪和肌肉","加大运动量","服用减肥药"],"a":1,"e":"如果你的BMI小于18.5，我不会给你任何减肥的机会，再减就是拿生命开玩笑。相反，我会觉得你可能需要增加一点脂肪和肌肉。"},{"q":"女性BMI在18.5~22之间时，建议？","o":["继续减重","体重不要再减，可关注体脂率和体型","加大节食力度","减少脂肪"],"a":1,"e":"如果你的BMI在18.5和22之间，我的建议是，体重一定不要再减了，再减就会面临免疫力下降和衰老加速等问题。但你如果确实对身材不满意，可以看一下你的体脂率和体型，考虑如何增加肌肉替代脂肪，并把脂肪从肚子上转移到大腿上。"},{"q":"女性BMI在22~24之间时？","o":["必须减肥","不需要有减肥压力，真想减也可以见好就收","绝对不能减","只能增肌"],"a":1,"e":"如果你的BMI在22和24之间，你不需要有减肥的压力，但真想减一点也可以，一定要见好就收，可以重点看体脂率和体型。"},{"q":"女性减肥每天能量摄入不到多少大卡，很快会出现脱发、停经等问题？","o":["1000大卡","1200大卡","1500大卡","1800大卡"],"a":1,"e":"开始减肥之后，有一种情况在我的女性患者里非常常见，就是急于求成，或者要求极其严格，每天的能量摄入还不到1200大卡，有大量运动时也不到1500大卡，营养搭配极不均衡。"},{"q":"月经对于减肥来说有两个重要功能，分别是？","o":["检验和代谢重塑","排毒和补水","减重和增肌","检验和排毒"],"a":0,"e":"②月经是你检验自己减肥方法是否正确的坐标，同时也是你重塑代谢的开始"},{"q":"月经后的一周应该如何安排？","o":["静养休息","确保增加运动量","严格节食","只吃水果"],"a":1,"e":"第二，月经后的一周确保增加运动量。"},{"q":"月经期保证睡眠，可以降低哪些拖慢代谢的激素水平？","o":["糖皮质激素、胰岛素","雄激素","生长激素","肾上腺素"],"a":0,"e":"有研究显示，月经期饮食结构合理，睡眠充足，会大大降低接下来一个月拖慢代谢的激素的水平-这类激素包括糖皮质激素、胰岛素等。"},{"q":"围绝经期是指？","o":["月经开始前的时期","女性绝经前后的一段时期","产后恢复期","青春期"],"a":1,"e":"围绝经期是指女性绝经前后的一段时期，到了这个时期，肥胖及心脑血管疾病风险都在成倍地增加，减肥变得更加重要。"},{"q":"判断孩子是否肥胖，需要把BMI和什么对比？","o":["全国平均水平","相同性别的同龄孩子","成年人标准","父母BMI"],"a":1,"e":"世界卫生组织也是通过计算BMI来判断孩子体重是否正常的，不过稍微复杂一点，算出来的BMI需要和相同性别的同龄孩子进行对比。"},{"q":"儿童BMI超过哪个百分位线属于超重？","o":["75th","85th","90th","97th"],"a":1,"e":"图3.3～图3.6就是不同年龄段男孩女孩的标准BMI范围，你可以先算一下孩子的BMI，然后再跟图表对照-85th和15th中间部分属于正常体重，超过85th那根线就是超重，超过97th那根线就是肥胖。"},{"q":"儿童BMI超过哪个百分位线属于肥胖？","o":["85th","90th","95th","97th"],"a":3,"e":"图3.3～图3.6就是不同年龄段男孩女孩的标准BMI范围，你可以先算一下孩子的BMI，然后再跟图表对照-85th和15th中间部分属于正常体重，超过85th那根线就是超重，超过97th那根线就是肥胖。"},{"q":"肥胖儿童在成年后继续肥胖的概率是？","o":["20%~30%","42%~63%","70%~80%","90%以上"],"a":1,"e":"调查显示，肥胖的儿童在成年后，有42%~63％的概率会继续肥胖；"},{"q":"肥胖青少年在成年后继续肥胖的概率高达？","o":["42%~63%","50%~60%","70%~80%","85%以上"],"a":2,"e":"肥胖的青少年在成年后，继续肥胖的概率更是高达70%~80％。"},{"q":"脂肪细胞的生长发育期是？","o":["出生前","成年之前","成年之后","青春期之后"],"a":1,"e":"在我们漫长的一生中，脂肪细胞的生长发育期只有一个，就是成年之前。"},{"q":"成年后脂肪细胞的特点是？","o":["数量会继续增多","数量固定，变化的是大小","数量会减少","大小固定不变"],"a":1,"e":"不管你是胖了还是瘦了，变化的都不是脂肪细胞的数量，而是它们的大小。"},{"q":"孩子肥胖导致“不长个儿”的原因是？","o":["营养不良","骨骺线提前闭合","运动太少","睡眠不足"],"a":1,"e":"脂肪细胞的过度增加会引发内分泌失调，从而导致孩子过早发育，骨骺线提前闭合。"},{"q":"父母双方都胖的孩子，肥胖风险是父母体重正常孩子的？","o":["2倍","2.7倍","3.1倍","4倍"],"a":3,"e":"研究显示，父母双方都胖的，孩子肥胖的风险是父母双方体重都正常的孩子的4倍；"},{"q":"新生儿出生时的正常体重范围是？","o":["2.5~4千克","3~5千克","2~3千克","4~6千克"],"a":0,"e":"新生儿出生时的体重，正常范围是2.5~4千克。"},{"q":"世界卫生组织建议母乳喂养至少到孩子多大？","o":["6个月","1周岁","2周岁","3个月"],"a":1,"e":"第四招，母乳喂养，至少到孩子1周岁。"},{"q":"1~3岁孩子每天最多喝多少果汁？","o":["120毫升","180毫升","240毫升","300毫升"],"a":0,"e":"根据美国儿科学会的推荐，1~3岁的孩子每天最多喝120毫升果汁；"},{"q":"限制孩子玩电子产品每天不超过多少小时？","o":["0.5小时","1小时","2小时","3小时"],"a":1,"e":"第九招，限制孩子玩电子产品，每天不超过1个小时。"},{"q":"适度寒冷可以促进哪种细胞的增长？","o":["白色脂肪","棕色脂肪","肌肉","骨骼"],"a":1,"e":"而适度的寒冷，会促进棕色脂肪细胞的增长。"},{"q":"日本学者推荐亚洲人将孕前BMI控制在多少以内？","o":["21","23","25","24"],"a":1,"e":"一些日本学者认为，新生儿体重在很大程度上取决于妈妈的孕前BMI，并推荐亚洲人将孕前BMI控制在23以内。"},{"q":"孕前BMI正常的孕妇（18.5~23.9），孕期总增重范围是？","o":["12.5~18千克","11.5~16千克","7~11.5千克","5~9千克"],"a":1,"e":"书中表3-1（美国国家科学院对孕期女性体重增长值的推荐）给出：孕前体重正常的孕妇（BMI 18.5~23.9），孕期总增重建议为11.5~16千克。"},{"q":"孕前体重过低（BMI小于18.5）的孕妇，孕期总增重范围是？","o":["12.5~18千克","11.5~16千克","7~11.5千克","5~9千克"],"a":0,"e":"书中表3-1（美国国家科学院对孕期女性体重增长值的推荐）给出：孕前体重过低的孕妇（BMI小于18.5），孕期总增重建议为12.5~18千克。"},{"q":"孕期推荐的骑车锻炼频率是？","o":["每周2次以上、每次20分钟","每周3次以上、每次30分钟以上","每周1次、每次1小时","每天1次"],"a":1,"e":"研究表明，每周3次以上、每次30分钟以上的骑车锻炼，有助于降低孕妇妊娠期体重过度增加的风险和妊娠糖尿病发病率。"},{"q":"产后体重恢复的建议不包括？","o":["母乳喂养","保持良好情绪","维持正常睡眠","严格节食"],"a":3,"e":"关于产后的体重恢复，我的建议是：（1）母乳喂养；（2）保持良好的情绪；（3）维持正常的睡眠时间。②母乳喂养、情绪良好、睡眠充足，是产后体重恢复最简单有效的方法。【三条建议中并没有'严格节食'】"},{"q":"女性产后6个月每天睡眠不超过多少小时，与一年后体重增加密切相关？","o":["5小时","6小时","7小时","8小时"],"a":0,"e":"这一方面不利于妈妈体重的恢复-数据表明，女性产后6个月每天睡眠时间不超过5个小时，与一年后的体重增加密切相关；"},{"q":"我们日常耗能中，基础代谢大约占？","o":["50%","60%","70%","80%"],"a":2,"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。"},{"q":"日常活动的耗能大约占？","o":["10%","20%","30%","40%"],"a":1,"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。"},{"q":"一般运动的耗能只占？","o":["1%~5%","10%~15%","20%~25%","30%左右"],"a":0,"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。"},{"q":"下列日常活动中，能量消耗最大的是？","o":["散步","爬楼梯","做家务","遛狗"],"a":1,"e":"在各种日常活动中，爬楼梯是能量消耗最大的一种。"},{"q":"普通家务和娱乐性活动，每天可以额外消耗多少能量？","o":["50~100大卡","100~200大卡","200~300大卡","300~400大卡"],"a":1,"e":"做饭、洗碗、买菜、洗车、照顾小孩、扫地、拖地、搬重物，等等，都是我们日常生活中常干的家务。别小看了这些活动，数据显示，普通家务和娱乐性活动，每天可以额外消耗100~200大卡的能量，大约相当于半个小时中等强度的运动量。"},{"q":"每天跳绳10分钟，可以燃烧将近多少大卡？","o":["100大卡","200大卡","300大卡","400大卡"],"a":1,"e":"如果每天跳10分钟，能够燃烧将近200大卡的能量。"},{"q":"适合在办公室或家里进行的运动需满足的两个条件是？","o":["空间小、强度大","时间长、强度小","空间大、强度大","时间短、强度小"],"a":0,"e":"适合在办公室或家里进行的运动，需要满足两个条件，一是占用的空间小，二是运动强度大。"},{"q":"高血压患者体重每减少1千克，相当于血压下降多少？","o":["0.5毫米汞柱","1毫米汞柱","2毫米汞柱","5毫米汞柱"],"a":1,"e":"美国最新的高血压指南指出，体重减少1千克，相当于收缩压或舒张压下降1毫米汞柱，这个效果可以一直累加到5千克，也就是血压下降5毫米汞柱。"},{"q":"仅靠减肥减重5千克，可获得的降压效果接近？","o":["半片降压药","一片降压药","两片降压药","不需要吃药"],"a":0,"e":"这意味着，仅靠减肥，你就可以获得半片降压药的效果。"},{"q":"高血压患者减肥推荐采用的饮食方案是？","o":["低碳水饮食","地中海饮食","低脂肪饮食","高蛋白饮食"],"a":1,"e":"如果你患有高血压，我推荐你在减肥时采用我们前面讲过的地中海饮食方案，结合每周不少于150分钟的持续中等强度有氧运动。"},{"q":"高血压患者的运动建议是每周不少于多少分钟的中等强度有氧运动？","o":["90分钟","120分钟","150分钟","200分钟"],"a":2,"e":"如果你患有高血压，我推荐你在减肥时采用我们前面讲过的地中海饮食方案，结合每周不少于150分钟的持续中等强度有氧运动。"},{"q":"高血脂人群想要降血脂，碳水化合物应占摄入总能量的？","o":["25%~40%","45%~55%","60%~70%","20%~30%"],"a":1,"e":"想要降低血脂，必须遵循我们前面讲过的营养均衡法则，就是让碳水化合物占摄入总能量的比例维持在45%~55%，其中要有0.5千克的蔬菜；"},{"q":"高血脂人群的脂肪摄入中，天然不饱和脂肪酸应占脂肪总量的多少以上？","o":["三分之一","一半","四分之三","全部"],"a":1,"e":"此外，脂肪一定要吃够，并且天然的不饱和脂肪酸要占到脂肪总量一半以上。"},{"q":"高血糖人群减肥推荐采用？","o":["低碳水饮食方案","高碳水饮食","低脂肪饮食","地中海饮食"],"a":0,"e":"关于高血糖人群的减肥，我郑重推荐低碳水饮食方案，具体怎么做，可以参考本章“如果你是个肉食动物”一节。"},{"q":"甲状腺功能减退的典型表现不包括？","o":["皮肤干燥","手脚怕冷","精力旺盛","月经量少"],"a":2,"e":"我仔细询问了她的三餐情况……我再三追问，发现她皮肤特别爱干燥，手脚很怕冷，经常犯困，打不起精神，月经只有两天，量也很少。我告诉她，你需要仔细检查一下甲状腺功能，我怀疑你有甲减。【甲减的典型表现是怕冷、犯困、乏力等，并非'精力旺盛'】"},{"q":"发现甲状腺功能减退后，首先要做的是？","o":["严格节食","补充甲状腺素","大量运动","服用减肥药"],"a":1,"e":"如果发现甲状腺功能减退，首先要做的是补充甲状腺素。"},{"q":"甲状腺功能减退患者为什么要特别强调减盐？","o":["因为身体储水增加","因为盐会增加脂肪","因为盐影响睡眠","因为会口渴"],"a":0,"e":"其次，因为甲状腺功能减退会使身体储水增加，脂代谢紊乱，所以对于甲状腺功能减退患者，要特别强调减盐，避免水肿加重，并且在减肥过程中也不推荐使用低碳水高脂肪饮食方案，避免脂代谢进一步紊乱。"},{"q":"甲状腺功能减退患者减肥时不推荐？","o":["均衡饮食","低碳水高脂肪饮食","地中海饮食","高蛋白饮食"],"a":1,"e":"其次，因为甲状腺功能减退会使身体储水增加，脂代谢紊乱，所以对于甲状腺功能减退患者，要特别强调减盐，避免水肿加重，并且在减肥过程中也不推荐使用低碳水高脂肪饮食方案，避免脂代谢进一步紊乱。"},{"q":"甲状腺功能自检超过多少分，建议去医院检查？","o":["4分","5分","7分","10分"],"a":2,"e":"如果自检超过7分，建议你赶紧去医院检查。"},{"q":"下列富含硒的食物是？","o":["坚果","米饭","面条","馒头"],"a":0,"e":"天然食物，比如坚果、金枪鱼、沙丁鱼、蛋黄以及牛肉等都有比较丰富的硒。"},{"q":"富含锌的食物不包括？","o":["牡蛎","贝壳类","坚果种子","苹果"],"a":3,"e":"天然食物中含锌比较多的是牡蛎、贝壳类、坚果种子以及牛肉等。【'苹果'不在含锌丰富的食物之列】"},{"q":"阻塞性睡眠呼吸暂停通俗地说就是？","o":["失眠多梦","打呼噜特别严重导致气道阻塞","嗜睡","睡眠不足"],"a":1,"e":"阻塞性睡眠呼吸暂停，说通俗一点，就是打呼噜打得特别严重，导致呼吸用的气道发生了阻塞，进气和出气都不顺畅。"},{"q":"中国罹患阻塞性睡眠呼吸暂停的成年人比例是？","o":["13.6%","23.6%","33.6%","43.6%"],"a":1,"e":"一是因为这个病发病率很高，在中国有23.6％的成年人罹患；"},{"q":"睡眠呼吸暂停自评达到多少分需要去医院？","o":["1分","2分","3分","5分"],"a":2,"e":"如果自评达到3分，那你就要去医院了，找呼吸科、心内科或者睡眠科的医生都行。"},{"q":"确诊睡眠呼吸暂停后的治疗方法不包括？","o":["应用呼吸机","采取侧卧位","减肥","大量饮用咖啡"],"a":3,"e":"确诊之后，你需要根据医生的指导，采取相应的方法，比如应用呼吸机、采取侧卧位、减肥等，改善夜间缺氧的问题。【治疗方法中并没有'大量饮用咖啡'】"},{"q":"减肥平台期是指连续多长时间体重不下降甚至反弹？","o":["3天以上","1周以上","两周以上","1个月以上"],"a":2,"e":"减肥过程中，连续两周以上体重不下降甚至有反弹趋势的阶段，被一些医学家定义为减肥平台期。"},{"q":"平台期出现的原因不包括？","o":["基础代谢降低","身体启动机制维持代谢平衡","方法做错了","生理平衡"],"a":2,"e":"它的出现不是因为我们做错了什么，而是身体开启了保护自己的机制。"},{"q":"度过平台期的三件事不包括？","o":["有点耐心","交替使用不同方法","增加肌肉","加大节食力度"],"a":3,"e":"如果到了平台期，请你做好三件事：有点耐心，方法轮替，以及增加肌肉，让自己的心理和身体做好准备迎接下一轮的减肥。【度过平台期并不靠'加大节食力度'】"},{"q":"平台期增加肌肉的建议是？","o":["减少力量训练","比平常增加一倍力量训练并补充蛋白质","停止运动","只做高强度有氧"],"a":1,"e":"这时候，建议你比平常增加一倍力量训练，同时补充蛋白质。"},{"q":"关于平台期的说法正确的是？","o":["只有不努力的人才会遇到","几乎人人都会经历","说明方法完全错了","应该立即换极端方法"],"a":1,"e":"好消息是它加强了我们减肥的耐心和决心，因为你会发现，只要减肥，几乎人人都得经历平台期。"},{"q":"关于快速减肥的真相是？","o":["辟谷可以健康减脂","除了动手术，几乎所有的快速减肥都不可信","生酮能永久减脂","减肥茶能刮油"],"a":1,"e":"真相：除了动手术，几乎所有的快速减肥都是不可信的。"},{"q":"快速减肥方法的本质是？","o":["减少脂肪","让你脱水","提高基础代谢","抑制食欲"],"a":1,"e":"其实，以上快速减肥方法的本质都是一样的：让你脱水。"},{"q":"水分占人体身体成分的多少？","o":["50%","60%","70%","80%"],"a":2,"e":"无论你是胖还是瘦，水分都占了你身体成分的70％。"},{"q":"减肥茶号称可以刮油，其实是添加了什么？","o":["维生素","医用泻药和利尿剂","蛋白质","膳食纤维"],"a":1,"e":"减肥茶号称可以刮油，其实是添加了医用泻药和利尿剂等，让饮用者增加排泄。"},{"q":"辟谷和生酮减肥法的共同点是？","o":["增加肌肉","消耗肌糖原及其储存的水分","提高基础代谢","增加脂肪"],"a":1,"e":"辟谷和生酮减肥法的共同点，是由于身体没了碳水化合物作为能量来源，正好消耗所有的肌糖原以及它储存的水分，从而达到脱水的效果。"},{"q":"世界卫生组织推荐的健康减肥速度是每周减少？","o":["0.5~1千克","1~2千克","2~3千克","3千克以上"],"a":0,"e":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度，都是每周减少0.5~1千克，超过1.5千克的话，减肥者患胆结石的风险会大幅提高（见图4-1）。"},{"q":"每周减重超过多少千克，患胆结石的风险会大幅提高？","o":["1千克","1.5千克","2千克","2.5千克"],"a":1,"e":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度，都是每周减少0.5~1千克，超过1.5千克的话，减肥者患胆结石的风险会大幅提高（见图4-1）。"},{"q":"体重变化最大的20%人群与最小的20%相比，冠心病风险提高了？","o":["34%","64%","84%","104%"],"a":1,"e":"在受访人群中，其他危险因素完全一致的情况下，体重变化最大的20％患者与变化最小的20％相比，冠心病风险提高了64%，心肌梗死风险提高了117%，而脑卒中风险提高了136％。"},{"q":"别人试过有用的减肥方法，对你？","o":["一定有效","可能大多数都不一定有效","绝对无效","效果完全相同"],"a":1,"e":"答案是，可能大多数都不一定有效。"},{"q":"人与人之间减肥效果差异的原因不包括？","o":["基因差异","血糖效应差异","星座差异","生活习惯差异"],"a":2,"e":"这是因为，减肥的时候，人与人之间的差异实在太大了。第一，基因差异。……第二，血糖效应差异。……第三，体脂率差异。……第四，生活习惯差异。……第五，减肥史差异。【'星座差异'不在此列】"},{"q":"同样的食物在不同个体身上引起血糖效应不同的可能原因是？","o":["肠道微生物构成不同","年龄不同","性别不同","身高不同"],"a":0,"e":"同样的食物，在不同个体身上引起的血糖效应不一样，原因可能是肠道微生物构成的不同。"},{"q":"体脂率较高的人更适合？","o":["力量训练为主","有氧运动","节食","无氧训练为主"],"a":1,"e":"体脂率较高的人更适合有氧运动，减肥期摄入的能量相对应该更少一些。"},{"q":"宣称“0蔗糖”的产品，实际上？","o":["等于0糖","基本都不是0糖","等于0碳水化合物","等于0卡路里"],"a":1,"e":"说自己“0蔗糖”的产品，基本都不是0糖。"},{"q":"麦芽糖的GI比蔗糖？","o":["更低","更高","相同","无法比较"],"a":1,"e":"糖的种类很多，不加蔗糖，还可以添加其他糖，比如麦芽糖、白砂糖、果糖、葡萄糖、果葡糖浆、椰子糖等。麦芽糖的GI比蔗糖还要高，很多医学研究也都发现，果葡糖浆、人工添加的果糖，都会明显增加体重。"},{"q":"宣称“0糖”的食品？","o":["等于完全不含糖","顶多是没有额外添加糖，不等于不含糖或碳水","等于不含碳水化合物","能量一定很低"],"a":1,"e":"如果写的是'0糖'，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。"},{"q":"无糖酸奶中含有？","o":["乳糖","蔗糖","麦芽糖","果葡糖浆"],"a":0,"e":"比如无糖酸奶，奶制品里本身有乳糖，也有碳水化合物；无糖饼干，虽然没有添加糖，但都是碳水化合物。"},{"q":"宣称“0脂肪”的产品往往？","o":["碳水化合物含量极低","碳水化合物含量很高","能量很低","蛋白质很高"],"a":1,"e":"如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上碳水化合物的量，往往它的碳水化合物含量会极高。"},{"q":"代糖和甜味剂虽然没有能量，却会？","o":["直接升高血糖","干扰大脑内能量代谢的传递过程","增加饱腹感","促进排便"],"a":1,"e":"代糖和甜味剂虽然没有能量，却会干扰我们大脑内能量代谢的传递过程。"},{"q":"关于含代糖食物，最近的研究显示？","o":["对减肥和预防糖尿病有显著作用","在减肥和预防糖尿病上没有任何作用且糖尿病风险更高","可以放心多吃","比直接吃糖健康得多"],"a":1,"e":"所以，食物中添加代糖和甜味剂虽然比直接添加糖好一些，但是最近的研究显示，这在减肥和预防糖尿病上没有任何作用，而且比起不添加，糖尿病风险更高。"},{"q":"关于大量运动的真相是？","o":["能带来大幅度减重","并不能带来大幅度减重","是减肥最快的方法","最健康的方法"],"a":1,"e":"真相：大量运动并不能带来大幅度减重。"},{"q":"身体活动消耗的能量占人体总消耗的？","o":["5%~10%","15%~30%","40%~50%","60%~70%"],"a":1,"e":"身体活动消耗的能量，占人体能量总消耗的15%~30%，但这并不意味着大量剧烈运动就能达到消耗值的上限。"},{"q":"BMI较高的人，运动后的能量补偿比例会达到？","o":["19%","29%","39%","49%"],"a":3,"e":"尤其是BMI较高的人，能量补偿比例会达到49%，也就是说，运动消耗的能量可能会被打对折，辛辛苦苦做运动消耗的能量，又被身体的节能本能给补充回来了。"},{"q":"如果要进行大量剧烈运动，应避开？","o":["周末","重度疲劳期和高压期","早晨","饭后"],"a":1,"e":"所以，如果要进行大量剧烈运动，请一定避开自己的重度疲劳期和高压期。"},{"q":"运动效果递减的原因是？","o":["动作熟练化、运动模式固定化、体重下降","肌肉增多","代谢提高","食欲变好"],"a":0,"e":"这是因为，动作的熟练化、运动模式的固定化，加上体重下降，造成相同运动强度下，单位时间身体消耗的能量在不断下降。"},{"q":"目前最管用的脂肪吸收抑制剂奥利司他，吸收抑制作用只有？","o":["10%","20%","30%","50%"],"a":2,"e":"目前最管用的脂肪吸收抑制剂，奥利司他，也只有30％的吸收抑制作用。"},{"q":"全球目前的研究中，抑制脂肪吸收可以稳定达到多少的食品提取物？","o":["30%","10%","连5%都没有","50%"],"a":2,"e":"事实上，不要说30%，全球目前的研究中，可以稳定达到5％的都没有，连安慰剂的效果都不如。"},{"q":"左旋肉碱、咖啡因、辣椒素在燃脂中的角色是？","o":["直接燃烧脂肪","把脂肪运送到线粒体的搬运工","抑制食欲","提高体温"],"a":1,"e":"有些产品添加了左旋肉碱啊，咖啡因啊，辣椒素啊，医学上有一定证据证明它们可以加速脂肪燃烧。这一功能的核心原理是，它们可以协助身体把脂肪运送到其燃烧场所——线粒体，相当于搬运工。"},{"q":"由专业减肥机构指导的减肥，成功率比普通减肥大约高？","o":["5%~10%","10%~50%","50%~80%","80%以上"],"a":1,"e":"美国有研究指出，由专业减肥机构指导的减肥，成功率大约比普通减肥高10%~50％。"},{"q":"需要警惕的减肥训练营关键词是？","o":["训练营","只管三个月","饮食管理","运动管理"],"a":1,"e":"04.6 只管三个月的减肥训练营"},{"q":"判断训练营方法能否长期应用的最重要标准是？","o":["有没有节食、饥饿感重不重","训练强度大不大","价格贵不贵","环境好不好"],"a":0,"e":"最重要的判断标准就是有没有节食，饥饿感是不是特别重。"},{"q":"好的减肥方案，随着体重越来越轻，应该？","o":["人越来越没精神","精力越来越充沛","需要加大节食","开始掉头发"],"a":1,"e":"好的减肥方案，随着体重越来越轻，精力应该越来越充沛，而不是体重越下降，人越没精打采。"},{"q":"《中国超重/肥胖医学营养治疗专家共识》指出，配合营养代餐的强化生活方式干预？","o":["比单纯的膳食支持和教育更有效","没有作用","有害健康","与普通饮食相同"],"a":0,"e":"《中国超重／肥胖医学营养治疗专家共识》明确指出，总的来说，配合营养代餐的强化生活方式干预，比单纯的膳食支持和教育，更能有效降低患者的体重。"},{"q":"代餐是不是智商税？","o":["是","不是，可以有效帮人省脑省时间","全部都是","看价格"],"a":1,"e":"代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间。"},{"q":"中国营养学会代餐团体标准中，每餐代餐的能量应为？","o":["100~200千卡","200~400千卡","400~600千卡","600千卡以上"],"a":1,"e":"能量：每餐代餐食品所提供的能量应为200~400千卡。"},{"q":"代餐中蛋白质提供的能量应占总能量的？","o":["10%~20%","25%~50%","50%~70%","70%以上"],"a":1,"e":"蛋白质：代餐中蛋白质提供的能量应占总能量的25%~50％。"},{"q":"代餐中脂肪提供的能量不应超过总能量的？","o":["20%","30%","40%","50%"],"a":1,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"代餐标准中，不得使用？","o":["氢化油脂","植物油","橄榄油","菜籽油"],"a":0,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"下列哪项不是代餐的“坑”？","o":["正规营养代餐按标准食用","燕麦酸奶冒充代餐","能量棒蛋白质几乎没有全是脂肪碳水","每餐只有120大卡变相节食"],"a":0,"e":"代餐的确不是智商税。……代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间。但随着代餐市场的迅速火爆，各种品牌、形式的代餐产品让人目不暇接，不知该如何选择。如果选错了，那就真是交了智商税。"},{"q":"作者说，减肥不是跟随别人，而是什么？","o":["成为自己","超越别人","战胜食欲","坚持到底"],"a":0,"e":"不得不承认，无论是身体情况，还是生活环境，每个人都有一定的差异，可能我认为的简单易行，在你这儿依然行不通。这很正常，减肥就是要养成属于你自己的生活方式，从这个角度说，减肥不是跟随别人，而是成为自己。"},{"q":"对于作者给出的那套简单易行的生活方式，正确的态度是？","o":["全盘照搬就行","每个人都有一定的差异，要养成属于你自己的生活方式","只照搬饮食部分","只照搬运动部分"],"a":1,"e":"基于科学减肥的底层逻辑和唯一路径，我给了你一套最简单易行的生活方式。那么，是不是全盘照搬就行了呢？不得不承认，无论是身体情况，还是生活环境，每个人都有一定的差异，可能我认为的简单易行，在你这儿依然行不通。这很正常，减肥就是要养成属于你自己的生活方式。"},{"q":"小满这次减肥失败，起因是她参加了一个什么挑战赛？","o":["过午不食挑战赛","21天断糖挑战赛","轻断食挑战营","高强度训练营"],"a":0,"e":"事情的起因，是小满参加了一个'过午不食'挑战赛。三个月顺利减重5千克后，维持了不到半年，一个月前，她的体重又长回去了，减肥再次宣告失败。"},{"q":"医生帮小满盘点减肥历程时画的体重坐标图，两个坐标轴分别是？","o":["横坐标是时间，纵坐标是体重","横坐标是体重，纵坐标是时间","横坐标是饮食，纵坐标是运动","横坐标是年龄，纵坐标是体脂率"],"a":0,"e":"一边盘点，我一边做记录，然后把小满的减肥历程画成了一张坐标图。横坐标轴是时间，纵坐标轴是她的体重。"},{"q":"如果没有医学科学的指导，单纯自发地进行减肥尝试，人体会？","o":["很快激活自身的生物机制，调整新陈代谢水平，阻止体重进一步下降","持续加速减重","基础代谢不断升高","脂肪细胞数量逐渐减少"],"a":0,"e":"大量的实验数据表明，如果没有医学科学的指导，单纯自发地进行减肥尝试，人体很快就会激活自身的生物机制，调整新陈代谢水平，阻止体重进一步下降，并在减肥停止后恢复以前的体重水平。"},{"q":"如果饮食、运动、心理因素等各种新工具都尝试过了却依然没有成功，应该？","o":["在医生的指导下，寻求减肥药物和减肥手术的帮助","继续加大节食力度","只增加有氧运动","彻底放弃减肥"],"a":0,"e":"如果这些都尝试过了，却依然没有成功，你可以在医生的指导下，寻求减肥药物和减肥手术的帮助。"},{"q":"关于减肥与反弹，书中的结论是？","o":["减肥不难，但反弹很容易","减肥很难，反弹也很难","减肥和反弹都很容易","只要足够努力就不会反弹"],"a":0,"e":"所以，虽然减肥不难，但反弹很容易。如果你复胖了，一点也不用感到愧疚，这只能说明你身体的机制属于正常人。"},{"q":"今天在美国，所有年龄性别人群来自零食的能量摄入占？","o":["5%~10%","20%~25%","35%~40%","50%以上"],"a":1,"e":"今天在美国，所有年龄性别人群20%～25%的能量摄入来自零食，相当于多吃了一顿饭。"},{"q":"按零食消费量排序，中国的位置是？","o":["居第一位","仅次于美国、澳大利亚和墨西哥","仅次于美国","居第十位以后"],"a":1,"e":"最新数据显示，中国是仅次于美国、澳大利亚和墨西哥的零食消费国，零食为中国人提供了大约10％的总能量摄入。"},{"q":"总结了医学上对零食成瘾的研究后，书中给出的建议一共有？","o":["两个","三个","四个","五个"],"a":1,"e":"要解决这个问题，在总结了近年来医学上对零食成瘾的研究后，我给你三个建议。【三个建议为：给零食贴标签、建立条件反射、备足绿色零食】"},{"q":"用来区分不同种类零食的三种标签颜色是？","o":["红、黄、绿","红、橙、绿","黑、黄、绿","红、黄、蓝"],"a":0,"e":"第一个建议 给零食贴标签。你可以用红、黄、绿三种颜色的标签来区分不同种类的零食。"},{"q":"绿色标签零食每天都可以吃，但要注意总量，其中水果和奶制品各不超过？","o":["100克","150克","250克","500克"],"a":2,"e":"绿色标签的零食每天都可以吃，注意一下总量就好——坚果一把，水果250克，奶制品250克，每天加起来不超过这个量。"},{"q":"烤地瓜、煮玉米、蒸山药虽可作绿色零食，但要注意它们属于？","o":["主食类，要计入一天的碳水化合物总量","蔬菜类，可以不限量","蛋白质类","水果类"],"a":0,"e":"像烤地瓜、煮玉米、蒸山药，都不错。不过它们属于主食类，要计入你一天的碳水化合物总量里。"},{"q":"把天然食物做成绿色零食，正确的烹饪原则是？","o":["不加油、不加糖、少加盐","少油、多糖、多加盐","不加油、多加糖、少加盐","多油、不加糖、多加盐"],"a":0,"e":"很多天然食物简单烹饪一下，都可以作为绿色零食。蒸煮、干炒，烘烤，都是不错的烹饪方法，记住，要不加油、不加糖、少加盐。"},{"q":"关于适当吃一些健康的零食，书中的观点是？","o":["有助于减少压力，提升内在的安全感","一定会导致发胖","会直接诱发进食障碍","只有儿童适合"],"a":0,"e":"没有人的意志力是无限的。与其坚决抵制零食，不如备足绿色零食，想吃了就可以来一点。零食并不是洪水猛兽，适当吃一些健康的零食，有助于减少压力，提升内在的安全感。"},{"q":"手边永远备好绿色饮料，可以起到什么作用？","o":["只要不渴，你对含糖饮料的需求就会大大降低","增加能量摄入","替代正餐","促进食欲"],"a":0,"e":"所以，我手边永远备好绿色饮料，只要不渴，你对含糖饮料的需求就会大大降低。"},{"q":"《2020外卖行业报告》显示，我国外卖用户规模已从2016年的0.63亿人增加到2019年的？","o":["1.23亿人","2.23亿人","4.23亿人","6.23亿人"],"a":2,"e":"《2020外卖行业报告》显示，我国外卖用户规模已从2016年的0.63亿人增加到2019年的4.23亿人。"},{"q":"在北上广深这些一线城市，能保证工作日晚上自己在家做饭的白领？","o":["不足四成","不足两成","约六成","约八成"],"a":0,"e":"数据显示，在北上广深这些一线城市，只有不足四成白领能够保证工作日晚上自己在家做饭。"},{"q":"有74.1%的白领选择在外吃饭，是因为？","o":["工作忙，没时间","饭菜更美味","价格更便宜","便于社交"],"a":0,"e":"有74.1％的白领选择在外吃饭是因为'工作忙，没时间'，还有一部分则是因为'懒得做饭'。"},{"q":"点外卖的第二个高招是吃饭顺序，正确的顺序是？","o":["先喝汤，再吃蔬菜，然后吃肉，最后吃主食","先吃主食，再喝汤","先吃肉，再喝汤","先吃蔬菜，最后喝汤"],"a":0,"e":"二是吃饭顺序。要先喝汤，再吃蔬菜，然后吃肉，最后吃主食。"},{"q":"关于火锅锅底，书中'尽量不要选'的是？","o":["清汤锅","菌汤锅","番茄锅","浓汤锅"],"a":3,"e":"最合适的是清汤锅，其实就是大葱加水；菌汤锅、番茄锅也可以；尽量不要选浓汤锅，因为它脂肪含量很高，甚至不低于牛油火锅。"},{"q":"吃火锅点菜时，肉类应该多选的是？","o":["鱼虾","午餐肉","香肠","虾滑"],"a":0,"e":"然后看怎么点菜。关键是要天然，不要选加工食材。肉类多选鱼虾，其次选鸡肉、百叶、黄喉、鸭血、鸭肠、猪肚，最后选瘦一点的牛羊肉。"},{"q":"吃火锅时，正确的涮菜方式是？","o":["豆制品、肉和蔬菜一起涮","先吃饱肉再用蔬菜填缝","只涮肉不涮菜","等汤凉了再涮菜"],"a":0,"e":"吃的时候呢，要豆制品、肉和蔬菜一起涮，别等肉吃饱了，才用蔬菜填个缝。涮完肉的汤，表层都是油，后涮菜的话，就会全被蔬菜给吸收了。"},{"q":"人体内可以燃烧白色脂肪、并且抵抗肥胖和糖尿病的'好'脂肪是？","o":["棕色脂肪","皮下脂肪","内脏脂肪","肌间脂肪"],"a":0,"e":"让我们如临大敌的是白色脂肪，一旦过多，会造成代谢紊乱，最终导致各种疾病。而人体内还有一种'好'脂肪，可以燃烧白色脂肪，并且抵抗肥胖和糖尿病，它就是棕色脂肪。"},{"q":"关于成年人体内的脂肪，正确的说法是？","o":["主要是白色脂肪，棕色脂肪含量极少","主要是棕色脂肪","白色和棕色各占一半","只有白色脂肪"],"a":0,"e":"然而，成年人身体内的脂肪主要是白色脂肪，棕色脂肪含量极少。"},{"q":"实在不能选火锅时，书中建议你给自己单加一份沙拉，用什么拌？","o":["油醋汁","沙拉酱","麻酱","千岛酱"],"a":0,"e":"如果实在不能选火锅，点菜时，你可以给自己单加份沙拉，用油醋汁拌，也可以加勺芥末或者小米辣。"},{"q":"人抵抗食物诱惑的能力会在什么时段降低？","o":["早上","中午","晚上","全天恒定"],"a":2,"e":"而且，人抵抗食物诱惑的能力还会在晚上降低，面对宵夜，你绝对无法拒绝大快朵颐。"},{"q":"白色脂肪一旦过多，会造成？","o":["代谢紊乱，最终导致各种疾病","代谢加快","肌肉增加","免疫力提升"],"a":0,"e":"让我们如临大敌的是白色脂肪，一旦过多，会造成代谢紊乱，最终导致各种疾病。"},{"q":"吃火锅时如果一定要搭配点正儿八经的主食，可以考虑？","o":["煮一点杂粮面","麻酱烧饼","红糖糍粑","油条"],"a":0,"e":"如果一定要搭配点正儿八经的主食，你可以考虑煮一点杂粮面。"},{"q":"喝酒以后会出现的情况是？","o":["意志力会进一步下降，对于该吃多少就更没谱了","意志力明显增强","代谢显著加快","食欲下降"],"a":0,"e":"而且，喝酒以后，你的意志力会进一步下降，对于该吃多少就更没谱了。"},{"q":"情绪化进食是指？","o":["因消极负面情绪而增加食物摄入","因生理饥饿而进食","因庆祝喜事而进食","因社交场合而进食"],"a":0,"e":"情绪化进食，是指因消极负面情绪而增加食物摄入。它是身体应对不适的一种策略。"},{"q":"为什么情绪化进食的判定标准一定要是'负面情绪'？","o":["高兴的事情一般一次进食就解决了，而负面情绪会持续很长一段时间","高兴时人不会进食","负面情绪不会产生进食欲望","只有负面情绪才算情绪"],"a":0,"e":"为什么一定要是负面情绪？因为高兴的事情一般一次进食就解决了，谁也不能为了中国队拿金牌吃一个星期夜宵吧？但是负面情绪不一样，抑郁、焦虑、失落、无聊，都会持续很长一段时间，不是吃一顿就能解决的。"},{"q":"研究发现，情绪化进食大多数时候？","o":["并不能减少情绪困扰，反而会在之后引发强烈的内疚感","能彻底消除情绪困扰","能显著减少能量摄入","有助于改善睡眠"],"a":0,"e":"而且研究发现，情绪化进食大多数时候并不能减少情绪困扰，如果你在减肥，反而会在之后引发强烈的内疚感。这样反反复复，摄入的能量必然严重超标。"},{"q":"节食者与饥饿感持续斗争的另一个后果是？","o":["完全失去了对饥饿感和饱腹感的判断能力","食欲显著下降","基础代谢升高","味觉变得灵敏"],"a":0,"e":"节食者与饥饿感持续斗争的另一个后果是，他们完全失去了对饥饿感和饱腹感的判断能力，这是使他们陷入情绪化进食的一个额外风险因素。"},{"q":"如果不想遭遇情绪化进食，从减肥的一开始就千万别？","o":["节食","运动","吃早餐","记录饮食"],"a":0,"e":"所以，如果不想遭遇情绪化进食，从减肥的一开始，就千万别节食。"},{"q":"培养自己在进食过程中对身体的觉知能力，可以通过什么方式？","o":["在餐前、餐中、餐后简单地自省","只记录每天的体重","每餐都称量食物","饭前喝大量的水"],"a":0,"e":"要做到这一点，你可以通过在餐前、餐中、餐后简单地自省，来培养自己在进食过程中对身体的觉知能力，从而控制情绪的波动。"},{"q":"进食障碍人群的表现是？","o":["有的因为进食而胖，有的却因为催吐而极度瘦弱","都表现为肥胖","都表现为极度瘦弱","只有暴食一种表现"],"a":0,"e":"进食障碍人群有的因为进食而胖，有的却因为催吐而极度瘦弱。"},{"q":"如果已经到了进食障碍的程度，应该赶紧找哪一科医生帮忙？","o":["精神科","消化科","内分泌科","营养科"],"a":0,"e":"我在得到App准备了一份初判的问卷，如果已经到了进食障碍的程度，请赶紧找精神科医生帮忙。"},{"q":"面对情绪化进食，书中主张的态度是？","o":["与其不断筑坝，不如有秩序地泄洪","把情绪完全锁死","只靠意志力硬扛","彻底不吃任何东西"],"a":0,"e":"委屈、不满、愤懑、压抑，这些情绪有如洪水，坝筑得再高，也难免会有决口的风险。所以，在情绪化进食来临时，与其不断筑坝，不如有秩序地泄洪，给情绪一些正向、积极的出口。"},{"q":"对减肥来说，比负面情绪更糟糕的是？","o":["述情障碍","工作压力","睡眠不足","缺乏运动"],"a":0,"e":"对减肥来说，述情障碍比负面情绪更糟糕。有负面情绪不可怕，可怕的是，因为述情障碍，我们要一直背负着负面情绪前行，让身心共同承受长期的煎熬。"},{"q":"生活作息无法规律时，即使吃跟平时同等能量的食物，结果是？","o":["体重增加也是早晚的事","体重不会有任何变化","体重反而会下降","只影响睡眠不影响体重"],"a":0,"e":"生活作息无法规律，确实是引发肥胖的一个棘手问题。在这种状态下，我们即使吃跟平时同等能量的食物，体重增加也是早晚的事。"},{"q":"一项在18家公立医院进行、涉及2371名护理人员的研究发现了什么？","o":["接触夜间工作的年限和BMI之间存在关联","上夜班与BMI完全无关","上夜班会使人变瘦","护理人员肥胖率最低"],"a":0,"e":"一项在18家公立医院进行的、涉及2371名护理人员的研究发现，接触夜间工作的年限和BMI之间存在关联，也就是上夜班的时间越长，肥胖的风险就会越高。"},{"q":"昼夜生物钟之所以在葡萄糖和脂类的代谢中起着至关重要的作用，是因为它会引起？","o":["激素水平的循环变化","体温骤降","血压升高","心率减慢"],"a":0,"e":"昼夜生物钟在葡萄糖和脂类的代谢中，起着至关重要的作用，因为它会引起激素水平的循环变化。"},{"q":"当昼夜节律乱了，人体就会缺乏内在的行为节律，这时可以求助于？","o":["外加的进食—禁食节律来支持代谢的平衡","大量剧烈运动","服用安眠药","完全禁食一周"],"a":0,"e":"而当我们的昼夜节律乱了，人体就会缺乏内在的行为节律，在这种情况下，可以求助于外加的进食一禁食节律来支持代谢的平衡。"},{"q":"TRE提出的解决方案是，将进食窗口限制在白天的多少个小时内？","o":["8个小时","12个小时","16个小时","20个小时"],"a":1,"e":"TRE提出了一个解决方案：将进食窗口限制在白天的12个小时内，比如7~19点，或者6~18点，尽可能使进食这件事与昼夜节律匹配。"},{"q":"下了夜班回家之后，按TRE的思路可以考虑？","o":["只在白天吃两顿饭，中间睡10个小时","立即大吃一顿","白天不吃、晚上补足","全天禁食"],"a":0,"e":"这样，即便是下了夜班回家之后，也可以考虑只在白天吃两顿饭，中间睡10个小时。"},{"q":"褪黑素、皮质醇等激素的产生，取决于？","o":["中枢神经系统针对光照—黑暗变化进行的节律性活动","每天进食量的多少","运动强度的大小","体温的高低"],"a":0,"e":"褪黑素、皮质醇等激素的产生，取决于中枢神经系统针对光照-黑暗变化进行的节律性活动，而其他一些营养敏感激素，比如胰岛素、瘦素等，则在这个昼夜节律的基础上振荡。"},{"q":"低碳水饮食的第一步，是先把多大的能量缺口减完？","o":["200大卡","500大卡","800大卡","1000大卡"],"a":1,"e":"（1）将平时摄入的碳水化合物减少到摄入总能量的25%~40％。你可以先把自己500大卡的能量缺口减完，看看还剩下多少食物。"},{"q":"低碳水饮食中保留的主食和'碳水'型蔬菜，应尽量选用？","o":["杂粮、全谷物、红薯或南瓜","大米、白面","油条、薯条","精制糕点"],"a":0,"e":"那你可以保留不超过600大卡的主食和'碳水'型蔬菜，尽量选用杂粮、全谷物、红薯或南瓜，换算成重量的话大约是150克，平均到三餐就是每顿一两。"},{"q":"低碳水饮食中，除去碳水化合物后剩下的空间（占总能量的60%~75%）是留给？","o":["脂肪和蛋白质","只有蛋白质","只有蔬菜","只有水果"],"a":0,"e":"（2）剩下的60%~75％都是脂肪和蛋白质的空间。相比平时的饮食，可以适量增加一些脂肪。"},{"q":"看食物成分标签时，'碳水化合物'一栏超过多少的加工食物要绕着走？","o":["10%","20%","30%","40%"],"a":1,"e":"⑤碳水化合物超标的加工食物。看食物成分标签，'碳水化合物'一栏，如果超过20%，你也要绕着走。"},{"q":"油炸碳水化合物主食之所以要避开，是因为它虽然能多吃到一些脂肪，却是？","o":["极易吸收的能量炸弹","低能量食物","优质蛋白来源","高纤维食物"],"a":0,"e":"①油炸碳水化合物主食。虽然可以多吃到一些脂肪，但油炸主食却是极易吸收的能量炸弹。"},{"q":"关于低碳水饮食方案与糖尿病人，书中的说法是？","o":["糖尿病人则很适合","糖尿病人绝对不能采用","只适合1型糖尿病","会加重糖尿病"],"a":0,"e":"其次，高血脂或心血管疾病患者不能采用低碳水饮食方案，因为这会使血脂进一步紊乱。糖尿病人则很适合。"},{"q":"一项比较低脂肪、低碳水和地中海饮食三种方案的研究发现，到第二年？","o":["低碳水组失败和退出的发生率最高","低碳水组坚持得最好","三组没有任何差别","地中海饮食组退出率最高"],"a":0,"e":"最后，一项研究比较了采取低脂肪、低碳水和地中海饮食三种不同方案的群体，发现到第六个月，低碳水饮食方案仍有大多数人坚持，但到第二年，低碳水组失败和退出的发生率最高。"},{"q":"低碳水组到第二年失败和退出率最高，可能的原因是？","o":["食物选择相对有限","价格太高","需要住院执行","味道太差"],"a":0,"e":"这可能是由于低碳水饮食方案的食物选择相对有限。"},{"q":"低碳水方案用上6个月后，书中建议？","o":["换成均衡的营养方案更好","继续长期执行下去","改为完全断绝碳水","加量再坚持一年"],"a":0,"e":"所以，即便你是个肉食动物，这个方案用上6个月，恐怕你也坚持不下去了。不必纠结，这时候换成均衡的营养方案更好。"},{"q":"低碳水饮食期间运动训练时碳水化合物摄入不足，还可能导致？","o":["代谢性酸中毒","低血糖昏迷","高血压","骨质疏松"],"a":0,"e":"此外，运动训练时碳水化合物摄入不足，还会导致代谢性酸中毒。"},{"q":"面对碳水化合物，很多人往往吃到第几口就再也停不下来？","o":["第一口","第三口","第十口","最后一口"],"a":1,"e":"但面对碳水化合物，很有可能出现的场景是，当你吃到第三口，你就再也停不下来，直到肚皮都快撑破了，满足感才会真正出现。"},{"q":"关于爱吃主食和爱吃肉哪个更难减肥，书中的判断是？","o":["爱吃主食比爱吃肉更难减肥","爱吃肉更难减肥","两者一样难","两者都不难"],"a":0,"e":"所以真实的情况是，如果你爱吃主食，比爱吃肉更难减肥。今天，因为热爱主食而导致肥胖的人群，在中国的比例要远高于爱吃肉的。"},{"q":"新中国成立初期，人们膳食结构中碳水化合物供能占比几乎可以达到？","o":["30%","50%","70%","90%"],"a":2,"e":"新中国成立初期，在人们的膳食结构中，碳水化合物供能占比几乎可以达到70％。但当年别说肥胖了，就是想找几个超重的也困难啊。"},{"q":"书中特别提醒爱吃主食的人，千万不要刻意降低碳水化合物的比例，因为这样只会？","o":["让你更快地放弃减肥","让减重速度更快","明显改善血脂","提高基础代谢"],"a":0,"e":"事实上，如果你爱吃主食，千万不要刻意降低碳水化合物的比例，因为这样只会让你更快地放弃减肥。"},{"q":"标注'低脂肪'的零食一定要小心，是因为它们很可能？","o":["碳水化合物含量很高","蛋白质含量很高","脂肪含量其实更高","完全不含能量"],"a":0,"e":"第二，所有高GI的零食，能戒都戒掉，尤其那些标注'低脂肪'的零食，一定要小心，因为它们很可能碳水化合物含量很高，吃了之后，再加上一日三餐的主食，你的碳水化合物摄入就会超标。"},{"q":"当饥饿感不强烈时，大脑中驱动'碳水'上瘾、活动会明显减弱的区域是？","o":["伏隔核","海马体","杏仁核","下丘脑"],"a":0,"e":"多项动物及人类神经生物学研究都观察到，当饥饿感不强烈时，大脑中驱动'碳水'上瘾的伏隔核区域，活动明显减弱，这样你对主食的需求度就变得可以控制了。"},{"q":"主食爱好者最简单的做法是，菜上齐之后？","o":["把想吃的肉、菜和主食都放在面前的餐盘里，一口肉一口菜一口饭轮着来","先吃完肉和菜再吃饭","只吃主食","先喝汤再吃饭"],"a":0,"e":"最简单的做法就是，菜上齐之后，把所有想吃的肉、菜和主食都放在面前的餐盘里，按照比例，吃一口肉，吃一口菜，再吃一口饭，轮着来，不要等菜都吃饱了再吃主食。"},{"q":"为什么千万别等肉和菜都吃饱了再吃饭？","o":["停不下主食的你还能再来碗汤泡饭或炝锅面溜个缝，一下子能量又超标","会严重影响消化","会导致低血糖","会让肉的营养流失"],"a":0,"e":"但也千万别等肉和菜都吃饱了再吃饭。相信我，停不下主食的你，虽然这时候已经吃不动肉了，但是再来碗汤泡饭或者炝锅面溜个缝，那是绰绰有余，一下子能量又超标了。"},{"q":"女性一旦减得不对就容易出问题，根本原因之一是脂类是合成什么激素的原料？","o":["雌激素和孕激素","胰岛素和胰高血糖素","甲状腺素","生长激素"],"a":0,"e":"这是因为，脂类是合成雌激素和孕激素的原料之一，如果没有了脂肪来源，身体就无法生产出这些女性必需的激素。"},{"q":"女性BMI大于24，但既没有三高、也没有糖尿病风险、没有睡眠呼吸暂停综合征和脂肪肝，且不是打心底里很想减肥，书中的建议是？","o":["可以再等等，只要体重不再增加就行","必须立即开始减肥","需要考虑减肥手术","要严格节食"],"a":0,"e":"BMI大于24呢？如果你还挺健康的，既没有'三高'，也没有糖尿病的风险，又没有睡眠呼吸暂停综合征、脂肪肝等肥胖导致的疾病，如果你不是打心底里很想减肥，那你可以再等等，只要体重不再增加就行。"},{"q":"即使没查出任何疾病，女性BMI超过多少，医生都会强烈建议开始减肥？","o":["24","26","28","30"],"a":3,"e":"如果已经有了上面说的任何一种疾病，或者虽然没查出啥疾病，但BMI已经超过30了，那无论如何，我都会强烈建议你开始减肥。"},{"q":"女性减肥急于求成时，有大量运动的情况下每天能量摄入也不到多少大卡？","o":["1000大卡","1200大卡","1500大卡","1800大卡"],"a":2,"e":"就是急于求成，或者要求极其严格，每天的能量摄入还不到1200大卡，有大量运动时也不到1500大卡，营养搭配极不均衡。"},{"q":"月经实际上是女性身体对自己的生活方式多久一次的检验？","o":["每周一次","每月一次","每季度一次","每年一次"],"a":1,"e":"有的女生很讨厌自己的月经，但月经实际上是我们女性身体对自己的生活方式每月一次的检验。"},{"q":"如果减肥的方式正确，你的月经会？","o":["比以前更加规律，经期血量不少，同时也比较舒服","提前停止","血量明显减少","周期不断变长"],"a":0,"e":"如果减肥的方式正确，你的月经只会比以前更加规律，经期血量不少，同时也比较舒服。"},{"q":"饥荒年间的女性根本没有月经，这是因为？","o":["身体在持续饥饿的状态下，就会减少生殖这种不必要的需求","营养不良直接损伤了卵巢","环境温度过低","劳动强度太大"],"a":0,"e":"你会发现，饥荒年间的女性根本没有月经，这是因为，身体在持续饥饿的状态下，就会减少生殖这种不必要的需求。"},{"q":"月经开始以后的多长时间，是你可以重新开启的时间？","o":["三天","一周","两周","一个月"],"a":2,"e":"无论是激素水平、代谢水平，还是身体的修复、情绪的调整，都是在一个月经周期里完成的。月经开始以后的两周，是你可以重新开启的两周。"},{"q":"月经期特别困乏，其实是身体在？","o":["修复自己，为进入代谢旺盛周期做准备","出现疾病的信号","严重缺乏营养","加速衰老"],"a":0,"e":"第一，保证睡眠。大部分时候，你在月经期都会特别困乏，这是身体在修复自己，为进入代谢旺盛周期做准备。"},{"q":"月经后的一周是黄金减肥期，一方面由于月经代谢、水肿消退，你本身就能轻上大约？","o":["0.5千克","1千克","2千克","3千克"],"a":1,"e":"这段时间是我们的黄金减肥期，一方面由于月经代谢、水肿消退，你本身就能轻上1千克左右，另一方面，雄激素等各种促进代谢的激素开始增加。"},{"q":"围绝经期对于减肥与月经期有着同样的两个功能，即？","o":["检验和重塑","排毒和补水","减重和增肌","储脂和燃脂"],"a":0,"e":"围绝经期对于你的减肥与月经期有着同样的两个功能。一是检验。……二是重塑。"},{"q":"对照儿童标准BMI范围图，属于正常体重的区间是？","o":["85th和15th中间部分","85th以上","97th以上","15th以下"],"a":0,"e":"85th和15th中间部分属于正常体重，超过85th那根线就是超重，超过97th那根线就是肥胖。"},{"q":"脂肪细胞的数量在什么时候达到顶峰？","o":["婴幼儿时期","青春期","成年之后","老年时期"],"a":1,"e":"婴幼儿时期，脂肪细胞就开始大量繁殖；到青春期的时候，数量达到顶峰。从此以后，这个数量就不会再变了。"},{"q":"小时候体重过高对未来肥胖的影响，贯穿的时间段是？","o":["从娘胎里到18岁的所有人生阶段","仅儿童期","仅青春期","仅婴儿期"],"a":0,"e":"请注意，这种小时候体重过高对未来肥胖的影响，发生在胎儿期、婴儿期、儿童期和青少年时期，也就是说，贯穿一个孩子从娘胎里到18岁的所有人生阶段。"},{"q":"关于所谓的'青春肥''婴儿肥'，书中的观点是？","o":["根本没有，小时候胖多半会变成真的胖","是正常的长身体","长大后一定会自动消失","只发生在女孩身上"],"a":0,"e":"根本没有什么所谓的'青春肥''婴儿肥'，小时候胖不是很多人以为的长身体，它多半会变成真的胖。"},{"q":"如果父亲一方胖，孩子肥胖的风险是父母双方体重都正常孩子的？","o":["2.7倍","3.1倍","4倍","1.5倍"],"a":1,"e":"研究显示，父母双方都胖的，孩子肥胖的风险是父母双方体重都正常的孩子的4倍；如果父亲一方胖，这个风险是3.1倍；仅有母亲一方胖的，这个风险是2.7倍。"},{"q":"如果仅有母亲一方胖，孩子肥胖的风险是父母双方体重都正常孩子的？","o":["2.7倍","3.1倍","4倍","5倍"],"a":0,"e":"研究显示，父母双方都胖的，孩子肥胖的风险是父母双方体重都正常的孩子的4倍；如果父亲一方胖，这个风险是3.1倍；仅有母亲一方胖的，这个风险是2.7倍。"},{"q":"新生儿出生时的体重不管是高于4千克还是低于2.5千克，都会导致？","o":["孩子成年后变胖以及患上肥胖相关疾病的概率都会明显增加","完全没有影响","只影响身高","只影响智力"],"a":0,"e":"医学研究发现，出生时的体重不管是高于4千克，还是低于2.5千克，孩子成年后变胖，以及患上肥胖相关疾病的概率都会明显增加。"},{"q":"大多数观察性研究都发现，母乳喂养的学龄期儿童肥胖风险会降低？","o":["5%~10%","15%~20%","25%~30%","35%~40%"],"a":1,"e":"大多数观察性研究都发现，母乳喂养的学龄期儿童，肥胖风险会降低15%~20％。"},{"q":"母乳有自己的调节机制，孩子吃得多时会？","o":["母乳产量大，能量密度就会下降，孩子吃进去的能量并不会增加","能量密度上升","立刻停止分泌","蛋白质含量翻倍"],"a":0,"e":"母乳有自己的调节机制，孩子吃得多，母乳产量大，能量密度就会下降，算下来，孩子吃进去的能量并不会增加。"},{"q":"根据美国儿科学会的推荐，4~6岁的孩子每天可以喝多少果汁？","o":["最多120毫升","120~180毫升","240毫升","300毫升"],"a":1,"e":"根据美国儿科学会的推荐，1~3岁的孩子每天最多喝120毫升果汁；4~6岁每天120~180毫升；6岁后每天可以喝240毫升。"},{"q":"根据美国儿科学会的推荐，6岁后的孩子每天可以喝多少果汁？","o":["120毫升","180毫升","240毫升","360毫升"],"a":2,"e":"根据美国儿科学会的推荐，1~3岁的孩子每天最多喝120毫升果汁；4~6岁每天120~180毫升；6岁后每天可以喝240毫升。"},{"q":"一杯240毫升的苹果汁，大约需要几个苹果才能榨成？","o":["1个","2个","3~4个","6~8个"],"a":2,"e":"一杯240毫升的苹果汁和一个苹果的分量差不多，但需要3~4个苹果才能榨成。"},{"q":"千万不能让孩子养成的进食习惯是？","o":["一会儿吃一点的'牛羊放牧式'进食","三餐定时定量","自己独立吃饭","细嚼慢咽"],"a":0,"e":"注意，千万不能养成一会儿吃一点、一会儿吃一点这种'牛羊放牧式'的进食习惯。如果孩子忙着玩，正餐没吃饱，也不要给他零食。他饿了，下一顿自然会好好吃。"},{"q":"三餐让孩子自己吃，有助于？","o":["培养孩子的专注力，让他更好地感知自己有没有吃饱","增加进食量","缩短吃饭时间","提高食欲"],"a":0,"e":"自己吃饭有助于培养孩子的专注力，让他更好地感知自己有没有吃饱，而不是慌着去玩，一不小心就吃多了。"},{"q":"关于棕色脂肪组织与BMI的关系，正确的是？","o":["呈负相关，棕色脂肪组织越多，体重就越低","呈正相关","两者没有关系","只在成年后才相关"],"a":0,"e":"其中，棕色脂肪组织与BMI呈负相关。也就是说，棕色脂肪组织越多，体重就越低。而适度的寒冷，会促进棕色脂肪细胞的增长。"},{"q":"对青少年来说，每天多长时间的中等强度有氧运动既能预防肥胖也能帮小胖墩们减肥？","o":["5~10分钟","20分钟到1小时","2~3小时","4小时以上"],"a":1,"e":"对青少年来说，每天20分钟到1小时的中等强度有氧运动，不仅能预防肥胖，也能帮小胖墩们减肥。"},{"q":"预防孩子肥胖的第十招是，全家11点前熄灯，让孩子睡足？","o":["8个小时","9个小时","10个小时","12个小时"],"a":2,"e":"第十招，全家11点前熄灯，让孩子睡足10个小时。"},{"q":"2~4岁的孩子每天要睡够多少小时？","o":["10个小时","11个小时","12个小时","13~14个小时"],"a":2,"e":"1~2岁的小宝贝，每天要睡13~14个小时；2~4岁，要睡够12个小时；4~7岁，大概是11个小时；到了学龄期和青春期，也就是7~15岁，每天要睡足8~11个小时。"},{"q":"学龄期和青春期（7~15岁）的孩子每天要睡足？","o":["6~8个小时","8~11个小时","11~12个小时","13~14个小时"],"a":1,"e":"到了学龄期和青春期，也就是7～15岁，每天要睡足8~11个小时。"},{"q":"遭受了心理损伤的肥胖孩子，往往会从喜欢的食物中获得慰藉，从而使体重进一步恶化，进入？","o":["身体受伤和心理受伤的恶性循环","体重与情绪改善的良性循环","代谢加快的状态","情绪稳定的状态"],"a":0,"e":"遭受了这种心理损伤的孩子，往往会从喜欢的食物中获得慰藉，使体重进一步恶化，进入身体受伤和心理受伤的恶性循环。"},{"q":"学校的健康调查告诉我们，肥胖的孩子更容易？","o":["被戏弄，被欺负，不合群","成为学生干部","运动能力更强","受到同学欢迎"],"a":0,"e":"学校的健康调查告诉我们，肥胖的孩子更容易被戏弄，被欺负，不合群。"},{"q":"书中把孕产期的体重管理归纳为几个时间段的关键认知和方法？","o":["两个","三个","四个","五个"],"a":1,"e":"想要在产后变成辣妈横空出世，我帮你归纳了三个时间段的关键认知和方法。第一，备孕期，尽量将体重减到正常范围。第二，孕期，体重有序增加。第三，产后，体重及时恢复。"},{"q":"美国国家科学院对女性孕期的体重增长值给出建议是在哪一年？","o":["1999年","2005年","2009年","2015年"],"a":2,"e":"2009年，美国国家科学院对女性孕期的体重增长值给出了以下建议（见表3-1）。"},{"q":"孕前超重（BMI 24~29.9）的孕妇，孕期总增重范围建议为？","o":["5~9千克","7~11.5千克","11.5~16千克","12.5~18千克"],"a":1,"e":"书中表3-1（美国国家科学院对孕期女性体重增长值的推荐）给出：孕前体重超重（BMI 24~29.9）的孕妇，孕期总增重建议为7~11.5千克。"},{"q":"孕前肥胖（BMI≥30）的孕妇，孕期总增重范围建议为？","o":["5~9千克","7~11.5千克","11.5~16千克","12.5~18千克"],"a":0,"e":"书中表3-1给出：孕前体重肥胖（BMI ≥30）的孕妇，孕期总增重建议为5~9千克。"},{"q":"孕期控制好体重，可以降低母婴两代人患哪些疾病的风险？","o":["糖尿病、心脑血管疾病","感冒、过敏","近视、龋齿","骨折、关节炎"],"a":0,"e":"这个时候控制好了，要远远胜过将来辛辛苦苦减肥，同时也更加有利于孩子的全方位健康，降低母婴两代人患糖尿病、心脑血管疾病的风险。"},{"q":"一系列高质量的研究都印证了，母乳喂养和产后女性体重变化是正相关的，也就是说？","o":["母乳喂养越充分、时间越久，母亲产后的体重下降就越快","母乳喂养与产后体重变化无关","母乳喂养会让母亲更胖","只有前三个月有效"],"a":0,"e":"（1）母乳喂养：一系列高质量的研究，都印证了母乳喂养和产后女性体重变化是正相关的。也就是说，母乳喂养越充分，时间越久，母亲产后的体重下降就越快。"},{"q":"佩德森等人发现，复胖风险最高的是哪一类女性？","o":["在怀孕期间和产后6个月、18个月时感到抑郁、焦虑或痛苦的女性","哺乳时间最长的女性","运动量最大的女性","睡眠最充足的女性"],"a":0,"e":"（2）保持良好的情绪：佩德森等人发现，在怀孕期间和产后6个月、18个月时感到抑郁、焦虑或痛苦的女性，复胖的风险最高。"},{"q":"如果生
