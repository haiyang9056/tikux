A的作用包括？","o":["上皮组织的形成、发育以及维持上皮组织的健全","决定一个人的皮肤状况好坏","与防治癌症关系密切","参与凝血过程"],"a":[0,1,2],"e":"另外，上皮组织的形成、发育以及维持上皮组织的健全方面，维生素A也是积极的贡献者。它不仅决定了一个人的皮肤状况好坏，还与防治癌症关系密切。"},{"q":"维生素A缺乏的突出和常见症状包括？","o":["暗适应能力下降，严重者在夜里会看不清东西","眼干燥症","皮肤和黏膜发生病变","夜盲症和骨痛"],"a":[0,1,2],"e":"维生素A缺乏最突出的症状是暗适应能力下降，严重者在夜里会看不清东西。……维生素A缺乏最常见的症状是眼干燥症……除了暗适应差、眼干燥症外，皮肤和黏膜也会发生病变。"},{"q":"检测自己暗适应能力的方法有？","o":["天黑后在路灯不亮的地方，是否感觉到明显看不清楚","把房屋的灯突然关掉，在黑暗中你过多久能看见东西","正常人10秒钟内应该可以看到","看电影去晚了能不能很快找到座位","在明亮处能否看清远方的字"],"a":[0,1,2,3],"e":"第一个方法是，天黑后在路灯不亮的地方，你是否会感觉到明显看不清楚。第二个方法是，把房屋的灯突然关掉，在黑暗中你过多久能看见东西。正常人10秒钟内应该可以看到。例如，去看电影的时候，如果去晚了，你能不能很快找到座位？"},{"q":"关于眼干燥症，正确的有？","o":["角膜、结膜上皮、泪腺等组织的修复过程非常需要维生素A的参与","如果缺乏维生素A，会出现眼睛干涩、发炎","严重者会出现角膜软化、溃疡、角质化等一系列变化","角膜损伤严重常会导致不可逆转的失明","现在大家用电脑和手机多，眼干燥症也很多发","眼干燥症与维生素A的缺乏无关"],"a":[0,1,2,3,4],"e":"维生素A缺乏最常见的症状是眼干燥症：角膜、结膜上皮、泪腺等组织的修复过程非常需要维生素A的参与，如果缺乏维生素A，会出现眼睛干涩、发炎，严重者会出现角膜软化、溃疡、角质化等一系列变化，角膜损伤严重常会导致不可逆转的失明。同时由于现在大家用电脑和手机多，眼干燥症也很多发。"},{"q":"维生素A缺乏在皮肤黏膜上的表现包括？","o":["肩部、上肢、腿部的皮肤角化干燥，呈小疙瘩状","口腔、呼吸道很干或者慢性咽炎","支气管肺炎的孩子可能缺维生素A","皮肤变得细腻有光泽"],"a":[0,1,2],"e":"我坐地铁时，常常发现一些女性，尽管脸上抹了化妆品，但是肩部、上肢、腿部的皮肤角化干燥，呈小疙瘩状，这都是维生素A缺乏的表现。另外，口腔、呼吸道很干或者慢性咽炎，也往往与维生素A缺乏有关。家里如果有经常出现支气管肺炎的孩子，父母一定要好好想想，孩子日常生活中是不是缺维生素A了。"},{"q":"与维生素A缺乏有关的其他问题包括？","o":["泌尿系统感染","妇科感染","某些癌症","骨折"],"a":[0,1,2],"e":"另外泌尿系统感染、妇科感染、某些癌症也与维生素A缺乏有关。"},{"q":"获得维生素A的途径包括？","o":["从动物肝脏、奶油和鸡蛋中直接获得","制造一个油性的环境，把植物中的胡萝卜素溶进去","吃胡萝卜炖牛腩、猪肉炖南瓜、炒西蓝花、炒油菜、炒菠菜等","大量生吃胡萝卜不加任何油脂"],"a":[0,1,2],"e":"第一，从动物肝脏、奶油和鸡蛋中直接获得维生素A。第二，制造一个油性的环境，把植物中的胡萝卜素溶进去，比如吃胡萝卜炖牛腩、猪肉炖南瓜、炒西蓝花、炒油菜、炒菠菜等来吸收维生素A。"},{"q":"关于胡萝卜素转化为维生素A，正确的有？","o":["肠道黏膜可以根据身体中对维生素A的需求量来决定对胡萝卜素的吸收量","一个胡萝卜素分子可以转化为两个维生素A分子","身体缺维生素A时肠道对胡萝卜素转化吸收的就多，够了就减少吸收","这样就不会出现体内维生素A中毒问题","胡萝卜素转化为维生素A的比例是1∶1"],"a":[0,1,2,3],"e":"肠道黏膜可以根据身体中对维生素A的需求量来决定对胡萝卜素的吸收量。一个胡萝卜素分子可以转化为两个维生素A分子，身体缺维生素A时肠道对胡萝卜素转化吸收的就多，够了就减少吸收，这样就不会出现体内维生素A中毒问题。"},{"q":"现在维生素D的定位与作用包括？","o":["研究已经把它上升到激素的高度","不仅与骨骼有关，还与细胞功能的调节及基因转录相关","维生素D的受体遍布全身，全身各处包括大脑细胞都会受到它的影响","只与钙的吸收有关"],"a":[0,1,2],"e":"近年来对维生素D的研究越来越多，现在已经把它上升到激素的高度。研究发现，维生素D不仅与骨骼有关，还与细胞功能的调节及基因转录相关。维生素D的受体遍布全身，因此全身各处包括大脑细胞都会受到维生素D的影响。"},{"q":"维生素D缺乏的人群分布特点是？","o":["城市里的人多于农村人","女性多于男性","冬天和春天最为高发","男性多于女性"],"a":[0,1,2],"e":"维生素D缺乏现在已经成为非常广泛而严重的健康问题，患者中居住在城市里的人多于农村人，女性多于男性，冬天和春天最为高发。"},{"q":"缺乏维生素D的表现形式有？","o":["骨质疏松、小儿盗汗等缺钙表现","容易过敏，容易感冒","好发肿瘤、抑郁等","冠心病、高血压、糖尿病等也与维生素D缺乏有关","皮肤角化呈小疙瘩状"],"a":[0,1,2,3],"e":"缺乏维生素D的表现形式有：骨质疏松、小儿盗汗等缺钙表现，容易过敏，容易感冒，好发肿瘤、抑郁等。此外，冠心病、高血压、糖尿病等也与维生素D缺乏有关。"},{"q":"为什么现在维生素D缺乏越来越高发？","o":["大家基本上在室内活动","出门也常常坐车或者开车","晒太阳的时间大幅减少","现在的人不吃鸡蛋"],"a":[0,1,2],"e":"现在大家基本上在室内活动，出门也常常坐车或者开车，导致维生素D缺乏越来越高发。"},{"q":"我们体内维生素D的来源有？","o":["从动物类食物中直接获得","人体皮肤合成","只能靠吃钙片获得","只能靠注射获得"],"a":[0,1],"e":"我们体内的维生素D有两个来源：第一，从动物类食物中直接获得……第二，人体皮肤合成。"},{"q":"含维生素D的食物有？","o":["动物的肝脏、大脑、肺、脾","鸡蛋、牛奶","三文鱼、大马哈鱼","动物的骨头和皮肤也含有少量维生素D","新鲜绿叶蔬菜"],"a":[0,1,2,3],"e":"含维生素D的食物有：动物的肝脏、大脑、肺、脾，鸡蛋，牛奶，三文鱼，大马哈鱼，动物的骨头和皮肤也含有少量维生素D。"},{"q":"人体皮肤合成维生素D的过程，正确的有？","o":["表皮与真皮内含有一定量的7-脱氢胆固醇","受到阳光或紫外光照射时，可以经光化学反应形成前维生素D3","再经过肝脏和肾脏的羟化作用，最后转化为有活性的维生素D3","皮肤可以直接合成有活性的维生素D3，不需要肝肾参与"],"a":[0,1,2],"e":"人体的表皮与真皮内含有一定量的7-脱氢胆固醇，当受到阳光或紫外光照射时，可以经光化学反应形成前维生素D3，再经过肝脏和肾脏的羟化作用，最后转化为有活性的维生素D3。"},{"q":"关于维生素D与癌症的研究，正确的有？","o":["国际上有超过2500篇公开发表成果的研究证实维生素D在预防癌症中有重要作用","无论是内源性还是营养补充方式获得的维生素D，都能够阻止身体内部癌症的发生","将乳腺癌、前列腺癌和结肠癌的风险减少50%","还能减少痴呆和神经系统失调的风险","维生素D会明显增加癌症风险"],"a":[0,1,2,3],"e":"国际上有超过2500篇公开发表成果的研究证实维生素D在预防癌症中有重要作用。无论是来自阳光照射自我合成的内源性维生素D，还是由营养补充方式获得的维生素D，都能够阻止身体内部癌症的发生，将乳腺癌、前列腺癌和结肠癌的风险减少50%，还能减少痴呆和神经系统失调的风险。"},{"q":"获取维生素D的最好方式是？","o":["日晒","每天要花半个小时接触阳光","哪怕是在背阴的地方接受散射的太阳光线也好","较少外出的人需要补充一些维生素D","大量服用钙片"],"a":[0,1,2,3],"e":"是日晒。我们每天要花半个小时接触阳光，哪怕是在背阴的地方接受散射的太阳光线也好。较少外出的人需要补充一些维生素D，可以通过吃前文提到的动物类食物来补充，以将血液中的维生素D保持在40～60纳克／毫升。"},{"q":"关于维生素B族，正确的有？","o":["是个大家庭，成员有12种以上，被世界公认的有9种","全部是水溶性维生素","包括维生素B1、B2、B6、B12、烟酸、叶酸、泛酸、生物素和胆碱","属于脂溶性维生素"],"a":[0,1,2],"e":"维生素B族是个大家庭，成员有12种以上，被世界公认的有9种，全部是水溶性维生素，包括维生素B1、维生素B2、维生素B6、维生素B12、烟酸、叶酸、泛酸、生物素和胆碱。"},{"q":"维生素B族的主要消耗用于完成细胞的哪些功能？","o":["合成辅酶，参与三大能量代谢","完善神经细胞功能","促进细胞分裂","构成细胞膜的主体骨架"],"a":[0,1,2],"e":"维生素B族的消耗主要用于完成细胞的以下功能：第一，合成辅酶，参与三大能量代谢。第二，完善神经细胞功能……第三，促进细胞分裂。"},{"q":"关于B族维生素与辅酶，正确的有？","o":["B族维生素的角色类似于助燃剂","如果B族缺乏，辅酶的活性会降低","人的新陈代谢速度就会减慢","B族维生素是构成细胞膜的主要成分"],"a":[0,1,2],"e":"第一，合成辅酶，参与三大能量代谢。B族维生素的角色类似于助燃剂，如果B族缺乏，辅酶的活性会降低，人的新陈代谢速度就会减慢。"},{"q":"与神经系统功能完善密切相关的维生素是？","o":["维生素B1","维生素B6","维生素B12","维生素C"],"a":[0,1,2],"e":"第二，完善神经细胞功能，尤其是维生素B1、维生素B6、维生素B12与神经系统的功能完善密切相关。"},{"q":"关于叶酸，正确的有？","o":["参与细胞DNA的构成","当细胞要进行分裂时，会先加倍合成DNA，之后进行有丝分裂","于是一个细胞就分裂为两个细胞，遗传物质也对半分","属于脂溶性维生素"],"a":[0,1,2],"e":"第三，促进细胞分裂。我们熟悉的叶酸，参与细胞DNA的构成。当细胞要进行分裂时，会先加倍合成DNA，之后进行有丝分裂，于是一个细胞就分裂为两个细胞，遗传物质也对半分了。"},{"q":"缺乏维生素B族最常见的症状是？","o":["上火，表现为眼结膜充血、烦躁、口腔溃疡","记忆力下降、反应迟钝、没有精神","容易头痛，严重者出现眩晕","皮肤角化呈小疙瘩状"],"a":[0,1,2],"e":"缺乏维生素B族最常见的症状是上火，表现为眼结膜充血，烦躁，口腔溃疡。……缺乏维生素B族最容易表现出神经系统症状：人会出现记忆力下降，反应迟钝，没有精神，容易头痛，严重者会出现眩晕。"},{"q":"为什么熬夜加班后容易出现上火症状？","o":["加班熬夜时要消耗大量能量","脑细胞快速运转","在这个过程中要消耗大量维生素B族","熬夜会直接破坏维生素C"],"a":[0,1,2],"e":"熬夜加班之后也容易出现类似症状，为什么？因为在加班熬夜时要消耗大量能量，脑细胞快速运转，在这个过程中要消耗大量维生素B族。"},{"q":"感冒后“上火”的原因包括？","o":["免疫系统在与病毒作战的过程中要加快三大能量的代谢","维生素B族作为三大能量代谢的辅酶，会大量被消耗","病毒感染直接产生大量维生素B族","感冒会让人食欲大增"],"a":[0,1],"e":"感冒也是同样的道理。感冒之后，许多人都说自己上火了，这是由于免疫系统在与病毒作战的过程中要加快碳水化合物、蛋白质、脂类这三大能量的代谢，而维生素B族作为三大能量代谢的辅酶，会大量被消耗。"},{"q":"缺乏维生素B族最突出的问题是周围神经症状，表现为？","o":["四肢和手脚套袜套样的感觉障碍，手脚是木的","开始时早晨出现这种症状，活动后好转，后来症状越来越严重","严重者不仅感觉麻木，最后手和足运动时也呈现无力症状","皮肤出现鱼鳞状改变"],"a":[0,1,2],"e":"最突出的问题是周围神经症状：当维生素B1、维生素B6、维生素B12缺乏时，人会出现四肢和手脚套袜套样的感觉障碍，手脚是木的。开始时早晨出现这种症状，活动后好转，后来症状越来越严重。严重者不仅感觉麻木，最后手和足运动时也呈现无力症状。"},{"q":"B族维生素不足时，患者还容易出现？","o":["食欲不振","消化不良","口臭","夜盲症"],"a":[0,1,2],"e":"B族维生素不足时，患者还容易出现食欲不振，消化不良，甚至一些人会出现口臭，别人都不敢靠近他。"},{"q":"那位因维生素B族不足导致口臭的患者，日常饮食是？","o":["每天吃馒头、米饭和面条","爱吃涮羊肉","喜欢吃点辣椒和咸菜","蔬菜和水果基本上一点都不吃","每天吃大量蔬菜水果"],"a":[0,1,2,3],"e":"他说：“每天吃馒头、米饭和面条，爱吃涮羊肉，喜欢吃点辣椒和咸菜，蔬菜和水果基本上一点都不吃。”"},{"q":"关于B族维生素的食物来源，正确的有？","o":["维生素B1——种子皮、动物内脏和瘦肉","维生素B2——动物肝脏、奶类、蛋类、豆类和绿叶蔬菜","维生素B6——动物肝脏、奶类、蛋类、豆类、绿叶蔬菜和全谷类食品","维生素B12——动物肝脏、肉类、蛋类和奶类","叶酸——动物肝脏、肾脏、蛋类、豆类、绿叶蔬菜、水果和坚果类","维生素B12主要来源于绿叶蔬菜"],"a":[0,1,2,3,4],"e":"维生素B1——种子皮、动物内脏和瘦肉。维生素B2——动物肝脏、奶类、蛋类、豆类和绿叶蔬菜。维生素B6——动物肝脏、奶类、蛋类、豆类、绿叶蔬菜和全谷类食品。维生素B12——动物肝脏、肉类、蛋类和奶类。叶酸——动物肝脏、肾脏、蛋类、豆类、绿叶蔬菜、水果和坚果类。"},{"q":"关于动物肝脏，正确的有？","o":["动物肝脏简直就是维生素大库房","营养师们都特别喜欢动物肝脏","肝脏是排毒器官，不是存毒器官","肝脏是存毒器官，所以不能吃"],"a":[0,1,2],"e":"大家发现没有，动物肝脏简直就是维生素大库房，所以营养师们都特别喜欢动物肝脏。但是大家经常困惑，肝脏是解毒器官，是不是里面有许多毒素呀？实际上这是个天大的误区，肝脏是排毒器官，不是存毒器官。"},{"q":"补充B族维生素时要考虑的3个特性是？","o":["属于水溶性维生素，很容易丢失，在体内的滞留时间只有数小时，必须每日补充","B族维生素像个球队，球员之间相互配合才能取得胜利，不要单独补一种","维生素B1、B2、B6之间的优质配比是1∶1∶1","属于脂溶性维生素，可以一次性大量补充"],"a":[0,1,2],"e":"第一，B族维生素属于水溶性维生素，很容易丢失，在体内的滞留时间只有数小时，所以必须每日补充，尤其是夏天和出汗多的时候。第二，B族维生素像个球队，球员之间相互配合才能取得胜利，也就是说不要单独补一种……第三，维生素B1、维生素B2、维生素B6之间的优质配比是1∶1∶1。"},{"q":"为什么缺乏维生素B2时不能只补B2？","o":["B族维生素像个球队，球员之间要相互配合","只补一种，很快症状又会复发","如果把各种B族维生素一起补，好得快，还不容易复发","B2单独补充完全没有效果"],"a":[0,1,2],"e":"第二，B族维生素像个球队，球员之间相互配合才能取得胜利，也就是说不要单独补一种，比如一些人口腔溃疡，明显是缺乏维生素B2，但如果只是补了维生素B2，很快症状又会复发。如果把各种B族维生素一起补，好得快，还不容易复发。"},{"q":"维生素C的作用包括？","o":["在皮下、血液中、细胞内外都起着抗氧化的作用","参与胶原蛋白的形成","肾上腺皮质激素的合成与释放也需维生素C参与","能促进抗体形成，增加抵抗力","给予大量维生素C可缓解铅、苯、砷等毒物的毒性","维生素C是脂溶性维生素，可以在体内长期大量储存"],"a":[0,1,2,3,4],"e":"维生素C在皮下、血液中、细胞内外都起着抗氧化的作用，参与胶原蛋白的形成。……此外，肾上腺皮质激素的合成与释放也需维生素C参与。维生素C能促进抗体形成，增加抵抗力。如果体内的毒物如铅、苯、砷及某些药物和细菌、毒素蓄积，给予大量的维生素C可缓解其毒性。"},{"q":"缺乏维生素C时会出现？","o":["胶原蛋白形成障碍","创伤愈合延缓和不同程度的出血","夜盲症","骨骼变脆易折"],"a":[0,1],"e":"当缺乏维生素C时，胶原蛋白形成障碍，会造成创伤愈合延缓和不同程度的出血。"},{"q":"维生素C缺乏症（坏血病）的早期症状包括？","o":["倦怠、疲乏、急躁","呼吸急促","牙龈疼痛出血、伤口愈合不良","关节肌肉短暂性疼痛、易骨折","皮肤角化呈小疙瘩状"],"a":[0,1,2,3],"e":"维生素C缺乏症又称为坏血病，早期症状是倦怠、疲乏、急躁、呼吸急促、牙龈疼痛出血、伤口愈合不良、关节肌肉短暂性疼痛、易骨折等。"},{"q":"坏血病的典型症状和严重后果包括？","o":["牙龈肿胀出血、牙床溃烂、牙齿松动、毛细血管脆性增加","严重者可导致皮下、肌肉和关节出血及血肿形成","最终出现贫血，心脏衰竭，直至死亡","视力迅速下降至失明"],"a":[0,1,2],"e":"典型症状是牙龈肿胀出血、牙床溃烂、牙齿松动、毛细血管脆性增加。严重者可导致皮下、肌肉和关节出血及血肿形成，最终出现贫血，心脏衰竭，直至死亡。"},{"q":"关于吃阿司匹林皮下出血的患者，作者的观点是？","o":["不能因噎废食，不吃水果哪儿来的维生素","咬不动可以榨汁喝","怕血糖高，还有血糖高的吃法","既然吃阿司匹林出血，就应该完全不吃水果"],"a":[0,1,2],"e":"我一问平时如何吃水果，回答都差不多：“血糖高，哪敢吃呀。”要不就说：“老了，咬不动。”每次我都会和患者说，不能因噎废食，不吃水果哪儿来的维生素？咬不动可以榨汁喝，怕血糖高，还有血糖高的吃法。"},{"q":"维生素C的主要来源有？","o":["韭菜、菠菜、柿子椒等深色蔬菜和花椰菜","柑橘、山楂、柚子等水果","野生的苋菜、刺梨、沙棘、猕猴桃、酸枣","肥肉和猪油"],"a":[0,1,2],"e":"维生素C主要来源于新鲜蔬菜与水果，如韭菜、菠菜、柿子椒等深色蔬菜和花椰菜，以及柑橘、山楂、柚子等水果，野生的苋菜、刺梨、沙棘、猕猴桃、酸枣等维生素C含量尤其丰富。"},{"q":"为什么水果成了中国人维生素C的主要来源？","o":["中国人的饮食习惯中，蔬菜基本上是炒熟了吃","维生素C怕热，炒熟会损失很多维生素C","很多人一周不见得能吃一次水果","中国人不吃蔬菜"],"a":[0,1,2],"e":"需要说明的是，中国人的饮食习惯中，蔬菜基本上是炒熟了吃，但维生素C怕热，这样会损失很多维生素C。因此水果就成了中国人维生素C的主要来源了。"},{"q":"关于水果的摄入建议，正确的有？","o":["一个人一天最好吃3种以上水果","合起来半斤以上","服用天然的维生素C片也是一个很好的补充方法","一天只吃一种水果即可"],"a":[0,1,2],"e":"一个人一天最好吃3种以上水果，合起来半斤以上。当然如果服用天然的维生素C片也是一个很好的补充方法。"},{"q":"维生素平衡小结的内容包括？","o":["每一种维生素的缺乏都会给身体健康带来严重的营养问题","化学合成的维生素还远达不到天然维生素的效果","补充维生素要对症下药、量体裁衣","水溶性的不怕摄入过多，就怕不够","脂溶性的如果摄入过多，就会导致中毒","脂溶性的不怕摄入过多，就怕不够"],"a":[0,1,2,3,4],"e":"每一种维生素的缺乏都会给身体健康带来严重的营养问题，而化学合成的维生素还远达不到天然维生素的效果。补充维生素我们要对症下药、量体裁衣……不过，要时刻强调的一点就是，维生素有两类，即脂溶性的和水溶性的。水溶性的不怕摄入过多，就怕不够；脂溶性的如果摄入过多，就会导致中毒。"},{"q":"关于矿物质在人体中的特点，正确的有？","o":["其实就是体内的各种离子","在人体内含量很少，却有着四两拨千斤的作用","必须来自外界，如果不注意摄入就很容易缺乏","人体可以自行合成矿物质"],"a":[0,1,2],"e":"矿物质其实就是体内的各种离子，它们在人体内虽然含量很少，却有着四两拨千斤的作用。第一，矿物质因为必须来自外界，所以如果不注意摄入就很容易缺乏，需要重视。"},{"q":"矿物质的功能包括？","o":["构成身体“钢筋水泥”，如钙、磷、镁是骨骼和牙齿的重要材料","维持身体里内在压力，如钠、钾、氯等与蛋白质共同构成组织的渗透压","给身体“调味儿”，控制体内的酸碱平衡","让体内细胞一直兴奋，特别是钾、钠、钙、镁离子","构成体内特殊物质，如铁构成血红蛋白，碘构成甲状腺素","直接提供能量"],"a":[0,1,2,3,4],"e":"有构成你身体“钢筋水泥”的矿物质……有维持你身体里内在压力的矿物质……有给你身体“调味儿”的矿物质……有让你体内细胞一直兴奋的矿物质……有构成体内特殊物质的矿物质。"},{"q":"矿物质作为“酶系统的活化剂”，正确的对应关系有？","o":["氯离子会激活唾液淀粉酶","盐酸会激活胃蛋白酶","镁离子会激活氧化磷酸化酶类","钙离子会激活胃蛋白酶"],"a":[0,1,2],"e":"这个开关的名称就叫作酶系统的活化剂，如氯离子会激活唾液淀粉酶，盐酸会激活胃蛋白酶，镁离子会激活氧化磷酸化酶类等。"},{"q":"补充矿物质时需要注意的问题包括？","o":["不要过量，尤其是微量元素","尽量选择从食物中补充","缺什么补什么","关注自己所处环境","记住自己的基因表达","尽量一次性把所有矿物质补足"],"a":[0,1,2,3,4],"e":"在补充矿物质时还需要注意一些问题：第一，不要过量，尤其是微量元素。第二，尽量选择从食物中补充。食补安全，吸收好。第三，缺什么补什么。第四，关注自己所处环境。第五，记住自己的基因表达。"},{"q":"维持正常生命活动必不可少的微量元素包括？","o":["铁、锌、碘、氟","铜、钼、锰、铬","镍、钒、锡、硅、钴、硒","钙、磷、镁"],"a":[0,1,2],"e":"一般认为维持正常生命活动必不可少的微量元素有铁、锌、碘、氟、铜、钼、锰、铬、镍、钒、锡、硅、钴、硒13种。由于是微量元素，不可过多补充。"},{"q":"为什么微量元素不可过多补充？","o":["在体内虽然需求很少","生理剂量与中毒剂量比较接近","摄入过多易产生毒性，如氟中毒、铝中毒、铅中毒","微量元素完全不会被排出体外"],"a":[0,1,2],"e":"微量元素在体内虽然需求很少，但其生理剂量与中毒剂量比较接近，摄入过多易产生毒性，如氟中毒、铝中毒、铅中毒。"},{"q":"多余的矿物质排出的途径包括？","o":["首当其冲是肾脏","其次是皮肤","肝脏和肺","头发和指甲"],"a":[0,1],"e":"多余的矿物质身体会努力排出，从哪里排呢？首当其冲是肾脏，其次是皮肤。……每一天都有一定数量的矿物质通过各种途径如泌尿道、肠道、汗腺、皮肤、脱落细胞以及头发、指甲等排出体外。"},{"q":"矿物质如果在肾脏堆积，会导致？","o":["轻则患上肾结石","重则发生肾功能衰竭","重则发生肾癌","轻则出现夜盲症"],"a":[0,1,2],"e":"矿物质如果在肾脏堆积，轻则患上肾结石，重则发生肾功能衰竭、肾癌。"},{"q":"关于环境与矿物质，正确的有？","o":["地壳中矿物质元素分布不平衡","若表层土壤中某种矿物质元素含量过低或过高，都会导致人群因长期摄入本地的食物或饮用水而引起亚临床症状甚至疾病","中国硒元素缺乏的地区很少，不是别人要补硒你也要补硒","中国人人都需要额外补硒"],"a":[0,1,2],"e":"第四，关注自己所处环境。地壳中矿物质元素分布不平衡，若表层土壤中某种矿物质元素含量过低或过高，都会导致人群因长期摄入本地的食物或饮用水而引起亚临床症状甚至疾病。所以不是别人要补硒你也要补硒，实际上中国硒元素缺乏的地区很少。"},{"q":"关于基因表达与矿物质需求，正确的有？","o":["基因表达能力大多数是从小养成的","妈妈在孕期的食物和婴幼儿时期常吃的食物对一个人一生都有影响","从小喝牛奶长大的孩子对各种奶制品都很耐受","海边长大的孩子对碘的需求量要大于内陆的孩子","基因表达能力与从小的饮食无关"],"a":[0,1,2,3],"e":"第五，记住自己的基因表达。基因表达能力大多数是从小养成的。在妈妈肚子里的时候，妈妈爱吃的食物和婴幼儿时期常吃的食物对一个人一生都有影响……比如从小喝牛奶长大的孩子对各种奶制品都很耐受；海边长大的孩子对碘的需求量要大于内陆的孩子。"},{"q":"关于钙在人体内的分布，正确的有？","o":["钙在人体内有两种状态，即游离的和沉积的","游离钙在血液中四处飘荡，也被称为血清钙","游离钙约占钙总量的1%","另外99%的钙沉积在骨骼和牙齿中，被称为骨骼钙","沉积钙占钙总量的1%"],"a":[0,1,2,3],"e":"钙在人体内有两种状态，即游离的和沉积的。游离的钙简称游离钙，就是在血液中四处飘荡的钙离子，也被称为血清钙，约占钙总量的1%。另外99%的钙沉积在骨骼和牙齿中，被称为骨骼钙。"},{"q":"游离钙的功能包括？","o":["维持神经肌肉的正常活动","是体内某些重要酶的辅酶","参与凝血过程","构成骨骼和牙齿的坚固结构"],"a":[0,1,2],"e":"游离的钙虽然只占人体钙总量的1%，却发挥着最重要的功能——维持神经肌肉的正常活动。……此外，游离钙是体内某些重要酶的辅酶，参与凝血过程。如果没有它的参与，血液将不会凝固。"},{"q":"关于钙的排出，正确的有？","o":["多余的钙会通过泌尿系统、肠道和汗腺排出","以肠道和汗液排钙为主","游离钙与骨骼钙维持着动态平衡","钙完全不会被排出体外"],"a":[0,1,2],"e":"一般状态下，游离钙与骨骼钙维持着动态平衡，钙的摄入和排出也维持着动态的平衡，多余的钙会通过泌尿系统、肠道和汗腺排出，以肠道和汗液排钙为主。"},{"q":"早期钙缺乏的表现包括？","o":["主要表现为神经肌肉的兴奋，出现症状时身体已缺钙，但血钙浓度测出来是正常的","孩子生长痛、枕秃、出汗多、出牙晚","成人腿抽筋、睡眠质量差、烦躁、易怒、出虚汗、过敏","夜里磨牙、肠痉挛","身材变矮、驼背"],"a":[0,1,2,3],"e":"早期钙缺乏主要表现为神经肌肉的兴奋，出现这种症状时身体已缺钙，但是血钙浓度测出来是正常的。如果是孩子，主要表现为生长痛、枕秃、出汗多、出牙晚。成人和孩子都会出现腿抽筋、睡眠质量差、烦躁、易怒、出虚汗、过敏等症状，另外还有一些人会表现为夜里磨牙、肠痉挛等。"},{"q":"晚期钙缺乏的表现包括？","o":["儿童身材不够高，或者佝偻病","成年人出现明显的骨质疏松表现","脚后跟疼、驼背、身高降低","股骨颈骨折、前臂骨折、胸腰椎的压缩性骨折","出牙晚、枕秃"],"a":[0,1,2,3],"e":"当一个人已经表现出骨骼和牙齿缺钙或者因缺钙引起哮喘、血压高等问题时，说明这个人的身体已经处于晚期钙缺乏。晚期钙缺乏在儿童主要表现为身材不够高，或者佝偻病；成年人会出现明显的骨质疏松表现，脚后跟疼，驼背，身高降低，髋部的股骨颈骨折，前臂骨折，胸腰椎的压缩性骨折等。"},{"q":"关于维生素D与钙的关系，正确的有？","o":["钙充足也不一定就不患骨质疏松","人体中要有一定的维生素D才能使吸收的钙质沉积在骨头上","维生素D必须经肝脏及肾脏的酶转换之后作为一种激素重新进入循环","肝脏、肾脏有问题的人也会出现骨质疏松","维生素D可以直接把钙送进骨头，不需要肝肾参与"],"a":[0,1,2,3],"e":"另外钙充足也不一定就不患骨质疏松，人体中要有一定的维生素D才能使吸收的钙质沉积在骨头上。……维生素D的活性不高，必须经肝脏及肾脏的酶转换之后作为一种激素重新进入循环，调节钙和磷的吸收，促进骨骼的生长和重构，所以肝脏、肾脏有问题的人也会出现骨质疏松。现在中青年出现缺钙的主要原因一个是缺乏户外运动，胆固醇不能转化为维生素D3，另一个原因是不注意喝牛奶。"},{"q":"钙缺乏的原因包括？","o":["钙的摄入不足，不喝牛奶或奶制品、偏食","维生素D不足，足不出户晒不到太阳","钙在代谢过程中需要的合作成员不对，如蛋白质、维生素A、镁、磷、锰、硅、铁和肠道微生物的参与","药物影响，如肾上腺皮质激素","疾病影响，如肾功能衰竭和肝功能衰竭","补钙方法不对，用无机钙代替有机钙","喝水太少"],"a":[0,1,2,3,4,5],"e":"钙缺乏的原因很多，主要有以下6种情况：第一，钙的摄入不足。第二，维生素D不足。第三，合作成员不对……第四，药物影响。第五，疾病影响。第六，补钙方法不对。"},{"q":"关于血钙正常却骨质疏松，正确的有？","o":["人的自我调节机制是优先供给重要器官","缺钙时首先是骨头和牙齿做些牺牲，释放出一些钙，保证游离钙的正常","所以血钙检查正常，也可以表现为骨质疏松或牙齿不够坚固","游离钙比骨骼钙重要得多，与肌肉收缩、神经传导、心脏收缩、心律有关","血钙正常就说明全身钙营养充足"],"a":[0,1,2,3],"e":"与骨骼钙相比，游离钙要重要得多，因为游离钙不但与肌肉收缩、神经传导、细胞的信息传递有关，还与心脏的收缩、心律有关。人的自我调节机制是当身体中某种营养素总量不够时，要先供给重要器官用，相对不重要的器官组织只好被牺牲掉。于是缺钙时首先是骨头和牙齿做些牺牲，释放出一些钙，保证游离钙的正常。所以即使此时这个人血钙检查正常，也可以表现为骨质疏松或牙齿不够坚固。"},{"q":"关于中国人的钙摄入现状，正确的有？","o":["中国人目前平均每日钙摄入量为400毫克","只达到《中国居民膳食指南（2016）》中钙摄入推荐量的一半","成人钙摄入推荐量是800毫克／日","美国的推荐量是1200毫克／日","日本从“二战”后就鼓励喝牛奶，现在日本年轻人的身高高出老一辈很多","中国的推荐量高于美国"],"a":[0,1,2,3,4],"e":"中国人目前平均每日钙摄入量为400毫克，只达到《中国居民膳食指南（2016）》中钙摄入推荐量的一半。《中国居民膳食指南（2016）》中成人钙摄入推荐量是800毫克／日，美国的推荐量是1200毫克／日。日本从“二战”后就鼓励喝牛奶，因而现在日本年轻人的身高高出老一辈很多。"},{"q":"关于补钙的食物选择，正确的有？","o":["钙的最好来源是奶和奶制品，包括牛奶、羊奶、驴奶、酸奶、奶酪、奶片","一般人每天最好喝300毫升牛奶","在所有奶制品中奶酪含钙量最高，同时也好消化","不能耐受奶制品的人可以吃芝麻、芝麻酱、虾皮、海藻类、大杏仁、西蓝花、豆类、瓜子","动物类食品中的钙比植物类食品中的钙吸收率高","植物类食品中的钙比动物类食品中的钙吸收率高"],"a":[0,1,2,3,4],"e":"钙的最好来源是奶和奶制品，奶中不但钙含量丰富，而且吸收率也很高，具体包括牛奶、羊奶、驴奶、酸奶、奶酪、奶片，等等。一般人每天最好喝300毫升牛奶。如果能够吃奶酪就更好了，因为在所有的奶制品中奶酪含钙量最高，同时也好消化。……还有一些食物含钙较高，要注意经常摄取，包括芝麻、芝麻酱、虾皮、海藻类（海带、紫菜、裙带菜）、大杏仁、西蓝花、豆类、瓜子，等等。需要注意的是动物类食品中的钙比植物类食品中的钙吸收率高。"},{"q":"影响补钙效果的因素包括？","o":["年龄：婴儿吸收率超过50%，儿童约40%，成年人仅20%左右","某些蔬菜如菠菜、苋菜、竹笋和葱中的草酸","脂肪：脂肪酶不足时形成脂肪泻，脂肪与钙结合排出","药物：抗酸药、四环素、肝素会影响钙的吸收","激素：维生素D、甲状旁腺素、降钙素和钙调素等","多喝水"],"a":[0,1,2,3,4],"e":"第一，年龄。婴儿对钙的吸收率超过50%，儿童约为40%，成年人仅20%左右。……第二，某些蔬菜会影响钙的吸收。比如菠菜、苋菜、竹笋和葱中的草酸可在肠腔内与钙结合成不溶解的钙盐……第三，脂肪。……第四，药物。如抗酸药、四环素、肝素会影响钙的吸收。第五，激素。例如，维生素D、甲状旁腺素、降钙素和钙调素等都会影响钙的吸收。"},{"q":"关于“吃小葱拌豆腐会得肾结石”，正确的有？","o":["这个认知是错误的","豆腐中的钙与草酸会在胃肠道里结合，之后从肠道排出","钙吸收虽然少了，但是也减少了得肾结石的机会","吃小葱拌豆腐一定会得肾结石"],"a":[0,1,2],"e":"经常有人问我，听说吃小葱拌豆腐会得肾结石。其实这个认知是错误的。豆腐中的钙与草酸会在胃肠道里结合，之后从肠道排出，钙吸收虽然少了，但是也减少了得肾结石的机会。"},{"q":"作者总结补钙效果不好的真正原因是？","o":["跟自身的吸收能力有关","跟一块儿摄入的其他食物或者药物有关","并不是因为食物中钙的含量不够","是因为市面上的钙片都是假的"],"a":[0,1,2],"e":"事实上，补钙效果不好并不是因为食物中钙的含量不够，而是跟自身的吸收能力有关，跟一块儿摄入的其他食物或者药物有关。"},{"q":"关于镁在人体内的分布，正确的有？","o":["成人体内含镁20～30克","60%以上的镁集中在骨骼和牙齿中","25%分布在肌肉组织中","细胞外液中的镁仅占1%","细胞外液中的镁占体内镁总量的一半"],"a":[0,1,2,3],"e":"成人体内含镁20～30克，其中60%以上的镁集中在骨骼和牙齿中，25%分布在肌肉组织中，细胞外液中的镁仅占1%。"},{"q":"为什么镁被称为生命活动的激活剂？","o":["人活着全靠人体内一系列复杂的生物化学反应维持生命活动","催化这些生化反应需要上千种酶","国外科学家研究发现，镁可激活325个酶系统","镁能直接提供能量"],"a":[0,1,2],"e":"人之所以活着，全靠人体内一系列复杂的生物化学反应维持着生命活动，而催化这些生化反应需要上千种酶（生物催化剂）。国外科学家研究发现，镁可激活325个酶系统，因此把镁称为生命活动的激活剂是当之无愧的。"},{"q":"关于镁与能量，正确的有？","o":["镁主要浓集于线粒体中","线粒体通过消耗镁来促进能量产生","心脏24小时不停地收缩，肌肉也需要很多能量","镁主要在细胞核中发挥作用"],"a":[0,1,2],"e":"镁，主要浓集于线粒体中，线粒体通过消耗镁来促进能量产生。什么器官需要能量最多？心脏啊，心脏24小时不停地收缩，还有肌肉也需要很多能量。"},{"q":"细胞外液中1%的镁的作用是？","o":["与钙、钾、钠离子共同维持着神经肌肉的兴奋性","维持心肌的正常结构和功能","维持心脏活动的正常节律","储存能量"],"a":[0,1,2],"e":"细胞外液中的镁虽然只占体内镁总量的1%，却与钙、钾、钠离子共同维持着神经肌肉的兴奋性，维持心肌的正常结构和功能以及心脏活动的正常节律。"},{"q":"缺镁的表现包括？","o":["早期常表现为胃肠道的症状，比如厌食、恶心、呕吐","加重时出现记忆力减退、精神紧张、易激动、神志不清、烦躁不安、手足徐动","严重时可有癫痫和心律失常发作","皮肤角化呈小疙瘩状"],"a":[0,1,2],"e":"早期缺镁常表现为胃肠道的症状，比如厌食、恶心、呕吐等。镁缺乏加重时会出现相应的神经症状，比如记忆力减退、精神紧张、易激动、神志不清、烦躁不安、手足徐动等症状。严重时，可有癫痫和心律失常发作。"},{"q":"容易缺镁的人群包括？","o":["长跑运动员","在闷热潮湿的环境中体力活动过多的人","久坐办公室的人","只喝纯净水的人"],"a":[0,1],"e":"喜欢长跑的人需要格外注意，因为长跑运动员或在闷热潮湿的环境中体力活动过多的人会出大量的汗，大量的镁随汗液排出，容易引起缺镁。"},{"q":"关于补镁的食物与吃法，正确的有？","o":["含镁多的食物多为植物性食物，特别是新鲜的绿叶蔬菜","绿叶蔬菜中的草酸、植酸会阻止镁的吸收，吃前最好用开水焯一下","坚果、粗粮和豆类也不错","海产品中的镁不仅含量高，而且容易吸收，可多吃海带、紫菜和裙带菜","蛋白质所分解的氨基酸有利于镁的吸收","补镁应多吃肉、少吃菜"],"a":[0,1,2,3,4],"e":"含镁多的食物多为植物性食物，特别是新鲜的绿叶蔬菜。但是由于新鲜绿叶蔬菜中还含有草酸、植酸等物质，这些物质会阻止镁的吸收，所以想补镁，在吃绿叶蔬菜时最好用开水焯一下。坚果、粗粮和豆类也不错，海产品中的镁不仅含量高，而且容易吸收，所以大家可以多吃一些海带、紫菜和裙带菜。蛋白质类也要多吃，因为多摄食蛋白质所分解的氨基酸有利于镁的吸收。"},{"q":"什么情况下容易发生镁中毒？","o":["正常人吃含镁食物过多时","肾功能不全的患者","需要服用大剂量的药物性镁时","吃绿叶蔬菜过多时"],"a":[1,2],"e":"对正常人来说，由于肾的调节作用，食物中的镁摄入过多一般不会发生镁中毒。但当一个患者肾功能不全，又需要服用大剂量的药物性镁时，就容易发生镁中毒。"},{"q":"关于出现肌肉抽搐（抽筋）时的判断，正确的有？","o":["脑海中要反应“一定缺钙，还有可能缺镁”","一定要补充钙","要看看补钙效果","如果补钙效果不好，还要关注是不是缺镁","抽筋一定是缺钾引起的"],"a":[0,1,2,3],"e":"由于镁与钙、钾、钠离子共同维持着神经肌肉的兴奋性，所以如果患者出现肌肉抽搐，就是咱们平时所说的“抽筋”，我们脑海中要反应的是“一定缺钙，还有可能缺镁”。所以一来一定要补充钙，二来看看补钙效果；如果补钙效果不好，还要关注是不是缺镁。"},{"q":"关于人体内的铁，正确的有？","o":["铁总量为4～5克","包括功能性铁和储存铁","功能性铁包括血红蛋白（占铁总量60%～75%）、肌红蛋白（占铁总量3%～5%）和各种含铁酶类（占总量1%）中的铁","近25%的铁在肝、脾和骨髓中以铁蛋白和含铁血黄素的形式存在","铁总量为20～30克"],"a":[0,1,2,3],"e":"人体中铁总量为4～5克，包括功能性铁和储存铁。功能性铁就是身体内正在用的铁，包括血红蛋白（占铁总量60%～75%）、肌红蛋白（占铁总量3%～5%）和各种含铁酶类（占总量1%）中的铁。……除了这些正在用的铁，还有近25%的铁在肝、脾和骨髓中以铁蛋白和含铁血黄素的形式存在。"},{"q":"关于血红蛋白与肌红蛋白，正确的有？","o":["血红蛋白在血液中运输氧气","肌红蛋白在肌肉中运输和储存氧气","各种含铁酶类参与体内的生化反应","肌红蛋白在血液中运输氧气"],"a":[0,1,2],"e":"它们的功能不同，血红蛋白在血液中运输氧气，肌红蛋白在肌肉中运输和储存氧气，各种酶参与体内的生化反应。"},{"q":"功能性铁的作用包括？","o":["参与血红蛋白、肌红蛋白的形成","参与人体很多酶的组成，尤其是氧化呼吸酶类，铁决定着人体的代谢速度","影响蛋白质和脱氧核糖核酸（DNA）的合成","与免疫功能息息相关","直接提供能量"],"a":[0,1,2,3],"e":"第一，功能性铁参与血红蛋白（红细胞内）、肌红蛋白（肌肉内）的形成……第二，功能性铁参与人体很多酶的组成，尤其是氧化呼吸酶类……第三，铁还影响蛋白质和脱氧核糖核酸的合成……第四，铁和免疫功能也息息相关。"},{"q":"为什么说“没有氧则窒息，没有铁则缺氧”？","o":["红细胞的主要作用就是运输氧，供给全身各处使用","有了铁我们才能利用氧","有了氧，三大产能营养素才能燃烧产生能量，维持生命的基本运转","铁本身可以直接燃烧产生能量"],"a":[0,1,2],"e":"我们都知道红细胞的主要作用就是运输氧，供给全身各处使用。所以，有了铁我们才能利用氧。有了氧，三大产能营养素才能燃烧产生能量，维持生命的基本运转。“没有氧则窒息，没有铁则缺氧。”"},{"q":"缺铁时免疫功能的改变包括？","o":["中性粒细胞的杀菌能力降低","淋巴细胞的作用受损","在补充铁后免疫功能可以得到改善","凡是贫血的人，感冒发烧会经常发生","白细胞数量会大量增加"],"a":[0,1,2,3],"e":"实验表明缺铁时，中性粒细胞的杀菌能力降低，淋巴细胞的作用受损，在补充铁后免疫功能可以得到改善。所以，凡是贫血的人，感冒发烧会经常发生。"},{"q":"缺铁性贫血的症状包括？","o":["头晕、头痛、乏力、易倦、心悸","活动后气短、眼花、耳鸣","口角炎、舌乳突萎缩、舌炎","严重的缺铁可有匙状指甲（反甲）、食欲减退、恶心及便秘","皮肤变得细腻有光泽"],"a":[0,1,2,3],"e":"但在日常生活中还是会有一些不适，表现出来的症状有头晕、头痛、乏力、易倦、心悸，活动后气短、眼花、耳鸣等。还有一些特殊表现会被忽视：口角炎、舌乳突萎缩、舌炎，严重的缺铁可有匙状指甲（反甲）、食欲减退、恶心及便秘等。"},{"q":"儿童缺铁常发生？","o":["生长发育迟缓或行为异常","烦躁、易怒","上课注意力不集中及学习成绩下降","身材异常高大"],"a":[0,1,2],"e":"若是儿童缺铁则常发生生长发育迟缓或行为异常，表现为烦躁、易怒、上课注意力不集中及学习成绩下降。"},{"q":"缺铁时身体发出的提醒特征包括？","o":["皮肤黏膜苍白","毛发干枯，口唇角化","指甲扁平、失光泽、易碎裂","约18%的患者有反甲，约10%的患者脾脏轻度肿大","全身皮肤潮红"],"a":[0,1,2,3],"e":"缺铁不易被察觉，但其实有很多身体特征会提醒我们，如皮肤黏膜苍白，毛发干枯，口唇角化，指甲扁平、失光泽、易碎裂，约18%的患者有反甲，约10%的患者脾脏轻度肿大。"},{"q":"那位48岁女患者的诊断与检查结果包括？","o":["BMI为17.5，四肢皮肤苍白，干枯，指甲薄薄的，向上翘着","血常规淋巴细胞比值很低，血色素只有8.9克","诊断为营养不良伴有贫血","诊断为单纯性肥胖"],"a":[0,1,2],"e":"她很瘦，BMI为17.5……她四肢皮肤苍白，干枯，指甲薄薄的，向上翘着。……淋巴细胞比值很低，说明此患者平时的免疫力很低；血色素只有8.9克，诊断结果很清楚，是营养不良伴有贫血。"},{"q":"那位48岁女患者贫血的原因包括？","o":["出血多，一个月两次月经","不吃红肉，导致身体缺乏蛋白质和卟啉铁","只吃鱼和虾，而鱼虾里只有很少的铁","她吃了太多鸡蛋"],"a":[0,1,2],"e":"她是出血多并且不吃红肉，导致身体缺乏蛋白质和卟啉铁。……第一，鱼虾里只有很少的铁，所以总是吃海鲜不吃红肉的人容易出现缺铁性贫血。"},{"q":"关于补铁的认识误区，正确的有？","o":["鱼虾里只有很少的铁，总是吃海鲜不吃红肉的人容易出现缺铁性贫血","法莫替丁这类抑酸药会抑制铁的吸收","鸡蛋里的铁含量比较低，不足以满足需求","菠菜是补铁的最佳食物"],"a":[0,1,2],"e":"这个患者有以下认识误区：第一，鱼虾里只有很少的铁……第二，法莫替丁这类抑酸药会抑制铁的吸收……第三，鸡蛋里的铁含量比较低，不足以满足患者的需求。因为受到草酸和植酸的影响，植物中的铁吸收率也很低。"},{"q":"关于不同肉类含铁量的比较，正确的有？","o":["每100克牛肉里含铁3.2毫克","每100克鸡肉含铁1.4毫克","每100克鱼肉含铁0.8毫克","牛肉含铁量是鱼肉的4倍","鱼肉含铁量是牛肉的4倍"],"a":[0,1,2,3],"e":"每100克牛肉里含铁3.2毫克，每100克鸡肉含铁1.4毫克，每100克鱼肉含铁0.8毫克，这说明什么？牛肉含铁量是鱼肉的4倍。"},{"q":"关于血红素铁，正确的有？","o":["吸收率比较高","既不受植酸等抑制因素的影响，也不受维生素C等促进因素的影响","存在于红细胞和红色的肌肉中，即各类血制品、红肉和肝脏","贫血的患者应首先选择补充血红素铁","主要存在于菠菜等植物中"],"a":[0,1,2,3],"e":"血红素铁的吸收率比较高。此种类型的铁既不受植酸等抑制因素的影响，也不受维生素C等促进因素的影响，所以我们会建议贫血的患者首先选择补充血红素铁。血红素铁存在于红细胞和红色的肌肉中，也就是各类血制品，比如鸭血、血豆腐，以及红肉和肝脏。"},{"q":"为什么素食者容易贫血？","o":["铁离子必须与蛋白质等有机物结合才能被吸收","蛋白质普遍存在于肉、蛋、奶等荤腥中","植物中的铁是非血红素铁，菠菜中的植酸、草酸、鞣酸可与非血红素铁形成不溶性的铁盐而阻止铁的吸收","植物中的铁含量比动物高得多"],"a":[0,1,2],"e":"铁离子必须与蛋白质等有机物结合才能被吸收，而蛋白质普遍存在于肉、蛋、奶等荤腥中，所以吃素的人很容易贫血。……因为植物中的铁是非血红素铁，菠菜中的植酸、草酸、鞣酸等可与非血红素铁形成不溶性的铁盐而阻止铁的吸收，所以植物中的铁吸收利用率比较低。"},{"q":"关于“024”的含义，正确的有？","o":["0就是没有腿的鱼要多吃","2就是鸡鸭这样的禽类排第二位吃","最后才选择四条腿的猪、牛、羊","红肉和鱼肉的摄入比例调整为1∶1，贫血的人红肉甚至要更多些","0代表零脂肪"],"a":[0,1,2,3],"e":"我们经常提到的“024”是什么意思呢？0就是没有腿的鱼要多吃，2就是鸡鸭这样的禽类排第二位吃，最后才选择四条腿的猪、牛、羊，但是希望以后大家可以做到将红肉和鱼肉的摄入比例调整为1∶1，对贫血的人来讲红肉甚至要更多些。"},{"q":"影响铁吸收的药物、胃酸和维生素因素包括？","o":["碱性药物可使非血红素铁形成难溶的氢氧化铁，阻碍铁的吸收","服用碳酸氢钠或者抑酸药升高胃酸pH值，容易引起缺铁性贫血","维生素C与铁同吃会促进铁的吸收，它是铁吸收的助力剂","维生素C会阻碍铁的吸收"],"a":[0,1,2],"e":"碱性药物可使非血红素铁形成难溶的氢氧化铁，阻碍铁的吸收。比如一些人有反酸症状时常常服用碳酸氢钠或者抑酸药，升高胃酸的pH值……这样容易引起缺铁性贫血。维生素C与铁同吃也会促进铁的吸收，它是铁吸收的助力剂。"},{"q":"关于锌在人体内的含量与分布，正确的有？","o":["成人体内含锌2～2.5克","主要分布于肌肉、骨骼、皮肤","眼组织的视网膜、脉络膜、前列腺以及精液中也有分布","人体内的锌主要从肠道、泌尿系统和汗腺排出","锌主要集中在血液中"],"a":[0,1,2,3],"e":"成人体内含锌2～2.5克，主要分布于肌肉、骨骼、皮肤，眼组织的视网膜、脉络膜、前列腺以及精液中。……人体内的锌主要从肠道、泌尿系统和汗腺排出。"},{"q":"锌的作用包括？","o":["促进生长发育和组织再生，对伤口愈合、毛发、指甲及口腔黏膜有修补作用","可以调节基因表现，维持味觉功能与促进食欲","促进胰岛素的正常分泌","支持增强大脑记忆系统","影响体内维生素A的代谢，参与机体的免疫功能","是酵素的重要组成成分","缺锌最典型的表现是夜盲症"],"a":[0,1,2,3,4,5],"e":"锌的作用非常重要……因为它能促进生长发育和组织再生，对伤口愈合、毛发、指甲及口腔黏膜等多处部位有修补作用，并且可以调节基因表现，维持味觉功能与促进食欲，促进胰岛素的正常分泌，支持增强大脑记忆系统，影响体内维生素A的代谢，参与机体的免疫功能，还是酵素的重要组成成分。"},{"q":"锌缺乏的表现包括？","o":["生长发育迟缓、食欲不振","味觉减退甚至异食癖，比如吃土、吃墙皮","性成熟推迟、第二性征发育不全、性机能低下","创伤不易愈合，免疫功能降低，易于感染","孕妇缺锌还会导致胎儿畸形","胰岛素功能减退也与锌元素缺乏有关","皮肤角化呈小疙瘩状"],"a":[0,1,2,3,4,5],"e":"锌缺乏的表现有很多，如生长发育迟缓、食欲不振、味觉减退甚至异食癖（吃一些很怪的东西，比如吃土、吃墙皮）等，还有性成熟推迟、第二性征发育不全、性机能低下。不仅如此，如果人体缺乏锌元素，创伤则不易愈合，免疫功能也会降低，易于感染。如果孕妇缺锌，还会导致胎儿畸形。另外，胰岛素功能减退也与锌元素缺乏有关。"},{"q":"关于含锌食物与吸收率，正确的有？","o":["锌主要存在于动物性食物中，含量最高的是牡蛎","其次是动物内脏，再者是牛、猪、羊肉","肉类中锌的吸收率高达30%～40%","植物性食物中的锌的吸收率一般只有10%～20%","豆类、粮食、蔬菜、水果中锌含量则很低","水果是锌含量最高的食物"],"a":[0,1,2,3,4],"e":"锌主要存在于动物性食物中，含量最高的是牡蛎，其次是动物内脏，再者是牛、猪、羊肉，蛋类也不错，豆类、粮食、蔬菜、水果中锌含量则很低。动物性食物中锌不仅含量高，而且吸收率也比植物性食品高，如肉类中锌的吸收率高达30%～40%，而植物性食物中的锌的吸收率一般只有10%～20%。"},{"q":"关于补锌的注意事项，正确的有？","o":["锌是微量元素，人体每天的需求量不到15毫克","锌由肾和汗腺排出","如果吃太多补锌的保健品，锌会在肾脏沉积，造成肾损伤","经常吃一些动物性食品，尤其牡蛎之类的海产品，不会缺锌而且也不易过量","锌摄入越多越好"],"a":[0,1,2,3],"e":"锌是微量元素，人体每天的需求量不到15毫克。有的人以为锌摄入越多越好，大家千万别忘了，锌是由肾和汗腺排出的，如果吃太多补锌的保健品，锌会在肾脏沉积，造成肾损伤。所以经常吃一些动物性食品，尤其牡蛎之类的海产品，不会缺锌而且也不易过量，不会造成身体负担。"},{"q":"影响锌吸收的膳食因素包括？","o":["植酸、膳食纤维妨碍锌的吸收","过多的铜、镉、钙和亚铁离子妨碍锌的吸收","维生素D、柠檬酸盐有利于锌的吸收","维生素D会妨碍锌的吸收"],"a":[0,1,2],"e":"锌的吸收会受到很多因素的影响，膳食因素中的植酸、膳食纤维以及过多的铜、镉、钙和亚铁离子等会妨碍锌的吸收，而维生素D、柠檬酸盐等则有利于锌的吸收。"},{"q":"关于碘在人体内的含量与分布，正确的有？","o":["成人体内约含碘20～50毫克","其中50%分布在肌肉，20%分布在甲状腺","10%分布在皮肤，6%分布在骨骼","其余存在于其他内分泌腺及中枢神经系统","血液中的碘主要为蛋白结合碘（PBI），含量为40～80微克／升","碘主要集中在血液中"],"a":[0,1,2,3,4],"e":"成人体内约含碘20～50毫克，其中50%分布在肌肉，20%分布在甲状腺，10%分布在皮肤，6%分布在骨骼，其余存在于其他内分泌腺及中枢神经系统。血液中的碘主要为蛋白结合碘（PBI），含量为40～80微克／升。"},{"q":"甲状腺素的生理功能包括？","o":["维持和调节机体的代谢，促进生长发育","促进生物氧化，协调氧化磷酸化过程，调节能量的转化","对蛋白质、碳水化合物、脂肪的代谢以及水盐代谢都有重要影响","直接运输氧气"],"a":[0,1,2],"e":"甲状腺素的生理功能是维持和调节机体的代谢，促进生长发育。它能促进生物氧化，协调氧化磷酸化过程，调节能量的转化，并且对蛋白质、碳水化合物、脂肪的代谢以及水盐代谢都有重要影响。"},{"q":"关于甲状腺与碘，正确的有？","o":["甲状腺摄碘能力最强，甲状腺碘含量为血浆的25倍以上","可用于合成甲状腺素（T4）和三碘甲状腺原氨酸（T3）","并与甲状腺球蛋白结合而储存","甲状腺素被分解代谢后，部分碘被重新利用，其余碘主要经肾脏排出体外","甲状腺的碘含量低于血浆"],"a":[0,1,2,3],"e":"甲状腺摄碘能力最强，因此甲状腺碘含量为血浆的25倍以上，可用于合成甲状腺素（T4）和三碘甲状腺原氨酸（T3），并与甲状腺球蛋白结合而储存。甲状腺素被分解代谢后，部分碘被重新利用，其余碘主要经肾脏排出体外。"},{"q":"缺碘会导致？","o":["甲状腺素分泌不足","生物氧化过程受到抑制，基础代谢率降低","甲状腺代偿性增生、肥大，出现甲状腺肿，多见于青春期、妊娠期和哺乳期","胎儿期和新生儿期缺碘还可引起呆小症，又称克汀病","甲状腺功能亢进"],"a":[0,1,2,3],"e":"缺碘会使甲状腺素分泌不足，生物氧化过程受到抑制，基础代谢率降低，并可引起甲状腺代偿性增生、肥大，出现甲状腺肿，多见于青春期、妊娠期和哺乳期。胎儿期和新生儿期缺碘还可引起呆小症，又称克汀病。"},{"q":"呆小症（克汀病）患儿的表现包括？","o":["生长停滞","发育不全","智力低下、聋哑","形似侏儒","身材异常高大"],"a":[0,1,2,3],"e":"患儿表现为生长停滞、发育不全、智力低下、聋哑，形似侏儒。"},{"q":"关于碘缺乏的地区性特点，正确的有？","o":["称为地方性甲状腺肿","内陆山区的土壤和水中含碘较少，属于碘缺乏比较高发的地区","长期大量摄入含碘高的食物以及摄入过量的碘剂，均可致高碘性甲状腺肿","沿海地区是碘缺乏高发区"],"a":[0,1,2],"e":"碘缺乏常具有地区性特点，称为地方性甲状腺肿。内陆山区的土壤和水中含碘较少，食物中碘的含量不高，属于碘缺乏比较高发的地区。如果长期大量摄入含碘高的食物，以及摄入过量的碘剂，均可致高碘性甲状腺肿。"},{"q":"关于碘的供给量与来源，正确的有？","o":["我国建议成人每日膳食中碘的供给量为150微克","孕妇和哺乳期女性为200微克","含碘较多的食物是海产食物，如海带、紫菜、海发菜、贻贝、海参、干贝、海鱼、海虾、蚶等","淡水鱼是含碘最多的食物"],"a":[0,1,2],"e":"我国建议每日膳食中碘的供给量为成人150微克，孕妇和哺乳期女性为200微克。含碘较多的食物是海产食物，如海带、紫菜、海发菜、贻贝、海参、干贝、海鱼、海虾、蚶等。"},{"q":"矿物质平衡小结提出的要点包括？","o":["矿物质必须来自外界，不注意摄入就很容易缺乏","矿物质在人体中的含量不到5%，但人体的几乎所有重要功能都会涉及","从食物中摄取的矿物质一般不会中毒；通过药品补充的微量元素短时间摄入过多易中毒，甚至成为潜在的致癌物质","注意食物中植物性与动物性矿物质的差别，来自动物类食物中的矿物质更好吸收","矿物质可以在人体内自行合成"],"a":[0,1,2,3],"e":"第一，矿物质因为必须来自外界，所以如果不注意摄入就很容易缺乏，需要重视。第二，矿物质在人体中的含量不到5%，但是人体的几乎所有重要功能都会涉及，必须重视。第三……第四，注意食物中植物性与动物性矿物质的差别……相对来说，来自动物类食物中的矿物质更好吸收。"},{"q":"关于微量元素，正确的有？","o":["指的是占生物体总质量的0.01%以下且为生物体所必需的一些元素","如铁、硅、锌、铜、碘、溴、硒、锰等","人体所需的微量元素大多都能在食物中找到","微量元素只能通过药品补充"],"a":[0,1,2],"e":"微量元素指的就是占生物体总质量的0.01%以下且为生物体所必需的一些元素，如铁、硅、锌、铜、碘、溴、硒、锰等。人体所需的微量元素大多都能在食物中找到。"},{"q":"作者对给孩子补充微量元素的观点是？","o":["家长要做的不是去药店，而是平时多下厨房","一瓶补铁的口服液其铁元素含量不见得比一根鸡腿的铁含量多","鸡肉中的铁是血红素铁，很容易被人体吸收利用","应多买补铁口服液给孩子喝"],"a":[0,1,2],"e":"一瓶补铁的口服液其铁元素含量不见得比一根鸡腿的铁含量多，而且鸡肉中的铁是血红素铁，很容易被人体吸收利用。所以，给孩子补充微量元素，家长要做的不是去药店，而是平时多下厨房。"},{"q":"关于膳食纤维，正确的有？","o":["多年前人们认为它是食物中最“没营养”的成分","随着营养学的发展，人们越来越重视膳食纤维在平衡膳食中的作用","蔬菜里的维生素、矿物质和水在肠道被吸收后，余下的就是膳食纤维","膳食纤维在小肠中被人体直接吸收利用"],"a":[0,1,2],"e":"很多年前，人们对膳食纤维的认识还有偏颇，认为它是食物中最“没营养”的成分。这些年随着营养学的发展，人们越来越重视膳食纤维在平衡膳食中的作用。蔬菜里的维生素、矿物质和水在肠道被吸收，进入血液，余下的是什么？是膳食纤维。它穿过小肠，来到了大肠。"},{"q":"关于可溶性膳食纤维，正确的有？","o":["在肠道中能够被细菌发酵分解","是肠道细菌的食物，可促进细菌的繁殖，增加粪便中的细菌数量","包括胶质、树脂、菊粉、低聚糖等","主要存在于水果、蔬菜、海带、紫菜及豆类中","主要存在于粗粮和豆类种子的外皮中"],"a":[0,1,2,3],"e":"在肠道中能够被细菌发酵分解的膳食纤维称为可溶性膳食纤维，它们是肠道细菌的食物，可促进细菌的繁殖，增加粪便中的细菌数量。这种可溶性膳食纤维包括胶质、树脂、菊粉、低聚糖等，主要存在于水果、蔬菜、海带、紫菜及豆类中。"},{"q":"关于非可溶性膳食纤维，正确的有？","o":["不易被细菌发酵，穿肠而过","可以促进肠蠕动，加速粪便的排泄","包括纤维素、半纤维素、木质素、抗性淀粉等","主要存在于粗粮、豆类种子的外皮、植物的茎和叶中","主要存在于水果的果肉中"],"a":[0,1,2,3],"e":"还有一类膳食纤维不能被细菌发酵，穿肠而过，可以促进肠蠕动，加速粪便的排泄。它不易被细菌发酵，包括纤维素、半纤维素、木质素、抗性淀粉等，主要存在于粗粮、豆类种子的外皮、植物的茎和叶中。"},{"q":"膳食纤维的四大功能包括？","o":["有利于通便","有利于减肥","有利于预防结肠癌","有利于降低餐后血糖","有利于提高食物的能量密度"],"a":[0,1,2,3],"e":"膳食纤维的四大功能说起来，会让很多人眼前一亮……第一，有利于通便。第二，有利于减肥。第三，有利于预防结肠癌。第四，有利于降低餐后血糖。"},{"q":"膳食纤维为什么有利于预防结肠癌？","o":["益生菌的增加具有保护肠道黏膜和滋养结肠的功效","可以抑制致病菌对结肠黏膜的伤害","当结肠细菌得不到可溶性膳食纤维时，会造成益生菌减少，结肠癌的发生率增加","膳食纤维能直接杀死结肠癌细胞"],"a":[0,1,2],"e":"第三，有利于预防结肠癌。益生菌的增加具有保护肠道黏膜和滋养结肠的功效，并且可以抑制致病菌对结肠黏膜的伤害。当结肠细菌得不到可溶性膳食纤维时，会造成益生菌减少，结肠癌的发生率增加。"},{"q":"为什么糖尿病人要多吃蔬菜、薯类这些含膳食纤维多的食物？","o":["膳食纤维会减缓食物的吸收速度","有利于减缓血糖上升的速度","膳食纤维能直接分解血糖","膳食纤维能刺激胰岛素分泌"],"a":[0,1],"e":"第四，有利于降低餐后血糖。膳食纤维会减缓食物的吸收速度，因此有利于减缓血糖上升的速度，所以糖尿病人要多吃一些蔬菜、薯类这些含膳食纤维多的食物。"},{"q":"膳食纤维摄入过多会怎样？","o":["主要出现在减肥人群中，因为食用这样的食物可以增加饱腹感","长期这样会造成身体中其他重要营养素的缺乏","容易造成营养不良，严重者会因为缺乏人体必需的营养素而生病","会让人迅速发胖"],"a":[0,1,2],"e":"摄入过多主要出现在减肥人群中……许多人通过多摄入膳食纤维的方法瘦身，吃蔬菜和水果再加上各种膳食纤维。的确，这样很快就会瘦下去，但是长期这样会造成身体中其他重要营养素的缺乏。也就是说，如果只想着给细菌吃饭，却忽略了自己身体细胞的需求，容易造成营养不良，严重者会因为缺乏人体必需的营养素而生病。"},{"q":"现在人们容易出现膳食纤维缺乏的饮食原因包括？","o":["吃细粮较多，肉类较以前也增加许多","粮食类只选择米饭、馒头，或者面包、面条","吃菜少","吃水果时还削皮","每天吃大量粗粮"],"a":[0,1,2,3],"e":"现在人们吃细粮较多，肉类较以前也增加许多。一些人的日常饮食中粮食类只选择米饭、馒头，或者面包、面条，吃菜少，吃水果时还削皮，大大减少了对膳食纤维的摄入，非常容易出现腹胀，肥胖，血糖高，大便干，或者大便黏的症状。"},{"q":"膳食纤维缺乏容易出现的症状包括？","o":["腹胀","肥胖、血糖高","大便干，或者大便黏","夜盲症"],"a":[0,1,2],"e":"非常容易出现腹胀，肥胖，血糖高，大便干，或者大便黏的症状。"},{"q":"那位32岁男性患者（120千克）的情况包括？","o":["血糖高，一直在打胰岛素","食欲极好，特别喜欢追求口味","偏爱吃各种粮食类食物，米饭一天能吃500克","把土豆、黄瓜和西红柿当作蔬菜","大便4～5天一次，需要经常使用各种排便的药","他平时喝酒吸烟很多"],"a":[0,1,2,3,4],"e":"我曾经接诊过一位患者，男性，32岁，体重为120千克。他血糖高，一直在打胰岛素。……他不喝酒，不吸烟，日常工作中体力活动不多，在家里又没有特意去锻炼。但是他的食欲极好，特别喜欢追求口味……他偏爱吃各种粮食类食物，比如米饭一天能吃500克（1斤）。问及蔬菜，他说他可爱吃蔬菜了，比如土豆、黄瓜和西红柿……他说：“大便这件事对我来说太难，太痛苦。如果不用药，4～5天一次，所以我经常使用各种排便的药。”"},{"q":"关于膳食纤维的建议摄入量与实际摄入量，正确的有？","o":["《中国居民膳食指南（2016）》要求中国成年人每天应摄入膳食纤维25～35克","目前中国人平均摄入量仅为13.3克，存在严重不足","美国人平均每人每天膳食纤维摄入量只有4～6克，所以美国人结肠癌的发生率很高","中国人的膳食纤维摄入量已远超标准"],"a":[0,1,2],"e":"《中国居民膳食指南（2016）》要求中国成年人每天应摄入膳食纤维25～35克，而目前中国人平均摄入量仅为13.3克，存在严重不足，而且这种情况越来越紧迫。美国人在这方面问题更严重，平均每人每天膳食纤维摄入量只有4～6克，所以美国人结肠癌的发生率很高。"},{"q":"膳食纤维主要存在于哪里？","o":["主要存在于蔬菜、水果中","精米、精面中很少","肉、鱼、奶中没有","主要存在于肉、鱼、奶中"],"a":[0,1,2],"e":"膳食纤维主要存在于蔬菜、水果中，精米、精面中很少，肉、鱼、奶中没有。"},{"q":"关于不同蔬菜的膳食纤维含量，正确的有？","o":["瓜类、茎类蔬菜含水量高，膳食纤维含量并不高","100克西红柿中膳食纤维只有0.5克","大家还是尽量选择叶菜类和菇类蔬菜","紫菜、海带的膳食纤维是在晒干状态下计算的，水泡发之后含量会大打折扣","西红柿的膳食纤维含量在所有蔬菜中最高"],"a":[0,1,2,3],"e":"蔬菜中膳食纤维的计算方式是指100克新鲜蔬菜里的膳食纤维含量。其中，瓜类、茎类蔬菜含水量高，膳食纤维含量并不高，100克西红柿中膳食纤维只有0.5克……因此大家还是尽量选择叶菜类和菇类蔬菜。有一些属于蔬菜但不是新鲜蔬菜的菜类，比如紫菜、海带，计算膳食纤维的时候是在晒干的状态下去计算的，经过水泡发之后，含量也会大打折扣。"},{"q":"作者对蔬菜水果摄入的具体建议有？","o":["每个人一天最好吃1斤蔬菜，其中叶菜最好占一半","水果最好是连皮吃，这样膳食纤维可以多吃一些","主食应选择全谷类、薯类、根茎类食物","少吃精米、精面和精面加工制品，比如面包、蛋糕、饼干等","水果最好削皮吃"],"a":[0,1,2,3],"e":"所以，我们每个人一天最好吃1斤蔬菜，其中叶菜最好占一半。水果最好是连皮吃，这样膳食纤维可以多吃一些。主食应选择全谷类、薯类、根茎类食物，少吃精米、精面和精面加工制品，比如面包、蛋糕、饼干等。"},{"q":"作者在门诊调查中发现的膳食纤维摄入情况有？","o":["十有八九的人膳食纤维不足","吃蔬菜每天250克以上的人不到一半","大概有一半人做不到每天吃水果","就这一半吃水果的人，大部分还把水果皮削了","所有人都能保证每天吃够蔬菜和水果"],"a":[0,1,2,3],"e":"我在门诊做了些调查，十有八九的人膳食纤维不足，吃蔬菜每天250克以上的人不到一半，大概有一半人做不到每天吃水果，就这一半吃水果的人，大部分还把水果皮削了。"},{"q":"关于水在人体内的作用，正确的有？","o":["人的身体中60%左右都是水","细胞的新陈代谢、微循环中的物质交换都是在水溶液中进行的","水可以调节体温，运送营养和氧气，排出废物和毒素","水可以润滑和保护组织器官","水是三大产能营养素之一"],"a":[0,1,2,3],"e":"人的身体中60%左右都是水，细胞的新陈代谢、微循环中的物质交换都是在水溶液中进行的。在人体内，水还可以调节体温，运送营养和氧气，排出废物和毒素，润滑和保护组织器官。"},{"q":"人体每日摄水量约2500毫升，其来源包括？","o":["饮水，包括白开水、矿泉水、饮料、茶水，大概有1200毫升","食物，比如萝卜、西红柿、米饭、汤、粥，大约有1000毫升","物质代谢，葡萄糖在线粒体内产生能量的同时会产生水，大约为300毫升","呼吸吸入的水，约500毫升"],"a":[0,1,2],"e":"一个人每日的摄水量总和约为2500毫升，来源有3个：第一，饮水。包括各种各样的水，比如白开水、矿泉水、饮料、茶水，大概有1200毫升。第二，食物……大约有1000毫升。第三，物质代谢。葡萄糖在线粒体内产生能量的同时会产生水，这些水可以被人体再利用，大约为300毫升。"},{"q":"在标准室温20℃左右，水的输出渠道包括？","o":["肾脏，以尿液的形式排出，一天一般是1500毫升左右","呼吸，每天大约350毫升","皮肤，一般一天会通过皮肤蒸发掉500毫升水分","大便，每天排出150毫升水分","头发和指甲，每天约200毫升"],"a":[0,1,2,3],"e":"在标准室温20℃左右，水的输出总和同样约为2500毫升，渠道有4个：第一，肾脏……一天一般是1500毫升左右。第二，呼吸……每天大约350毫升。第三，皮肤……一天会通过皮肤蒸发掉500毫升水分。第四，大便。人每天通过大便排出150毫升水分。"},{"q":"关于人体缺水程度与表现，正确的有？","o":["缺水量达到体重的2%时，会感到口渴","到10%时，会烦躁无力，体温升高，血压下降","达到20%就会有生命危险","缺水量达到1%就会有生命危险"],"a":[0,1,2],"e":"当人体中缺水量达到人体体重的2%时，会感到口渴；到10%时，会烦躁无力，体温升高，血压下降；达到20%就会有生命危险。"},{"q":"哪些人要注意水是否摄入过多？","o":["肾功能不全的人","心功能不好的人","体内水多了会加重心、肾的负担","运动中出汗多的人"],"a":[0,1,2],"e":"只有在某些特殊疾病情况下，才要注意水的摄入。比如肾功能不全的人、心功能不好的人要注意水是否摄入过多，因为体内水多了会加重心、肾的负担；而脑缺血、运动中出汗多的人，要注意水是否摄入过少，因为他们正是最需要水的人群。"},{"q":"哪两类人正是最需要水的？","o":["脑缺血的人","运动中出汗多的人","肾功能不全的人","心功能不好的人"],"a":[0,1],"e":"而脑缺血、运动中出汗多的人，要注意水是否摄入过少，因为他们正是最需要水的人群。"},{"q":"那位50多岁男性突发脑血栓的经过包括？","o":["7月去南方出差，和同事一起爬山，出了很多汗","虽然已经很渴，但依然不肯停下来喝水","在离山顶还有300米时，左腿无力，紧接着左胳膊也抬不起来","一检查是脑血栓","他是在家里休息时突然发病的"],"a":[0,1,2,3],"e":"有一年7月，他去南方出差，和几位同事一起爬山。争强好胜的他不肯落后，出了很多汗，气喘吁吁，仍然保持在队伍的前列。当时为了赶时间，他虽然已经很渴，但依然不肯停下来喝水……可就在离山顶还有300米的时候，他的左腿开始变得无力，紧接着左胳膊也抬不起来了……一检查是脑血栓。"},{"q":"这位50多岁男性发生脑血栓的机制包括？","o":["气温高、运动量大、出汗多，造成血容量不足","血管内压力比较低，人体最高处处于缺血状态","右侧大脑中动脉与前动脉分布区的交界处（额顶部皮层）有明显的缺血灶","他本身有严重的高血压和糖尿病"],"a":[0,1,2],"e":"这个部位是全身最高处，也就是说当时由于气温高、运动量大、出汗多，造成了他血容量不足，血管内压力比较低，人体最高处处于缺血状态。后来我看了他的CT和核磁片子，在右侧大脑中动脉与前动脉分布区的交界处（额顶部皮层）有个明显的缺血灶。……平时身体还好，血压正常，血糖正常。"},{"q":"关于血液与缺水，正确的有？","o":["一个正常人血管里的血液大概有5升左右","其中将近一半是红细胞、白细胞、血小板，剩下的是血浆","血浆中90%是水","缺水时血浆总量首先会减少，从而引起血容量减少和血液黏度增加","缺水会使血液黏度降低"],"a":[0,1,2,3],"e":"一个正常人血管里的血液大概有5升左右，其中将近一半是红细胞、白细胞、血小板，剩下的是血浆。血浆中90%是水，如果缺水，血浆总量首先会减少，从而引起血容量减少和血液黏度增加。"},{"q":"为什么大脑的两个血管交界区容易发生缺血？","o":["是两个大血管之间的小血管集中部位","人运动时血管中液体量少，压力达不到顶部","血液黏度高","该部位血管特别粗大"],"a":[0,1,2],"e":"人运动时，如果血管中液体量少，压力达不到顶部，黏度又高，大脑的两个血管交界区是两个大血管之间的小血管集中部位，就很容易发生缺血。"},{"q":"作者对那位脑血栓患者的建议是？","o":["病因很清楚，只是缺水","以后不再出现类似缺水的情况就可以了","注意补水，补营养，经常运动","需要长期服用活血药"],"a":[0,1,2],"e":"我告诉他，病因很清楚，只是缺水，以后不再出现类似缺水的情况就可以了。注意补水，补营养，经常运动，他就不会出现类似的症状。"},{"q":"关于正常人的饮水量，正确的有？","o":["正常情况下，普通人每天应该饮水1200～1500毫升","天热时要注意多喝水","排汗多或者运动较多的人也要多喝水","中国人喜欢喝粥、喝汤、吃热汤面，单纯从饮水中获得的水可以相应减少","所有人都必须每天喝8杯水"],"a":[0,1,2,3],"e":"正常情况下，普通人每天应该饮水1200～1500毫升，但是天热时要注意多喝水，排汗多或者运动较多的人也要多喝水。中国人喜欢喝粥、喝汤、吃热汤面，这样能在饮食中摄入较多的水分，那么单纯从饮水中获得的水可以相应减少。"},{"q":"判断饮水量是否合适，主要观察哪两项指标？","o":["看自己渴不渴","观察尿液的颜色和排尿量","体重变化","血压高低"],"a":[0,1],"e":"怎么判断自己一天的饮水量是否合适呢？主要观察两项指标：一个是看自己渴不渴……另一个是观察尿液的颜色和排尿量。"},{"q":"关于口渴与饮水，正确的有？","o":["渴了才喝水是不对的","饮水量合适的情况下，人是不应该感觉口渴的","口渴说明身体正常","口渴时应立即大量饮水"],"a":[0,1],"e":"一个是看自己渴不渴，渴了才喝水是不对的。饮水量合适的情况下，人是不应该感觉口渴的。"},{"q":"关于正常尿液，正确的有？","o":["正常情况下尿液是淡黄色的","一天的排尿量是1500毫升左右","一般3～4小时排尿一次","如果半天不想上厕所，或者排出的尿液是深黄色的，说明饮水量不足","尿液像水一样清说明喝水过多","正常的排尿频率是每10分钟一次"],"a":[0,1,2,3,4],"e":"另一个是观察尿液的颜色和排尿量。正常情况下尿液是淡黄色的，一天的排尿量是1500毫升左右，一般3～4小时排尿一次。如果半天不想上厕所，或者排出的尿液是深黄色的，那就说明饮水量不足了；反之，如果频频如厕，且尿液像水一样清，那就喝得有些过多了。"},{"q":"关于每天喝多少水的结论，正确的有？","o":["到底是8杯水还是12杯水，这是因人而异的","没有放之四海而皆准的数量","作者的回答是看自己的口渴感觉，看自己尿的颜色和排尿频率","必须严格每天8杯水"],"a":[0,1,2],"e":"可是到底是8杯水还是12杯水，这是因人而异的，没有放之四海而皆准的数量。我的回答很简单：看自己的口渴感觉，看自己尿的颜色和排尿频率。"},{"q":"人类每一天身体的输出（按基因赋予的任务执行）包括？","o":["能量输出","新陈代谢","修复自身结构","免疫防卫","主动增殖器官"],"a":[0,1,2,3],"e":"人类每一天身体的输出都是按照基因赋予我们的任务去执行，包括四个方面：能量输出、新陈代谢、修复自身结构和免疫防卫。"},{"q":"关于吸烟与抗氧化剂，正确的有？","o":["吸烟的人身体中自由基过多，要多补充抗氧化剂去对抗自由基","最常见的抗氧化剂是维生素A、C、E","吸烟的人摄入维生素A、C、E要比一般人多一些","很多吸烟的人特别不喜欢吃水果，对身体的伤害大，得病的概率就高","吸烟的人应减少维生素A、C、E的摄入"],"a":[0,1,2,3],"e":"也有一些需要额外消耗的事情，比如吸烟的人身体中自由基过多，要多补充抗氧化剂去对抗自由基。最常见的抗氧化剂是维生素A、C、E，所以吸烟的人摄入维生素A、C、E要比一般人多一些。但是我们往往看到很多吸烟的人特别不喜欢吃水果，于是，身体内自由基多，对身体的伤害大，得病的概率就高。"},{"q":"关于生命原料的输入与睡眠，正确的有？","o":["一个人每天的生命原料输入只有一个渠道，就是吃","通过每一餐摄取大自然的营养素来满足自己身体输出的需求","睡眠是让身体放松，给自身身体一个用营养素来修复的时间","睡眠也是营养素的一个输入渠道"],"a":[0,1,2],"e":"一个人每天的生命原料输入只有一个渠道，就是吃，通过每一餐摄取大自然的营养素来满足自己身体输出的需求。睡眠是让身体放松，给自身身体一个用营养素来修复的时间。"},{"q":"关于身体状况的高平衡与低平衡，正确的有？","o":["运动多，思考多，饮食不挑嘴，荤素通吃，能保持标准体重和旺盛精力，这叫高平衡","不爱运动，也不爱动脑子，每样都吃一点，也是荤素通吃，体重正常，化验正常，但动作总像慢半拍，这叫低平衡","高平衡与低平衡都属于身体状况平衡","低平衡比高平衡更理想","低平衡属于不平衡"],"a":[0,1,2],"e":"人的身体状况平衡可分为两种：高平衡和低平衡。运动多，思考多，饮食不挑嘴，荤素通吃，能够保持标准的体重和旺盛的工作精力，这叫高平衡。不爱运动，也不爱动脑子，吃饭时每样都吃一点，也是荤素通吃，体重正常，化验正常，但是这个人的动作总像是慢半拍，有点与世无争的样子，这叫低平衡。"},{"q":"关于身体状况不平衡，正确的有？","o":["有两种：出大于入和入大于出","在能量方面消耗＞摄入，这个人会比较瘦","在能量方面摄入＞消耗，身材肯定会发胖","出大于入和入大于出都属于高平衡"],"a":[0,1,2],"e":"身体状况不平衡也有两种：出大于入和入大于出。出大于入，即消耗＞摄入：在能量方面消耗＞摄入，这个人会比较瘦。入大于出，即摄入＞消耗：在能量方面摄入＞消耗，身材肯定会发胖。"},{"q":"关于营养素方面的出大于入，正确的有？","o":["消耗＞摄入","长此以往，体内的营养素亏空","各种疾病也会随之而来","体重一定会发胖"],"a":[0,1,2],"e":"在营养素方面消耗＞摄入，长此以往，体内的营养素亏空，各种疾病也会随之而来。"},{"q":"关于营养素方面的入大于出，正确的有？","o":["摄入＞消耗","要看是哪种营养素，以什么方式，摄入时间的长短等","症状的表现形式也会不一样","症状表现完全相同，与营养素种类无关"],"a":[0,1,2],"e":"在营养素方面摄入＞消耗，这就要看是哪种营养素了，以什么方式，摄入时间的长短等，症状的表现形式也会不一样。"},{"q":"关于吃肉多了吃不下，正确的有？","o":["吃不下了，这是人与生俱来的自我调节能力","孩子一出生就有这个自主反射能力，吃奶吃饱了就会立即停止吃奶","是胃里的胃蛋白酶已经饱和，不能再分解蛋白质","肠道的脂肪酶和胆汁饱和，不能再分解脂肪","人的食量完全是主观意愿决定的"],"a":[0,1,2,3],"e":"是呀，吃不下了，这是人与生俱来的自我调节能力。孩子一出生就有这个自主反射能力，吃奶吃饱了，孩子就会立即停止吃奶，安安静静地去睡觉。……当肉吃多了，吃不下的时候，是因为胃里的胃蛋白酶已经饱和，不能再分解蛋白质；肠道的脂肪酶和胆汁饱和，不能再分解脂肪。"},{"q":"关于人体保持总平衡的过程，正确的有？","o":["今天吃顶了，后面几天自然会多吃蔬菜、水果和粮食","又过了几天，胃肠道产生了新的蛋白酶和脂肪酶，又想吃肉了","这样身体才能一直保持总平衡","吃肉吃顶了以后应继续大量吃肉"],"a":[0,1,2],"e":"此时你的感觉是今天吃顶了，于是后面几天自然会多吃蔬菜、水果和粮食。又过了几天，胃肠道产生了新的蛋白酶和脂肪酶，又想吃肉了，于是就可以继续吃肉类，这样身体才能一直保持总平衡。"},{"q":"关于孩子喊着要吃肉、要吃鸡蛋，正确的有？","o":["如果吃得比大人多，而且消化得了，还不积食，人也不胖","说明这段时间他的需求量大，他的消化酶也足够","说明孩子生病了","必须严格控制，不能让他吃"],"a":[0,1],"e":"如果一个孩子喊着要吃肉、要吃鸡蛋，吃得比大人多，而且消化得了，还不积食，人也不胖，说明这段时间他的需求量大，他的消化酶也足够。"},{"q":"关于夏天的食欲变化，正确的有？","o":["夏天大家都特别想吃西瓜，因为身体在说“我需要”","夏天吃羊肉、牛肉少，也是身体在说“我消化不了，秋天再吃吧”","许多人不敢吃这个、不敢吃那个，是主观意识控制了人体的自主反射","身体拥有自己的智慧","夏天的食欲变化完全没有生理依据"],"a":[0,1,2,3],"e":"夏天，大家都特别想吃西瓜，为什么？因为身体在说：“我需要。”夏天吃羊肉、牛肉少，也是身体在说：“我消化不了，秋天再吃吧。”许多人不敢吃这个，不敢吃那个，不是不想吃，是不敢吃，是主观意识控制了人体的自主反射，却忘记了身体拥有自己的智慧。"},{"q":"关于肠道黏膜的营养素调节功能，正确的有？","o":["肠道黏膜铺展开来面积可达200～400平方米","专门负责筛选可以吸收的营养素","能自己判断血液里缺哪种营养素，缺得多的就多吸收，缺得少的就少吸收","各种营养素在不同人不同时期之间的吸收率能差很多倍","肠道黏膜的面积只有2～4平方米"],"a":[0,1,2,3],"e":"肠道黏膜有个特殊功能，叫作营养素的调节功能。肠道黏膜铺展开来面积可达200～400平方米，专门负责筛选可以吸收的营养素。同时它还能自己判断血液里缺哪种营养素，缺得多的就多吸收，缺得少的就少吸收，因此各种营养素在不同人不同时期之间的吸收率能差很多倍。"},{"q":"身体告诉我们吃多了的信号，正确的有？","o":["血糖高了，说明碳水化合物吃多了","尿酸高，说明含嘌呤的食物吃多了","血压高可就不一定，它的影响因素太多了","血糖高说明蛋白质吃多了"],"a":[0,1,2],"e":"还有一些信号会告诉我们吃多了：血糖高了，说明碳水化合物吃多了；尿酸高，说明含嘌呤的食物吃多了；血压高可就不一定，它的影响因素太多了。"}]};var curQ=null,ans={},done=false;function shf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){var b=a.slice();shf(b);return b.slice(0,n);}

curQ.m.forEach(function(x,i){if(ans['m_'+i]&&ans['m_'+i].length>0){n++;sc+=3;}});
document.getElementById('answeredCount').textContent=n;
document.getElementById('scoreDisplay').textContent=Math.min(sc,100);
}
function submitQuiz(){
if(done)return;done=true;
var btn=document.getElementById('submitBtn');
btn.disabled=true;btn.textContent='✅ 已提交';
try{var total=0;var dt=[];
curQ.s.forEach(function(q,i){
var ua=ans['s_'+i]||[];
var ok=ua.length>0&&ua[0]===q.a;
if(ok)total+=1;
var ls=document.querySelectorAll('#o_s_'+i+' label');
var userPick=ua.length>0?String.fromCharCode(65+ua[0])+'. '+q.o[ua[0]]:'(未选)';
var correctAns=String.fromCharCode(65+q.a)+'. '+q.o[q.a];
ls.forEach(function(el,oi){if(oi===q.a)el.classList.add('c');if(ua.length>0&&ua[0]===oi&&oi!==q.a)el.classList.add('w');});
dt.push({t:'s',q:q.q,e:q.e||'',ok:ok,pt:ok?1:0,mp:1,ua:userPick,ca:correctAns});
});
curQ.m.forEach(function(q,i){
var ua=ans['m_'+i]||[];
var hit=0,wrong=false;
if(ua.length>0){ua.forEach(function(v){if(q.a.indexOf(v)!==-1){hit++;}else{wrong=true;}});}
var sc=wrong?0:Math.round(300*hit/Math.max(q.a.length,1))/100;
if(sc>3)sc=3;
total+=sc;
var ls=document.querySelectorAll('#o_m_'+i+' label');
var userPick=ua.length>0?ua.map(function(v){return String.fromCharCode(65+v)+'. '+q.o[v]}).join('; '):'(未选)';
var correctAns=q.a.map(function(v){return String.fromCharCode(65+v)+'. '+q.o[v]}).join('; ');
ls.forEach(function(el,oi){if(q.a.indexOf(oi)!==-1)el.classList.add('c');if(ua.indexOf(oi)!==-1&&q.a.indexOf(oi)===-1)el.classList.add('w');});
dt.push({t:'m',q:q.q,e:q.e||'',ok:sc>=3,pt:sc,mp:3,ua:userPick,ca:correctAns});
});
showResults(total,dt);
}catch(e){alert('提交出错：'+e.message);done=false;btn.disabled=false;btn.textContent='📩 重新提交';}
}
function showResults(total,dt){
document.getElementById('app').style.display='none';
var rb=document.getElementById('resultBox');
rb.style.display='block';rb.classList.add('show');
var pass=total>=70;
var h='';
h+='<div class="result-hdr">';
h+='<div class="big-score'+(pass?'':' w')+'">'+total+'<span style="font-size:18px;font-weight:400;color:#6b7280">/100</span></div>';
h+='<div class="score-label">'+(pass?'🎉 恭喜通过！':'😅 未通过，再接再厉！')+'</div>';
var ss=0,ms=0;
dt.forEach(function(d){if(d.t==='s')ss+=d.pt;if(d.t==='m')ms+=d.pt;});
h+='<div class="score-detail"><span>单选: '+ss+'/40</span><span>多选: '+ms+'/60</span></div>';
h+='</div><div class="analysis-section">';
dt.forEach(function(d,i){
h+='<div class="analysis-item">';
h+='<div class="aq">'+(i+1)+'. '+esc(d.q)+' <span class="'+(d.ok?'correct-txt':'wrong-txt')+'">('+d.pt+'/'+d.mp+'分)</span></div>';
if(d.t==='s'||d.t==='m'){
h+='<div class="ad">你的答案：<span class="user-ans">'+esc(d.ua)+'</span>';
if(!d.ok)h+=' | 正确答案：<span class="corr-ans">'+esc(d.ca)+'</span>';
h+='</div>';
if(d.e)h+='<div class="ex"><div class="ex-t">📖 解析（书本原文）</div><div class="ex-b">'+esc(d.e)+'</div></div>';
}
h+='</div>';
});
h+='</div>';
document.getElementById('resultContent').innerHTML=h;
}
function reshuffle(){render();window.scrollTo(0,0);}
render();
</script></body></html>
