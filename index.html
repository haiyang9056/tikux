olid #dc2626}.ftr{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #dce6dc;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.06)}.ftr-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.ftr-info{font-size:13px;color:#6b7280;line-height:1.4}.ftr-info strong{color:#1a2a1a}.btn{padding:10px 28px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}.btn:active{transform:scale(.97)}.btn-p{background:#1b8a3e;color:#fff}.btn-p:hover{background:#14532d}.btn-p:disabled{opacity:.45;cursor:default}.btn-s{background:#dce6dc;color:#1a2a1a}.btn-s:hover{background:#c8d6c8}.btn-grp{display:flex;gap:8px}.result-box{display:none}.result-box.show{display:block}.result-hdr{text-align:center;padding:28px 16px;background:#fff;border:1px solid #dce6dc;border-radius:12px;margin-bottom:16px}.big-score{font-size:44px;font-weight:800;color:#15803d}.big-score.w{color:#dc2626}.score-label{font-size:14px;color:#6b7280;margin-top:4px}.score-detail{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12px;color:#6b7280;flex-wrap:wrap}.analysis-section{margin-top:14px}.analysis-item{padding:10px;border:1px solid #dce6dc;border-radius:8px;margin-bottom:6px;font-size:12px;line-height:1.5;background:#fff}.analysis-item .aq{font-weight:500;margin-bottom:3px}.analysis-item .ad{color:#4b5563;margin-top:2px;font-size:12px}.analysis-item .ad .user-ans{color:#2563eb}.analysis-item .ad .corr-ans{color:#15803d}.correct-txt{color:#15803d;font-weight:600}.wrong-txt{color:#dc2626;font-weight:600}@media(max-width:480px){body{padding-bottom:140px}.container{padding:8px}.hdr h1{font-size:17px}.ftr-inner{flex-direction:column;gap:6px}.btn{width:100%}.btn-grp{width:100%}.btn-grp .btn{flex:1}.big-score{font-size:36px}}.ex{margin-top:8px;background:#f4faf4;border:1px solid #d5e8d5;border-left:3px solid #1b8a3e;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.7}.ex-t{color:#14532d;font-weight:700;margin-bottom:3px;display:block}.ex-b{color:#334155}</style></head><body><div class="hdr"><h1>你是你吃出来的 · 题库</h1><p>覆盖上册 PART 01、PART 02 全部内容 | 每次抽60题 | 满分100分 | 70分及格</p><div class="stats"><span>📝 单选815题</span><span>📋 多选343题</span></div></div><div class="container" id="app"></div><div class="result-box" id="resultBox"><div class="container" id="resultContent"></div></div><div class="ftr"><div class="ftr-inner"><div class="ftr-info">已答 <strong id="answeredCount">0</strong>/60 | 得分 <strong id="scoreDisplay">0</strong></div><div class="btn-grp"><button class="btn btn-s" onclick="reshuffle()">🔄 重新抽题</button><button class="btn btn-p" id="submitBtn" onclick="submitQuiz()">📩 提交</button></div></div></div><script>var QB = {"singles":[{"q":"国际上关于长寿的标准是，寿命等于成熟期的多少倍？","o":["3～5倍","5～7倍","7～9倍","10倍以上"],"a":1,"e":"国际上有个标准，寿命等于成熟期的5～7倍者为长寿。按照这个说法，长寿之人应该能活到100～175岁。"},{"q":"按照“寿命等于成熟期的5～7倍”这一标准，人应该能活到？","o":["80～100岁","100～175岁","150～200岁","70～90岁"],"a":1,"e":"按照这个说法，长寿之人应该能活到100～175岁。可是到目前为止，全世界还没有任何一个国家的人均寿命能够达到或接近这个标准。"},{"q":"2015年5月发布《世界卫生统计报告（2015）》的机构是？","o":["世界卫生组织","联合国粮农组织","美国医学会","国际红十字会"],"a":0,"e":"2015 年 5 月，世界卫生组织（ WHO ）发布了《世界卫生统计报告（2015）》。"},{"q":"截至2013年，报告中中国人均寿命为？","o":["女性77岁，男性74岁","女性80岁，男性75岁","女性74岁，男性77岁","女性81岁，男性76岁"],"a":0,"e":"中国在此次报告中的人均寿命为：女性77岁，男性74岁。"},{"q":"《世界卫生统计报告（2015）》中人均寿命全世界排名第一的是？","o":["日本","瑞士","美国","澳大利亚"],"a":0,"e":"咱们的邻居日本，人均寿命在全世界排名第一，国民平均寿命为84岁。"},{"q":"报告中美国女性的平均寿命为？","o":["76岁","77岁","81岁","84岁"],"a":2,"e":"该报告上显示美国女性的平均寿命为81岁，男性为76岁，依然超过了我们。"},{"q":"书中指出，过去影响中国人均寿命的主要因素是？","o":["饥饿、战争和各种感染","饮食过于油腻","缺乏运动","熬夜"],"a":0,"e":"过去，影响中国人均寿命的因素主要是饥饿、战争，还有各种感染。另外，产妇死亡、婴幼儿夭折等也是影响平均寿命的因素之一。"},{"q":"一般情况下，当细胞死亡数达到总量的多少时，人就会死亡？","o":["5%","10%","20%","50%"],"a":2,"e":"我们知道，人体是由细胞组成的。一般情况下，当细胞死亡数达到总量的20%时，人就会死亡。"},{"q":"血管内皮细胞的寿命大约是？","o":["1天","3～5天","28天","150天"],"a":0,"e":"比如血管的内皮细胞1天就会死亡；胃黏膜细胞3～5天更替一次；肺表面的细胞寿命是2～3周；皮肤最外面的角质层细胞28天左右就要换新；肝细胞能存活150天左右；心脏细胞更新速度要慢很多，大约需要20年；而大脑细胞一生一世不再更新。"},{"q":"胃黏膜细胞的更替周期是？","o":["1天","3～5天","2～3周","28天"],"a":1,"e":"胃黏膜细胞3～5天更替一次。"},{"q":"肺表面细胞的寿命是？","o":["1天","3～5天","2～3周","28天"],"a":2,"e":"肺表面的细胞寿命是2～3周。"},{"q":"皮肤最外面的角质层细胞大约多久就要换新？","o":["1天","7天","28天","150天"],"a":2,"e":"皮肤最外面的角质层细胞28天左右就要换新。"},{"q":"肝细胞能存活多久？","o":["28天左右","150天左右","1年","20年"],"a":1,"e":"肝细胞能存活150天左右。"},{"q":"心脏细胞的更新速度大约需要？","o":["1年","5年","20年","50年"],"a":2,"e":"心脏细胞更新速度要慢很多，大约需要20年。"},{"q":"关于大脑细胞，下列说法正确的是？","o":["一生一世不再更新","每28天更新一次","每20年更新一次","每150天更新一次"],"a":0,"e":"而大脑细胞一生一世不再更新。"},{"q":"书中给“生病”下的本质定义是？","o":["细胞损伤的速度超过了细胞修复的速度","病毒入侵","器官功能衰竭","基因突变"],"a":0,"e":"人的一生中，体内大部分细胞都在不断更新，通过再生来修复损伤，这一生就是一个细胞不断自我修复的过程。而生病的本质，就是细胞损伤的速度超过了细胞修复的速度。"},{"q":"除了遗传和外因等先天不可抗因素，造成细胞损伤、影响细胞修复的主要因素是？","o":["不健康的心理或不合理的饮食、运动、睡眠等生活方式","年龄增长","气候变化","医疗条件"],"a":0,"e":"答案就是不健康的心理或者不合理的饮食、运动、睡眠等生活方式。"},{"q":"冠心病、高血压、糖尿病、肿瘤、抑郁症等疾病，被医学工作者统一归类为？","o":["慢性非传染性疾病","急性感染性疾病","遗传性疾病","免疫缺陷病"],"a":0,"e":"我们最常见的冠心病、高血压、糖尿病、肿瘤、抑郁症、气管炎、哮喘、慢性肾病等疾病，都是由不恰当的生活方式引起的，医学工作者将这些疾病统一归类为慢性非传染性疾病，简称“慢病”。"},{"q":"据统计，中国每5人中就有几人确诊为慢病患者？","o":["1人","2人","3人","4人"],"a":0,"e":"据统计，中国每5人中就有1人确诊为慢病患者，慢病导致的死亡人数占中国总死亡人数的85%。"},{"q":"慢病导致的死亡人数占中国总死亡人数的？","o":["45%","65%","85%","95%"],"a":2,"e":"慢病导致的死亡人数占中国总死亡人数的85%。"},{"q":"多年来各国阻止慢病发展最主流的方式是？","o":["对抗疗法","生活方式干预","营养治疗","心理疏导"],"a":0,"e":"多年来，很多国家都在想尽办法阻止慢病的发展，其中最主流的方式就是对抗疗法——血压高了用降压药，血糖高了用降糖药，肿瘤长出来了切除，哮喘用抗哮喘药，等等。"},{"q":"书中认为，对抗疗法不适用于慢病的根本原因是？","o":["慢病是行为方式错误造成的，矫正错误行为才是根本","慢病无法诊断","药物价格太高","患者不配合"],"a":0,"e":"治疗方向错了——这种对抗疗法以前是用来针对外来因素给人体造成的疾病。例如外伤，病毒感染导致的疾病，常采用止血、抗炎、抢救和预防接种等方式，但并不适用于慢病。慢病是行为方式错误造成的，矫正错误行为才是根本。"},{"q":"下列不属于书中列举的亚健康状态的是？","o":["易疲劳、疼痛","过敏、咳嗽","便秘、腹泻","骨折、脱臼"],"a":3,"e":"此时会出现一些我们常说的亚健康状态，正是身体向我们发出的求救信号，如易疲劳、疼痛、过敏、咳嗽、便秘、腹泻、血压增高、血糖上升……"},{"q":"书中把心脏搭桥、放支架、溶栓、切除肿瘤等治疗方式评价为？","o":["无奈之举，属于临时抱佛脚","根治手段","最佳选择","预防措施"],"a":0,"e":"心脏搭桥、血管里放支架、溶栓、切除肿瘤……这些快刀斩乱麻的方式其实都是无奈之举，属于临时抱佛脚，而许多人却觉得这就是获得健康的终南捷径。"},{"q":"追根究底，慢病源于？","o":["各种不平衡","单一基因缺陷","细菌感染","一次重大外伤"],"a":0,"e":"追根究底，慢病源于各种不平衡，比如缺乏睡眠、长期吸烟、大量饮酒、不运动或者运动过量、饮食不平衡、压力太大，等等。这种不平衡加速度越快，累加种类越多，得慢病的可能性就越大，而且患病年龄大大提前。"},{"q":"作者把睡眠、运动、吸烟、饮酒、心态与饮食的关系比作？","o":["一个天平","一辆汽车","一座大楼","一条河流"],"a":0,"e":"就如同一个天平，左边有五个砝码——睡眠、运动、吸烟、饮酒、心态，右边只有一个砝码——饮食，左边的错误累加都会要求右边砝码加重。"},{"q":"作者所说的“天平”左边有五个砝码，它们代表的是？","o":["损伤和消耗","修补和补充","营养物质","治疗手段"],"a":0,"e":"左边是损伤和消耗，右边是修补损伤和补充消耗，左边每一项的不正确都是对右边饮食营养补充的挑战。"},{"q":"人体细胞的自我修复能力取决于哪两个主要因素？","o":["与生俱来的细胞生命周期和后天的营养状况","年龄和性别","运动量和睡眠","药物和手术"],"a":0,"e":"人体细胞的自我修复能力取决于两个主要因素，一个是与生俱来的细胞生命周期，另一个是后天的营养状况，即先天因素和后天因素。"},{"q":"先天因素（细胞固有的更新周期）决定了什么？","o":["修复速度","修复质量","损伤程度","免疫强弱"],"a":0,"e":"先天因素（细胞固有的更新周期）决定了修复速度，后天因素（营养状态）决定了修复质量。"},{"q":"后天因素（营养状态）决定了什么？","o":["修复质量","修复速度","细胞寿命","遗传特性"],"a":0,"e":"先天因素（细胞固有的更新周期）决定了修复速度，后天因素（营养状态）决定了修复质量。"},{"q":"当细胞修复速度低于损伤速度时，病情会？","o":["加重","平稳","好转","自愈"],"a":0,"e":"当细胞修复速度低于损伤的速度，病情会加重。"},{"q":"当细胞修复速度等于损伤速度时，病情表现为？","o":["常年拉锯，病情平稳但缠绵不去","迅速恶化","完全康复","时好时坏无规律"],"a":0,"e":"当细胞修复速度等于损伤的速度，病情会常年拉锯，表现为病情平稳，但总也缠绵不去。"},{"q":"下列属于书中举例的“修复速度等于损伤速度”的典型情形是？","o":["糖尿病几十年吃二甲双胍，剂量不增加，血糖基本稳定","突然血压明显升高","支气管炎好转","肾功能衰竭"],"a":0,"e":"例如，一个人患糖尿病几十年，一直吃二甲双胍，剂量不增加，血糖依然能保持基本稳定。"},{"q":"下列哪种情况属于细胞损伤已到无法再修复的程度？","o":["肾功能衰竭、已心肌梗死的组织、脑血栓后坏死的脑组织","轻度高血压","早期胃炎","偶尔失眠"],"a":0,"e":"有些严重损伤是无法再修复的，比如肾功能衰竭、已经心肌梗死的组织、脑血栓之后坏死的脑组织等。"},{"q":"作者对慢病能否预防和治愈的结论是？","o":["慢病是可以预防和治愈的","慢病只能控制不能预防","慢病必然恶化","慢病只能靠手术"],"a":0,"e":"慢病患病时间较长，这实际上给了我们修复自己细胞的机会……换句话说，慢病是可以预防和治愈的。当然这里有一个前提，就是细胞损伤程度还不到无可挽回的情况下。"},{"q":"书中把疾病的发展归结为什么之间的博弈？","o":["细胞损伤和细胞修复","正气和邪气","药物和病菌","基因和环境"],"a":0,"e":"从这个层面讲，我们可以得出如下结论——疾病的发展，就是细胞损伤和细胞修复之间的博弈。"},{"q":"作者提出“食物造就人”，其理由是？","o":["对人体来说，除了吃是摄入，其余种种活动都是消耗输出","人是由食物直接构成的","食物决定基因","不吃就会饿"],"a":0,"e":"有人说上帝造人，但是要我说：食物造就人。因为对人体来说，除了“吃”是摄入，其余种种活动都是消耗输出，比如运动、思考、熬夜，等等。"},{"q":"从临床医学角度，人体所需的营养素准确称为？","o":["七大营养素","三大产能营养素","五大元素","六大类食物"],"a":0,"e":"这些营养，从临床医学角度准确地描述，叫作七大营养素。"},{"q":"下列不属于七大营养素的是？","o":["碳水化合物、蛋白质、脂类","维生素、矿物质","膳食纤维、水","氧气、二氧化碳"],"a":3,"e":"七大营养素，包括：碳水化合物、蛋白质、脂类、维生素、矿物质、膳食纤维、水。【氧气和二氧化碳不属于七大营养素】"},{"q":"碳水化合物又称为？","o":["糖类","脂肪","蛋白","维生素"],"a":0,"e":"碳水化合物（又称为糖类，包括葡萄糖、果糖、麦芽糖、淀粉等）。"},{"q":"下列不属于碳水化合物的是？","o":["葡萄糖、果糖","麦芽糖、淀粉","蔗糖","胆固醇"],"a":3,"e":"碳水化合物（又称为糖类，包括葡萄糖、果糖、麦芽糖、淀粉等）。【胆固醇属于类脂，不是碳水化合物】"},{"q":"蛋白质分为哪两类？","o":["必需氨基酸和非必需氨基酸","脂溶性和水溶性","可溶性和不可溶性","常量元素和微量元素"],"a":0,"e":"蛋白质（分为必需氨基酸和非必需氨基酸）。"},{"q":"脂类分为？","o":["脂肪和类脂","饱和和不饱和","动物性和植物性","必需和非必需"],"a":0,"e":"脂类（分为脂肪和类脂）。"},{"q":"脂肪又叫？","o":["甘油三酯","磷脂","胆固醇","脂肪酸"],"a":0,"e":"脂类（分为脂肪和类脂，脂肪又叫甘油三酯，分为必需脂肪酸和非必需脂肪酸；类脂包括磷脂、胆固醇、胆固醇脂、糖脂）。"},{"q":"下列属于类脂的是？","o":["磷脂、胆固醇、胆固醇脂、糖脂","甘油三酯","葡萄糖","氨基酸"],"a":0,"e":"类脂包括磷脂、胆固醇、胆固醇脂、糖脂。"},{"q":"维生素分为？","o":["脂溶性维生素和水溶性维生素","常量元素和微量元素","必需和非必需","可溶性和不可溶性"],"a":0,"e":"维生素（分为脂溶性维生素和水溶性维生素）。"},{"q":"矿物质分为？","o":["常量元素和微量元素","脂溶性和水溶性","必需和非必需","有机和无机"],"a":0,"e":"矿物质（分为常量元素和微量元素）。"},{"q":"膳食纤维分为？","o":["可溶性膳食纤维和不可溶性膳食纤维","动物性和植物性","长链和短链","必需和非必需"],"a":0,"e":"膳食纤维（分为可溶性膳食纤维和不可溶性膳食纤维）。"},{"q":"准确地说，“平衡膳食”是指？","o":["选择的食物能满足成人和儿童对能量及各种营养素的需求","每天吃够30种食物","荤素各占一半","不挑食不偏食"],"a":0,"e":"准确地说，平衡膳食是指选择的食物能满足成人和儿童对能量及各种营养素的需求。"},{"q":"测基础代谢时，要求室温保持在多少？","o":["15～18℃","20～25℃","26～30℃","18～20℃"],"a":1,"e":"一个人如果躺着不动，室温保持在20～25℃，测出来的能量消耗称为基础代谢。"},{"q":"一般来讲，男性的基础代谢约为？","o":["1000千卡/天左右","1200千卡/天左右","1400千卡/天左右","1800千卡/天左右"],"a":2,"e":"一般来讲，男性为1400千卡／天左右，女性在1300千卡／天左右。"},{"q":"一般来讲，女性的基础代谢约为？","o":["1000千卡/天左右","1100千卡/天左右","1300千卡/天左右","1600千卡/天左右"],"a":2,"e":"一般来讲，男性为1400千卡／天左右，女性在1300千卡／天左右。"},{"q":"用脑越多，越需要多补充的营养素是？","o":["蛋白质、维生素、矿物质，以及胆固醇、磷脂、DHA和EPA","碳水化合物和膳食纤维","水和膳食纤维","糖类和盐"],"a":0,"e":"第二，心理方面。大脑消耗的营养素与肌肉消耗的营养素不一样，用脑越多越需要多补充蛋白质、维生素、矿物质，还有脂类中的胆固醇、磷脂和大家都很关注的DHA和EPA。"},{"q":"熬夜会额外消耗的营养素是？","o":["维生素A、维生素B族、磷脂和蛋白质等","钙和铁","膳食纤维","水和钠"],"a":0,"e":"第三，熬夜。消耗的营养素会更多，如维生素A、维生素B族、磷脂和蛋白质等。"},{"q":"吸烟需要补充更多抗氧化剂，是为了对抗什么？","o":["尼古丁等毒素对人体的伤害","自由基以外的细菌","紫外线","重金属"],"a":0,"e":"第四，吸烟。需要更多的抗氧化剂来对抗尼古丁等毒素对人体的伤害。"},{"q":"喝酒伤肝，需要更多哪些营养素来修复肝脏细胞？","o":["维生素B族和蛋白质","钙和磷","维生素C和铁","膳食纤维和水"],"a":0,"e":"第五，喝酒。伤肝，需要更多的营养素来修复肝脏细胞，如维生素B族和蛋白质。"},{"q":"作者用“量入为出”比喻营养，意思是？","o":["吃进去的食物里所含的营养素等于消耗就基本平衡","吃得越少越好","多吃多消耗","按口味选择食物"],"a":0,"e":"营养要做到“量入为出”，吃进去的食物里所含的营养素如果等于以上这几项的消耗，基本就平衡了。"},{"q":"关于通用食谱，作者的态度是？","o":["不存在，必须因人而异","人人都该照搬","只分男女两版","按季节轮换即可"],"a":0,"e":"这么复杂的问题，有通用的食谱可以解决吗？当然没有，必须因人而异。身高不同，性别不同，所处环境不同，输出的多少必然会有所差异。"},{"q":"关于“每天吃盐不要超过6克”，作者补充说明？","o":["在南方潮湿闷热的地区，尤其是夏天，不能要求一定低于6克","任何地区都必须严格执行","北方可以放宽","夏天应减到3克"],"a":0,"e":"比如，我们现在都提倡低盐，要求每天吃盐不要超过6克。但是，在南方潮湿闷热的地区，尤其是夏天，就不能要求一定要低于6克了。"},{"q":"作者在福建讲课时建议，出汗多的地区可以？","o":["喝汤、吃米线或者面条，甚至可以吃点咸菜","完全不吃盐","只喝白水","多吃水果"],"a":0,"e":"我说，要因人、因地而异，出汗多的地区可以喝汤、吃米线或者面条，甚至可以吃点咸菜，但是北方人以及整天在空调房间里工作不出汗的人就一定要减少盐的摄入。"},{"q":"福建医院的急诊室为什么常来低钠血症的老年患者？","o":["当地潮湿闷热出汗多，加上老年人少盐清淡饮食，钠盐流失而补充不足","老年人喝水太多","老年人肾功能差","当地水质含钠低"],"a":0,"e":"就是因为福建地区潮湿闷热，人们本来就出汗多，再加上许多老年人不习惯家里开空调，而且每天出去运动，随汗液流失的钠盐就多。老年人又讲究要吃少盐清淡的食物，如果不注意及时补充钠盐，人们很容易在大汗后出现低钠血症。"},{"q":"“DHA”俗称？","o":["脑黄金","血管清道夫","植物黄金","生命之泉"],"a":0,"e":"(2) DHA：俗称脑黄金，是一种对人体非常重要的不饱和脂肪酸，属于ω-3不饱和脂肪酸家族中的重要成员。"},{"q":"“EPA”又称？","o":["血管清道夫","脑黄金","植物固醇","辅酶"],"a":0,"e":"(3) EPA：又称血管清道夫，是鱼油的主要成分，是人体必需的几种ω-3脂肪酸之一。"},{"q":"二甲双胍属于哪一类药物？","o":["双胍类口服降血糖药","他汀类降脂药","ACEI类降压药","质子泵抑制剂"],"a":0,"e":"(1) 二甲双胍（guā）：为双胍类口服降血糖药。"},{"q":"把细胞比喻成工厂车间时，细胞膜相当于？","o":["车间的外墙、窗户和门","车间里的机器","车间总指挥","车间中流动的空气"],"a":0,"e":"如果我们把细胞比喻成一个工厂的车间，细胞膜就相当于车间的外墙、窗户和门，细胞器相当于车间里的机器，细胞核里的DNA相当于车间总指挥，细胞质则相当于车间中流动的空气。"},{"q":"把细胞比喻成工厂车间时，细胞器相当于？","o":["车间里的机器","外墙和门","总指挥","流动的空气"],"a":0,"e":"细胞器相当于车间里的机器。"},{"q":"把细胞比喻成工厂车间时，细胞质相当于？","o":["车间中流动的空气","机器","总指挥","窗户"],"a":0,"e":"细胞质则相当于车间中流动的空气。"},{"q":"细胞膜中含量最高的成分是？","o":["磷脂","胆固醇","蛋白质","糖类"],"a":0,"e":"如果把一个人身上所有细胞的膜收集起来进行检测，我们会发现里面实际上主要是三种成分：蛋白质、磷脂、胆固醇。磷脂所占的比例较高，占50%～70%，胆固醇占30%左右，蛋白质占20%左右。"},{"q":"细胞膜中胆固醇所占比例约为？","o":["10%","20%","30%左右","50%～70%"],"a":2,"e":"磷脂所占的比例较高，占50%～70%，胆固醇占30%左右，蛋白质占20%左右。"},{"q":"细胞膜中蛋白质所占比例约为？","o":["10%","20%左右","30%","50%"],"a":1,"e":"磷脂所占的比例较高，占50%～70%，胆固醇占30%左右，蛋白质占20%左右。还有一点糖类物质，如糖蛋白或糖脂，占膜重的2%～10%。"},{"q":"细胞膜中糖类物质（糖蛋白或糖脂）占膜重的？","o":["2%～10%","10%～20%","20%～30%","30%以上"],"a":0,"e":"还有一点糖类物质，如糖蛋白或糖脂，占膜重的2%～10%。"},{"q":"细胞膜上的蛋白质根据什么的指示，决定对哪些营养素实行开放政策？","o":["DNA","血糖水平","激素","神经信号"],"a":0,"e":"细胞膜上的蛋白质根据DNA的指示决定对哪些营养素实行开放政策，这些被批准的营养素一定是有助于修复细胞结构或者细胞代谢的营养成分，比如氨基酸、葡萄糖、钾、钙、磷等，能转运多少要看细胞需要多少。"},{"q":"细胞核里的DNA被比喻为细胞的？","o":["司令部","锅炉","外墙","大门"],"a":0,"e":"细胞核里有DNA，是细胞的司令部，记载着所有细胞应该执行的程序。"},{"q":"细胞核的膜叫核膜，其结构与细胞膜一样，由什么组成？","o":["磷脂、蛋白质、胆固醇等","纤维素和果胶","矿物质和水","糖类和盐"],"a":0,"e":"细胞核的膜叫核膜，和上面说的细胞膜结构一样，由磷脂、蛋白质、胆固醇等成分组成。"},{"q":"承担细胞内物质合成和运输作用的细胞器是？","o":["内质网","高尔基体","线粒体","细胞核"],"a":0,"e":"细胞里的细胞器之一内质网，具有承担细胞内物质合成和运输的作用。比如合成蛋白质、参与激素的合成与运输，等等。"},{"q":"主要功能是将内质网合成的蛋白质进行加工、对比、分类、包装的细胞器是？","o":["高尔基体","内质网","线粒体","核膜"],"a":0,"e":"还有一个叫作高尔基体，它的主要功能是将内质网合成的蛋白质进行加工、对比、分类、包装，然后分门别类地送到细胞特定的部位或分泌到细胞外。"},{"q":"被比作工厂大锅炉、负责产生能量的细胞器是？","o":["线粒体","高尔基体","内质网","细胞核"],"a":0,"e":"所有的细胞工作都需要能量，负责产生能量的线粒体很像工厂的大锅炉。"},{"q":"线粒体这个大锅炉里，一般情况下燃烧的是？","o":["葡萄糖","脂肪","蛋白质","氨基酸"],"a":0,"e":"这个大锅炉里一般情况下燃烧的是葡萄糖（碳水化合物中的一种）。"},{"q":"当葡萄糖不足时，线粒体会燃烧什么？","o":["脂肪","蛋白质","维生素","矿物质"],"a":0,"e":"当葡萄糖不足时燃烧脂肪，蛋白质不能直接被燃烧，要在肝脏中转化成葡萄糖以后才能成为能量。"},{"q":"关于蛋白质供能，正确的说法是？","o":["蛋白质不能直接被燃烧，要在肝脏中转化成葡萄糖以后才能成为能量","蛋白质是最优先的燃料","蛋白质直接在线粒体燃烧","蛋白质不能提供任何能量"],"a":0,"e":"蛋白质不能直接被燃烧，要在肝脏中转化成葡萄糖以后才能成为能量。"},{"q":"“新陈代谢”是生物体内全部有序化学变化的总称，是生命现象的？","o":["最基本特征","次要特征","附属现象","偶然现象"],"a":0,"e":"代谢是生物体内全部有序化学变化的总称，是生命现象的最基本特征。如果新陈代谢停止了，生命也就结束了，由此可见其重要性。"},{"q":"酶的主体部分是？","o":["蛋白质","维生素","矿物质","脂类"],"a":0,"e":"酶是从哪里来的呢？是食物中的营养转化的。酶的主体部分是蛋白质，辅助部分叫作辅酶，辅酶的主要成分是维生素和矿物质。"},{"q":"辅酶的主要成分是？","o":["维生素和矿物质","蛋白质和脂类","碳水化合物和水","膳食纤维"],"a":0,"e":"酶的主体部分是蛋白质，辅助部分叫作辅酶，辅酶的主要成分是维生素和矿物质。"},{"q":"甲状腺素、胰岛素属于哪一类激素？","o":["蛋白质类激素","胆固醇类激素","氨基酸类激素","脂溶性激素"],"a":0,"e":"激素分为蛋白质类激素和胆固醇类激素，比如甲状腺素、胰岛素都属于蛋白质类激素，肾上腺素就属于胆固醇类激素。"},{"q":"肾上腺素属于哪一类激素？","o":["胆固醇类激素","蛋白质类激素","肽类激素","水溶性激素"],"a":0,"e":"比如甲状腺素、胰岛素都属于蛋白质类激素，肾上腺素就属于胆固醇类激素。"},{"q":"人体由多少个细胞组成？","o":["40万亿～60万亿个","4万亿～6万亿个","400万亿～600万亿个","1亿个左右"],"a":0,"e":"人体由40万亿～60万亿个细胞组成，而我们身上的细菌数量是人体细胞数量的10倍。"},{"q":"人体身上的细菌数量大约是人体细胞数量的？","o":["10倍","1/10","2倍","相同"],"a":0,"e":"人体由40万亿～60万亿个细胞组成，而我们身上的细菌数量是人体细胞数量的10倍，并且主要在肠道里，肠道里的细菌靠食物中的膳食纤维养活。"},{"q":"肠道里的细菌靠什么养活？","o":["食物中的膳食纤维","蛋白质","脂肪","维生素"],"a":0,"e":"肠道里的细菌靠食物中的膳食纤维养活。"},{"q":"食物进到人体中有四个主要去向，不包括？","o":["给细胞提供能量","成为细胞结构","调节细胞代谢","转化为氧气"],"a":3,"e":"总结起来，食物进到人体中有四个主要去向：给细胞提供能量、成为细胞结构、调节细胞代谢、养肠道菌群。"},{"q":"给细胞提供能量主要靠哪类食物？","o":["碳水化合物类，也就是粮食、水果等","蛋白质类","脂类","膳食纤维"],"a":0,"e":"给细胞提供能量——主要靠碳水化合物类，也就是粮食、水果等。"},{"q":"成为细胞结构主要靠哪类营养素，主要存在于哪些食物中？","o":["蛋白质类和脂类，主要存在于肉、蛋、奶、鱼中","碳水化合物类，主要存在于粮食中","维生素，主要存在于水果中","膳食纤维，主要存在于蔬菜中"],"a":0,"e":"成为细胞结构——主要靠蛋白质类和脂类，主要存在于肉、蛋、奶、鱼中。"},{"q":"调节细胞代谢靠的是？","o":["蛋白质类和胆固醇类，还有维生素、矿物质","碳水化合物和水","膳食纤维和盐","脂肪和水"],"a":0,"e":"调节细胞代谢——蛋白质类和胆固醇类，还有维生素、矿物质。"},{"q":"养肠道菌群靠的是？","o":["食物中的膳食纤维","食物中的蛋白质","食物中的脂肪","食物中的糖"],"a":0,"e":"养肠道菌群——食物中的膳食纤维。"},{"q":"书中指出，各种细胞的形成是？","o":["基因选择性表达的结果","随机分化的结果","环境影响的结果","营养决定的结果"],"a":0,"e":"各种细胞的形成是基因选择性表达的结果。基因决定了心脏怎样跳、肝脏做什么功、肾脏干什么活。"},{"q":"基因决定了人应该睡多长时间、喝多少水等，作者认为：当人们顺应基因确定好的细胞需求去生活，就能？","o":["长寿","富有","聪明","强壮"],"a":0,"e":"当人们顺应基因确定好的细胞需求去生活，就能长寿；如果一味地任性，想吃什么就吃什么，想几点睡就几点睡，生活方式与基因编码不对等，疾病就会找上门来。"},{"q":"关于饮食在基因上的编码，目前科学技术的状态是？","o":["还做不到精确定位","已经完全破译","可精确定位到每个营养素","不存在相关编码"],"a":0,"e":"可是按照目前的科学技术，饮食方面在基因上的编码还做不到精确定位，但是有一个非常简单的方法可以让我们初步了解基因的表达：回顾人类发展史，从中找到一些规律。"},{"q":"作者建议用什么简单方法初步了解基因关于饮食的表达？","o":["回顾人类发展史","做基因检测","记录饮食日记","抽血化验"],"a":0,"e":"但是有一个非常简单的方法可以让我们初步了解基因的表达：回顾人类发展史，从中找到一些规律。"},{"q":"当细胞死亡数达到总量的多少，人就会死亡？","o":["10%","20%","30%","50%"],"a":1,"e":"我们知道，人体是由细胞组成的。一般情况下，当细胞死亡数达到总量的20%时，人就会死亡。"},{"q":"生病的本质是？","o":["细胞损伤的速度超过了细胞修复的速度","细胞修复的速度超过了细胞损伤的速度","细胞生命周期突然变短","基因必然发生突变"],"a":0,"e":"人的一生中，体内大部分细胞都在不断更新，通过再生来修复损伤，这一生就是一个细胞不断自我修复的过程。而生病的本质，就是细胞损伤的速度超过了细胞修复的速度。"},{"q":"从大约距今多少年开始，非洲东部地壳发生变化，古猿下地寻找食物，开始了荤素搭配的饮食结构？","o":["250万年","80万年","15万年","5000年"],"a":0,"e":"从大约距今250万年开始，非洲东部地壳发生变化，完全靠采集植物为生的古猿只好下地寻找食物，就此开始了荤素搭配的饮食结构。"},{"q":"大约多少年前，有部分人种发现野火烧过的动物肉既好吃又好消化，把火种引进了山洞？","o":["80多万年","250万年","15万年","1万年"],"a":0,"e":"大约80多万年前，有部分人种发现野火烧过的动物肉既好吃，又好消化，于是把火种引进了山洞，这使得人类又前进了一大步。"},{"q":"把动物煮熟或烤熟了吃，带来的好处是？","o":["蛋白质和脂类更容易消化吸收，大脑获得更多滋养","食物更耐储存","减少了烹饪时间","增加了食物数量"],"a":0,"e":"把打来的动物煮熟或者烤熟了吃，摄入的蛋白质和脂类更容易消化吸收，大脑获得了更多滋养。"},{"q":"恩格斯曾指出，古猿转变成人的重要一步是？","o":["从只吃植物过渡到同时也吃肉","学会使用火","开始直立行走","制造石器"],"a":0,"e":"正如恩格斯所说：“从只吃植物过渡到同时也吃肉，是古猿转变成人的重要一步。”"},{"q":"旧石器时代人类在外形上的重要特点不包括？","o":["脑容量显著增大","下巴逐渐收缩","牙齿变小","四肢变得纤细"],"a":3,"e":"这时的人类在外形上有一些非常重要的特点：脑容量显著增大，下巴逐渐收缩进去，牙齿也变小了（由于食物煮熟后容易咀嚼和消化）。【四肢纤细不在其中】"},{"q":"人类有意识地制造石器、开启旧石器时代，是在什么过程中开始的？","o":["围攻大型动物、团结一心开动脑筋想办法的过程中","种植农作物的过程中","驯养家畜的过程中","冶炼金属的过程中"],"a":0,"e":"人类在动物里不是最高大的，不是最有力气的，要围攻一个大型动物很不容易，大家要团结一心，开动脑筋想办法。也是从这一阶段，人类开始有意识地制造一些石器，开启了旧石器时代。"},{"q":"人类学家把15万年前、外观上与现代人类已基本相似的人类叫作？","o":["智人","直立人","能人","尼安德特人"],"a":0,"e":"15万年前的人类和现代人类在外观上除了某些原始性外，已基本相似，人类学家把他们叫作智人。"},{"q":"畜牧业的雏形是指人们？","o":["把一时吃不完的野马、野牛或鹿驱赶进栅栏暂时饲养","把野兽杀死后腌制保存","开始种植野菜野果","驯化狗来帮助狩猎"],"a":0,"e":"人们开始在原野上选择一个适当的地方搭建栅栏，把一时吃不完的野马、野牛或鹿驱赶进去，让它们暂时生活在那里，形成了畜牧业的雏形。"},{"q":"农业的萌芽出现在公元前？","o":["9500—前8500年","5000年左右","2万年","15万年"],"a":0,"e":"公元前9500—前8500年，人们把一些野菜、野果的种子留下，开垦出一片土地去种植，这就是农业的萌芽。"},{"q":"大约多少年前，农业革命已经横扫欧洲、亚洲、非洲？","o":["5000年","9500年","1万年","15万年"],"a":0,"e":"到大约5000年前，农业革命已经横扫欧洲、亚洲、非洲，人类不约而同地选择了这种安逸的生活方式：春天播种，秋天收获。"},{"q":"书中指出，农业革命的开始实际上是？","o":["食物营养下降的开始","人类寿命延长的开始","脑容量激增的开始","体质增强的开始"],"a":0,"e":"但是从营养素的获取来讲，农业革命的开始实际上是食物营养下降的开始。人类不再需要与大型动物搏杀，每天吃的食物是主动种植的植物或者饲养的动物，食谱变窄了。"},{"q":"农业革命对人类进化的影响是？","o":["大脑增容和体质增强戛然而止","大脑进一步增容","体质进一步增强","脑容量和体质同步大增"],"a":0,"e":"农业的发展大大改变了人类的饮食结构，肉类食物比例减少，植物类食物所占比例明显增多，定居生活带来的是人类大脑增容和体质增强的戛然而止。"},{"q":"欧洲工业革命发生在多少年前？","o":["200多年前","500多年前","1000多年前","2000多年前"],"a":0,"e":"200多年前，欧洲的工业革命再次让饮食结构发生了巨大变化。"},{"q":"据日本2006年发布的一则调查，和20年前相比，菠菜的营养素只剩下了？","o":["不到20%","不到50%","80%左右","几乎没有变化"],"a":0,"e":"据日本2006年发布的一则调查显示，和20年前相比，菠菜的营养素只剩下了不到20%。"},{"q":"下列属于工业革命后新出现、老祖宗餐桌上没有的食物是？","o":["工业生产的反式脂肪酸（人造黄油、起酥油）","野生鱼类","新鲜蔬菜","粗粮"],"a":0,"e":"一些从未在我们生活中出现的食物出现了，比如：各种添加剂：口味剂、防腐剂、保鲜剂、色素等。工业生产的反式脂肪酸（人造黄油、起酥油）。精米、精面。"},{"q":"书中关于精米、精面的说法正确的是？","o":["精米、精面是近几十年工业发展的结果，老祖宗吃的是五谷杂粮","精米精面自古就有","精米精面比杂粮更有营养","精米精面是手工加工的产物"],"a":0,"e":"精米、精面是近几十年工业发展的结果，老祖宗吃的是五谷杂粮，那时候食物加工要靠手工，不可能制造出精细的米和面。"},{"q":"书中指出，今天慢病蔓延流行的根本原因是？","o":["旧基因和新饮食的矛盾","人口老龄化","医疗水平下降","运动不足"],"a":0,"e":"从数万年前茹毛饮血的旧石器时代到现在，我们的基因结构和消化系统基本上没有改变，然而我们的饮食结构却有翻天覆地的变化，特别是在最近100年间。正是由于旧基因和新饮食的矛盾，造成了今天慢病的蔓延流行。"},{"q":"书中认为，从饮食方面而言，人类进化的催化剂是？","o":["荤素搭配、食谱变宽","精米精面","人工添加剂","定居生活"],"a":0,"e":"毫无疑问，从饮食方面而言，荤素搭配、食谱变宽是人类进化的催化剂，而饮食结构的变化、食物获取方式的颠覆正是饮食方面让人类受困于各种慢病的主要原因。"},{"q":"人类之所以成为世界上最聪明的动物，很重要的一点在于？","o":["人类是所有哺乳动物中吃得最复杂的","人类体型最大","人类奔跑最快","人类寿命最长"],"a":0,"e":"人类之所以成为世界上最聪明的动物，很重要的一点在于，人类是所有哺乳动物中吃得最复杂的。"},{"q":"我们的老祖宗可以从自然界摄取多少种食物？","o":["7000多种","500多种","1000多种","1万多种"],"a":0,"e":"我们的老祖宗可以从自然界摄取7000多种食物，能够充饥的无毒食物都成了人类的腹中餐。但是，随着农牧业的开展以及工业加工食品的出现，人们常吃的食物只有500多种。"},{"q":"随着农牧业的开展以及工业加工食品的出现，人们常吃的食物只剩下？","o":["500多种","1000多种","3000多种","7000多种"],"a":0,"e":"但是，随着农牧业的开展以及工业加工食品的出现，人们常吃的食物只有500多种。也就是说，有6000多种我们老祖宗吃的食物都从我们的餐桌上消失了。"},{"q":"大约在距今多少年前，人类进化得最快？","o":["2万～1万年前","250万年前","15万年前","5000年前"],"a":0,"e":"大概在距今2万～1万年前是旧石器时代向新石器时代转化时期，人类进化得最快。"},{"q":"人类进化最快时期，饮食结构中植物性食物占？","o":["65%左右","35%左右","50%左右","80%左右"],"a":0,"e":"植物性食物占65%左右，主要是水果、蔬菜、坚果、豆类和蜂蜜。"},{"q":"人类进化最快时期，动物性食物占？","o":["35%左右","65%左右","50%左右","20%左右"],"a":0,"e":"动物性食物占35%左右，主要是肉类、蛋类、鱼和虾贝类。"},{"q":"这个完美饮食结构带来的特点不包括？","o":["低钠高钾","高纤维素","高蛋白质","高糖"],"a":3,"e":"这样完美的饮食结构带来了大量的维生素和矿物质，低钠高钾、高纤维素、高蛋白质以及脂肪酸中ω-3脂肪酸的高含量，糖多为蜂蜜和水果提供的果糖，从而大大促进了人类的进化。"},{"q":"作者提出的三条建议中，动物类食物（肉、蛋、奶、鱼等）最好占一天食物的？","o":["35%","50%","65%","20%"],"a":0,"e":"第三，动物类食物（肉、蛋、奶、鱼等）最好占一天食物的35%。当然如果能买到散养的畜禽类动物或者禽卵更好。植物类食物包括蔬菜、水果和粮食，占一天食物的65%。"},{"q":"作者认为下列主食中最不好的是？","o":["精米、精面","全麦类","糙米","莜麦"],"a":0,"e":"粮食类食物种类要多，以粗粮为主，如全麦类、糙米、玉米、莜麦、薯类都很好，最不好的是精米、精面，因为精米、精面是工业化的产物。"},{"q":"作者用土豆炖牛肉举例，是为了说明？","o":["食物种类多不等于营养丰富","做菜要少放油","牛肉比土豆贵","炖菜更有营养"],"a":0,"e":"你看我做一个土豆炖牛肉，土豆占65%，牛肉占35%，这不就实现了夏老师提的这个要求了吗？细心的读者可能会反驳说，你这饮食太单调了。"},{"q":"“白菜炖粉条、土豆炖牛肉、煮红薯、凉拌山药泥”这一桌菜，作者认为？","o":["花样很多，其实营养还是很单一","营养十分全面","蛋白质充足","是理想的膳食搭配"],"a":0,"e":"如果我说第二种虽然看起来花样很多，其实营养还是很单一，大家会不会觉得很惊讶？"},{"q":"从临床营养科医生的角度看，所有的食物都可以归为？","o":["七大营养素","三大类","四类","五谷杂粮"],"a":0,"e":"从一个临床营养科医生的角度来看，所有的食物都可以归为七大营养素。"},{"q":"粉条、土豆、红薯和山药，主要含有同一种营养素，即？","o":["碳水化合物","蛋白质","脂类","维生素"],"a":0,"e":"第二种搭配看上去有6种食物，好像很丰富了，其实粉条、土豆、红薯和山药主要含有同一种营养素——碳水化合物。"},{"q":"作者把细胞修复过程比作盖大楼，指出最终成为“豆腐渣工程”的原因不包括？","o":["原料不足、质量不好","搭配单一","偷工减料、以次充好","设计图纸太复杂"],"a":3,"e":"把细胞修复过程比作盖大楼，如果原料不足、质量不好、搭配单一、偷工减料、磨洋工、以次充好……再好的设计也无济于事，最终都会成为豆腐渣工程。"},{"q":"即便基因是长寿基因，如果损伤因素太多、修复材料给得不对不足，结果会是？","o":["疾病丛生，缩短和破坏生命的长度和质量","依然长寿","只是略微不适","不受影响"],"a":0,"e":"所以，即便基因是长寿基因，如果损伤因素太多，修复材料给得不对、不足，都会导致疾病丛生，缩短和破坏生命的长度和质量。"},{"q":"那位10岁女孩就诊时，个子看起来像多大的孩子？","o":["幼儿园大班的孩子","一年级学生","三年级学生","小学毕业生"],"a":0,"e":"这个女孩子已经10岁了，可个子看起来像幼儿园大班的孩子。"},{"q":"那位10岁女孩的出生和早期发育情况是？","o":["出生顺产，1岁多就会走路，幼儿园时身高智力运动能力与别的孩子没有差异","出生时难产缺氧","1岁多还不会走路","幼儿园时就明显矮小"],"a":0,"e":"一问，孩子妈妈说：“孩子出生顺产，1岁多就会走路。在幼儿园的时候，身高、智力和运动能力与别的孩子没有差异，可是上学以后就不长个儿了。”"},{"q":"那位10岁女孩上学后的三餐主要在？","o":["家里吃","学校吃","小饭桌吃","外面餐馆吃"],"a":0,"e":"“上幼儿园的时候在幼儿园吃，上学后三餐都在家里吃。”"},{"q":"那位10岁女孩每天的早餐是？","o":["一个馒头，一碗白米粥","一个鸡蛋，一杯牛奶","一碗面条","两个包子"],"a":0,"e":"一了解，孩子每天的饮食如下：早餐一个馒头，一碗白米粥；中午和晚上都是一碗米饭加上1～2种蔬菜。"},{"q":"那位10岁女孩大约1个月吃几个鸡蛋？","o":["一两个","十个","二十个","不吃"],"a":0,"e":"中午和晚上都是一碗米饭加上1～2种蔬菜。1个月吃一两个鸡蛋，不吃肉，不吃鱼，不喝牛奶。"},{"q":"从营养素角度看，那位10岁女孩的饮食中完全缺席的是？","o":["脂类","碳水化合物","维生素","水"],"a":0,"e":"从营养素角度看，馒头、粥和米饭都是碳水化合物，蔬菜提供维生素，提供蛋白质的鸡蛋几乎没有，而脂类是完全缺席的。"},{"q":"细胞的结构物质主要指？","o":["磷脂、蛋白质、胆固醇","葡萄糖、果糖","维生素、矿物质","膳食纤维、水"],"a":0,"e":"一个正在生长发育中的孩子，细胞新陈代谢既需要能量，也需要结构物质。结构物质主要指磷脂、蛋白质、胆固醇。"},{"q":"作者用“工厂里的煤”比喻什么？","o":["碳水化合物只能提供能量，变不成细胞结构","蛋白质","脂肪","维生素"],"a":0,"e":"如果把人体比作一个工厂，这个孩子吃的碳水化合物都只是工厂里的煤，吃再多碳水化合物，工厂里也只有煤堆积如山，堆得再多也变不成厂房的一砖一瓦。"},{"q":"那位10岁女孩按建议吃肉、蛋、奶后，3个月内的变化是？","o":["长了两厘米","长高了5厘米","体重下降","没有变化"],"a":0,"e":"这位妈妈听完了，赶紧回家按照我的建议给孩子吃肉、蛋、奶。3个月后她告诉我，很久没长个子的孩子长了两厘米。"},{"q":"关于三大营养素之间的转化，下列说法正确的是？","o":["碳水化合物能转化成脂肪，脂肪也能转化成碳水化合物","脂肪不能转化成碳水化合物","蛋白质能直接转化成脂肪和碳水化合物","三者互不转化"],"a":0,"e":"碳水化合物能转化成脂肪，脂肪也能转化成碳水化合物。蛋白质可以转化成碳水化合物。"},{"q":"为什么说吃再多的主食和油都未必能变成身体所需的所有蛋白质？","o":["碳水化合物和脂肪在体内只能转化为非必需氨基酸，必需氨基酸必须从外界摄取","蛋白质不能由任何物质转化","主食和油含蛋白质太多","蛋白质不需要转化"],"a":0,"e":"但不是所有的蛋白质都能由碳水化合物和脂肪直接转化而来。蛋白质是由氨基酸构成的，而碳水化合物和脂肪在体内只能转化为非必需氨基酸，必需氨基酸是必须要从外界摄取的。"},{"q":"心外科手术后，医生们每次查房都要强调多吃什么？","o":["肉、蛋、奶","米饭、馒头","水果、蔬菜","粥、汤"],"a":0,"e":"这也是为什么在我们医院，心外科手术后，尽管大多数患者都没有胃口，医生们每次查房还是要强调多吃些肉、蛋、奶。"},{"q":"那位伤口长不上的患者，每天除了喝粥就是吃？","o":["馒头、喝泡菜汤","鸡蛋、喝牛奶","瘦肉、吃蔬菜","鱼、喝鱼汤"],"a":0,"e":"有一次，我遇到一个患者，她每天除了喝粥就是吃馒头、喝泡菜汤，住院三个星期了伤口还是长不上。"},{"q":"那位伤口长不上的患者住院多久了伤口仍未愈合？","o":["三个星期","三天","三个月","半年"],"a":0,"e":"她每天除了喝粥就是吃馒头、喝泡菜汤，住院三个星期了伤口还是长不上。"},{"q":"作者向那位患者解释：主食吃到身体中会转化成脂肪存在肚子上，所以她的？","o":["肚子大","伤口不愈合","血压高","血糖低"],"a":0,"e":"主食是碳水化合物，吃到身体中会转化为脂肪存在肚子上，所以您的肚子大。但是皮肤、肌肉、骨头等部位的细胞主要成分是磷脂、蛋白质和胆固醇，您吃的食物没有这些营养，细胞就长不出来。"},{"q":"作者建议那位伤口不愈合的患者多吃？","o":["肉类、鸡蛋、酸奶和猪肝","粥和馒头","水果和蔬菜","粗粮和豆制品"],"a":0,"e":"这种情况下，多吃肉类、鸡蛋、酸奶和猪肝，伤口才能快点儿长好。"},{"q":"面对家属“胆固醇对身体不好”的质疑，作者的解释是？","o":["吃进去的胆固醇会成为人体细胞结构的一部分，肝脏造的胆固醇才与动脉粥样硬化有关","食物胆固醇完全无害","胆固醇只对肝脏有害","食物中不含胆固醇"],"a":0,"e":"我继续耐心解释：“吃进去的胆固醇会成为人体细胞结构的一部分，肝脏造的胆固醇才与动脉粥样硬化有关，不是一回事儿。”"},{"q":"患者女儿把鸡肉捞出来自己吃、只给妈妈喝鸡汤，作者认为？","o":["同样多的鸡肉和鸡汤，鸡肉更有营养","鸡汤更有营养","两者营养相同","应该只喝汤"],"a":0,"e":"同样多的鸡肉和鸡汤，哪个更有营养？当然是鸡肉。"},{"q":"心脏手术后喝汤汤水水为什么要限制？","o":["要限制进入身体的液体量，同时保证磷脂、蛋白质、胆固醇和各种维生素的摄入","汤太热","汤里盐太多","汤会加重心脏负担之外的消化负担"],"a":0,"e":"而且心脏手术后不能喝这么多汤汤水水，要限制进入身体的液体量，又要保证磷脂、蛋白质、胆固醇和各种维生素的摄入，所以，每一口饭都非常重要。"},{"q":"食物中的碳水化合物、蛋白质和脂肪一同被摄入时，最先被利用的是？","o":["碳水化合物","蛋白质","脂肪","维生素"],"a":0,"e":"食物中的碳水化合物、蛋白质和脂肪如果一同被摄入，最先被利用的一定是碳水化合物，它冲在最前面，进入细胞的线粒体，直接变为能量。"},{"q":"人饿的时候，消耗的顺序是？","o":["碳水化合物先被用光，之后才是皮下脂肪和蛋白质","脂肪先被用光","蛋白质先被用光","三者同时消耗"],"a":0,"e":"人饿的时候，碳水化合物先被用光，之后才是皮下脂肪和蛋白质。"},{"q":"饥饿时，脂肪的分解约占多少？","o":["80%左右","20%左右","50%左右","10%左右"],"a":0,"e":"一般来讲，人在饥饿时，以脂肪分解为主，占80%左右，蛋白质的分解约占20%，脂肪和蛋白质的分解比例约为4∶1。"},{"q":"饥饿时脂肪和蛋白质的分解比例约为？","o":["4∶1","1∶4","1∶1","2∶1"],"a":0,"e":"人在饥饿时，以脂肪分解为主，占80%左右，蛋白质的分解约占20%，脂肪和蛋白质的分解比例约为4∶1。"},{"q":"那位健身的瘦小伙子，午餐吃的是？","o":["50克主食、75克瘦肉和一些蔬菜","两碗米饭和红烧肉","三个鸡蛋","只吃蔬菜沙拉"],"a":0,"e":"他说：“每天早上吃一个鸡蛋；中午吃50克主食、75克瘦肉和一些蔬菜；晚上要少吃一些，基本上不吃主食。”"},{"q":"那位健身小伙子半年下来体重减轻了3千克，但？","o":["不出肌肉，且全身无力","肌肉明显增长","力量大增","效果理想"],"a":0,"e":"近来体重减轻了3千克，但是就是不出肌肉。很明显，因为碳水化合物摄入不足造成了他体内蛋白质和脂肪分解。"},{"q":"那位健身小伙子早晨只吃鸡蛋的问题在于？","o":["能量不够用，鸡蛋里的蛋白质没成为肌肉成分，而是被燃烧掉了","鸡蛋吃得太少","鸡蛋胆固醇太高","鸡蛋难以消化"],"a":0,"e":"第二天早上应该摄入一些碳水化合物，结果他早晨仅仅只吃鸡蛋，于是上午的能量只能从鸡蛋中来。能量不够用，因此鸡蛋里的蛋白质没有成为肌肉细胞的成分，而是变成能量给燃烧掉了。"},{"q":"碳水化合物摄入太多、人体消耗不掉，会造成？","o":["肥胖、糖尿病等疾病","阿尔茨海默病、呆小症","贫血","骨质疏松"],"a":0,"e":"食物摄入不均衡，如果碳水化合物摄入太多，人体消耗不掉，就会造成肥胖、糖尿病等疾病；而为细胞提供结构和形成调节物质的营养素不足，会导致阿尔茨海默病、呆小症等。"},{"q":"为细胞提供结构和形成调节物质的营养素不足，会导致？","o":["阿尔茨海默病、呆小症等","肥胖、糖尿病","高血压","痛风"],"a":0,"e":"而为细胞提供结构和形成调节物质的营养素不足，会导致阿尔茨海默病、呆小症等。"},{"q":"对运动量不大的现代人来说，最好的食物选择是？","o":["低能量密度，高营养密度","高能量密度，高营养密度","低能量密度，低营养密度","高能量密度，低营养密度"],"a":0,"e":"对运动量不大的现代人来说，最好的食物选择是：低能量密度，高营养密度。如果是体力劳动者，那就要高能量密度，高营养密度。"},{"q":"如果是体力劳动者，应该选择的食物是？","o":["高能量密度，高营养密度","低能量密度，高营养密度","低能量密度，低营养密度","高能量密度，低营养密度"],"a":0,"e":"如果是体力劳动者，那就要高能量密度，高营养密度。"},{"q":"所谓能量密度，指的是？","o":["单位体积中所含的提供给细胞的能量营养素有多少","单位体积中所含的营养素有多少","食物的总重量","食物所含的热量总和"],"a":0,"e":"所谓能量密度，指的是单位体积中所含的提供给细胞的能量营养素有多少。比如馒头和油煎馒头比，肯定后者能量密度大。"},{"q":"所谓营养密度，指的是？","o":["单位体积中所含的营养素有多少","单位体积中所含的能量有多少","食物的价格高低","食物的加工程度"],"a":0,"e":"所谓营养密度，指的是单位体积中所含的营养素有多少。"},{"q":"下列食物中被称为“空能量食物”的是？","o":["白米粥、甜饮料、白面馒头和大米饭","鸡蛋、牛奶","瘦肉、鱼","蔬菜、水果"],"a":0,"e":"我们把这种只有能量而没有其他营养素的食物叫作空能量食物，比如白米粥、甜饮料、白面馒头和大米饭。"},{"q":"最符合低能量、高营养这一标准的膳食结构是？","o":["地中海膳食结构","西方快餐式膳食","纯素食结构","高蛋白膳食"],"a":0,"e":"最符合低能量、高营养这一标准的膳食结构，就是地中海膳食结构。多年的临床研究也证明，这是预防高血压、高血脂、糖尿病等现代慢病最有效的饮食方式。"},{"q":"澳大利亚一项历时10年的研究表明，最常吃传统地中海式食品的人死于心血管病的风险要低？","o":["30%","21%","27%","73%"],"a":0,"e":"他们调查了不同来源地人群的饮食类型与心脏病死亡率之间的关系，发现最常吃传统地中海式食品的人，比很少吃地中海式食品的人死于心血管病的风险要低30%。"},{"q":"研究人员分析19项研究、超过16.2万人数据后发现，地中海式饮食可以使人们患糖尿病的风险减少？","o":["21%","27%","30%","73%"],"a":0,"e":"分析显示，与其他饮食相比，富含鱼类、坚果、蔬菜和水果的地中海式饮食，可以使人们患糖尿病的风险减少21%。对于患有心脏病的高危人群，地中海式饮食可以使人们患糖尿病的风险减少27%。"},{"q":"对于患有心脏病的高危人群，地中海式饮食可以使患糖尿病的风险减少？","o":["27%","21%","30%","73%"],"a":0,"e":"对于患有心脏病的高危人群，地中海式饮食可以使人们患糖尿病的风险减少27%。"},{"q":"美国连续几年的对比研究发现，地中海式饮食可使痴呆患者的死亡风险减少？","o":["73%","30%","21%","27%"],"a":0,"e":"美国后来又连续几年做了这方面的对比研究，发现地中海式饮食可以减缓老年痴呆症病情的恶化，可使痴呆患者的死亡风险减少73%。"},{"q":"许多研究显示，地中海式饮食可以减少多少乳腺癌发病率？","o":["30%","21%","27%","73%"],"a":0,"e":"许多研究还显示地中海式饮食可以起到预防乳腺癌的作用，可以减少30%的乳腺癌发病率。"},{"q":"作者认为，判断一个人是否健康最简单的是先评估？","o":["能量","体重","血糖","血压"],"a":0,"e":"我们看一个人是否健康，最简单的就是先评估能量，因为它比七大营养素更宏观，更易辨识。当一个人能量不平衡时，我们再进一步深挖，去分析究竟是哪种营养素不平衡。"},{"q":"本书中“脂肪”一词代指脂类，原因是？","o":["类脂只占5%，老百姓熟知且常用的词汇为脂肪","脂肪比类脂重要","类脂不存在于人体","脂肪含量更高"],"a":0,"e":"(1) 脂类中包括脂肪和类脂，其中类脂只占5%。老百姓熟知且常用的词汇为脂肪，故本章内容中的脂肪代指脂类，特此说明。"},{"q":"判断能量摄入过多还是不足，书中给出的简单方法是？","o":["能量摄入大于消耗时多余产能物质储存起来，人就会发胖","看体重指数","测体脂率","看腰围"],"a":0,"e":"当能量的摄入大于消耗时，多余的产能物质会在人体内储存起来，人就会发胖；反之，人就会消瘦，全身无力，抵抗力下降。"},{"q":"要让摄入和消耗达到平衡，作者强调首先要？","o":["计算清楚消耗，消耗多少补多少","控制饮食","增加运动","补充维生素"],"a":0,"e":"要让摄入和消耗达到平衡，我们首先要计算清楚消耗，消耗多少补多少。"},{"q":"人体每天的能量消耗包括哪三个方面？","o":["基础代谢、运动和食物消化","工作、睡眠和娱乐","呼吸、心跳和体温","吃饭、走路和思考"],"a":0,"e":"一个人每天的能量消耗主要有以下三个方面：基础代谢、运动和食物消化。"},{"q":"基础代谢率是指？","o":["尽量排除其他影响因素，在非常安静的环境中、清醒状态下测定的代谢率","睡觉时的能量消耗","运动时的最大耗氧量","饭后两小时的代谢率"],"a":0,"e":"基础代谢率就是尽量排除其他影响因素，在非常安静的环境中，在清醒的状态下，一个人的身体不受精神紧张、肌肉活动和环境温度等影响测定的代谢率。"},{"q":"下列不属于影响基础代谢常见因素的是？","o":["环境温度、激素","年龄、性别","身高和遗传","血型"],"a":3,"e":"日常生活中，基础代谢很容易受到其他因素的影响，常见的包括环境温度、激素、年龄、性别、身高和遗传等。"},{"q":"环境温度在多少时，人的基础代谢率最低？","o":["20～25℃","15～18℃","26～30℃","10℃以下"],"a":0,"e":"环境温度在20～25℃时，人的基础代谢率最低；低温和高温环境中，代谢率都会升高。"},{"q":"长期生活在恒温房间里的人容易发胖，原因是？","o":["能量消耗少","吃得更多","睡眠更差","激素紊乱"],"a":0,"e":"现在大家长期生活在恒温房间里，能量消耗少，很容易发胖。"},{"q":"会提高细胞生化反应速度、影响基础代谢的激素是？","o":["甲状腺激素和肾上腺皮质激素","胰岛素和胰高血糖素","雌激素和孕激素","生长激素"],"a":0,"e":"激素也是影响基础代谢的重要因素。甲状腺激素和肾上腺皮质激素会提高细胞生化反应速度，一些药物及交感神经活动等也可以影响能量消耗。"},{"q":"作者用“一天到晚特别爱紧张的人往往比较瘦”来说明？","o":["精神紧张比心情放松要多消耗一些能量","紧张会抑制食欲","紧张会导致失眠","紧张影响激素"],"a":0,"e":"比如精神紧张的人比心情放松的人要多消耗一些能量，所以大家看到一天到晚特别爱紧张的人往往比较瘦。"},{"q":"关于基础代谢的差别，下列说法正确的是？","o":["男性比女性高，高个子高于小个子，还有一定遗传倾向","女性比男性高","矮个子高于高个子","与遗传无关"],"a":0,"e":"另外，男性比女性基础代谢率高，高个子的基础代谢率高于小个子，基础代谢率的高低还有一定的遗传倾向。"},{"q":"作者问患者运动量时，会特别追问？","o":["散步时走得快吗、出汗了没有","有没有办健身卡","运动鞋是什么牌子","一周运动几次"],"a":0,"e":"如果患者说：“我每天散步一小时。”我就要再仔细问问：“散步时走得快吗？出汗了没有？”因为“快走”和“溜达”在一个小时内所消耗的能量差异太大了。"},{"q":"消化食物的过程也要消耗能量，这被称作？","o":["食物的动力效应","基础代谢","食物热价","代谢当量"],"a":0,"e":"消化食物的过程也要消耗能量，这被称作食物的动力效应。"},{"q":"不同营养素中，动力效应最大的是？","o":["蛋白质","碳水化合物","脂肪","膳食纤维"],"a":0,"e":"不同营养素的动力效应是不同的。蛋白质的动力效应最大，约为30%；而碳水化合物和脂肪的动力效应较低，基本在5%左右。"},{"q":"蛋白质的动力效应约为？","o":["30%","5%","15%","50%"],"a":0,"e":"蛋白质的动力效应最大，约为30%；而碳水化合物和脂肪的动力效应较低，基本在5%左右。"},{"q":"碳水化合物和脂肪的动力效应约为？","o":["5%左右","30%左右","15%左右","1%左右"],"a":0,"e":"而碳水化合物和脂肪的动力效应较低，基本在5%左右。"},{"q":"如果吃进去的蛋白质热量是100千卡，实际吸收到机体中的是？","o":["70千卡","95千卡","100千卡","30千卡"],"a":0,"e":"例如，如果你吃进去的蛋白质热量是 100 千卡，消化分解自身用掉30%，实际上吸收到机体中的是70千卡。"},{"q":"100千卡的碳水化合物进入人体后，吸收到身体中的是？","o":["95千卡左右","70千卡左右","100千卡","5千卡"],"a":0,"e":"而100千卡的碳水化合物进入人体后，消化分解自身只用掉5%，吸收到身体中的是95千卡左右，脂肪也是同量。"},{"q":"七大营养素中与能量息息相关的三大营养素被称为？","o":["产能营养素","结构营养素","微量元素","调节因子"],"a":0,"e":"在七大营养素中，有三大营养素和能量息息相关，它们分别是碳水化合物、蛋白质和脂类，被称为“产能营养素”。"},{"q":"三大产能营养素是指？","o":["碳水化合物、蛋白质和脂类","碳水化合物、维生素和水","蛋白质、矿物质和水","脂类、膳食纤维和水"],"a":0,"e":"三大产能营养素就是碳水化合物、蛋白质和脂类。其他营养素是人体必需的营养素，但不产能。"},{"q":"每克碳水化合物产生的能量是？","o":["4千卡","7千卡","9千卡","2千卡"],"a":0,"e":"碳水化合物每克产生4千卡能量，蛋白质每克产生4千卡能量，脂类每克产生9千卡能量。"},{"q":"每克蛋白质产生的能量是？","o":["4千卡","7千卡","9千卡","6千卡"],"a":0,"e":"碳水化合物每克产生4千卡能量，蛋白质每克产生4千卡能量，脂类每克产生9千卡能量。"},{"q":"每克脂类产生的能量是？","o":["9千卡","4千卡","7千卡","12千卡"],"a":0,"e":"脂类每克产生9千卡能量。"},{"q":"常饮酒的人有第四个能量来源是酒精，1克酒精产生多少能量？","o":["7千卡","4千卡","9千卡","5千卡"],"a":0,"e":"常饮酒的人有第四个能量来源——酒精，1克酒精产生7千卡能量。"},{"q":"啤酒瓶上标明的酒精含量通常不会超过？","o":["14%","4%","25%","50%"],"a":0,"e":"啤酒瓶上标明的酒精含量通常不会超过14%，如青岛啤酒的酒精含量是4%。"},{"q":"一瓶500毫升、酒精含量4%的啤酒，其酒精含量为？","o":["20克","4克","40克","14克"],"a":0,"e":"一瓶啤酒500毫升，那么酒精含量就是500×4%=20克。"},{"q":"喝一瓶500毫升、酒精含量4%的啤酒，相当于吃了多少克碳水化合物？","o":["35克","20克","140克","70克"],"a":0,"e":"按照 1 克酒精产能 7 千卡计算， 20 克酒精产能为20×7=140千卡。换算成碳水化合物的话，1克碳水化合物产能4千卡：140÷4=35克。所以喝一瓶啤酒相当于吃了35克碳水化合物。"},{"q":"喝啤酒的人肚子越来越大，作者解释的原因是？","o":["酒精能量加上再吃米饭面条，能量累加代谢不掉转成脂肪囤积在腹部","啤酒含大量脂肪","啤酒阻碍消化","啤酒让人少动"],"a":0,"e":"而且大多数人喝了很多啤酒之后，还要再吃一碗米饭或者面条，这些能量累加，长期代谢不掉，转化成脂肪囤积在腹部周围，肚子也就越来越大。"},{"q":"一个人要保持健康，除了总能量出入平衡，还要注意？","o":["三大产能营养素之间的合理比例","每餐只吃七分饱","不吃主食","多补充维生素"],"a":0,"e":"一个人要保持健康，总能量应该和总消耗相对等，也就是说要出入平衡。除此以外，还要注意三大产能营养素之间的合理比例。"},{"q":"总的摄入能量大于消耗的能量，结果是？","o":["肥胖","消瘦","体重正常","体脂偏低"],"a":0,"e":"总的摄入能量＞消耗的能量＝肥胖；总的摄入能量＜消耗的能量＝消瘦；总的摄入能量＝消耗的能量＝体重正常。"},{"q":"作者指出，上述数量上的估计存在什么局限？","o":["数量正常不代表质量优良","只适用于男性","只适用于老年人","无法计算"],"a":0,"e":"上述只是“数量”上的一个估计，但是“数量正常”不代表“质量优良”。"},{"q":"那位60多岁女患者的主要症状是？","o":["双下肢无力、消化不良","头痛、失眠","心悸、水肿","咳嗽、发热"],"a":0,"e":"有一次，我在营养科出门诊的时候，碰到了一位60多岁、双下肢无力、消化不良的女患者。"},{"q":"那位女患者体重51.5千克、身高160厘米，她的BMI是？","o":["20.1","18.5","23.9","25.6"],"a":0,"e":"这位患者体重为51.5千克，身高160厘米，BMI是20.1，正常人是18.5～23.9，很正常吧。"},{"q":"人体成分分析仪检测发现，那位女患者？","o":["体内脂肪超标，肌肉量很低","脂肪偏低，肌肉发达","各项正常","严重水肿"],"a":0,"e":"但是我们在用人体成分分析仪给她做检测时发现，她的体内脂肪超标，肌肉量很低。"},{"q":"那位女患者每天摄入的能量中，碳水化合物占？","o":["80%左右","55%左右","20%左右","50%左右"],"a":0,"e":"发现，她每天所摄入的能量80%左右来自碳水化合物，蛋白质和脂肪合起来才占总能量的20%左右。"},{"q":"那位女患者每天蛋白质和脂肪合起来占总能量的比例约为？","o":["20%左右","45%左右","30%左右","10%左右"],"a":0,"e":"发现，她每天所摄入的能量80%左右来自碳水化合物，蛋白质和脂肪合起来才占总能量的20%左右。"},{"q":"那位女患者平时的饮食习惯是？","o":["不吃肉、蛋、奶，不吃油炸食品，炒菜还要用开水冲冲","爱吃肉和油炸食品","每天喝牛奶","经常吃鱼"],"a":0,"e":"她不吃肉、蛋、奶，不吃油炸食品，炒出来的菜还要用开水冲冲，每天的能量基本上都是靠三顿主食中的米和面提供。"},{"q":"那位女患者缺乏蛋白质，因此出现了什么表现？","o":["肌肉无力，消化能力差，睡眠不好","皮肤干燥，视力很差","记忆力减退","关节疼痛"],"a":0,"e":"缺乏蛋白质，所以肌肉无力，消化能力差，睡眠不好。"},{"q":"那位女患者缺乏必需脂肪酸，因此出现了什么表现？","o":["皮肤干燥，视力很差，记忆力减退","肌肉无力","消化能力差","睡眠不好"],"a":0,"e":"缺乏必需脂肪酸，所以皮肤干燥，视力很差，记忆力减退。"},{"q":"那位女患者理解能力和记忆能力明显下降的原因是？","o":["蛋白质和必需脂肪酸长期缺乏，神经细胞被损伤","年龄大了自然如此","缺乏维生素C","睡眠不足"],"a":0,"e":"她的理解能力和记忆能力明显出现了问题，其实，这和她消化不良、四肢乏力的原因相同，也是因为蛋白质和必需脂肪酸长期缺乏，神经细胞因此被损伤。"},{"q":"作者给那位女患者的建议是？","o":["增加肉、蛋、奶、鱼，减少碳水化合物","继续坚持清淡饮食","多吃水果","只补充维生素"],"a":0,"e":"饮食中一定要增加肉、蛋、奶、鱼，不能吃这么多碳水化合物，要注意给大脑补足营养，才能有效地治疗消化不良和预防老年痴呆。"},{"q":"计算标准体重的公式是？","o":["标准体重=身高（厘米）－105","标准体重=身高（厘米）－100","标准体重=身高（厘米）－110","标准体重=体重（千克）÷身高"],"a":0,"e":"依据标准体重计算，标准体重=身高（厘米）－105，不管男性还是女性基本都是这样计算。"},{"q":"轻体力劳动者的能量消耗标准是标准体重每千克？","o":["30千卡","35千卡","40千卡","25千卡"],"a":0,"e":"一般来讲轻体力劳动者是标准体重每千克耗能30千卡，中体力劳动者35千卡，重体力劳动者40千卡，长期卧床的人标准体重每千克耗能25千卡。"},{"q":"中体力劳动者的能量消耗标准是标准体重每千克？","o":["35千卡","30千卡","40千卡","25千卡"],"a":0,"e":"中体力劳动者35千卡，重体力劳动者40千卡。"},{"q":"重体力劳动者的能量消耗标准是标准体重每千克？","o":["40千卡","35千卡","30千卡","45千卡"],"a":0,"e":"重体力劳动者40千卡，长期卧床的人标准体重每千克耗能25千卡。"},{"q":"长期卧床的人能量消耗标准是标准体重每千克？","o":["25千卡","30千卡","20千卡","15千卡"],"a":0,"e":"长期卧床的人标准体重每千克耗能25千卡。"},{"q":"临床上一个轻体力劳动者若偏胖，计算能量时应？","o":["减少5千卡，即标准体重每千克耗能25千卡","增加5千卡","维持30千卡不变","按重体力计算"],"a":0,"e":"临床上我们也不是这么绝对，比如一个轻体力劳动者，偏胖，计算能量的时候减少5千卡，为标准体重每千克耗能25千卡。"},{"q":"大多数营养书上，蛋白质占三大能量的比例是？","o":["10%～15%","20%～30%","55%～65%","30%～40%"],"a":0,"e":"大多数营养书上三大能量比例是蛋白质为10%～15% ，脂类为20%～30% ，碳水化合物为55%～65%。"},{"q":"大多数营养书上，脂类占三大能量的比例是？","o":["20%～30%","10%～15%","55%～65%","40%～50%"],"a":0,"e":"大多数营养书上三大能量比例是蛋白质为10%～15% ，脂类为20%～30% ，碳水化合物为55%～65%。"},{"q":"大多数营养书上，碳水化合物占三大能量的比例是？","o":["55%～65%","20%～30%","10%～15%","70%以上"],"a":0,"e":"大多数营养书上三大能量比例是蛋白质为10%～15% ，脂类为20%～30% ，碳水化合物为55%～65%。"},{"q":"根据多年临床经验，作者建议三大能量比例应如何取值？","o":["碳水化合物取低值，蛋白质和脂类取高值","三者都取低值","碳水化合物取高值","三者都取中间值"],"a":0,"e":"根据中国居民饮食现状和身体状况，碳水化合物的摄入量我们尽量取其范围的低值，蛋白质和脂类我们尽量取其范围的高值，这样的目标设定效果会好得多。"},{"q":"如果是脑病患者，脂类比例要？","o":["远远大于30%","小于20%","等于30%","降到10%"],"a":0,"e":"如果是脑病患者，脂类比例要远远大于30%；糖尿病患者的碳水化合物比例，我通常会要求降到40%～50%。"},{"q":"对糖尿病患者，作者通常要求碳水化合物比例降到？","o":["40%～50%","55%～65%","30%以下","10%～15%"],"a":0,"e":"糖尿病患者的碳水化合物比例，我通常会要求降到40%～50%。"},{"q":"例子中那位54岁男性公务员的身高体重是？","o":["身高175厘米，体重72千克","身高170厘米，体重75千克","身高180厘米，体重80千克","身高165厘米，体重60千克"],"a":0,"e":"一位54岁的男性公务员，身高175厘米，体重72千克，每天坐汽车上班，没有额外的运动。"},{"q":"那位54岁男性公务员的标准体重是？","o":["70千克","72千克","75千克","65千克"],"a":0,"e":"标准体重（千克）=身高（厘米）－105，因此这位男士的标准体重是175－105=70（千克）。"},{"q":"那位男士是轻体力劳动者，每日所需总能量为？","o":["2100千卡","2400千卡","2800千卡","1800千卡"],"a":0,"e":"第二步：他是个轻体力劳动者，而且不是大胖子，也不是很瘦的人，因此每日每千克体重所需能量为30千卡，这位男士每日所需总能量为70×30＝2100（千卡）。"},{"q":"按碳水占55%计算，那位男士每日应摄入碳水化合物约？","o":["288.75克","315克","78.75克","70克"],"a":0,"e":"碳水化合物占总能量的55%：2100×55%＝1155（千卡），每克碳水化合物产生 4 千卡能量，此人每日应该摄入碳水化合物为 1155÷4 ＝288.75（克）。"},{"q":"作者建议把算出的碳水化合物如何分配？","o":["一分为二，一半粗粮和谷薯，一半米面","全部吃粗粮","全部吃细粮","按1∶3分配"],"a":0,"e":"在实际操作中还有一个技巧可以用，就是将这些碳水化合物一分为二，一半是粗粮和谷薯，另一半是米面。"},{"q":"对体力劳动者、较瘦的人或胃肠功能差的人，作者会？","o":["把细粮的比例加大","把粗粮的比例加大","完全去掉细粮","减少总能量"],"a":0,"e":"如果是体力劳动者或者比较瘦的人，还有胃肠功能差的人，我会把细粮的比例加大；如果是肥胖者或者运动量很少的人，我会把粗粮的比例加大。"},{"q":"按蛋白质占15%计算，那位男士每日所需蛋白质约为？","o":["78.75克","288.75克","70克","105克"],"a":0,"e":"蛋白质占总能量的15%：2100×15%＝315（千卡），每克蛋白质产生4千卡能量，所需蛋白质315÷4＝78.75（克）。"},{"q":"那位男士的动植物蛋白质应如何分配？","o":["各占一半","动物蛋白占2/3","全部来自植物","全部来自动物"],"a":0,"e":"其中动植物蛋白质应该各占一半，即各39.375克。"},{"q":"一个中等大小的鸡蛋大约含有多少蛋白质？","o":["6克","10克","3克","15克"],"a":0,"e":"一个中等大小鸡蛋差不多含有6克蛋白质，200毫升牛奶含有6克蛋白质。"},{"q":"200毫升牛奶大约含有多少蛋白质？","o":["6克","10克","3克","12克"],"a":0,"e":"一个中等大小鸡蛋差不多含有6克蛋白质，200毫升牛奶含有6克蛋白质。"},{"q":"瘦肉以及鱼类基本上含有多少蛋白质？","o":["17%～20%","6%～10%","25%～30%","50%以上"],"a":0,"e":"瘦肉（四条腿或两条腿的动物）以及鱼类基本上含有17%～20%的蛋白质，即每100克肉含有17～20克蛋白质。"},{"q":"例子中那位男士每天应该吃多少肉类或鱼类？","o":["约150克（相当于3两）","约300克（6两）","约50克（1两）","约500克（1斤）"],"a":0,"e":"所以此人应该每天吃1个鸡蛋、300毫升牛奶和约150克肉类或鱼类（相当于3两）。"},{"q":"关于蛋白质摄入量，作者特别提醒？","o":["不能打折扣，鼓励尽量多一些，但不要超过20%","必须严格控制","可以随意增减","越少越好"],"a":0,"e":"实际操作时必须注意，蛋白质的摄入量不能打折扣，鼓励尽量多一些，但不要超过20%。"},{"q":"按脂类占30%计算，那位男士每日所需脂类约为？","o":["70克","105克","78.75克","288.75克"],"a":0,"e":"脂类占总能量的30%：2100×30%＝630（千卡），每克脂类产生9千卡能量，因此需要630÷9＝70（克）。"},{"q":"那位男士的脂类来源应如何分配？","o":["植物油占一半35克，动物油35克","全部为植物油","全部为动物油","植物油70克"],"a":0,"e":"其中植物油占一半，为每天35克。动物油在吃鸡蛋、肉类食物和喝牛奶时可以获得，为35克。"},{"q":"关于脂类摄入，作者建议鱼、虾和海藻要多吃，理由是？","o":["单不饱和脂肪酸和多不饱和脂肪酸要更多一些","鱼虾含蛋白质高","鱼虾热量低","鱼虾含钙高"],"a":0,"e":"脂类的摄入在保证数量的同时还要注重比例，单不饱和脂肪酸和多不饱和脂肪酸要更多一些，因此鱼、虾和海藻要多吃一些。"},{"q":"对于消耗能量很大的人（如快递员、农民），作者的建议是？","o":["每种营养素的摄入都要相应有较大幅度的提高","只增加主食","只增加蛋白质","保持原量"],"a":0,"e":"如果平时消耗能量很大，比如送快递的快递员、下地的农民，即使身高、体重不变，但因为能量消耗大大增加了，所以每种营养素的摄入都要相应有一个较大幅度的提高。"},{"q":"对于年龄大、能量消耗少的人，作者的建议是？","o":["相应减少饮食的总能量，但三大能量比例不变","只减少主食","三大比例全部下调","不需要调整"],"a":0,"e":"年龄大的人一般能量消耗少，要相应减少饮食的总能量，但是三大能量比例不要变。"},{"q":"BMI的中文名称和计算方法是？","o":["体重指数，用体重千克数除以身高米数的平方","体脂率，用脂肪重量除以体重","腰臀比，用腰围除以臀围","基础代谢率，用耗氧量计算"],"a":0,"e":"BMI: Body Mass Index的缩写，即体重指数，具体计算方法就是用体重千克数除以身高米数的平方。"},{"q":"按书中定义，轻体力劳动者的时间分配是？","o":["75%时间坐或站立，25%时间站着活动","25%时间坐或站立，75%时间特殊职业活动","40%时间坐或站立，60%时间特殊职业活动","全部时间是坐姿工作"],"a":0,"e":"轻体力劳动者：75%时间坐或站立，25%时间站着活动，如从事办公室工作、修理电器、售货员等。"},{"q":"下列属于书中列举的中体力劳动者的是？","o":["机动车驾驶员、电工、车床操作者","办公室工作、售货员","炼钢、装卸、采矿","长期卧床者"],"a":0,"e":"中体力劳动者：25%时间坐或站立，75%时间特殊职业活动，如学生日常生活、机动车驾驶员、电工、安装人员、车床操作者、从事金属切割的人员等。"},{"q":"下列属于书中列举的重体力劳动者的是？","o":["从事非机械化农业劳动，炼钢、舞蹈、体育活动、装卸、采矿等","办公室工作","售货员","修理电器"],"a":0,"e":"重体力劳动者：40%时间坐或站立，60%时间特殊职业活动，如从事非机械化农业劳动，炼钢、舞蹈、体育活动、装卸、采矿等。"},{"q":"蛋白质约占人体重量的？","o":["20%左右","40%左右","60%左右","10%左右"],"a":0,"e":"蛋白质是人体最基本的组成成分，占人体重量的20%左右。"},{"q":"人的体重中水约占60%，剩下的40%中蛋白质占？","o":["一半","四分之一","全部","三分之一"],"a":0,"e":"千万别小看这20%，人的体重中60%左右是水，剩下的40%中蛋白质就占了一半。"},{"q":"下列部位中，不以蛋白质为主要成分的是？","o":["指甲和头发","大脑和神经","皮肤和肌肉","骨骼中的钙盐"],"a":3,"e":"人体的大脑、神经、皮肤、肌肉、内脏、血液，甚至指甲、头发都以蛋白质为主要成分。"},{"q":"蛋白质在身体中的角色是？","o":["生长发育、衰老组织更新和损伤组织新生细胞的修补原料","主要能量来源","主要溶剂","主要储能物质"],"a":0,"e":"同时蛋白质还是身体生长发育、衰老组织更新和损伤组织新生细胞的修补原料。"},{"q":"如果能量不足、身体里的碳水化合物已经用完，人体会通过消耗什么来供能？","o":["脂肪和蛋白质","维生素和矿物质","水和膳食纤维","骨骼和肌肉以外的组织"],"a":0,"e":"如果能量不足，身体里的碳水化合物已经用完，人体会通过消耗脂肪和蛋白质来供能。"},{"q":"衡量蛋白质营养价值高低的标准是？","o":["进入人体后能被利用的氨基酸越多，营养价值越高","蛋白质含量越高越好","食物价格越贵越好","分子量越小越好"],"a":0,"e":"广泛存在于动、植物食物中的蛋白质进入人体后能被利用的氨基酸越多，其营养价值越高，否则蛋白质含量再高，如果所含的氨基酸与人体需求不匹配也没用，甚至还有坏处。"},{"q":"关于肉蛋类蛋白质与植物类蛋白质，正确的说法是？","o":["肉蛋类蛋白质的生物利用率高于植物类蛋白质","植物类高于动物类","两者完全相同","无法比较"],"a":0,"e":"从这一点来说，肉蛋类蛋白质的生物利用率高于植物类蛋白质。"},{"q":"肾功能有问题的人不让吃大豆，原因是？","o":["大豆缺乏某种人体必需的氨基酸，氨基酸利用受影响，代谢产物增多对肾脏压力大","大豆蛋白质含量太低","大豆含脂肪高","大豆难以消化"],"a":0,"e":"如果只靠喝豆浆、吃大豆来获取蛋白质，氨基酸被人体利用会受到影响，代谢产物增多，对肾脏的压力会很大，所以肾功能有问题的人我们都不让吃大豆。"},{"q":"对于高蛋白质而氨基酸不完整的植物，作者建议采用？","o":["食物互补的方法","完全不吃","高温处理","大量生吃"],"a":0,"e":"对于这种高蛋白质而氨基酸不完整的植物，最好采用食物互补的方法，也就是说缺哪种氨基酸就寻找含这种氨基酸高的食物来搭配。在这里再叮嘱一句：豆制品不要单吃。"},{"q":"计算蛋白质摄入量的原则“一看总能量”，其中优质蛋白质最好占？","o":["一半","三分之一","全部","四分之一"],"a":0,"e":"一看总能量：蛋白质一般是占总能量的 10% ～15%，总能量需要越高，蛋白质需求也就越高。优质蛋白质最好占一半。"},{"q":"按照“二看身体需求”的原则，蛋白质比例和计量要相对多一些的是？","o":["低蛋白血症的患者、身体虚弱的人","孕妇和儿童","运动员","肥胖者"],"a":0,"e":"二看身体需求：低蛋白血症的患者、身体虚弱的人蛋白质的比例和计量都要相对多一些。"},{"q":"“三看平时习惯”中提到，配置蛋白质饮食比较麻烦的是？","o":["纯吃素的人","爱吃肉的人","爱喝酒的人","挑食的人"],"a":0,"e":"三看平时习惯：纯吃素的人在配置蛋白质饮食时比较麻烦，为了保证摄入氨基酸的比例与人体所需接近，要想方设法把几种互补的食物搭配在一起。"},{"q":"那位58岁男性患者的身高体重是？","o":["身高178厘米，体重58千克","身高178厘米，体重78千克","身高170厘米，体重58千克","身高168厘米，体重58千克"],"a":0,"e":"我曾经诊疗过一个患者，58岁，男性，身高178厘米，体重58千克，平时运动量很大，每天至少运动两个小时。"},{"q":"那位58岁患者的生活方式特点是？","o":["绝对做到低脂低盐、少糖少油，每天至少运动两个小时","爱吃肉、爱喝酒","从不运动","经常熬夜"],"a":0,"e":"他吃饭也非常讲究，绝对做到低脂低盐、少糖少油，人也不胖，却在一次体检中发现患了肺癌。"},{"q":"那位58岁患者一天实际摄入的优质蛋白是？","o":["16克","47克","94克","6克"],"a":0,"e":"我给他算了一下，他一天实际摄入的优质蛋白是16克。"},{"q":"那位58岁患者的标准体重是？","o":["63千克","58千克","73千克","70千克"],"a":0,"e":"这位患者身高178厘米，标准体重是178－105=63千克。"},{"q":"按中等体力劳动者计算，那位58岁患者每天应摄入的蛋白质是？","o":["94.5克","47.25克","63克","16克"],"a":0,"e":"按照前面介绍的能量比例计算，以一个中等体力劳动者为参照，每天应摄入的蛋白质为63×40×15%÷4＝94.5克。"},{"q":"那位58岁患者每天应有的动物蛋白量是47.25克，实际只吃了16克，亏空多少？","o":["31克","47克","16克","50克"],"a":0,"e":"算出总量后，其中一半应该是动物蛋白（优质蛋白），是47.25克，可实际上他每天只吃了16克动物蛋白，亏空31克。"},{"q":"作者解释那位58岁患者患肺癌与饮食有关时，提到的营养素不包括？","o":["磷脂、蛋白质、胆固醇","铁、钙","维生素A","膳食纤维"],"a":3,"e":"运动多的人能量消耗多，肌肉损伤大，修复的速度快，因此需要的磷脂、蛋白质、胆固醇以及铁、钙等营养素也要比正常人多。同时，油脂对人体也非常重要，维生素A属于脂溶性维生素，对上皮细胞的保护以及免疫系统十分重要。【未提及膳食纤维】"},{"q":"维生素A属于脂溶性维生素，其吸收特点是？","o":["必须在有油脂的环境中才能被人体吸收利用","必须空腹吸收","只能随水吸收","加热后才能吸收"],"a":0,"e":"维生素A属于脂溶性维生素，对上皮细胞的保护以及免疫系统十分重要，而脂溶性维生素必须在有油脂的环境中才能被人体吸收利用。"},{"q":"作者给那位58岁患者制定的每日食谱是？","o":["两个鸡蛋+400毫升牛奶+100～150克肉类","一个鸡蛋+200毫升牛奶+50克肉","三个鸡蛋+500毫升牛奶","只吃蔬菜和豆制品"],"a":0,"e":"你可以每天吃两个鸡蛋+400毫升牛奶+100～150克肉类（包括各种瘦肉、鱼、虾等）。"},{"q":"作者提醒，200毫升牛奶或酸奶中含有多少蛋白质？","o":["6～7克","3克","12克","17～20克"],"a":0,"e":"200毫升牛奶或者酸奶中含有6～7克蛋白质，1个鸡蛋中含有6～7克蛋白质，100克的瘦肉或者鱼中含有17～20克蛋白质。"},{"q":"作者提醒，1个鸡蛋中含有多少蛋白质？","o":["6～7克","3克","12克","17～20克"],"a":0,"e":"1个鸡蛋中含有6～7克蛋白质。"},{"q":"发现肺癌三年后，那位58岁患者的情况是？","o":["长胖了，体质明显变强，肿瘤没有复发","病情恶化","体重继续下降","需要手术"],"a":0,"e":"发现肺癌后过了三年，他长胖了，体质明显变强。关键是这三年里，肿瘤没有复发。"},{"q":"如果蛋白质缺乏不严重，通常很难表现出来，其中儿童的表现是？","o":["生长发育迟缓","体重超标","性早熟","多动"],"a":0,"e":"如果蛋白质不是缺乏到很严重的程度，是很难表现出来的。通常有儿童生长发育迟缓、成人头发稀少干枯易断、人体代谢率下降、蛋白质类激素减少、新陈代谢所需各种酶的功能减弱等慢性表现。"},{"q":"成人蛋白质缺乏的慢性表现不包括？","o":["头发稀少干枯易断","代谢率下降","蛋白质类激素减少","血压升高"],"a":3,"e":"通常有儿童生长发育迟缓、成人头发稀少干枯易断、人体代谢率下降、蛋白质类激素减少、新陈代谢所需各种酶的功能减弱等慢性表现。【高血压不在其列】"},{"q":"蛋白质更加缺乏后，可能出现的不适不包括？","o":["抵抗力低下，容易感冒发烧","肌肉无力，容易疲劳","消化不良、全身发冷","皮肤出油增多"],"a":3,"e":"例如，抵抗力低下，容易感冒发烧或者发生泌尿系统感染；肌肉无力，容易疲劳；胃肠道蠕动能力下降和消化酶的缺乏，导致消化不良；全身发冷，没有力气，甲状腺功能低下；贫血，双下肢水肿或有腹水，骨质疏松，等等。"},{"q":"很多人以为骨质疏松只是缺钙，作者指出也可能是缺蛋白质，因为？","o":["蛋白质在骨骼中以骨胶原的形式存在，增加骨骼韧性，并提供矿物质依附保证硬度","蛋白质是骨骼的主要成分","蛋白质能转化成钙","蛋白质能促进钙吸收"],"a":0,"e":"很多人以为骨质疏松只是缺钙，但其实很有可能是缺蛋白质。蛋白质在骨骼中以骨胶原的形式存在，增加了骨骼的韧性。此外，它还提供矿物质依附，保证骨骼的硬度。"},{"q":"那位70多岁男患者最初因心悸气短就诊于？","o":["心内科","骨科","神经内科","营养科"],"a":0,"e":"我曾经接诊过一个男患者，70多岁，因为经常心悸气短去心内科诊治，心内科医生做了几项检查，认为“问题不大”。"},{"q":"那位70多岁患者因双下肢无力找骨科医生，得到的诊断是？","o":["腰椎间盘轻度突出，不需要处理，与无力无关","腰椎骨折","关节炎","坐骨神经痛"],"a":0,"e":"骨科医生的诊断意见是“腰椎间盘轻度突出”，不需要处理，双下肢无力与椎间盘突出没有关系。"},{"q":"作者让那位70多岁患者提起裤腿，用食指压他的胫骨前面，发现两个深深的凹陷，这是？","o":["可凹性水肿","静脉曲张","肌肉萎缩","皮下出血"],"a":0,"e":"于是，我让他把裤腿提起来，用食指压了压他的胫骨前面，两个深深的凹陷非常明显地显现出来，这是可凹性水肿，更证明了我的推断。"},{"q":"那位70多岁患者的血色素化验值是？","o":["8.5克","10.5克","12.5克","6.5克"],"a":0,"e":"血常规里的血色素一项，数值是8.5克，低于正常值；生化项目中的血浆白蛋白一项，化验值为34毫摩尔／升，也低于正常值。"},{"q":"那位70多岁患者的血浆白蛋白化验值是？","o":["34毫摩尔/升","44毫摩尔/升","24毫摩尔/升","54毫摩尔/升"],"a":0,"e":"生化项目中的血浆白蛋白一项，化验值为34毫摩尔／升，也低于正常值。"},{"q":"那位70多岁患者营养不良的原因是？","o":["老伴3年前去世，一个人生活，长期饮食单一","患有消化道肿瘤","刻意节食减肥","牙齿全部脱落"],"a":0,"e":"原来老先生的老伴3年前去世了，儿女都在海外工作，无法近身照顾，老先生自己一个人生活。以前老伴做饭，这三年老伴走了，老先生就凑合着吃。长期的饮食单一，营养跟不上，导致了这一系列问题。"},{"q":"考虑到咀嚼能力较差，作者建议那位老先生平日多吃？","o":["肝脏、鸭血","坚果、豆类","粗粮、蔬菜","水果、牛奶"],"a":0,"e":"由于老先生咀嚼能力较差，吃肉比较困难，我建议他一天吃两个鸡蛋，两袋牛奶。平日多吃些肝脏、鸭血，这两种食物好咀嚼，同时补血效果好。肉类中可选择鱼肉，也可以将红肉做成肉馅吃。"},{"q":"蛋白质摄入过多的公认危害不包括？","o":["胃肠道功能紊乱","肝脏损伤","肾脏损害","骨质疏松"],"a":3,"e":"第一，胃肠道功能紊乱。第二，肝脏损伤。第三，肾脏损害。【骨质疏松是蛋白质缺乏的表现，不在蛋白质过多的危害中】"},{"q":"蛋白质摄入过多造成肝脏损伤，其机制是？","o":["肠道有毒气体堆积过多，被吸收入血液到达肝脏解毒，超过肝脏解毒能力","蛋白质直接毒害肝细胞","肝脏需要合成更多胆汁","脂肪在肝脏堆积"],"a":0,"e":"第二，肝脏损伤。当蛋白质摄入过量，肠道的有毒气体堆积过多，这些气体就会被吸收入血液，最终到达肝脏进行解毒。所以，如果蛋白质摄入过多，超过了肝脏的解毒能力，将会造成肝脏的损害。"},{"q":"蛋白质代谢产物如尿素、肌酐、肌酸和尿酸需经哪里排出？","o":["肾脏滤过进入尿中","肝脏分解","肠道排出","皮肤汗液"],"a":0,"e":"第三，肾脏损害。不能被人体利用的蛋白质代谢产物如尿素、肌酐、肌酸和尿酸需经肾脏滤过进入尿中，继而排出体外。"},{"q":"作者用“一碗面条和一碗红烧肉”设问，说明的关键点是？","o":["动物性食物中的优质蛋白吸收利用率高，且受身体限制很难吃多","面条比肉有营养","肉比面条好吃","红烧肉能量更低"],"a":0,"e":"从动物性食物中获得的是优质蛋白，吸收利用率高，而且受身体的限制，很难吃多。"},{"q":"为什么肉一次吃不了多少？","o":["胃里面的胃蛋白酶活性和总量有限，且动物性食物油脂多易腻","肉太贵","肉难咀嚼","肉纤维太粗"],"a":0,"e":"肉一次吃不了多少，因为胃里面的胃蛋白酶活性和总量有限，当超过了胃蛋白酶分解能力时，你会觉得“吃不动了”。同时动物性食物里油脂较多，会有种很腻的感觉。"},{"q":"下列食物中，植物蛋白容易吃多、生物利用度较低的是？","o":["豆类（各种豆制品）和一些食用菌","瘦肉和鱼类","鸡蛋和牛奶","水果和蔬菜"],"a":0,"e":"但是植物性蛋白容易吃多，比如豆类（各种豆制品），还有一些食用菌。这些植物蛋白的生物利用度比较低，不能被利用的部分只能经肝脏转化再经肾脏排出体外，从而加重肝脏和肾脏的负担。"},{"q":"作者对蛋白质摄入的总态度是？","o":["既适量又质优","越多越好","越少越好","无所谓"],"a":0,"e":"所以，蛋白质的摄入不是一味要多吃，也不是一味要少吃，而是要既适量又质优。"},{"q":"蛋白质平衡本质上是？","o":["氨基酸的平衡","能量的平衡","酸碱的平衡","水盐的平衡"],"a":0,"e":"蛋白质平衡本质上是氨基酸的平衡，也就是摄入的蛋白质中所含的氨基酸的量和各种氨基酸的比例要与人体所消耗的量和比例基本相当。"},{"q":"氨基酸组成与人体所需基本一致的蛋白质被称为？","o":["优质蛋白","完全蛋白粉","必需蛋白","结构性蛋白"],"a":0,"e":"氨基酸组成与人体所需基本一致的蛋白质被称为优质蛋白。这类蛋白质主要是动物蛋白质，包括肉、蛋、奶。"},{"q":"优质蛋白的定义是？","o":["蛋白质的氨基酸模式越接近人体蛋白质的氨基酸模式，越容易被人体吸收利用","分子量最小的蛋白质","价格最贵的蛋白质","含量最高的蛋白质"],"a":0,"e":"(1) 优质蛋白质：蛋白质的氨基酸模式越接近人体蛋白质的氨基酸模式，越容易被人体吸收利用，这种蛋白质为优质蛋白质。"},{"q":"优质蛋白中的“肉”包括？","o":["四条腿的畜类、两条腿的禽类和没有腿的鱼类","只包括猪牛羊","只包括鸡鸭","只包括鱼虾"],"a":0,"e":"这类蛋白质主要是动物蛋白质，包括肉、蛋、奶，这里的肉包括四条腿的畜类、两条腿的禽类和没有腿的鱼类。"},{"q":"在一个人每天的饮食中，优质蛋白也就是动物类蛋白应占摄入蛋白质总量的？","o":["一半","三分之一","四分之三","全部"],"a":0,"e":"在一个人每天的饮食中，优质蛋白也就是动物类蛋白应占摄入蛋白质总量的一半。"},{"q":"例子中那位30多岁男性的身高体重是？","o":["身高178厘米，体重78千克","身高178厘米，体重58千克","身高175厘米，体重72千克","身高180厘米，体重80千克"],"a":0,"e":"举个例子：男性，30多岁，身高178厘米，体重78千克，每天对着电脑工作，一周打一次篮球。"},{"q":"那位30多岁男性的标准体重是？","o":["73千克","78千克","68千克","75千克"],"a":0,"e":"标准体重是178－105=73千克，运动量不大，总能量为73×30=2190千卡。"},{"q":"那位30多岁男性一天所需的蛋白质约为？","o":["82克","73克","41克","42克"],"a":0,"e":"此人一天所需的蛋白质为2190×0.15÷4 =82克。"},{"q":"那位30多岁男性每日所需的动物蛋白约为？","o":["41克","82克","30克","12克"],"a":0,"e":"这样算下来，每日所需的动物蛋白应该是41克左右。"},{"q":"那位30多岁男性每天需要吃多少瘦肉？","o":["150克左右（大概含30克蛋白）","300克（含60克蛋白）","50克（含10克蛋白）","500克"],"a":0,"e":"他每天需要吃150克左右的瘦肉（大概含30克蛋白），一个鸡蛋（大概含6克蛋白）和200毫升牛奶（大概含6克蛋白）。"},{"q":"作者提醒：几种优质蛋白质的食物之间可以互换，但？","o":["豆浆不能代替牛奶","鸡蛋可以代替牛奶","鱼可以代替所有肉类","蔬菜可以代替肉类"],"a":0,"e":"有几点要特别提醒大家：豆浆不能代替牛奶。"},{"q":"关于蛋白质摄入的总体平衡，作者建议最好以什么为周期？","o":["一周","一天","一个月","一餐"],"a":0,"e":"一般来讲，一段时间内做到总体平衡就可以了，最好以一周为一个周期。如果今天吃肉很少，第二天、第三天可以补上。"},{"q":"作者建议周末时可以做的一件有助于平衡的事是？","o":["做一下“饮食修补”，把不够的补一补","断食一天","暴饮暴食","加大运动量"],"a":0,"e":"如果平时工作很忙，顾不上每一顿饭都做到膳食平衡，可以在周末的时候做一下“饮食修补”，回忆一下这一周的食谱，哪种食物进食过多，哪种食物不够，多的别吃了，把不够的补一补，这样也能达到膳食平衡。"},{"q":"对于肾衰竭的人，蛋白质摄入的原则是？","o":["严格控制蛋白质的质量和数量，以防进一步损害肾功能","多多益善","完全不吃","只吃植物蛋白"],"a":0,"e":"而对于肾衰竭的人，则要严格控制蛋白质的质量和数量，以防进一步损害肾功能。当然肝硬化的患者更要注意。"},{"q":"在一个人每天的饮食中，动物类蛋白应占蛋白质总量的？","o":["三分之一","一半","全部","五分之一"],"a":1,"e":"在一个人每天的饮食中，优质蛋白也就是动物类蛋白应占摄入蛋白质总量的一半。对于这种高蛋白质而氨基酸不完整的植物，最好采用食物互补的方法……豆制品不要单吃。"},{"q":"碳水化合物最大的功能是？","o":["为人体提供能量","构成细胞结构","调节代谢","养肠道菌群"],"a":0,"e":"前面讲了蛋白质对于人体的意义，复杂而重要。相比之下，碳水化合物就简单朴素多了，它最大的功能就是为人体提供能量。"},{"q":"碳水化合物、脂类和蛋白质都能产能，其中提供能量当数第一的是？","o":["碳水化合物","脂类","蛋白质","维生素"],"a":0,"e":"碳水化合物、脂类和蛋白质都可以产生能量，但论其功绩，碳水化合物提供的能量当数第一。"},{"q":"碳水化合物也称糖类，基本上可以等同于我们的？","o":["主食：米饭、面条、大饼、红薯、土豆等","蔬菜","水果","肉类"],"a":0,"e":"碳水化合物也称糖类，说白了基本上可以等同于我们的主食：米饭、面条、大饼、红薯、土豆等。"},{"q":"主食吃多了，多余的能量在体内的储存形式表现为？","o":["多余的脂肪","多余的肌肉","多余的骨质","多余的水分"],"a":0,"e":"主食吃多了可不是好事儿，并不会生成超多的能量，让你力大无穷，而是以化学能的形式储存起来，形式上却表现为多余的脂肪。"},{"q":"书中把肥胖者增多、慢病增多的能量代谢原因归结为？","o":["运动量迅速减少而饮食习惯没有改变，摄入能量多于消耗","食物中有毒物质增多","睡眠不足","遗传变异"],"a":0,"e":"由于运动量迅速减少，而我们的饮食习惯没有改变，摄入能量多于消耗能量，造成能量的蓄积，于是肥胖者增多，患上了很多疾病。"},{"q":"《中国居民膳食指南（2016）》指出，每人每天应摄入谷薯类食物？","o":["250～400克","150～250克","400～500克","500～700克"],"a":0,"e":"《中国居民膳食指南（2016）》指出：每人每天应摄入谷薯类食物250～400克，其中全谷物和杂豆类50～150克，薯类50～100克。"},{"q":"指南中全谷物和杂豆类的每日推荐量是？","o":["50～150克","250～400克","50～100克","150～250克"],"a":0,"e":"每人每天应摄入谷薯类食物250～400克，其中全谷物和杂豆类50～150克，薯类50～100克。"},{"q":"指南中薯类的每日推荐量是？","o":["50～100克","50～150克","250～400克","100～200克"],"a":0,"e":"其中全谷物和杂豆类50～150克，薯类50～100克。"},{"q":"书中解释指南给出的碳水摄入量跨度很大，原因是？","o":["中国幅员辽阔，经济发展不均衡，人们劳动强度不一样","食物种类太多","统计口径不统一","各地口味差异"],"a":0,"e":"因为中国幅员辽阔，经济发展不均衡，人们的劳动强度也不一样。"},{"q":"据国家统计局2014年公布的数据，2013年末中国城镇人口占总人口的？","o":["53.73%","46.27%","60%","40%"],"a":0,"e":"国家统计局2014年公布的数据显示，2013年末，中国城镇人口占总人口的53.73%，也就是说农村和城市人口基本上各占一半。"},{"q":"同样100克，米面的淀粉含量是薯类（土豆、山药、芋头等）的？","o":["四倍","两倍","一倍","六倍"],"a":0,"e":"白米、白面中的淀粉含量较高，同样100克，米面的淀粉含量是薯类（土豆、山药、芋头等）的四倍，是豆类（赤小豆、芸豆等）的近两倍。"},{"q":"同样100克，米面的淀粉含量是豆类（赤小豆、芸豆等）的？","o":["近两倍","近四倍","三倍","相同"],"a":0,"e":"米面的淀粉含量是薯类（土豆、山药、芋头等）的四倍，是豆类（赤小豆、芸豆等）的近两倍。"},{"q":"关于体力劳动者与碳水摄入，作者的建议是？","o":["体力劳动者应多吃含淀粉的食物，运动量一旦减少就要立即改变主食的种类和数量","体力劳动者也不能多吃主食","体力劳动者应多吃肉","主食量终生不变"],"a":0,"e":"体力劳动者应该多吃一些含淀粉的食物，面条、馒头、米饭都很好。但是运动量一旦减少，就要立即改变主食的种类和数量，减少淀粉的摄入。"},{"q":"那位67岁男患者的血糖血压情况是？","o":["血糖高、血压高，吃过不少药","血糖血压都正常","只有血糖高","只有血压高"],"a":0,"e":"我诊治过一个男患者，67岁，血糖高，血压高，吃过不少药。他很胖，尤其是肚子很大。他不喝酒，不吸烟，天天散步，但是效果还是不太好。"},{"q":"那位67岁男患者每天要吃多少面条？","o":["2～3顿，将近500克（1斤）","1顿，约100克","3顿，约300克","基本不吃面条"],"a":0,"e":"他每天要吃2～3顿面条，将近500克（1斤），早上喝粥，很少吃粗粮；肉一天大概50～100克，蔬菜一天不到250克（半斤）；基本不吃水果，不喝牛奶，很少吃鱼。"},{"q":"那位67岁男患者每天吃的蔬菜不足？","o":["250克（半斤）","500克（1斤）","100克（2两）","1000克（2斤）"],"a":0,"e":"肉一天大概50～100克，蔬菜一天不到250克（半斤）；基本不吃水果，不喝牛奶，很少吃鱼。"},{"q":"作者分析那位67岁男患者营养严重不平衡，表现为？","o":["碳水化合物和盐吃得太多，蔬菜、水果吃得太少","蛋白质吃得太少，主食太少","脂肪太多，主食太少","水和膳食纤维太少"],"a":0,"e":"很明显，这位患者的营养严重不平衡，碳水化合物和盐吃得太多，而蔬菜、水果吃得太少。"},{"q":"患者听要停掉面条后很着急，理由是他？","o":["从小吃面条长大，习惯了，吃别的吃不下去","觉得面条最便宜","认为面条最有营养","担心营养不良"],"a":0,"e":"这位患者一听要停掉面条，急了：“我从小吃面条长大，每天早上都喝粥、吃咸菜，习惯了，吃别的吃不下去。”"},{"q":"作者向那位67岁患者解释：过去干农活要用力气、要出汗，所以多吃面条？","o":["绝对正确","也不合适","有害健康","无关紧要"],"a":0,"e":"我看着他，乐了：“过去干农活，要用力气，要耗能量，而且还要出汗。汗水是什么味道的？是咸味，所以多吃面条绝对正确。但是您从地头搬到了楼房，运动少了，再这样吃，食物进到身体中成了负担，血压、血糖就都升高了。”"},{"q":"作者告诉那位67岁患者，什么情况下还可以多吃些面条？","o":["血压正常了，运动量增多，而且每天出汗","体重下降后","血糖正常后","想吃就吃"],"a":0,"e":"不，吃一点儿还是可以的。以后您要是血压正常了，运动量增多，而且每天出汗，还是可以多吃些面条的。"},{"q":"那位67岁患者回去后把什么蒸一蒸当主食吃？","o":["土豆","南瓜","芋头","玉米"],"a":0,"e":"他回去后吃饭时增加了粗粮，有时把土豆蒸一蒸，当主食吃。土豆也是他从小的最爱，既能吃饱，还补充了膳食纤维、钾等元素。"},{"q":"那位67岁患者饮食调整后两个月的变化是？","o":["肚子小了很多，面色也好了","血压完全正常","体重没变","血糖升高"],"a":0,"e":"两个月后，他来复查，哇，肚子小了很多，面色也好了。一年之后，他的降压药从三种减成一种，血糖也很平稳。"},{"q":"那位67岁患者调整饮食一年后，降压药从三种减成？","o":["一种","两种","完全停药","四种"],"a":0,"e":"一年之后，他的降压药从三种减成一种，血糖也很平稳。"},{"q":"如果碳水化合物摄入不足，人容易出现？","o":["低血糖症状，皮下脂肪及肌肉分解供能，长期明显消瘦","高血糖","腹部肥胖","血脂升高"],"a":0,"e":"如果碳水化合物摄入不足，人就容易出现低血糖症状，皮下脂肪及肌肉也会分解来供能，长期下去就会明显消瘦。"},{"q":"一个人很胖、特别是腹部肥胖，或血浆中甘油三酯明显增高（排除饮酒因素），则提示？","o":["碳水化合物摄入过多","蛋白质摄入过多","脂类摄入过少","维生素缺乏"],"a":0,"e":"反之，如果一个人很胖，特别是腹部肥胖，或者血浆中甘油三酯明显增高，排除饮酒的因素，则提示碳水化合物摄入过多。"},{"q":"有些人总有小肚子且软软的，提示？","o":["碳水化合物在饮食中所占的比例较高","蛋白质摄入不足","缺乏运动","遗传所致"],"a":0,"e":"有些人体重正常或者还有些偏低，但是摸摸自己的腹部，总有小肚子，而且软软的，这就提示碳水化合物在饮食中所占的比例较高，应该调整。"},{"q":"那位青岛女老师的血糖情况是？","o":["血糖高，吃着两种降糖药","血糖正常","血糖偏低","只有餐后血糖高"],"a":0,"e":"有一段时间我在青岛讲课，遇到一位女老师，30多岁，血糖高，吃着两种降糖药。"},{"q":"那位青岛女老师的身高体重和BMI是？","o":["身高160厘米，体重82千克，BMI 32","身高160厘米，体重60千克，BMI 23","身高170厘米，体重82千克，BMI 28","身高155厘米，体重70千克，BMI 29"],"a":0,"e":"她的身高160厘米，体重82千克，BMI为32，腰围110厘米，属于向心性肥胖。"},{"q":"那位青岛女老师的腰围是？","o":["110厘米","90厘米","100厘米","120厘米"],"a":0,"e":"她的身高160厘米，体重82千克，BMI为32，腰围110厘米，属于向心性肥胖。"},{"q":"“向心性肥胖”指的是？","o":["患者体内脂肪沉积以心脏、腹部为中心","脂肪主要沉积在臀部","四肢脂肪多","全身均匀肥胖"],"a":0,"e":"(1) 向心性肥胖：亦称中心型肥胖，指的是患者体内脂肪沉积是以心脏、腹部为中心的一种肥胖。"},{"q":"那位青岛女老师每天吃水果的量是？","o":["500克（1斤）以上","100克","250克","不水果"],"a":0,"e":"平日家里水果不断，每天要吃500克（1斤）以上。每周她还要吃两三次甜食。"},{"q":"那位青岛女老师吃土豆的方式是？","o":["把土豆当菜，一边吃米饭，一边吃土豆丝","把土豆当主食，不吃米饭","油炸土豆片","不吃土豆"],"a":0,"e":"她尤其喜欢吃土豆，总是把土豆当菜，一边吃米饭，一边吃土豆丝，再加上个黄瓜拌粉丝。"},{"q":"作者指出，米饭、土豆、粉丝、粉条本质上都是？","o":["碳水化合物","蛋白质","脂类","膳食纤维"],"a":0,"e":"其实这些食物中，米饭、土豆、粉丝、粉条都是碳水化合物。很明显这个患者的能量基本上来自碳水化合物，总量太多，比例太高，运动量又太少，造成血糖居高不下。"},{"q":"那位青岛女老师调整饮食3个月后的变化是？","o":["体重减了10斤，腰围减了2厘米","体重减了20斤","血压恢复正常","血糖完全正常"],"a":0,"e":"3个月后，我见到她，她高兴地告诉我：“我体重减了10斤，腰围减了2厘米。”"},{"q":"又过约8个月后，那位青岛女老师的降糖药调整情况是？","o":["只吃二甲双胍，停掉了阿格列汀","两种药都停了","增加到三种药","改为胰岛素"],"a":0,"e":"又过了大概8个月，我再次见到她，我都有点怀疑了，这还是那位胖胖的老师吗？她身材匀称，曲线清晰……降糖药只吃二甲双胍，停掉了阿格列汀。"},{"q":"碳水化合物的摄入量主要由什么决定？","o":["体力消耗的多少","年龄","性别","身高"],"a":0,"e":"碳水化合物的摄入量，主要是由体力消耗的多少来决定。"},{"q":"脑力劳动者同时运动少的人，每天至少要保证多少粮食？","o":["150克左右","250克","50克","400克"],"a":0,"e":"脑力劳动者同时运动少的人吃的粮食量要少一些，但是每天至少要保证150克左右的粮食。"},{"q":"关于不同人群的粮食摄入，作者指出？","o":["正在长身体的少年儿童要多吃粮食，而老年人要相应减少","少年儿童和老年人都应多吃","少年儿童要少吃","老年人要多吃"],"a":0,"e":"另外，正在长身体的少年儿童要多吃粮食，而老年人要相应减少。"},{"q":"作者建议多吃复合型碳水化合物，下列属于复合型的是？","o":["土豆、燕麦、莲藕","蔗糖","精米","精面"],"a":0,"e":"平时可以少吃多餐，多吃复合型碳水化合物（天然的食物都是复合型，比如土豆、燕麦、莲藕等），少吃蔗糖和精米精面。"},{"q":"消化能力很差的人可以暂时吃什么？","o":["糊精（白米粥里的汤汁）","油炸食品","粗粮","生冷水果"],"a":0,"e":"消化能力很差的人可以暂时吃糊精（白米粥里的汤汁），但是要注意搭配其他营养素，并且时间不要持续太长，摄入量上要注意。"},{"q":"关于“喝粥养人”，作者的解释是？","o":["过去喝的粥是粗粮煮成糊状，现在的米是精米、免淘米，没有麸皮，两者对人影响差异巨大","粥都很有营养","现在的粥更有营养","喝粥会导致营养不良"],"a":0,"e":"中国人总讲“喝粥养人”，实际上过去喝的粥和现在的不一样，老祖宗吃的五谷全部是粗粮，煮一煮，煮成糊状才能吃得进去。而现在的米是精米，是免淘米，没有麸皮。所以虽然同样是粥，对人的影响却差异巨大。"},{"q":"碳水化合物的等量交换中，50克白米、白面大约等于多少薯类？","o":["200克","400克","100克","50克"],"a":0,"e":"一般来讲，50克白米、白面换算为薯类，大约等于 200 克，换算为水果（比如苹果和梨），大约等于400克。"},{"q":"碳水化合物的等量交换中，50克白米、白面大约等于多少水果（苹果和梨）？","o":["400克","200克","100克","500克"],"a":0,"e":"50克白米、白面换算为薯类，大约等于 200 克，换算为水果（比如苹果和梨），大约等于400克。吃了薯类或者水果，相应地减少米面，甚至这顿饭可以不吃米面。"},{"q":"吃了薯类或者水果后，应该？","o":["相应地减少米面，甚至这顿饭可以不吃米面","额外再吃同样多的米面","不用调整","减少蛋白质"],"a":0,"e":"吃了薯类或者水果，相应地减少米面，甚至这顿饭可以不吃米面。"},{"q":"作者指出，老百姓“谈油色变”、吃菜用清水涮，结果往往是？","o":["大腹便便没下去，却又患上了新病","成功瘦身","血脂明显改善","身体更健康"],"a":0,"e":"很多人吃菜基本上不用油炒，碰到有油的菜还用清水涮涮再吃，久而久之，大腹便便没下去，却又患上了新病。根本原因还是我们对脂类的误解太深了。"},{"q":"脂类包括？","o":["脂肪和类脂","饱和脂肪酸和不饱和脂肪酸","动物脂肪和植物脂肪","甘油和脂肪酸"],"a":0,"e":"脂类包括脂肪和类脂，脂肪是甘油三酯，又称中性脂肪；类脂包括磷脂、胆固醇和糖脂。"},{"q":"脂肪又称？","o":["中性脂肪","酸性脂肪","类脂","磷脂"],"a":0,"e":"脂肪是甘油三酯，又称中性脂肪。"},{"q":"类脂包括？","o":["磷脂、胆固醇和糖脂","甘油三酯","饱和脂肪酸","必需脂肪酸"],"a":0,"e":"类脂包括磷脂、胆固醇和糖脂。"},{"q":"三大产能营养素的供能顺序是？","o":["先利用葡萄糖，脂肪在葡萄糖用完后才被分解供能","先利用脂肪，再用葡萄糖","先利用蛋白质","三者同时供能"],"a":0,"e":"虽然三大产能营养素都能供能，但是有先后顺序。先利用的是葡萄糖，脂肪只有在人体中的葡萄糖使用完了以后才会被分解去提供能量。"},{"q":"作者用竞走运动员瘦、铅球运动员胖来说明？","o":["长时间运动后半截靠分解脂肪供能，一瞬间运动糖还没消耗完脂肪留在皮下","运动项目决定体型","胖瘦由饮食决定","铅球运动员吃得更多"],"a":0,"e":"我们看竞走运动员都很瘦，而铅球运动员都很胖，只因竞走是长时间的运动，身体中储存的葡萄糖被分解完后，运动的后半截靠分解脂肪产生能量；而铅球是一瞬间的运动，糖还没有被消耗完，所以脂肪还留存在皮下。"},{"q":"脂肪作为脂溶性维生素的载体，涉及的维生素是？","o":["维生素A、D、E、K","维生素B族","维生素C","维生素B12"],"a":0,"e":"第二，是脂溶性维生素的载体。维生素A、D、E、K等脂溶性维生素，只有在有油脂的环境下才可以被吸收。因此，不吃油脂的人常会出现脂溶性维生素不足等症状。"},{"q":"被称为人体必需脂肪酸的是哪两种？","o":["ω-6系列的亚油酸和ω-3系列的亚麻酸","饱和脂肪酸和反式脂肪酸","油酸和棕榈酸","胆固醇和磷脂"],"a":0,"e":"第三，提供必需脂肪酸。ω-6系列的亚油酸和ω-3系列的亚麻酸是人体必需的两种脂肪酸。"},{"q":"必需脂肪酸是合成多种生物活性物质的原料，不包括？","o":["磷脂","前列腺素（PG）","血栓素（TXA）","葡萄糖"],"a":3,"e":"这类脂肪酸只能依赖从外界的摄入，且往往在身体里承担了重要的角色，是合成很多生物活性物质的原料，比如：磷脂、前列腺素（PG）、血栓素（TXA）、白三烯（LT）和调节胆固醇等。"},{"q":"那位45岁女患者的主要困扰是？","o":["睡觉时必须垫高枕头并向右卧，否则胃酸涌向咽部有强烈胃灼热感","反复发热","持续头痛","关节肿痛"],"a":0,"e":"最烦恼的事情是睡觉时必须垫高枕头，而且要向右卧，如果头低一点或者向左卧位，热热的胃酸就会涌向咽部，有种强烈的胃灼热感。"},{"q":"那位45岁女患者的检查结果是？","o":["反流性食管炎、胃下垂、尿蛋白阳性和潜血","胃溃疡、肾炎","胆结石、脂肪肝","一切正常"],"a":0,"e":"她去消化科做检查，诊断为反流性食管炎；做B超，医生告诉她胃下垂得很厉害；查尿常规，尿液出现蛋白质阳性和潜血等一系列问题。"},{"q":"作者认为那位女患者胃下垂的根源是？","o":["饮食中的脂肪缺乏，脏器间支撑不足","长期站立","腹肌无力","年龄增长"],"a":0,"e":"脂肪在脏器之间起着无法替代的支撑作用，缺乏脂肪会导致固定胃的韧带和网膜不牢固，胃受重力影响就会发生下垂，所以她的胃下垂归根结底是缘于饮食中的脂肪缺乏。"},{"q":"那位女患者贲门括约肌收缩无力，贲门位于？","o":["食道与胃之间的平滑肌","胃与十二指肠之间","咽喉部","肛门处"],"a":0,"e":"饮食结构不平衡，蛋白质、脂肪摄入不足，从而导致了器官功能下降，造成贲门括约肌（食道与胃之间的平滑肌）收缩无力，全身肌肉无力。"},{"q":"作者把“脂肪恐惧”评价为？","o":["一个尤为突出的重灾区","完全正确的健康观念","无关紧要的小事","医学界的共识"],"a":0,"e":"现在大家都非常注重健康，注重身材保养，但是对一些知识却一知半解，对一些概念也不求甚解，随随便便就拿来用，“脂肪恐惧”是一个尤为突出的重灾区。"},{"q":"关于脂肪，作者的核心观点是？","o":["脂肪多了不好，但没有脂肪、脂肪不够一样会带来很多疾病，要追求适度","脂肪越少越好","脂肪完全不能吃","脂肪多多益善"],"a":0,"e":"是的，脂肪多了自然不好，但是没有脂肪呢？脂肪不够呢？一样会带来很多疾病，大家要追求适度而不是盲目地减少。"},{"q":"磷脂在人体中的作用不包括？","o":["活化细胞，维持细胞新陈代谢和基础代谢","增强免疫力和细胞再生力","调节血脂、保持血管通畅","直接提供大量能量"],"a":3,"e":"磷脂不仅对活化细胞，维持细胞新陈代谢、基础代谢及荷尔蒙的均衡分泌有重大作用，而且在增强人体免疫力和细胞的再生力方面也十分关键，在调节血脂、保持血管通畅方面更是扮演着重要的角色。"},{"q":"人体神经细胞和大脑细胞结构中大约有多少是磷脂？","o":["一半","三分之一","四分之一","全部"],"a":0,"e":"尤其要强调的一点是：人体的神经细胞和大脑细胞结构中大约有一半是磷脂。磷脂的质量和数量决定了大脑细胞间信息传递的速度，因此具有增强记忆力、预防老年痴呆的功能。"},{"q":"磷脂的质量和数量决定了？","o":["大脑细胞间信息传递的速度","肌肉收缩的力量","骨骼的密度","血液的黏稠度"],"a":0,"e":"磷脂的质量和数量决定了大脑细胞间信息传递的速度，因此具有增强记忆力、预防老年痴呆的功能。"},{"q":"小孩子半岁就要增加鸡蛋、猪肝、肉类等辅食，主要原因是？","o":["大脑发育很快，卵磷脂、铁、蛋白质及磷脂正是孩子最需要的营养素","孩子需要更多能量","孩子牙齿发育需要","孩子需要补钙"],"a":0,"e":"大家都知道小孩子半岁时就要开始增加鸡蛋、猪肝、肉类等辅食，主要原因是大脑的发育很快，鸡蛋里的卵磷脂，猪肝和肉里的铁、蛋白质及磷脂正是孩子最需要的营养素。"},{"q":"增加鱼油类食物（如DHA、EPA）的作用是？","o":["提高脑细胞的磷脂的质量","提高肌肉力量","促进骨骼生长","改善视力"],"a":0,"e":"另外，增加鱼油类食物（如DHA、EPA）也可以提高脑细胞的磷脂的质量。"},{"q":"胆固醇约占人体体重的？","o":["0.2%","2%","5%","20%"],"a":0,"e":"胆固醇占人体体重0.2%，和磷脂、蛋白质并肩作战，成为细胞膜的结构成分，它的作用是增加细胞膜的韧性和坚固度，防止细胞膜损伤。"},{"q":"胆固醇在细胞膜中的作用是？","o":["增加细胞膜的韧性和坚固度，防止细胞膜损伤","提供能量","携带氧气","催化反应"],"a":0,"e":"它的作用是增加细胞膜的韧性和坚固度，防止细胞膜损伤。"},{"q":"胆固醇是形成哪类激素的原料？","o":["肾上腺皮质激素和性激素","甲状腺素和胰岛素","生长激素","肾上腺素以外的肽类激素"],"a":0,"e":"另外，它还是形成肾上腺皮质激素和性激素的原料。性激素包括了男性的雄性激素、女性的雌激素和孕激素。"},{"q":"怕胖而完全不吃肉蛋奶等含胆固醇食物的人，可能因此患上？","o":["卵巢早衰或性功能障碍","甲状腺功能亢进","糖尿病","高血压"],"a":0,"e":"在临床上，我们经常见到很多怕胖、恐慌胆固醇摄入过多的患者，他们不吃肉蛋奶等含胆固醇的食物，却因此患上了卵巢早衰或者性功能障碍。"},{"q":"胆固醇进入人体后还要参与合成？","o":["维生素D3和胆汁酸","维生素C和叶酸","胰岛素和胰高血糖素","血红蛋白"],"a":0,"e":"不仅如此，胆固醇进入人体后还要参与合成维生素D3 和胆汁酸，从而防止骨质疏松、低钙，帮助脂类消化和吸收。"},{"q":"糖脂在什么结构中分布很广？","o":["神经髓鞘","肌肉纤维","骨基质","毛细血管"],"a":0,"e":"糖脂在神经髓鞘中分布很广，神经髓鞘的作用是绝缘和增快神经传导速度。"},{"q":"神经髓鞘的作用是？","o":["绝缘和增快神经传导速度","储存能量","分泌激素","运输氧气"],"a":0,"e":"神经髓鞘的作用是绝缘和增快神经传导速度。大家可能听说过三叉神经痛，就是三叉神经的髓鞘破损造成了神经短路的结果。"},{"q":"三叉神经痛的成因是？","o":["三叉神经的髓鞘破损造成了神经短路","三叉神经被压迫","缺乏维生素C","细菌感染"],"a":0,"e":"大家可能听说过三叉神经痛，就是三叉神经的髓鞘破损造成了神经短路的结果。这种疼痛的感觉非常可怕，有种痛不欲生之感，这与类脂摄入不足息息相关。"},{"q":"出版社编辑那碗“红红的面条”里，实际上只有？","o":["面条一种食物","面条和肉","面条和蔬菜","面条和鸡蛋"],"a":0,"e":"仔细看看，里面有两种成分，一粗一细，粗的是粗面条，细的是细面条，用红色的调味酱拌在一起。闹了半天，里面只有“面条”这一种食物。"},{"q":"作者对那位只吃面条的编辑说，脑力劳动者这样吃的问题在于？","o":["神经细胞消耗的不只是糖，还有磷脂、蛋白质、胆固醇、脂肪酸、维生素和矿物质","面条能量太低","面条太难消化","面条含盐太多"],"a":0,"e":"如果你看懂了前文神经细胞所需消耗的营养素，就知道神经细胞消耗的不只是糖，还有磷脂、蛋白质、胆固醇、脂肪酸、维生素和某种矿物质。而眼前这位没有重体力劳动的编辑，仅仅补充了糖类，其他营养素都没有补充。"},{"q":"编辑担心吃肉和油会更胖，作者的回答是？","o":["游泳圈就是天天吃面吃出来的，真多吃肉和油还不一定有游泳圈","吃肉一定会更胖","必须完全吃素","油只会长肚子"],"a":0,"e":"“姑娘，这游泳圈就是你天天吃面吃出来的，你要真的多吃肉和油，还不一定有游泳圈呢。”"},{"q":"下列食物中不属于含脂类来源的是？","o":["植物油、动物油、坚果","加工食品中的脂肪","动物的皮下脂肪和大脑中的脂质","蔬菜和水果中的膳食纤维"],"a":3,"e":"食物中含脂类的有植物油、动物油、坚果、加工食品中的脂肪、动物的皮下脂肪、动物大脑中的脂质（磷脂、胆固醇、糖脂），还有鱼油。"},{"q":"一般来讲，我们每天摄入的脂类应占一天总能量的？","o":["30%左右","50%左右","10%左右","70%左右"],"a":0,"e":"一般来讲，我们每天摄入的脂类应占一天总能量的30%左右。大多数发达国家的摄入量要高于这个数，发展中国家要低于这个数。"},{"q":"关于脂类摄入量的地区差异，作者指出？","o":["北方寒冷地区居民的脂类摄入量要多于南方温暖地区居民","南方居民应多于北方","东西部无差异","城市应多于农村"],"a":0,"e":"在此范围内，北方寒冷地区居民的脂类摄入量要多于南方温暖地区居民。"},{"q":"在30%左右的脂类中，三种脂肪酸应各占？","o":["10%","30%","50%","3%"],"a":0,"e":"在这30%左右的脂类中，饱和脂肪酸、单不饱和脂肪酸和多不饱和脂肪酸这三种脂肪酸应各占10%。"},{"q":"在室温下，饱和脂肪酸大多处于什么状态？","o":["凝固状态","流动状态","气态","溶解状态"],"a":0,"e":"有个简单办法可以进行判断：在室温下饱和脂肪酸大多处于凝固状态，比如大肥肉、腊肉。植物油中的椰子油和棕榈油也是饱和脂肪酸。"},{"q":"下列植物油中属于饱和脂肪酸的是？","o":["椰子油和棕榈油","橄榄油和茶籽油","大豆油和玉米油","芝麻油和花生油"],"a":0,"e":"植物油中的椰子油和棕榈油也是饱和脂肪酸。"},{"q":"哪两种食用油的单不饱和脂肪酸含量在70%以上？","o":["橄榄油和茶籽油","大豆油和玉米油","椰子油和棕榈油","花生油和芝麻油"],"a":0,"e":"单不饱和脂肪酸含量在70%以上的有两种油：橄榄油和茶籽油。"},{"q":"下列属于含多不饱和脂肪酸较多的油是？","o":["大豆油、小麦胚芽油、玉米油、芝麻油和花生油","椰子油和棕榈油","猪油和牛油","黄油和奶油"],"a":0,"e":"其余的在室温下呈流动状态的油基本上都是含多不饱和脂肪酸较多的油，比如大豆油、小麦胚芽油、玉米油、芝麻油和花生油。"},{"q":"要做到三种脂肪酸各占1/3，作者给出的简单操作方法是？","o":["动物脂肪占一半，植物脂肪占一半","全部用植物油","全部用动物油","只吃坚果"],"a":0,"e":"比较简单的操作方法是：动物脂肪占一半，植物脂肪占一半。"},{"q":"例子中那位30岁男性的症状是？","o":["皮肤干燥、痒，特别容易出头皮屑，眼睛干涩","头晕、心悸","腹泻、腹痛","关节疼痛"],"a":0,"e":"一位男性，30岁，身高165厘米，体重60千克，从事轻体力劳动，每天运动1.5个小时，最近发现皮肤干燥、痒，特别容易出头皮屑，而且眼睛干涩。"},{"q":"那位30岁男性一天应摄入的总能量是？","o":["2100千卡","1800千卡","2400千卡","3000千卡"],"a":0,"e":"他一天应该摄入的总能量为35×60=2100千卡，每克脂类能够产生9千卡能量，因此他每天摄入脂类应该是2100×30%÷9 =70克。"},{"q":"那位30岁男性每天应摄入的脂类是？","o":["70克","35克","210克","100克"],"a":0,"e":"他每天摄入脂类应该是2100×30%÷9 =70克。"},{"q":"那70克脂肪应如何分配？","o":["一半来自动物脂肪，一半来自植物脂肪","全部来自炒菜油","三分之二来自动物","全部来自坚果"],"a":0,"e":"这70克脂肪是不是全部来自炒菜的油？不是的，有一半要来自动物脂肪，从肉、蛋、奶、鱼中获得；另一半来自植物脂肪，从食用油和坚果中获得。"},{"q":"一般一个人一天的植物油摄入量大约在？","o":["30毫升左右","50毫升左右","10毫升左右","100毫升左右"],"a":0,"e":"植物脂肪的摄入量特别好计算，看看油壶上的刻度，或者用小勺估量，基本上就差不多了。一个人一天的摄入量在 30 毫升左右。"},{"q":"作者建议，每天吃一个鸡蛋、一袋牛奶、100～150克瘦肉，每周吃几次鱼，动物脂肪基本够用？","o":["2～3次","1次","5次以上","不吃鱼也可以"],"a":0,"e":"一般来讲，每天吃一个鸡蛋、一袋牛奶、100～150克瘦肉，每周吃2～3次鱼，摄入的动物脂肪量基本就够用了。"},{"q":"不吃动物性食物、且植物油严格控制在30毫升的人，会怎样？","o":["只完成了应摄入量的一半，时间长了会出现油脂摄入不足的问题","刚好满足需求","摄入超标","完全不受影响"],"a":0,"e":"有些人不吃动物性食物，如果植物油的用量严格控制在30毫升，这样相当于每天只完成了应该摄入量的一半，时间长了，身体会出现许多油脂摄入不足的问题。"},{"q":"特别爱吃肥肉的人，往往存在的问题是？","o":["饱和脂肪超标","多不饱和脂肪酸不足","蛋白质不足","胆固醇不足"],"a":0,"e":"还有一种情况，特别爱吃肥肉的人，往往是饱和脂肪超标，饮食比例也要注意改一改。"},{"q":"ω-3和ω-6系列不饱和脂肪酸的摄入量一般应不少于总能量的？","o":["3%","10%","1%","0.5%"],"a":0,"e":"ω-3和ω-6系列不饱和脂肪酸都是人体必需脂肪酸，一定要从食物中获得，一般认为应不少于总能量的3%。"},{"q":"ω-6系列的不饱和脂肪酸主要存在于？","o":["植物油中","深海鱼中","坚果中","奶制品中"],"a":0,"e":"ω-6系列的不饱和脂肪酸主要存在于植物油中。"},{"q":"ω-3系列的脂肪酸在植物中主要存在于？","o":["亚麻籽、坚果和马齿苋","大豆和玉米","花生和芝麻","椰子和棕榈"],"a":0,"e":"ω-3系列的脂肪酸都在哪里呢？动物中有深海鱼、贝类，植物中有亚麻籽、坚果和马齿苋，保健品中品质较好的鱼油中也含有ω-3不饱和脂肪酸。"},{"q":"ω-3和ω-6之间比较好的比例是？","o":["1∶4～6","1∶1","1∶20","4∶1"],"a":0,"e":"ω-3和ω-6之间比较好的比例是1∶4～6。由于大家获取植物油要比获取深海鱼、贝类、坚果以及鱼油等容易得多，所以现实生活中大多数人摄入的实际比例几乎到了1∶20，甚至更夸张。"},{"q":"现实生活中大多数人摄入的ω-3与ω-6比例大约是？","o":["1∶20","1∶5","1∶1","1∶4"],"a":0,"e":"现实生活中大多数人摄入的实际比例几乎到了1∶20，甚至更夸张。"},{"q":"ω-6摄入过多会引起的一系列问题不包括？","o":["血管炎症、高脂血症","心脑血管病、关节炎症","肥胖、哮喘","夜盲症"],"a":3,"e":"研究表明，许多慢性炎症性疾病都与这个比例失调有关。ω-6摄入过多会引起血管炎症、高脂血症、心脑血管病、关节炎症、肥胖、哮喘等问题。"},{"q":"通常来讲，一个人ω-3脂肪酸的每日摄入量应不低于总能量的？","o":["0.5%","3%","1%","5%"],"a":0,"e":"通常来讲，一个人ω-3脂肪酸的每日摄入量应不低于总能量的0.5%。"},{"q":"发明将食用油部分“氢化”专利的德国化学家是？","o":["威廉·诺曼","巴斯德","李比希","科赫"],"a":0,"e":"20世纪初，德国化学家威廉·诺曼获得了一项发明专利，将食用油部分“氢化”。"},{"q":"经过“氢化”的植物油与普通植物油相比，特点是？","o":["更加稳定，呈固体状态，食品外观更好看、口感更松软，价格更低廉","更容易氧化","呈液态","价格更高"],"a":0,"e":"经过“氢化”的植物油与普通植物油相比更加稳定，呈固体状态，可以使食品外观更好看，口感更松软，同时，与动物油相比价格还更低廉。"},{"q":"摄入过多反式脂肪酸引起的健康问题不包括？","o":["促进血栓形成，造成冠心病和脑卒中","影响生育能力，减少男性荷尔蒙分泌","影响胎儿发育和大脑功能","降低血脂"],"a":3,"e":"摄入过多反式脂肪酸会引起以下几个严重的健康问题：促进血栓形成，造成冠心病和脑卒中。影响生育能力，减少男性荷尔蒙的分泌，对精子的活跃性产生负面影响。影响胎儿发育。影响大脑功能，降低记忆力，尤其对婴幼儿的大脑发育和神经系统发育产生不利影响，且这种影响会延续终身。引起肥胖。"},{"q":"反式脂肪酸对婴幼儿大脑发育的不利影响有何特点？","o":["会延续终身","可以完全恢复","仅在婴儿期存在","尚无定论"],"a":0,"e":"影响大脑功能，降低记忆力，尤其对婴幼儿的大脑发育和神经系统发育产生不利影响，且这种影响会延续终身。"},{"q":"下列属于反式脂肪酸“好听的名字”的是？","o":["植物氢化油、起酥油、植脂末","橄榄油、茶籽油","亚麻籽油、核桃油","猪油、牛油"],"a":0,"e":"反式脂肪酸有很多好听的名字，比如：植物氢化油、人造黄（奶）油、人造植物黄（奶）油、人造脂肪、氢化油、起酥油、植脂末等。"},{"q":"奶茶和咖啡中常加的、属于反式脂肪酸的配料是？","o":["植脂末","蜂蜜","淡奶油","可可粉"],"a":0,"e":"另外，大家还要注意奶茶和咖啡中的配料，上面清清楚楚写着“植脂末”，这也是反式脂肪酸。"},{"q":"世界卫生组织、联合国粮农组织建议反式脂肪酸最大摄取量不超过总能量的？","o":["1%","5%","10%","0.5%"],"a":0,"e":"世界卫生组织、联合国粮农组织在《膳食营养与慢性疾病（2003）》中建议“反式脂肪酸最大摄取量不超过总能量的1%”，这个1%折算出来一个人一天的限量在2克左右。"},{"q":"反式脂肪酸每天折合限量在？","o":["2克左右","5克左右","10克左右","0.5克"],"a":0,"e":"这个1%折算出来一个人一天的限量在2克左右。"},{"q":"食品标签上标有氢化油却写“反式脂肪酸为0”，原因是？","o":["只吃一个小食品绝对没有超标，于是可以忽略不计","标签写错了","氢化油不含反式脂肪酸","检测方法不准"],"a":0,"e":"一个人一天摄入反式脂肪酸应低于2克，因此，如果只吃这类包装食品中的一个小食品，绝对没有超标，于是可以忽略不计。"},{"q":"胆固醇的来源分为？","o":["外源性胆固醇和内源性胆固醇","动物性和植物性","好胆固醇和坏胆固醇","游离和结合"],"a":0,"e":"胆固醇的来源分为外源性胆固醇和内源性胆固醇两种。外源性胆固醇来自每日膳食，内源性胆固醇则是由肝脏合成，肝脏把摄入的葡萄糖等能量成分转变为胆固醇。"},{"q":"一个人一天需要多少胆固醇供人体细胞使用？","o":["1300～1500毫克","300～500毫克","1000毫克","250毫克"],"a":0,"e":"一个人一天需要1300～1500毫克胆固醇供人体细胞使用。正常的比例是每天饮食摄入胆固醇300～500毫克（白天从三顿饭中获得），肝脏合成1000毫克（大部分在晚上合成）。"},{"q":"正常情况下，每天饮食摄入的胆固醇应为？","o":["300～500毫克","1000毫克","1300～1500毫克","250毫克"],"a":0,"e":"正常的比例是每天饮食摄入胆固醇300～500毫克（白天从三顿饭中获得），肝脏合成1000毫克（大部分在晚上合成）。"},{"q":"正常情况下，肝脏每天合成的胆固醇约为？","o":["1000毫克","300毫克","500毫克","1300毫克"],"a":0,"e":"肝脏合成1000毫克（大部分在晚上合成）。"},{"q":"一个中等大小的鸡蛋中胆固醇含量约为？","o":["250毫克","70毫克","500毫克","1000毫克"],"a":0,"e":"一个中等大小的鸡蛋中胆固醇的含量为250毫克左右，100克畜禽类瘦肉中胆固醇的含量为70毫克左右。"},{"q":"100克畜禽类瘦肉中胆固醇的含量约为？","o":["70毫克","250毫克","100毫克","30毫克"],"a":0,"e":"一个中等大小的鸡蛋中胆固醇的含量为250毫克左右，100克畜禽类瘦肉中胆固醇的含量为70毫克左右。"},{"q":"关于磷脂的来源，正确的说法是？","o":["主要从食物中获得，肝脏也能合成部分，但量不能满足人体需求","完全由肝脏合成","只能从食物获得，肝脏不能合成","人体不需要磷脂"],"a":0,"e":"磷脂是组成人体生命细胞的重要成分，细胞膜当中大约有一半是磷脂。磷脂主要从食物中获得，肝脏也能合成部分磷脂，但是量不能满足人体需求。"},{"q":"下列属于含磷脂较多的动物类食物是？","o":["鸡蛋、肝脏、脑、骨髓、肾脏、心脏","肥肉、猪油","瘦肉、鱼肉","奶制品"],"a":0,"e":"大家要尽量摄入含磷脂多的食物，如动物类食物中的鸡蛋、肝脏、脑、骨髓、肾脏、心脏等，植物类食物中的芝麻、葵花籽、大豆等。"},{"q":"下列属于含磷脂较多的植物类食物是？","o":["芝麻、葵花籽、大豆","白菜、萝卜","苹果、梨","大米、白面"],"a":0,"e":"植物类食物中的芝麻、葵花籽、大豆等。"},{"q":"糖鞘脂包括？","o":["脑苷脂和神经节苷脂","磷脂和胆固醇","甘油三酯和脂肪酸","亚油酸和亚麻酸"],"a":0,"e":"糖鞘脂有脑苷脂和神经节苷脂。脑苷脂在脑中含量最多，肺、肾次之，肝、脾及血清中也含有。"},{"q":"脑苷脂在哪个器官中含量最多？","o":["脑","肺","肾","肝"],"a":0,"e":"脑苷脂在脑中含量最多，肺、肾次之，肝、脾及血清中也含有。"},{"q":"神经节苷脂在全身各组织细胞膜的外表面均有分布，其中以哪里最丰富？","o":["脑组织","肝脏","肾脏","皮肤"],"a":0,"e":"神经节苷脂广泛分布于全身各组织的细胞膜的外表面，以脑组织最丰富。"},{"q":"人的ABO血型是由什么决定的？","o":["红细胞质膜上的糖鞘脂","血浆中的蛋白质","白细胞的抗原","血红蛋白"],"a":0,"e":"在细胞膜表面的糖鞘脂主要作为细胞表面的标志物质，比如我们每个人都有一种血型，A型、B型、O型或AB型，这个血型就是由红细胞质膜上的糖鞘脂决定的。"},{"q":"糖脂的两个最主要功能是？","o":["神经系统中髓鞘的成分，以及作为细胞表面标志物质","提供能量和储存能量","构成骨骼和牙齿","运输氧气"],"a":0,"e":"所以糖脂有两个最主要的功能，一个是神经系统中髓鞘的成分，另一个是作为细胞表面标志物质。"},{"q":"人体合成糖脂所需的半乳糖从哪里获取？","o":["牛奶和甜菜","大米和白面","水果和蔬菜","肉类和鱼类"],"a":0,"e":"我们的身体中一般不会缺乏葡萄糖，那半乳糖从哪里获取呢？从牛奶和甜菜里。婴儿可以从母乳中获得半乳糖，而成年人应适当补充一些奶制品来获得，再增加一些坚果和鱼类食物。"},{"q":"当脂类食物摄入大于消耗时，身体会出现什么变化？","o":["肥胖，全身胖、四肢粗壮，皮肤细腻有光泽有弹性","消瘦","皮肤干燥","脱发"],"a":0,"e":"当脂类食物的摄入大于消耗时，主要表现为肥胖。这种肥胖表现为全身胖，四肢粗壮，同时皮肤细腻、有光泽、有弹性。"},{"q":"脂类食物摄入低于消耗时，会出现的两种情况是？","o":["消瘦，以及脂溶性维生素缺乏的症状","肥胖和血脂升高","高血压和糖尿病","贫血和水肿"],"a":0,"e":"当脂类食物摄入低于消耗时，就会表现为以下两种情况：第一，消瘦。第二，出现脂溶性维生素缺乏的症状。"},{"q":"脂溶性维生素指的是？","o":["维生素A、D、E、K","维生素B族和C","维生素B12和叶酸","维生素C和E"],"a":0,"e":"脂溶性维生素指的是维生素A、维生素D、维生素E和维生素K。"},{"q":"缺乏维生素A的典型症状是？","o":["皮肤干燥，脱皮屑，出皮疹","骨头和关节疼痛","牙龈出血","生育能力下降"],"a":0,"e":"缺乏维生素A的症状：皮肤干燥，脱皮屑，出皮疹。严重的患者脱衣服时就能掉下许多皮屑。"},{"q":"缺乏维生素D的典型症状是？","o":["骨头和关节疼痛，肌肉萎缩，腹泻","皮肤干燥脱屑","牙龈出血","免疫力下降"],"a":0,"e":"缺乏维生素D的症状：骨头和关节疼痛，肌肉萎缩，腹泻等。"},{"q":"缺乏维生素E的典型症状是？","o":["生育能力下降，免疫力下降，代谢失常，机体衰老","出血倾向","骨痛","夜盲"],"a":0,"e":"缺乏维生素E的症状：生育能力下降，免疫力下降，代谢失常，机体衰老等。"},{"q":"缺乏维生素K的典型症状是？","o":["牙龈出血、流鼻血、尿血、胃出血等各种出血症状","皮肤干燥","骨痛","肌肉萎缩"],"a":0,"e":"缺乏维生素K的症状：牙龈出血、流鼻血、尿血、胃出血等各种出血症状。"},{"q":"造成脂类摄入下降的原因不包括？","o":["食物中缺乏脂肪的素食者","脂肪泻患者","需求量不能得到满足的孩子和孕妇","长期高脂饮食者"],"a":3,"e":"造成脂类摄入下降的原因有很多，比如食物中缺乏脂肪的素食者、脂肪泻患者，或者需求量不能得到满足的孩子和孕妇等。"},{"q":"希腊克里特岛居民的脂类摄入量占整体能量摄入的？","o":["40%","30%","20%","50%"],"a":0,"e":"地中海地区的一些国家直到今天还保持着原始的饮食结构，比如希腊克里特岛的居民脂类摄入量占到整体能量摄入的40%，比我们现在要求的高多了，但他们的癌症死亡率却只有美国的一半，冠心病死亡率是美国的1/20。"},{"q":"希腊克里特岛居民的癌症死亡率只有美国的？","o":["一半","1/20","1/5","十分之一"],"a":0,"e":"但他们的癌症死亡率却只有美国的一半，冠心病死亡率是美国的1/20。"},{"q":"希腊克里特岛居民的冠心病死亡率是美国的？","o":["1/20","一半","1/5","1/50"],"a":0,"e":"冠心病死亡率是美国的1/20。"},{"q":"作者由克里特岛的例子得出的结论是？","o":["在脂类摄入中合适的比例要比量的控制重要得多","脂类摄入越多越好","要严格限制脂类","植物油最好"],"a":0,"e":"他们摄入的脂类主要来源于鱼、坚果和橄榄油，完全符合我们前面提到的三种类型脂肪酸的比例，所以在脂类摄入中合适的比例要比量的控制重要得多。"},{"q":"那位14岁男孩最突出的皮肤问题是？","o":["从小学一年级开始小腿皮肤像鱼鳞一样，抹药也没有效果","全身湿疹","面部痤疮","皮肤色素沉着"],"a":0,"e":"这个孩子14岁，个子却像10岁，但这不是她想找我的原因。她找我是因为这个孩子从小学一年级开始，小腿的皮肤像鱼鳞一样，抹了药也没有效果，这几年愈加厉害了。"},{"q":"那位14岁男孩的饮食情况是？","o":["不喝牛奶，每天一个煮鸡蛋，不吃油炸食物，一周只让吃2次肉且一次只吃一块","每天喝牛奶，爱吃鱼","经常吃麦当劳肯德基","每天吃大量肉类"],"a":0,"e":"孩子抢着说：“我妈从来不让我吃麦当劳、肯德基里的食品，说是垃圾食品。我们家从来不喝牛奶，每天吃一个煮鸡蛋，不吃油炸的食物。我很喜欢吃肉，但是不爱吃鱼，因为不会挑刺。”我妈说要适量，一周让我吃2次，不让吃肥肉。"},{"q":"作者对“少肉、少油、少盐”这类饮食理念的态度是？","o":["饮食要因人而异，尤其是孩子、孕妇等特殊人群，固定只吃某些食物是害孩子","适用于所有人","孩子更应该少吃肉","孕妇也应少油"],"a":0,"e":"大家现在受到一些饮食理念的指导，觉得少肉、少油、少盐才是对的。可是，饮食要因人而异，尤其是孩子、孕妇等特殊人群，他们对于某些营养的需求更高。如果固定地只吃某些食物，这是害孩子，不是爱孩子。"},{"q":"那位50多岁女患者家属担心的问题是？","o":["她近来总是丢三落四、心情紧张，怕大脑出现了问题","她体重骤增","她反复发热","她关节变形"],"a":0,"e":"有一次，一位50多岁的女患者来找我看病。她近来总是丢三落四、心情紧张，家属不放心，怕她大脑出现了问题。"},{"q":"那位50多岁女患者的头颅CT显示？","o":["脑萎缩","脑出血","脑肿瘤","一切正常"],"a":0,"e":"我看了看她的头颅CT，非常明显是脑萎缩。"},{"q":"那位50多岁女患者的日常饮食是？","o":["早上喝点粥吃点咸菜，中午和晚上吃老玉米和馒头或地里摘的蔬菜","每天喝牛奶吃鸡蛋","经常吃肉和鱼","每天吃坚果和水果"],"a":0,"e":"她每天早上喝点粥，吃点咸菜，中午和晚上都是吃老玉米和馒头，或者从地里摘点蔬菜。"},{"q":"那位50多岁女患者不吃鸡蛋的原因是？","o":["攒着，换点钱，给孙子买好吃的","不喜欢吃","咬不动","怕胆固醇高"],"a":0,"e":"我问：“为什么不吃鸡蛋？你老伴说你们家养了许多鸡。”她说：“攒着，换点钱，给孙子买好吃的。”"},{"q":"那位50多岁女患者不吃坚果和水果的原因是？","o":["咬不动","怕胖","太贵","不喜欢"],"a":0,"e":"“那坚果呢？水果呢？”回答得更干脆：“咬不动。”"},{"q":"作者认为那位50多岁女患者脑萎缩的原因是？","o":["磷脂、蛋白质、胆固醇、必需脂肪酸这些大脑最基本的养分一样都没有","年龄增长","高血压","遗传"],"a":0,"e":"说来说去，她的食物只有两部分来源：粮食和蔬菜。磷脂、蛋白质、胆固醇、必需脂肪酸这些大脑需要的最基本的养分一样都没有，脑细胞怎么可能不萎缩？"},{"q":"例子中那位电脑程序员的身高是？","o":["185厘米","175厘米","178厘米","165厘米"],"a":0,"e":"这位程序员身高185厘米，平时的工作和生活中几乎75%的时间都是坐着的，25%的时间是站着的，这种类型的人属于轻体力劳动者。"},{"q":"按照标准体重计算，那位程序员每天所需总能量是？","o":["2400千卡","2100千卡","1800千卡","3000千卡"],"a":0,"e":"那么他每天所需总能量应该是（185－105）×30=2400千卡。"},{"q":"那位程序员标准体重是185－105=80千克，他每天需要补充的脂肪是？","o":["80克","72克","30克","240克"],"a":0,"e":"720÷9＝80克。也就是说，对一个185厘米轻体力劳动的男性来说，他每天需要补充80克脂肪，才能保证脂肪的摄入是充足的。"},{"q":"那位程序员的80克脂肪应如何落实？","o":["30毫升的炒菜油加上20克的坚果基本上差不多","全部用炒菜油","全部吃坚果","只吃肥肉"],"a":0,"e":"然后再把这80克脂肪分成两份，一半由动物脂肪提供，另一半由植物脂肪提供。动物脂肪在你吃鸡蛋、肉、鱼、奶的时候就包含在里面了，植物脂肪在炒菜里和坚果里，这样，30毫升的炒菜油加上20克的坚果基本上差不多了。"},{"q":"在脂肪中最需要控制摄入的是？","o":["反式脂肪酸","肥肉","鱼油","坚果"],"a":0,"e":"在脂肪中最需要控制摄入的是反式脂肪酸，而肥肉是可以吃的，适量就好；鱼油是多不饱和脂肪酸，而且是必需脂肪酸，最好经常摄入，可以多吃一些深海鱼。"},{"q":"关于肥肉和鱼油，作者的态度是？","o":["肥肉可以吃、适量就好；鱼油最好经常摄入","肥肉绝对不能吃","鱼油不能吃","两者都要完全避免"],"a":0,"e":"而肥肉是可以吃的，适量就好；鱼油是多不饱和脂肪酸，而且是必需脂肪酸，最好经常摄入，可以多吃一些深海鱼；如果有条件，也可以选择高质量的鱼油。"},{"q":"对于运动较多的人，作者建议？","o":["可以多吃一些油性食物，包括饱和脂肪","应严格控制脂肪","只能吃植物油","应完全不吃脂肪"],"a":0,"e":"例如，运动较多的人可以多吃一些油性食物，包括饱和脂肪，体力劳动者可以多吃一些肥肉，这样可以保证有足够的能量。"},{"q":"反流性食管炎的定义是？","o":["胃和十二指肠内容物反流入食管引起胃灼热等症状的疾病","食管黏膜化脓的疾病","食管痉挛的疾病","食管静脉曲张的疾病"],"a":0,"e":"(1) 反流性食管炎：即胃和十二指肠内容物反流入食管引起胃灼热等症状的疾病。"},{"q":"维生素在人体中的含量不到1%，它被称为“维持生命的元素”，原因是？","o":["如果没有维生素，人体内很多重要的生命活动都无法完成","它能提供大量能量","它构成身体主要结构","它能杀死病菌"],"a":0,"e":"维生素在人体中的含量很少，不到1%，但如果没有维生素，人体内很多重要的生命活动都无法完成，所以叫作维持生命的元素，简称“维生素”。"},{"q":"脂溶性维生素包括？","o":["维生素A、D、E、K","维生素B族和维生素C","维生素A、B、C","维生素C和E"],"a":0,"e":"一类叫作脂溶性维生素，包括维生素A、D、E、K。这类维生素必须溶解在油脂里才能被吸收。"},{"q":"脂溶性维生素的吸收特点是？","o":["必须溶解在油脂里才能被吸收","必须溶解在水里才能被吸收","直接经皮肤吸收","不需要介质"],"a":0,"e":"这类维生素必须溶解在油脂里才能被吸收。"},{"q":"水溶性维生素包括？","o":["维生素B族和维生素C","维生素A和D","维生素E和K","维生素A、D、E、K"],"a":0,"e":"另一类叫作水溶性维生素，包括维生素B族和维生素C，水溶性维生素可溶解在水中，很容易流失。"},{"q":"与大多数营养素不同，维生素的失衡特点是？","o":["从食物中获取的维生素一般不会过量，缺乏的情况居多","容易过量","既不过量也不缺乏","只能通过药物补充"],"a":0,"e":"但是维生素很特别，从食物中获取的维生素在人体内一般不会过量，缺乏的情况居多。"},{"q":"维生素在人体内能否合成或相互转化？","o":["不能合成，也不能相互转化，只能从食物中获取","可以自行合成","可以相互转化","可由肠道细菌合成全部种类"],"a":0,"e":"维生素在人体内不能合成，也不能相互转化，只能从食物中获取，所以如果从食物中摄取不足，就会出现维生素缺乏的症状。"},{"q":"水溶性维生素摄入多了会怎样？","o":["马上通过尿液和汗水从体内排出","在体内大量储存","转化为脂肪","引起中毒"],"a":0,"e":"尤其是水溶性维生素，特别容易流失，如果摄入多了，会马上通过尿液和汗水从体内排出。"},{"q":"脂溶性维生素有“吃一顿，管三天”的特点，说明？","o":["能在人体的脂肪组织内储存，抗流失能力较强","必须每天补充","不能被吸收","没有营养作用"],"a":0,"e":"脂溶性维生素尽管能在人体的脂肪组织内储存，有“吃一顿，管三天”的特点，抗流失能力较强，但如果不良饮食习惯坚持几年、几十年不变，体内储存的维生素被消耗干净，当细胞缺乏维生素时就会出现许多疾病，甚至会导致死亡。"},{"q":"维生素缺乏的诱因中，“膳食中供给不足”的典型例子是？","o":["生活条件太差，没有能力获得食物","偏食挑食","熬煮时间过长","长期吃快餐"],"a":0,"e":"日常生活中，维生素缺乏主要有以下几种诱因：第一，膳食中供给不足。比如生活条件太差，没有能力获得食物。"},{"q":"食物加工过程中会造成维生素破坏丢失过多的做法不包括？","o":["熬煮时间过长","冲洗次数过多","油炸温度过高","冷藏保存"],"a":3,"e":"第二，食物加工过程中破坏丢失过多，如熬煮时间过长，冲洗次数过多，或者油炸温度过高，都会破坏食物中的维生素。"},{"q":"那位周围神经炎患者每天吃白菜炖豆腐，炖多长时间？","o":["半小时","5分钟","1小时","2小时"],"a":0,"e":"我问她：“白菜豆腐您每次炖多长时间？”她的回答让我们诊室的人都吃了一惊：“半小时。”"},{"q":"那位周围神经炎患者一周吃几个鸡蛋？","o":["一个","三个","七个","不吃"],"a":0,"e":"她说：“不是讲白菜豆腐保平安吗？我每天都吃白菜炖豆腐。不爱吃肉，一周吃一个鸡蛋。”"},{"q":"作者指出，白面中？","o":["几乎不含维生素","富含维生素B族","富含维生素C","富含维生素A"],"a":0,"e":"有一些人会用白面做出各种食物，看似丰富，但是白面中几乎不含维生素，如果食物中不增加蔬菜、水果和肉类，也会出现身体亏空。"},{"q":"补充脂溶性维生素制剂时要注意用量，原因是？","o":["不溶于水，难以从肾脏排出，易在身体里积存过多产生毒性作用","吸收太快","会随尿液排出","会破坏其他维生素"],"a":0,"e":"由于脂溶性维生素不溶于水，难以从肾脏排出，易在身体里积存过多产生毒性作用，所以我们在补充维生素A、D、E等脂溶性维生素制剂时要注意用量，别过犹不及。比如咱们给孩子吃鱼肝油的时候都要严格按照说明书吃。"},{"q":"作者建议出租车司机在车上备的食物不包括？","o":["煮好的鸡蛋、牛肉干","洗干净的西红柿、黄瓜","奶片或红薯干","油炸薯片和含糖饮料"],"a":3,"e":"我坐出租车时经常和司机师傅聊天，建议他们可以在车上备一些煮好的鸡蛋、牛肉干，还有洗干净的西红柿、黄瓜，拿起来就能吃，另外再准备些奶片或红薯干当零食。"},{"q":"下列会导致消化能力变差、影响维生素吸收的情况是？","o":["长期腹泻、胆汁分泌受限、胃酸分泌减少","长期运动","长期熬夜","长期补钙"],"a":0,"e":"例如，长期腹泻、胆汁分泌受限、胃酸分泌减少都会造成消化能力变差，影响维生素的吸收；如果膳食中脂肪含量低，也会影响脂溶性维生素的吸收。"},{"q":"服用下列哪种药物会增加对维生素B6的需求？","o":["异烟肼、青霉胺及避孕药","阿司匹林","维生素C片","降压药"],"a":0,"e":"服用异烟肼、青霉胺及避孕药等也会增加对维生素B6 的需求。比如一些吃抗结核药的人容易出现四肢麻木的感觉，这是由于服药以后会影响维生素B族的代谢。"},{"q":"维生素缺乏是一个渐进的过程，其发展顺序是？","o":["体内储备量降低→生化检查异常→组织病理变化→临床体征","先出现临床体征再有生化异常","直接出现组织病变","无规律可循"],"a":0,"e":"维生素缺乏是一个渐进的过程。开始时，体内储备量降低，身体会感觉到不适，但是各项检查尚且正常。当体内储备越来越低，生化检查开始出现异常，最后组织病理也发生变化，此时在临床上才会表现出相应体征，但这时已经晚了。"},{"q":"患者出现症状或体征时，补充维生素的量应？","o":["远大于每日推荐量，因为要把身体中的亏空量算进去","等于每日推荐量","小于每日推荐量","随意即可"],"a":0,"e":"所以当我们看到患者出现症状或者体征时，补给的维生素含量要远大于每日推荐量，因为补进去的量要把身体中的亏空量算进去。"},{"q":"关于维生素补充片，作者特别强调？","o":["最好选择从食物中提取的天然维生素，化学合成的不要长期摄入","合成维生素效果更好","可以随意长期大量服用","完全不能吃"],"a":0,"e":"经常吃一些维生素补充片也是很好的选择。但是在这里我要特别强调一下，维生素补充剂最好选择从食物中提取的天然维生素，化学合成的维生素不要长期摄入。"},{"q":"近些年人体对维生素A的消耗比历史上任何年代都多，原因是？","o":["手机和电脑的广泛应用","食物种类减少","运动量增加","睡眠减少"],"a":0,"e":"近些年，由于手机和电脑的广泛应用，人体对维生素A的消耗比历史上任何年代都多。"},{"q":"与维生素A关系更为密切的视觉状态是？","o":["黑暗中的视觉","明亮处的色觉","远距离视觉","动态视觉"],"a":0,"e":"因为视神经的光敏感作用需要维生素A，尤其是黑暗中的视觉状态与维生素A关系更为密切。"},{"q":"维生素A缺乏最突出的症状是？","o":["暗适应能力下降，严重者在夜里会看不清东西","牙龈出血","口角炎","关节疼痛"],"a":0,"e":"维生素A缺乏最突出的症状是暗适应能力下降，严重者在夜里会看不清东西。"},{"q":"把房屋的灯突然关掉，正常人应在多久内看见东西？","o":["10秒钟内","1分钟内","3分钟内","5分钟内"],"a":0,"e":"第二个方法是，把房屋的灯突然关掉，在黑暗中你过多久能看见东西。正常人10秒钟内应该可以看到。"},{"q":"维生素A缺乏最常见的症状是？","o":["眼干燥症","夜盲以外的白内障","结膜炎以外的青光眼","近视"],"a":0,"e":"维生素A缺乏最常见的症状是眼干燥症：角膜、结膜上皮、泪腺等组织的修复过程非常需要维生素A的参与。"},{"q":"维生素A严重缺乏导致的角膜损伤可能造成？","o":["不可逆转的失明","暂时视物模糊","色盲","散光"],"a":0,"e":"如果缺乏维生素A，会出现眼睛干涩、发炎，严重者会出现角膜软化、溃疡、角质化等一系列变化，角膜损伤严重常会导致不可逆转的失明。"},{"q":"作者在地铁上观察到一些女性肩部、上肢、腿部皮肤角化干燥、呈小疙瘩状，他认为这是？","o":["维生素A缺乏的表现","皮肤过敏","缺乏维生素C","真菌感染"],"a":0,"e":"我坐地铁时，常常发现一些女性，尽管脸上抹了化妆品，但是肩部、上肢、腿部的皮肤角化干燥，呈小疙瘩状，这都是维生素A缺乏的表现。"},{"q":"口腔、呼吸道很干或者慢性咽炎，往往与缺乏什么有关？","o":["维生素A","维生素C","维生素D","钙"],"a":0,"e":"另外，口腔、呼吸道很干或者慢性咽炎，也往往与维生素A缺乏有关。"},{"q":"家里孩子经常出现支气管肺炎，父母应首先考虑？","o":["孩子日常是否缺维生素A","孩子是否缺钙","孩子是否缺铁","孩子是否缺锌"],"a":0,"e":"家里如果有经常出现支气管肺炎的孩子，父母一定要好好想想，孩子日常生活中是不是缺维生素A了。"},{"q":"可以直接获得维生素A的动物性食物是？","o":["动物肝脏、奶油和鸡蛋","瘦肉和鱼","牛奶和酸奶","骨头汤"],"a":0,"e":"第一，从动物肝脏、奶油和鸡蛋中直接获得维生素A。"},{"q":"为了吸收植物中的胡萝卜素，作者建议的做法是？","o":["制造一个油性的环境，如吃胡萝卜炖牛腩、猪肉炖南瓜、炒西蓝花","生吃胡萝卜","水煮胡萝卜","榨汁饮用"],"a":0,"e":"第二，制造一个油性的环境，把植物中的胡萝卜素溶进去，比如吃胡萝卜炖牛腩、猪肉炖南瓜、炒西蓝花、炒油菜、炒菠菜等来吸收维生素A。"},{"q":"一个胡萝卜素分子可以转化为几个维生素A分子？","o":["两个","一个","三个","四个"],"a":0,"e":"肠道黏膜可以根据身体中对维生素A的需求量来决定对胡萝卜素的吸收量。一个胡萝卜素分子可以转化为两个维生素A分子，身体缺维生素A时肠道对胡萝卜素转化吸收的就多，够了就减少吸收，这样就不会出现体内维生素A中毒问题。"},{"q":"肠道黏膜对胡萝卜素的吸收机制说明？","o":["身体缺维生素A时吸收转化多，够了就减少吸收，不会中毒","吸收是无限量的","完全不吸收","只能被动吸收"],"a":0,"e":"身体缺维生素A时肠道对胡萝卜素转化吸收的就多，够了就减少吸收，这样就不会出现体内维生素A中毒问题。"},{"q":"近年来对维生素D的研究已把它上升到什么的高度？","o":["激素","维生素","矿物质","蛋白质"],"a":0,"e":"近年来对维生素D的研究越来越多，现在已经把它上升到激素的高度。研究发现，维生素D不仅与骨骼有关，还与细胞功能的调节及基因转录相关。"},{"q":"维生素D除了与骨骼有关，还与什么相关？","o":["细胞功能的调节及基因转录","血液凝固","肌肉收缩的唯一能量来源","胃肠蠕动"],"a":0,"e":"研究发现，维生素D不仅与骨骼有关，还与细胞功能的调节及基因转录相关。"},{"q":"关于维生素D受体的分布，正确的说法是？","o":["遍布全身，包括大脑细胞都会受到维生素D的影响","只分布在骨骼","只分布在肾脏","只分布在皮肤"],"a":0,"e":"维生素D的受体遍布全身，因此全身各处包括大脑细胞都会受到维生素D的影响。"},{"q":"维生素D缺乏在不同人群中的分布有什么特点？","o":["城市人多于农村人，女性多于男性，冬天和春天最为高发","农村人多于城市人","男性多于女性","夏天最为高发"],"a":0,"e":"维生素D缺乏现在已经成为非常广泛而严重的健康问题，患者中居住在城市里的人多于农村人，女性多于男性，冬天和春天最为高发。"},{"q":"缺乏维生素D的表现形式不包括？","o":["骨质疏松、小儿盗汗等缺钙表现","容易过敏，容易感冒","好发肿瘤、抑郁","牙龈出血"],"a":3,"e":"缺乏维生素D的表现形式有：骨质疏松、小儿盗汗等缺钙表现，容易过敏，容易感冒，好发肿瘤、抑郁等。此外，冠心病、高血压、糖尿病等也与维生素D缺乏有关。"},{"q":"下列疾病中，与维生素D缺乏有关的是？","o":["冠心病、高血压、糖尿病","坏血病","脚气病","夜盲症"],"a":0,"e":"此外，冠心病、高血压、糖尿病等也与维生素D缺乏有关。因此患这些疾病的患者在检查时也应该查一下自己血液里维生素D的浓度。"},{"q":"含维生素D的动物类食物不包括？","o":["动物的肝脏、大脑、肺、脾","鸡蛋、牛奶","三文鱼、大马哈鱼","精米、精面"],"a":3,"e":"含维生素D的食物有：动物的肝脏、大脑、肺、脾，鸡蛋，牛奶，三文鱼，大马哈鱼，动物的骨头和皮肤也含有少量维生素D。"},{"q":"人体皮肤合成维生素D的原料是？","o":["7-脱氢胆固醇","胡萝卜素","麦角固醇","胆固醇酯"],"a":0,"e":"人体的表皮与真皮内含有一定量的7-脱氢胆固醇，当受到阳光或紫外光照射时，可以经光化学反应形成前维生素D3，再经过肝脏和肾脏的羟化作用，最后转化为有活性的维生素D3 。"},{"q":"皮肤合成的维生素D3需要经过哪些器官的羟化作用才有活性？","o":["肝脏和肾脏","心脏和肺","胃和肠","脾和胰腺"],"a":0,"e":"当受到阳光或紫外光照射时，可以经光化学反应形成前维生素D3，再经过肝脏和肾脏的羟化作用，最后转化为有活性的维生素D3 。"},{"q":"作者说“我们的老祖宗都不缺维生素D”，原因是？","o":["食物中不缺乏肉类，在外面打猎时又能获得充足的阳光","他们服用补充剂","他们基因不同","他们不晒太阳"],"a":0,"e":"我们的老祖宗都不缺维生素D，因为他们的食物中不缺乏肉类，在外面打猎时又能获得充足的阳光。"},{"q":"国际上有超过2500篇研究证实，维生素D能够将乳腺癌、前列腺癌和结肠癌的风险减少？","o":["50%","30%","20%","73%"],"a":0,"e":"国际上有超过2500篇公开发表成果的研究证实维生素D在预防癌症中有重要作用。无论是来自阳光照射自我合成的内源性维生素D，还是由营养补充方式获得的维生素D，都能够阻止身体内部癌症的发生，将乳腺癌、前列腺癌和结肠癌的风险减少50%，还能减少痴呆和神经系统失调的风险。"},{"q":"人体获取维生素D的最佳途径是什么？","o":["日晒","口服补充剂","吃钙片","喝牛奶"],"a":0,"e":"既然维生素D如此重要，那么获取维生素D的最好方式是什么呢？是日晒。我们每天要花半个小时接触阳光，哪怕是在背阴的地方接受散射的太阳光线也好。"},{"q":"为补充维生素D，每天要花多长时间接触阳光？","o":["半个小时","两个小时","五分钟","三个小时"],"a":0,"e":"我们每天要花半个小时接触阳光，哪怕是在背阴的地方接受散射的太阳光线也好。"},{"q":"作者建议将血液中的维生素D保持在什么范围？","o":["40～60纳克/毫升","10～20纳克/毫升","100～200纳克/毫升","80～100纳克/毫升"],"a":0,"e":"较少外出的人需要补充一些维生素D，可以通过吃前文提到的动物类食物来补充，以将血液中的维生素D保持在40～60纳克／毫升。"},{"q":"维生素B族被世界公认的有几种？","o":["9种","12种","5种","20种"],"a":0,"e":"维生素B族是个大家庭，成员有12种以上，被世界公认的有9种，全部是水溶性维生素，包括维生素B1 、维生素B2 、维生素B6 、维生素B12、烟酸、叶酸、泛酸、生物素和胆碱。"},{"q":"维生素B族全部属于？","o":["水溶性维生素","脂溶性维生素","矿物质","必需脂肪酸"],"a":0,"e":"维生素B族是个大家庭，成员有12种以上，被世界公认的有9种，全部是水溶性维生素。"},{"q":"B族维生素在三大能量代谢中的角色类似于？","o":["助燃剂","燃料","润滑剂","阻燃剂"],"a":0,"e":"第一，合成辅酶，参与三大能量代谢。B族维生素的角色类似于助燃剂，如果B族缺乏，辅酶的活性会降低，人的新陈代谢速度就会减慢。"},{"q":"神经系统的功能完善与哪类维生素关系最密切？","o":["维生素B1、B6、B12","维生素A、D、E","维生素C","维生素K"],"a":0,"e":"第二，完善神经细胞功能，尤其是维生素B1 、维生素B6 、维生素B12与神经系统的功能完善密切相关。"},{"q":"参与细胞DNA构成、促进细胞分裂的维生素是？","o":["叶酸","维生素B1","维生素C","维生素D"],"a":0,"e":"第三，促进细胞分裂。我们熟悉的叶酸，参与细胞DNA的构成。"},{"q":"维生素B族缺乏时最常见的表现是什么？","o":["上火，表现为眼结膜充血、烦躁、口腔溃疡","皮肤干燥","牙龈出血","骨痛"],"a":0,"e":"维生素B族是个大家族，往往一种维生素缺乏时，其他种类维生素也缺乏。缺乏维生素B族最常见的症状是上火，表现为眼结膜充血，烦躁，口腔溃疡。"},{"q":"熬夜加班后容易出现“上火”症状，原因是？","o":["加班熬夜时要消耗大量能量，脑细胞快速运转，消耗大量维生素B族","熬夜导致缺水","熬夜导致免疫力下降","熬夜使体温升高"],"a":0,"e":"熬夜加班之后也容易出现类似症状，为什么？因为在加班熬夜时要消耗大量能量，脑细胞快速运转，在这个过程中要消耗大量维生素B族。"},{"q":"感冒之后人们常说“上火了”，作者解释是因为？","o":["免疫系统与病毒作战加快三大能量代谢，维生素B族作为辅酶被大量消耗","病毒直接破坏口腔黏膜","发热导致脱水","药物副作用"],"a":0,"e":"感冒也是同样的道理。感冒之后，许多人都说自己上火了，这是由于免疫系统在与病毒作战的过程中要加快碳水化合物、蛋白质、脂类这三大能量的代谢，而维生素B族作为三大能量代谢的辅酶，会大量被消耗。"},{"q":"缺乏维生素B族最容易表现出的症状是？","o":["神经系统症状，如记忆力下降、反应迟钝、头痛","皮肤症状","消化系统症状","骨骼症状"],"a":0,"e":"缺乏维生素B族最容易表现出神经系统症状：人会出现记忆力下降，反应迟钝，没有精神，容易头痛，严重者会出现眩晕，感觉到头晕目眩，躺在床上不敢翻身，稍微一动就会呕吐。"},{"q":"反复头痛、做CT和核磁都是阴性的人，作者认为可能是？","o":["体内维生素B不平衡","脑供血不足","脑肿瘤早期","偏头痛"],"a":0,"e":"还有一些人由于反复头痛，跑去做CT和核磁，结果都是阴性，其实就是体内维生素B不平衡了。"},{"q":"维生素B族最突出的问题是周围神经症状，表现为？","o":["四肢和手脚有套袜套样的感觉障碍，手脚是木的","剧烈疼痛","皮肤瘙痒","关节肿胀"],"a":0,"e":"最突出的问题是周围神经症状：当维生素B1 、维生素B6 、维生素B12缺乏时，人会出现四肢和手脚套袜套样的感觉障碍，手脚是木的。"},{"q":"B族维生素不足时，还容易出现？","o":["食欲不振、消化不良，甚至口臭","多食易饥","便秘为主","血压升高"],"a":0,"e":"B族维生素不足时，患者还容易出现食欲不振，消化不良，甚至一些人会出现口臭，别人都不敢靠近他。"},{"q":"那位口臭患者的饮食特点是？","o":["每天吃馒头、米饭和面条，爱吃涮羊肉，喜欢辣椒和咸菜，蔬菜水果基本上一点都不吃","爱吃蔬菜水果","每天喝牛奶","严格素食"],"a":0,"e":"他说：“每天吃馒头、米饭和面条，爱吃涮羊肉，喜欢吃点辣椒和咸菜，蔬菜和水果基本上一点都不吃。”"},{"q":"维生素B1主要存在于？","o":["种子皮、动物内脏和瘦肉","奶类和蛋类","绿叶蔬菜","水果"],"a":0,"e":"维生素B1 ——种子皮、动物内脏和瘦肉。"},{"q":"维生素B2的食物来源是？","o":["动物肝脏、奶类、蛋类、豆类和绿叶蔬菜","种子皮和瘦肉","水果和坚果","海产品"],"a":0,"e":"维生素B2 ——动物肝脏、奶类、蛋类、豆类和绿叶蔬菜。"},{"q":"维生素B12的食物来源是？","o":["动物肝脏、肉类、蛋类和奶类","绿叶蔬菜","水果和坚果","种子皮"],"a":0,"e":"维生素B12 ——动物肝脏、肉类、蛋类和奶类。"},{"q":"叶酸的食物来源是？","o":["动物肝脏、肾脏、蛋类、豆类、绿叶蔬菜、水果和坚果类","只有绿叶蔬菜","只有动物内脏","只有水果"],"a":0,"e":"叶酸——动物肝脏、肾脏、蛋类、豆类、绿叶蔬菜、水果和坚果类。"},{"q":"作者说“营养师们都特别喜欢动物肝脏”，因为？","o":["动物肝脏简直就是维生素大库房","肝脏价格便宜","肝脏容易烹饪","肝脏含能量高"],"a":0,"e":"大家发现没有，动物肝脏简直就是维生素大库房，所以营养师们都特别喜欢动物肝脏。"},{"q":"关于肝脏是“解毒器官”，作者的解释是？","o":["肝脏是排毒器官，不是存毒器官","肝脏确实会储存毒素","肝脏毒素无法排出","肝脏毒素需要药物清除"],"a":0,"e":"但是大家经常困惑，肝脏是解毒器官，是不是里面有许多毒素呀？实际上这是个天大的误区，肝脏是排毒器官，不是存毒器官。"},{"q":"B族维生素在体内的滞留时间只有？","o":["数小时","数天","数周","数月"],"a":0,"e":"第一，B族维生素属于水溶性维生素，很容易丢失，在体内的滞留时间只有数小时，所以必须每日补充，尤其是夏天和出汗多的时候。"},{"q":"作者用“球队”比喻B族维生素，强调？","o":["不要单独补一种，各种B族维生素要一起补","只补一种即可","球员之间互相竞争","越贵越好"],"a":0,"e":"第二，B族维生素像个球队，球员之间相互配合才能取得胜利，也就是说不要单独补一种，比如一些人口腔溃疡，明显是缺乏维生素B2 ，但如果只是补了维生素B2 ，很快症状又会复发。如果把各种B族维生素一起补，好得快，还不容易复发。"},{"q":"维生素B1、B2、B6之间的优质配比是？","o":["1∶1∶1","1∶2∶3","2∶1∶1","3∶2∶1"],"a":0,"e":"第三，维生素B1 、维生素B2 、维生素B6 之间的优质配比是1∶1∶1。"},{"q":"维生素C在体内的作用不包括？","o":["皮下、血液中、细胞内外起抗氧化作用","参与胶原蛋白的形成","参与肾上腺皮质激素的合成与释放","储存能量"],"a":3,"e":"维生素C在皮下、血液中、细胞内外都起着抗氧化的作用，参与胶原蛋白的形成。此外，肾上腺皮质激素的合成与释放也需维生素C参与。维生素C能促进抗体形成，增加抵抗力。"},{"q":"缺乏维生素C时，胶原蛋白形成障碍，会造成？","o":["创伤愈合延缓和不同程度的出血","骨骼变形","神经损伤","肌肉萎缩"],"a":0,"e":"当缺乏维生素C时，胶原蛋白形成障碍，会造成创伤愈合延缓和不同程度的出血。"},{"q":"体内有铅、苯、砷及某些药物和细菌毒素蓄积时，给予大量什么可缓解其毒性？","o":["维生素C","维生素A","维生素D","维生素E"],"a":0,"e":"如果体内的毒物如铅、苯、砷及某些药物和细菌、毒素蓄积，给予大量的维生素C可缓解其毒性。"},{"q":"维生素C缺乏症又称为？","o":["坏血病","脚气病","癞皮病","夜盲症"],"a":0,"e":"维生素C缺乏症又称为坏血病。"},{"q":"坏血病的早期症状不包括？","o":["倦怠、疲乏、急躁","呼吸急促","牙龈疼痛出血、伤口愈合不良","骨质疏松"],"a":3,"e":"维生素C缺乏症又称为坏血病，早期症状是倦怠、疲乏、急躁、呼吸急促、牙龈疼痛出血、伤口愈合不良、关节肌肉短暂性疼痛、易骨折等。"},{"q":"坏血病的典型症状是？","o":["牙龈肿胀出血、牙床溃烂、牙齿松动、毛细血管脆性增加","皮肤干燥脱屑","骨头和关节疼痛","夜盲"],"a":0,"e":"典型症状是牙龈肿胀出血、牙床溃烂、牙齿松动、毛细血管脆性增加。严重者可导致皮下、肌肉和关节出血及血肿形成，最终出现贫血，心脏衰竭，直至死亡。"},{"q":"坏血病严重时最终可能导致？","o":["贫血，心脏衰竭，直至死亡","失明","瘫痪","痴呆"],"a":0,"e":"严重者可导致皮下、肌肉和关节出血及血肿形成，最终出现贫血，心脏衰竭，直至死亡。"},{"q":"有些患者说吃一点阿司匹林就皮下出血，作者一问平时如何吃水果，回答是？","o":["“血糖高，哪敢吃呀”或“老了，咬不动”","“每天吃三种”","“不爱吃甜食”","“只吃进口水果”"],"a":0,"e":"我一问平时如何吃水果，回答都差不多：“血糖高，哪敢吃呀。”要不就说：“老了，咬不动。”"},{"q":"对不吃水果的患者，作者的建议是？","o":["不能因噎废食，咬不动可以榨汁喝，怕血糖高还有血糖高的吃法","尊重习惯，不吃就不吃","改吃维生素片即可","用蔬菜完全替代水果"],"a":0,"e":"每次我都会和患者说，不能因噎废食，不吃水果哪儿来的维生素？咬不动可以榨汁喝，怕血糖高，还有血糖高的吃法。"},{"q":"维生素C主要来源于？","o":["新鲜蔬菜与水果","动物肝脏","奶类和蛋类","谷物和豆类"],"a":0,"e":"维生素C主要来源于新鲜蔬菜与水果，如韭菜、菠菜、柿子椒等深色蔬菜和花椰菜，以及柑橘、山楂、柚子等水果。"},{"q":"下列维生素C含量尤其丰富的野生食物是？","o":["苋菜、刺梨、沙棘、猕猴桃、酸枣","苹果、梨","香蕉、西瓜","白菜、萝卜"],"a":0,"e":"野生的苋菜、刺梨、沙棘、猕猴桃、酸枣等维生素C含量尤其丰富。"},{"q":"中国人维生素C的主要来源为什么是水果？","o":["中国人蔬菜基本上炒熟了吃，而维生素C怕热，会损失很多","中国人不吃蔬菜","水果比蔬菜便宜","水果维生素C含量更高"],"a":0,"e":"需要说明的是，中国人的饮食习惯中，蔬菜基本上是炒熟了吃，但维生素C怕热，这样会损失很多维生素C。因此水果就成了中国人维生素C的主要来源了。"},{"q":"作者建议一个人一天最好吃几种水果、共多少？","o":["3种以上，合起来半斤以上","1种，半斤","5种，一斤","2种，二两"],"a":0,"e":"一个人一天最好吃3种以上水果，合起来半斤以上。当然如果服用天然的维生素C片也是一个很好的补充方法。"},{"q":"作者对化学合成维生素的评价是？","o":["还远达不到天然维生素的效果","效果优于天然维生素","与天然维生素完全相同","可以完全替代天然维生素"],"a":0,"e":"每一种维生素的缺乏都会给身体健康带来严重的营养问题，而化学合成的维生素还远达不到天然维生素的效果。"},{"q":"补充维生素的正确态度是？","o":["对症下药、量体裁衣，根据自己的症状判断所缺种类","多多益善","统一补充复合维生素即可","只补维生素C"],"a":0,"e":"补充维生素我们要对症下药、量体裁衣，根据自己的症状，判断自己所缺的维生素种类，然后吃相对应的肉类、果蔬。"},{"q":"关于两类维生素的摄入风险，作者总结为？","o":["水溶性的不怕摄入过多，就怕不够；脂溶性的如果摄入过多，就会导致中毒","两类都怕过多","两类都怕不够","脂溶性不怕过多"],"a":0,"e":"不过，要时刻强调的一点就是，维生素有两类，即脂溶性的和水溶性的。水溶性的不怕摄入过多，就怕不够；脂溶性的如果摄入过多，就会导致中毒。"},{"q":"血液中的维生素D应保持在什么范围？","o":["40～60纳克／毫升","10～20纳克／毫升","100～200纳克／毫升","越高越好"],"a":0,"e":"较少外出的人需要补充一些维生素D，可以通过吃前文提到的动物类食物来补充，以将血液中的维生素D保持在40～60纳克／毫升。"},{"q":"书中用什么词形容矿物质在人体内含量很少却作用巨大？","o":["四两拨千斤","锦上添花","雪中送炭","画龙点睛"],"a":0,"e":"矿物质其实就是体内的各种离子，它们在人体内虽然含量很少，却有着四两拨千斤的作用。"},{"q":"关于矿物质失衡，书中特别提醒的一个特点是？","o":["常常在不经意间发生，不了解症状就意识不到自己缺矿物质","一定伴随剧烈疼痛","只在老年人身上出现","只能通过化验才能发现"],"a":0,"e":"而离子的不平衡常常在不经意间，如果你不知道离子失衡的症状，很有可能，你根本不会意识到自己在缺矿物质，更不会采取措施去补救。而不补救的结果，就是百病缠身。"},{"q":"书中指出，打破任何一种营养平衡都会让人生病，这包括？","o":["大分子营养素和更细小的离子都包括","只有蛋白质","只有维生素","只有矿物质"],"a":0,"e":"我们的身体每天都处在各种平衡中，不管是前面讲到的大分子的碳水化合物、蛋白质、脂类，还是后面要讲到的更细小的离子，打破任何一种平衡，都会让人生病。"},{"q":"一个人身上有多少种矿物质？","o":["50多种","20多种","10多种","100多种"],"a":0,"e":"一个人身上有50多种矿物质，每一种都是经过我们嘴巴一点一点进入身体的。"},{"q":"矿物质的排出途径不包括？","o":["肝脏","泌尿道","肠道","汗腺"],"a":0,"e":"每一天都有一定数量的矿物质通过各种途径如泌尿道、肠道、汗腺、皮肤、脱落细胞以及头发、指甲等排出体外。"},{"q":"构成身体“钢筋水泥”的矿物质中，相当于“钢筋”的是？","o":["钙、磷、镁","磷、硫","钠、钾、氯","铁、碘"],"a":0,"e":"有构成你身体“钢筋水泥”的矿物质。如钙、磷、镁，它们是骨骼和牙齿的重要材料，相当于“钢筋”；而磷、硫是构成体内某些蛋白质的成分，相当于“水泥”。"},{"q":"构成身体“水泥”的矿物质是？","o":["磷、硫","钙、磷","钠、氯","锌、铁"],"a":0,"e":"如钙、磷、镁，它们是骨骼和牙齿的重要材料，相当于“钢筋”；而磷、硫是构成体内某些蛋白质的成分，相当于“水泥”。"},{"q":"与蛋白质共同构成组织渗透压、实现体内水平衡的矿物质是？","o":["钠、钾、氯","钙、镁、磷","铁、锌、碘","硫、磷、氯"],"a":0,"e":"有维持你身体里内在压力的矿物质。如钠、钾、氯等与蛋白质共同构成组织的渗透压，实现体内的水平衡。"},{"q":"构成体内碱性离子的矿物质是？","o":["钙、镁、钾、钠","硫、磷、氯","铁、锌、碘","钠、氯、氟"],"a":0,"e":"有给你身体“调味儿”的矿物质。钙、镁、钾、钠构成碱性离子，硫、磷、氯构成酸性离子，共同控制着体内的酸碱平衡。"},{"q":"构成体内酸性离子的矿物质是？","o":["硫、磷、氯","钙、镁、钾","钠、钾、氯","铁、铜、锌"],"a":0,"e":"钙、镁、钾、钠构成碱性离子，硫、磷、氯构成酸性离子，共同控制着体内的酸碱平衡。"},{"q":"让体内细胞一直兴奋的矿物质离子主要是？","o":["钾、钠、钙、镁离子","铁、锌、碘离子","硫、磷、氯离子","氟、铝、铅离子"],"a":0,"e":"有让你体内细胞一直兴奋的矿物质。这就是各种无机离子，特别是钾、钠、钙、镁离子。"},{"q":"构成血红蛋白和细胞色素酶系的矿物质是？","o":["铁","碘","锌","钙"],"a":0,"e":"有构成体内特殊物质的矿物质。比如铁构成血红蛋白和细胞色素酶系，碘构成甲状腺素和谷胱甘肽过氧化物酶。"},{"q":"构成甲状腺素和谷胱甘肽
