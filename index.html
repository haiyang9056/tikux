状腺功能，尤其是自检超过多少分的？","o":["3分","4分","7分","10分"],"a":1,"e":"这就意味着，所有肥胖人群，如果想减肥，都要尽力强化甲状腺功能，尤其是自检超过4分的。【自检超过7分是建议赶紧去医院检查的界线，强化甲状腺功能尤其关注的是超过4分的人群】"},{"q":"硒对激活甲状腺有重要作用，体内硒过低会导致？","o":["甲状腺功能弱化","甲状腺功能亢进","血糖升高","血压下降"],"a":0,"e":"硒对激活甲状腺有重要作用，体内硒过低的话，会导致甲状腺功能弱化。"},{"q":"锌在甲状腺方面的作用是？","o":["调节甲状腺激素的重要矿物质","直接提供能量","抑制甲状腺素的合成","与甲状腺功能无关"],"a":0,"e":"锌同硒的作用差不多，是调节甲状腺激素的重要矿物质。"},{"q":"补充硒、锌的原则是？","o":["尽量食补，实在不行再考虑吃补充剂","直接大剂量吃补充剂","只吃补充剂不食补","完全不需要补充"],"a":0,"e":"天然食物中含锌比较多的是牡蛎、贝壳类、坚果种子以及牛肉等。尽量食补，实在不行再考虑吃补充剂。"},{"q":"研究证明，可以明显提升包括甲状腺素在内的各种激素水平的是？","o":["规律运动","长时间静坐","大量饮酒","长期熬夜"],"a":0,"e":"3．规律运动 研究证明，运动可以明显提升各种激素，包括甲状腺素的水平。"},{"q":"关于强化甲状腺的第三条'补充纤维素'，下列说法正确的是？","o":["它并不会强化甲状腺素功能，却能缓解甲减带来的胃肠蠕动减慢、便秘等问题","它能直接强化甲状腺素功能","它会加重便秘","它与甲状腺完全无关"],"a":0,"e":"3．补充纤维素 多吃蔬菜和薯类等食物。这并不会强化甲状腺素功能，却能缓解甲状腺功能减退带来的胃肠蠕动减慢、便秘等问题，同时改善脾虚湿盛、五谷不化导致的肥胖。"},{"q":"甲状腺素缺乏会影响血红蛋白合成，同时还会影响肠道对什么营养素的吸收？","o":["铁和叶酸","钙和维生素D","锌和硒","维生素C和钾"],"a":0,"e":"此外，甲状腺素缺乏会影响血红蛋白合成，同时影响肠道对铁和叶酸的吸收。"},{"q":"肥胖和阻塞性睡眠呼吸暂停之间的关系，书中比喻为？","o":["鸡和蛋的关系，是个死循环","两者完全无关","单向的因果关系","此消彼长的关系"],"a":0,"e":"所以，肥胖和阻塞性睡眠呼吸暂停就是个死循环，如果不打断，就是一道无解的题。……①阻塞性睡眠呼吸暂停和肥胖，就像是鸡和蛋的关系。"},{"q":"呼吸暂停后人缺氧，会使身体里的什么激素过度分泌，反过来又增加了肥胖的程度？","o":["胰岛素","甲状腺素","生长激素","肾上腺素"],"a":0,"e":"呼吸暂停后，人缺氧了，就会使身体里的胰岛素过度分泌，反过来又增加了肥胖的程度。"},{"q":"为什么要把阻塞性睡眠呼吸暂停单拎出来讲？除了发病率高，还因为？","o":["一旦得了这个病，光按第二章的方法减肥是减不下来的","它完全不影响减肥","它会让人自动变瘦","它属于可以自愈的疾病"],"a":0,"e":"为什么要把这个病单拎出来讲？一是因为这个病发病率很高，在中国有23.6％的成年人罹患；二是因为一旦得了这个病，光按第二章的方法减肥，是减不下来的。"},{"q":"怀疑自己有阻塞性睡眠呼吸暂停时，一般只需要做什么检查，医生就可以做出明确的诊断？","o":["睡眠监测","胃镜","抽血化验","心电图"],"a":0,"e":"如果自评达到3分，那你就要去医院了，找呼吸科、心内科或者睡眠科的医生都行。一般只需要做一个睡眠监测，医生就可以帮你做出明确的诊断。"},{"q":"胖了脖子就粗，会使打呼噜的时候什么更严重，从而导致睡眠呼吸暂停？","o":["喉部塌陷","鼻腔扩张","气管变粗","舌体缩小"],"a":0,"e":"胖了，脖子就粗，就会使打呼噜的时候喉部塌陷更严重，从而导致睡眠呼吸暂停。"},{"q":"一项非随机的小研究中，86名接受呼吸机治疗的患者均出现了？","o":["BMI的降低和内脏脂肪的减少","BMI的升高","内脏脂肪的增加","各项指标均无变化"],"a":0,"e":"最近一项非随机的小研究也印证了我的这个经验：86名接受呼吸机治疗的患者均出现了BMI的降低和内脏脂肪的减少，其中11人所患疾病出现好转。"},{"q":"减肥过程中体重下降速度的规律是？","o":["往往在初期最快，而后会逐渐放缓甚至停滞","匀速直线下降","越来越快","先慢后快"],"a":0,"e":"现实中，体重并不会以稳定的速度持续直线下降。第一个月减重4千克，并不意味着两个月可以减重8千克、四个月可以减重16千克。减肥过程中的体重下降速度往往在初期最快，而后会逐渐放缓甚至停滞。"},{"q":"平台期的长短会因什么而不同？","o":["个体差异、调整方法、原方法","季节的变化","居住的城市","饮食的口味"],"a":0,"e":"减肥过程中，连续两周以上体重不下降甚至有反弹趋势的阶段，被一些医学家定义为减肥平台期。平台期的长短会因个体差异、调整方法、原方法而不同。"},{"q":"关于平台期的'坏消息'是？","o":["平台期的出现是我们身体的本能，肯定不能跟它硬碰硬","可以用极端方式硬扛过去","吃得更少就能突破","加大运动量即可消除"],"a":0,"e":"坏消息是，平台期的出现是我们身体的本能，肯定不能跟它硬碰硬。"},{"q":"平台期是长肌肉的好时候，是因为这个阶段身体进入了？","o":["修复的过程，既不会让你更瘦，也不会让你更胖","分解的过程","储脂的过程","脱水的过程"],"a":0,"e":"第三，增加肌肉。平台期是长肌肉的好时候。这个阶段，我们的身体进入了修复的过程，既不会让你更瘦，也不会让你更胖。"},{"q":"平台期增加肌肉时，建议力量训练比平常增加多少？","o":["一半","一倍","两倍","三倍"],"a":1,"e":"这时候，建议你比平常增加一倍力量训练，同时补充蛋白质。"},{"q":"只要在平台期增加了肌肉，下一轮减肥开启时你就会？","o":["比其他小伙伴更加优秀","更容易反弹","完全没有效果","需要重新减脂"],"a":0,"e":"你会发现，两周后，即使体重不掉，别人也会夸你看起来瘦了一圈。只要在平台期增加了肌肉，下一轮减肥开启时，你就会比其他小伙伴更加优秀。"},{"q":"平台期并不纯粹是坏事，它可以用来？","o":["调整身体比例，帮你准备好更平和的心态和更强大的身体","停止一切运动","恢复原来的旧习惯","彻底放弃减肥"],"a":0,"e":"所以，平台期并不纯粹是坏事。它可以用来调整身体比例，帮你准备好更平和的心态和更强大的身体，迎接下一轮的减重。这就好比我们加速跑前的热身，热身越充分，加速越给力。"},{"q":"度过平台期时'交替使用不同方法'在饮食上的例子是？","o":["开启一个月的轻断食，很容易地骗过身体的记忆","一直重复原来的方案","完全停止进食","只吃蛋白质"],"a":0,"e":"这时候，如果你换个花样，比如开启一个月的轻断食，就可以很容易地骗过身体的记忆，还会带来其他意想不到的好处。"},{"q":"医学减肥领域的专家们总结说，世上减肥“坑”的数量大约是有效减肥方法的多少倍？","o":["10倍","50倍","100倍","1000倍"],"a":2,"e":"某日，几个医学减肥领域的大咖一起开会，聊起门诊时听过最多的故事，不是减肥成功了，或是失败了，而是被骗了。大家总结说：“这个世上，减肥的“坑”，数量大约是有效减肥方法的100倍。”所以，你接触到的100个减肥方法里，可能有99个都是“坑”。"},{"q":"大咖们聊起门诊时听过最多的故事，不是减肥成功或失败，而是什么？","o":["被骗了","复胖了","没坚持下来","方法太复杂"],"a":0,"e":"某日，几个医学减肥领域的大咖一起开会，聊起门诊时听过最多的故事，不是减肥成功了，或是失败了，而是被骗了。"},{"q":"关于“快速减肥”，书中给出的真相是？","o":["只要方法得当就可以快速减肥","除了动手术，几乎所有的快速减肥都是不可信的","快速减肥配合代餐是可行的","快速减肥只适合年轻人"],"a":1,"e":"4.1 快速减肥 真相：除了动手术，几乎所有的快速减肥都是不可信的。"},{"q":"进行辟谷的人，有的会吃一粒丹丸，除此之外基本上每天？","o":["只吃蔬菜","只吃水果","除了喝水基本不吃任何食物","只喝牛奶"],"a":2,"e":"进行辟谷的人，有的会吃一粒丹丸，总体上除了喝水，基本每天不吃任何食物。"},{"q":"生酮减肥法的核心要求是严格控制什么，通过吃大量脂肪让酮体供能？","o":["蛋白质","碳水化合物","膳食纤维","食盐"],"a":1,"e":"这种方法要求减肥者不吃或吃很少的主食、蔬菜、水果等，严格控制碳水化合物，通过吃大量脂肪让酮体供能。"},{"q":"减肥茶号称可以“刮油”，其实是因为添加了什么，让饮用者增加排泄？","o":["膳食纤维和益生菌","医用泻药和利尿剂","左旋肉碱和咖啡因","蛋白粉和代糖"],"a":1,"e":"减肥茶号称可以刮油，其实是添加了医用泻药和利尿剂等，让饮用者增加排泄。"},{"q":"辟谷、生酮、减肥茶、节食加过度运动，这些快速减肥方法的本质都是一样的，即？","o":["让你脱水","让你减少脂肪","让你提高基础代谢","让你增加肌肉"],"a":0,"e":"其实，以上快速减肥方法的本质都是一样的：让你脱水。无论你是胖还是瘦，水分都占了你身体成分的70％。如果单纯只想减轻体重，再没有什么方法能比直接脱水更快了。"},{"q":"无论你是胖还是瘦，水分都占了你身体成分的多少？","o":["30%","50%","70%","90%"],"a":2,"e":"其实，以上快速减肥方法的本质都是一样的：让你脱水。无论你是胖还是瘦，水分都占了你身体成分的70％。"},{"q":"水分分布在人体每一个器官的细胞内外和血液中，而肌肉中的“储水大户”是？","o":["肌纤维","肌糖原","血红蛋白","肌酸"],"a":1,"e":"水分分布在人体每一个器官的细胞内外和血液中，而肌肉中的肌糖原正是储水大户。"},{"q":"辟谷和生酮减肥法能达到脱水效果，共同点在于？","o":["都添加了利尿剂","身体没了碳水化合物作为能量来源，正好消耗所有的肌糖原以及它储存的水分","都要求大量出汗","都会导致腹泻"],"a":1,"e":"辟谷和生酮减肥法的共同点，是由于身体没了碳水化合物作为能量来源，正好消耗所有的肌糖原以及它储存的水分，从而达到脱水的效果。"},{"q":"在快速减肥的几种方法中，医用泻药和利尿剂属于什么，而“节食＋过度运动”则两种脱水方法都包括？","o":["比较直接的排水","间接提高代谢","减少脂肪合成","增加饱腹感"],"a":0,"e":"医用泻药和利尿剂属于比较直接的排水，节食＋过度运动则两种脱水方法都包括。"},{"q":"减肥的核心显然是要减掉什么？","o":["体重秤上的数字","脂肪","水分","肌肉"],"a":1,"e":"然而，减肥的核心显然是要减掉脂肪，而不是减掉体重秤上的数字。"},{"q":"为什么快速减肥方法一旦停下来，体重就会快速反弹？","o":["因为它们都是短期的，水分很快就会补充回来","因为脂肪细胞会迅速增多","因为基础代谢永久受损","因为它们抑制了食欲"],"a":0,"e":"用这些方法，体重减少确实快，但是恢复起来也特别快。因为它们都是短期的。你能一辈子辟谷吗？还是能一辈子坚持不吃主食，不碰碳水化合物？一旦停下来，水分很快就会补充回来，体重也随之快速反弹。"},{"q":"快速减肥反弹之后，如果还想用同一类方法重新减，为什么肯定减不下去？","o":["因为身体长记性了，绝不轻易掉肉","因为方法已经失效需要换新的","因为肌肉量增加了","因为肠胃吸收变差了"],"a":0,"e":"因为，我们的身体长记性了！身体说，你那么长时间都没吃饭，营养极度不良，幸亏我节能减排，才没丢了小命。这回又来？我绝不轻易掉肉了。"},{"q":"在其他危险因素完全一致的情况下，体重变化最大的20%患者与变化最小的20%相比，冠心病风险提高了多少？","o":["36%","64%","117%","136%"],"a":1,"e":"在受访人群中，其他危险因素完全一致的情况下，体重变化最大的20％患者与变化最小的20％相比，冠心病风险提高了64%，心肌梗死风险提高了117%，而脑卒中风险提高了136％。"},{"q":"在其他危险因素完全一致的情况下，体重变化最大的20%患者与变化最小的20%相比，心肌梗死风险提高了多少？","o":["64%","100%","117%","136%"],"a":2,"e":"在受访人群中，其他危险因素完全一致的情况下，体重变化最大的20％患者与变化最小的20％相比，冠心病风险提高了64%，心肌梗死风险提高了117%，而脑卒中风险提高了136％。"},{"q":"在其他危险因素完全一致的情况下，体重变化最大的20%患者与变化最小的20%相比，脑卒中风险提高了多少？","o":["64%","117%","126%","136%"],"a":3,"e":"在受访人群中，其他危险因素完全一致的情况下，体重变化最大的20％患者与变化最小的20％相比，冠心病风险提高了64%，心肌梗死风险提高了117%，而脑卒中风险提高了136％。"},{"q":"下列哪一项不属于书中列举的快速减肥的常见危害？","o":["胃肠功能衰退","抵抗力下降","皮肤变差、脱发","肌肉量明显增加"],"a":3,"e":"除此之外，快速减肥还有很多其他危害，比如常见的胃肠功能衰退；抵抗力下降；月经期延长，月经量变少，甚至停止；皮肤变差；脱发。【原文列举的危害中并不包括肌肉量增加】"},{"q":"近年来不少研究指出，体重陡然减少或者增加，都会增加哪些情况的发生率？","o":["骨折、扭伤","心梗、猝死、脑梗","龋齿、口腔溃疡","近视、听力下降"],"a":1,"e":"近年来还有不少研究指出，体重陡然减少或者增加，都会增加心梗、猝死、脑梗的发生率。"},{"q":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度是？","o":["每周减少0.5~1千克","每周减少1.5~2千克","每天减少0.5千克","每月减少5千克"],"a":0,"e":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度，都是每周减少0.5~1千克，超过1.5千克的话，减肥者患胆结石的风险会大幅提高。"},{"q":"每周减重超过多少，减肥者患胆结石的风险会大幅提高？","o":["0.5千克","1千克","1.5千克","2千克"],"a":2,"e":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度，都是每周减少0.5~1千克，超过1.5千克的话，减肥者患胆结石的风险会大幅提高（见图4-1）。"},{"q":"书中指出，让你一次次掉进同样“坑”的真正原因是？","o":["广告太有说服力","在我们的心里，都住着一个总想走“捷径”的小朋友","科学知识不足","身边人都在减肥"],"a":1,"e":"在我们的心里，都住着一个总想走“捷径”的小朋友，这是让你一次次掉进同样的“坑”的真正原因。但是，减肥成功，最终靠的是你的生活方式。"},{"q":"关于减肥的速度，书中的说法是？","o":["减肥可以简单，但不可以太快","越快越好","必须慢到没有任何感觉","速度完全不重要"],"a":0,"e":"生活哪有什么捷径可言？减肥可以简单，但不可以太快，这个世界上，真正的成功都需要时间的累积。“坑”其实长在你的心里，我们把它填平夯实，你就没有弱点可以被人攻击。"},{"q":"关于“我试过，这法子特好用”，书中给出的真相是？","o":["别人试过有效的对你也一定有效","“我试过”，不是大多数人长期试过","只要坚持三个月就一定有效","朋友推荐的方法都是坑"],"a":1,"e":"4.2 “我试过，这法子特好用” 真相：“我试过”，不是大多数人长期试过。"},{"q":"判断别人的方法对你是否有效，第一个前提是：朋友推荐给你的，一定是？","o":["一个原则，而不是一个具体方法","一个具体方法，而不是一个原则","经过临床验证的药物","最流行的一种方案"],"a":1,"e":"这里有两个前提。一是朋友推荐给你的，一定是一个具体方法，而不是一个原则。原则可能适合你或者大多数人，但具体方法就不一定了。二是这个方法不一定是坑，我们只是在判断它好不好用。"},{"q":"同样的食物在不同个体身上引起的血糖效应不一样，原因可能是？","o":["胰岛素分泌速度不同","肠道微生物构成的不同","胃容量不同","肝功能差异"],"a":1,"e":"同样的食物，在不同个体身上引起的血糖效应不一样，原因可能是肠道微生物构成的不同。举个例子，我为你推荐的某种低GI食物，可能早上你闺蜜吃了，到中午也不饿，而你吃了，不到两小时就饿了。所以究竟哪种食物适合自己，要多试一试。"},{"q":"即便两个人体重差不多，体脂率不同，减肥方案也不同。体脂率较高的人更适合什么运动？","o":["力量训练","高强度间歇训练","有氧运动","柔韧性训练"],"a":2,"e":"即便两个人体重差不多，体脂率不同，采用的减肥方案也是不同的。体脂率较高的人更适合有氧运动，减肥期摄入的能量相对应该更少一些。"},{"q":"一款代餐，男生吃了瘦下来了，推荐给自己的女朋友吃反而可能让她长胖，这体现了哪种差异？","o":["基因差异","血糖效应差异","体脂率差异","减肥史差异"],"a":2,"e":"即便两个人体重差不多，体脂率不同，采用的减肥方案也是不同的。体脂率较高的人更适合有氧运动，减肥期摄入的能量相对应该更少一些。一款代餐，男生吃了瘦下来了，但是如果他推荐给自己的女朋友吃，反而可能会让女朋友长胖。"},{"q":"别人通过减少主食摄入量瘦了下来，但你本身吃主食就很少，这个方法对你就没作用了。这属于哪种差异？","o":["基因差异","生活习惯差异","体脂率差异","血糖效应差异"],"a":1,"e":"别人通过减少主食摄入量瘦了下来，但你本身吃主食就很少，对你来说，这个方法肯定就没作用了。别人通过增加运动量瘦了下来，但你平时就有运动习惯，对你来说，这个方法也是无用的。"},{"q":"对于采取过极端方式减肥的人来说，别人的减肥方法可能就会怎样？","o":["效果更好","无效","需要加倍执行","只适合短期用"],"a":1,"e":"之前是否有过减肥经历，采用哪种方式减肥，减肥速度快慢等，都会对减肥的效果有极大影响。对于采取过极端方式减肥的人来说，别人的减肥方法可能就会无效。"},{"q":"为什么我们那么容易轻信别人的方法？书中给出的解释是？","o":["广告投放量大","身边的榜样力量最强大，人很容易和自己身边的人形成比较，并以他们为自己的模仿坐标","科学普及不够","朋友更懂营养学"],"a":1,"e":"身边的榜样，力量最强大。人很容易和自己身边的人形成比较，并以他们为自己的模仿坐标。而面对奥运会冠军、科学家、企业家这种杰出人物，你则会抱持吃瓜的心态，觉得他们身上发生的一切都是“人家”的世界，看看就好。"},{"q":"就健康生活方式的养成而言，你要寻找的、对标的，应该是？","o":["近处的朋友","网红博主","来自科学的力量","奥运冠军"],"a":2,"e":"但是就健康生活方式的养成而言，你要寻找的、对标的，不应该是近处的谁，而应该是来自科学的力量。照着科学的方法去做，做着做着，做成了习惯，你就会变成别人眼中的“人家”。"},{"q":"关于0蔗糖、0脂肪、0卡路里产品，书中给出的真相是？","o":["可以放心多吃","0产品对减肥没有显著作用","只要是0产品就都能减肥","0卡路里产品最安全"],"a":1,"e":"4.3 0蔗糖，0脂肪，0卡路里 真相：0产品对减肥没有显著作用。"},{"q":"关于宣称“0蔗糖”的产品，书中指出？","o":["基本都不是0糖","等同于0碳水化合物","一定不含果糖","能量一定很低"],"a":0,"e":"0蔗糖≠0糖≠0碳水化合物 说自己“0蔗糖”的产品，基本都不是0糖。"},{"q":"糖的种类很多，不加蔗糖还可以添加其他糖。下列哪种糖的GI比蔗糖还要高？","o":["果糖","葡萄糖","麦芽糖","椰子糖"],"a":2,"e":"糖的种类很多，不加蔗糖，还可以添加其他糖，比如麦芽糖、白砂糖、果糖、葡萄糖、果葡糖浆、椰子糖等。麦芽糖的GI比蔗糖还要高，很多医学研究也都发现，果葡糖浆、人工添加的果糖，都会明显增加体重。"},{"q":"很多医学研究发现，下列哪种成分都会明显增加体重？","o":["膳食纤维、抗性淀粉","果葡糖浆、人工添加的果糖","乳清蛋白、胶原蛋白","不饱和脂肪酸"],"a":1,"e":"糖的种类很多，不加蔗糖，还可以添加其他糖，比如麦芽糖、白砂糖、果糖、葡萄糖、果葡糖浆、椰子糖等。麦芽糖的GI比蔗糖还要高，很多医学研究也都发现，果葡糖浆、人工添加的果糖，都会明显增加体重。"},{"q":"拿到所谓0蔗糖的产品，你应该怎么做？","o":["直接当健康食品吃","翻到食品标签，看成分里有什么其他糖，如果有就当成普通含糖食品对待","只吃一半的量","搭配运动一起吃就没关系"],"a":1,"e":"所以，拿到所谓0蔗糖的产品，你可以翻到食品标签，看一下成分里有什么其他糖，如果有，那就把它当成普通含糖食品来对待吧。"},{"q":"如果食品标签写的是“0糖”，顶多意味着什么？","o":["不含碳水化合物","没有额外添加糖","能量为零","不含脂肪"],"a":1,"e":"如果写的是“0糖”，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。比如无糖酸奶，奶制品里本身有乳糖，也有碳水化合物；无糖饼干，虽然没有添加糖，但都是碳水化合物。"},{"q":"无糖饼干虽然没有添加糖，但其实都是什么？","o":["蛋白质","脂肪","碳水化合物","膳食纤维"],"a":2,"e":"如果写的是“0糖”，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。比如无糖酸奶，奶制品里本身有乳糖，也有碳水化合物；无糖饼干，虽然没有添加糖，但都是碳水化合物。"},{"q":"对于0糖食品，书中特别提醒你要更关注什么？","o":["蛋白质","脂肪","钠含量","维生素"],"a":1,"e":"此外，0糖食品要更关注脂肪。很多高脂肪食品都会宣称自己无糖，但它们的能量其实很高。"},{"q":"如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上什么的量，往往它会极高？","o":["蛋白质","碳水化合物","膳食纤维","钙"],"a":1,"e":"0脂肪≠0碳水化合物 如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上碳水化合物的量，往往它的碳水化合物含量会极高。"},{"q":"“0卡路里”的食物相对比较健康，你需要额外注意的是什么不能吃得过多？","o":["含膳食纤维的0卡路里食物","含代糖和甜味剂的0卡路里食物","含蛋白质的0卡路里食物","含矿物质的0卡路里食物"],"a":1,"e":"“0卡路里”的食物相对比较健康。你需要额外注意的是，含代糖和甜味剂的0卡路里食物，不能吃得过多。"},{"q":"当我们的舌头尝到“甜”时，大脑会告诉哪里分泌胰岛素来降糖？","o":["肝脏","胰岛","肾上腺","甲状腺"],"a":1,"e":"代糖和甜味剂虽然没有能量，却会干扰我们大脑内能量代谢的传递过程。当我们的舌头尝到“甜”时，大脑会认为人体摄入了“糖”（真正的糖，如蔗糖、果糖等），就会告诉胰岛分泌胰岛素来降糖。"},{"q":"代糖和甜味剂虽然没有能量，却会造成什么后果？","o":["干扰大脑内能量代谢的传递过程，使胰岛素增加分泌、促进脂肪生成","直接升高血糖","抑制食欲","提高基础代谢"],"a":0,"e":"代糖和甜味剂虽然没有能量，却会干扰我们大脑内能量代谢的传递过程。这种刺激虽然不会升高体内的血糖，但对大脑来说，和吃了真正的糖是差不多的，也会使胰岛素增加分泌，促进脂肪生成，当然也就有可能增加肥胖的风险。"},{"q":"最近的研究显示，食物中添加代糖和甜味剂，在减肥和预防糖尿病上的作用是？","o":["有显著作用","有一定作用","没有任何作用，而且比起不添加，糖尿病风险更高","只对儿童有作用"],"a":2,"e":"所以，食物中添加代糖和甜味剂虽然比直接添加糖好一些，但是最近的研究显示，这在减肥和预防糖尿病上没有任何作用，而且比起不添加，糖尿病风险更高。"},{"q":"为什么普通人很难避开商家的“坑”？作者的对策是什么？","o":["商家动用了专业的营养、心理、体验感等工具设计你的感受，作者要为你赋予专业的判断力，用专业对抗专业","只要不看广告就行","靠意志力硬抗","买贵的产品"],"a":0,"e":"在产品设计上，商家有一系列专业人才，他们动用了专业的营养、心理、体验感等工具，来设计你的感受。作为普通人，你很难避开商家的“坑”。而我这本书，正是要为你在减肥问题上赋予专业的判断力，用专业对抗专业。"},{"q":"关于大量运动，书中给出的真相是？","o":["大量运动能带来大幅度减重","大量运动并不能带来大幅度减重","大量运动是最安全的减肥方式","大量运动只适合年轻人"],"a":1,"e":"4.4 大量运动 真相：大量运动并不能带来大幅度减重。"},{"q":"身体活动消耗的能量，占人体能量总消耗的多少？","o":["5%~10%","15%~30%","30%~50%","50%~70%"],"a":1,"e":"身体活动消耗的能量，占人体能量总消耗的15%~30%，但这并不意味着大量剧烈运动就能达到消耗值的上限。"},{"q":"在身体活动消耗的这部分能量中，占据最大比例的是什么？","o":["跑步、游泳等专项训练","走路、做家务、伸个懒腰等日常一切行为活动","健身房力量训练","球类运动"],"a":1,"e":"事实上，身体活动还包括日常劳动等一切行为活动，走路、做家务、伸个懒腰，都算在其中。这些活动消耗的能量，占据了30％这个数值的最大比例。"},{"q":"为什么大量剧烈运动之后，其他活动消耗的能量往往会相应减少？","o":["因为关节受损","因为腰酸腿软、浑身疲累，只想躺平","因为肌肉合成增加","因为食欲下降"],"a":1,"e":"回忆一下自己大量剧烈运动后的状态吧。腰酸腿软，浑身疲累，只想躺平，对不对？做家务？出门买菜？就别提了，完全不想动。所以，大量剧烈运动之后，其他活动消耗的能量往往会相应减少，一增一减，总的来说，消耗的能量是有限的。"},{"q":"我们的身体经过百万年的进化，其实是为节约能量而设计的。因此规律的大量剧烈运动后期，身体的基础代谢会比之前怎样？","o":["上升","下降","不变","先降后升"],"a":1,"e":"我们的身体经过百万年的进化，其实是为节约能量而设计的。身体会十分恐惧能量不足，希望你能用最少的能量干最大的事，把大部分能量留存下来应对各种紧急情况。一些新的研究发现，在规律的大量剧烈运动后期，身体的基础代谢会比之前下降。"},{"q":"尤其是BMI较高的人，规律大量剧烈运动后期的能量补偿比例会达到多少？","o":["19%","29%","39%","49%"],"a":3,"e":"一些新的研究发现，在规律的大量剧烈运动后期，身体的基础代谢会比之前下降；尤其是BMI较高的人，能量补偿比例会达到49%，也就是说，运动消耗的能量可能会被打对折，辛辛苦苦做运动消耗的能量，又被身体的节能本能给补充回来了。"},{"q":"能量补偿比例达到49%，意味着运动消耗的能量可能会怎样？","o":["翻倍","被打对折","完全归零","增加一半"],"a":1,"e":"尤其是BMI较高的人，能量补偿比例会达到49%，也就是说，运动消耗的能量可能会被打对折，辛辛苦苦做运动消耗的能量，又被身体的节能本能给补充回来了。"},{"q":"运动效果递减的原因，不包括下列哪一项？","o":["动作的熟练化","运动模式的固定化","体重下降","基础代谢升高"],"a":3,"e":"这是因为，动作的熟练化、运动模式的固定化，加上体重下降，造成相同运动强度下，单位时间身体消耗的能量在不断下降。【原文给出的三个原因是动作熟练化、运动模式固定化、体重下降，不包括基础代谢升高】"},{"q":"解决运动效果递减的办法不包括下列哪一项？","o":["加快速度","增加训练重量或组数","发现并体验一种新的运动方式","彻底停止运动"],"a":3,"e":"当然，有很多方法可以解决这个问题，比如加快速度，增加训练重量或是组数，或者去发现并体验一种新的运动方式，都能让运动效果持续。"},{"q":"书中提到的一项为期四周的研究，前三周受试者的高强间歇运动量分别是？","o":["20分钟、40分钟、60分钟","36分钟、90分钟、152分钟","45分钟、75分钟、120分钟","30分钟、60分钟、120分钟"],"a":1,"e":"一项为期四周的最新研究，让受试者在前三周逐渐加量，每周分别做36分钟、90分钟和152分钟的高强间歇运动，并在第四周减少到52分钟。"},{"q":"上述为期四周的过量运动研究中，血糖监测、葡萄糖耐量试验和线粒体呼吸功能各项指标反而变差，出现在什么时候？","o":["第一周","第二周","第三周运动量最大的时候","第四周减量之后"],"a":2,"e":"同时对受试者进行血糖监测和葡萄糖耐量试验，并测定线粒体的呼吸功能。结果发现，在第三周运动量最大的时候，受试者的上述各项指标反而变差，到第四周运动减量后仍然无法完全恢复。"},{"q":"上述研究中，第四周运动减量后，各项指标的情况是？","o":["完全恢复","仍然无法完全恢复","继续变差","与第三周持平"],"a":1,"e":"结果发现，在第三周运动量最大的时候，受试者的上述各项指标反而变差，到第四周运动减量后仍然无法完全恢复。"},{"q":"近年来在猝死案例中占据较大比例的是什么？作者因此建议，如果要进行大量剧烈运动，请一定避开什么？","o":["晨跑猝死；避开空腹时段","运动中猝死，尤其是大量剧烈运动后猝死；避开自己的重度疲劳期和高压期","夜间猝死；避开晚餐后","感冒时猝死；避开冬季"],"a":1,"e":"近年来，在猝死的案例中，运动中猝死，尤其是大量剧烈运动后猝死，占据了较大的比例。所以，如果要进行大量剧烈运动，请一定避开自己的重度疲劳期和高压期。"},{"q":"为什么我们会信奉“自虐式”的大量运动？书中给出的解释是？","o":["因为我们不了解运动生理学","因为我们内心认可付出了汗水就要有对等的收获，且大量运动初期效果非常明显","因为教练这样要求","因为器材太贵"],"a":1,"e":"我们内心认可，付出了汗水，就要有对等的收获。大量运动初期效果非常明显，看着体重一天天往下掉，由不得你不心动，所以，它自然就成了你长久的念想。但是，如果没有科学的指导，努力的方向不一定正确。对于减肥来说，大量运动的效果不过是昙花一现。"},{"q":"关于“让脂肪不吸收与加速燃烧”，书中给出的真相是？","o":["有特效保健品可以做到","除了生病，吃进去的脂肪没有不吸收的可能；除了运动，几乎什么都不能让脂肪加速燃烧","只有进口产品可以做到","节食就能做到"],"a":1,"e":"4.5 让脂肪不吸收与加速燃烧 真相：除了生病，吃进去的脂肪没有不吸收的可能。除了运动，几乎什么都不能让脂肪加速燃烧。"},{"q":"作者说，平均几个来找他减肥的人中，就有一个会带着新发现的“秘密武器”？","o":["2个","3个","5个","10个"],"a":1,"e":"在我的记忆中，平均三个来找我减肥的人中，就有一个会带着新发现的秘密武器，问我管不管用。什么“脂肪粉碎丸”“脂肪阻断剂”“加速脂肪酶”“脂肪燃烧弹”“燃脂精英”，进口的、国产的都有。"},{"q":"目前最管用的脂肪吸收抑制剂是哪一种？","o":["二甲双胍","奥利司他","左旋肉碱","西布曲明"],"a":1,"e":"第一，坦白地说，让脂肪不吸收，是一个全球性的医学难题。目前最管用的脂肪吸收抑制剂，奥利司他，也只有30％的吸收抑制作用。"},{"q":"奥利司他的脂肪吸收抑制作用只有多少？","o":["10%","20%","30%","50%"],"a":2,"e":"目前最管用的脂肪吸收抑制剂，奥利司他，也只有30％的吸收抑制作用。这就是说，即使用奥利司他，你吃下去的脂肪也会有70％顺利进入你的体内，转化成你自己的脂肪并储存下来。"},{"q":"即使用了奥利司他，你吃下去的脂肪仍有多少会顺利进入体内并储存下来？","o":["30%","50%","70%","100%"],"a":2,"e":"这就是说，即使用奥利司他，你吃下去的脂肪也会有70％顺利进入你的体内，转化成你自己的脂肪并储存下来。"},{"q":"在抑制脂肪吸收这件事上，全球目前的食物提取物研究中，可以稳定达到的抑制比例是？","o":["5%","10%","15%","连5%都没有，连安慰剂的效果都不如"],"a":3,"e":"事实上，不要说30%，全球目前的研究中，可以稳定达到5％的都没有，连安慰剂的效果都不如。所以，如果吃了这类保健品，你就抱着脂肪不会吸收的心态，放心地大吃大喝，那比不吃这类保健品更糟糕。"},{"q":"吃了“脂肪阻断”类保健品，最糟糕的情况是什么？","o":["产生依赖","抱着脂肪不会吸收的心态放心地大吃大喝","引起腹泻","干扰药物吸收"],"a":1,"e":"所以，如果吃了这类保健品，你就抱着脂肪不会吸收的心态，放心地大吃大喝，那比不吃这类保健品更糟糕。"},{"q":"让脂肪加速燃烧，目前的情况是？","o":["已有多种产品上市","在医学上更是难上加难，目前没有任何医学产品在这个领域上市","只有进口产品有效","配合节食即可实现"],"a":1,"e":"第三，让脂肪加速燃烧，在医学上更是难上加难，目前没有任何医学产品在这个领域上市。"},{"q":"只要营养均衡，我们的身体本身就可以生产出什么，在需要时自动完成燃脂？","o":["左旋肉碱","燃烧脂肪的酶","咖啡因类似物","酮体"],"a":1,"e":"事实上，我们的身体只要营养均衡，本身就可以生产出燃烧脂肪的酶，在需要时自动完成燃脂这个步骤，不需要额外补充什么物质。"},{"q":"左旋肉碱、咖啡因、辣椒素协助燃脂的核心原理是，把脂肪运送到其燃烧场所，这个场所是？","o":["细胞核","线粒体","内质网","溶酶体"],"a":1,"e":"这一功能的核心原理是，它们可以协助身体把脂肪运送到其燃烧场所-线粒体，相当于搬运工。但事实上，这些搬运工我们人体自身就能产生，食物中也天然含有，应对一般运动和日常生活足够了。"},{"q":"在燃脂过程中，左旋肉碱、咖啡因、辣椒素相当于什么角色？","o":["催化剂","搬运工","清洁剂","燃料"],"a":1,"e":"这一功能的核心原理是，它们可以协助身体把脂肪运送到其燃烧场所-线粒体，相当于搬运工。"},{"q":"只有在什么情况下，才有可能出现“搬运工短缺”？","o":["长期节食时","增加到极大运动量时","熬夜之后","生病期间"],"a":1,"e":"第五，只有在增加到极大运动量时，才有可能出现搬运工短缺。但我们前面说过，大量运动对于减肥来说并不可取。"},{"q":"伪科学的做法是？","o":["完全不提科学概念","用科学当幌子，借用科学的概念和研究方向，在科研成果的基础上杜撰、篡改、夸大","只做动物实验","只针对老年人"],"a":1,"e":"伪科学一定会用科学当幌子，借用科学的概念和研究方向，在科研成果的基础上杜撰、篡改、夸大。有时即便是做医生的我，也要查阅多篇文献才能搞清楚真相。"},{"q":"作者炼成“火眼金睛”的简单办法是什么？","o":["多看广告","敬畏生命","买贵的不买便宜的","只看销量"],"a":1,"e":"我有一个简单的办法：敬畏生命。具体来说，凡是涉及改变、干预身体本身的，以及涉及生理调节机制的产品，你都需要慎之又慎，多方求证，比如看看官方的网站和一些学术平台，问问这个领域的同学，问问医生。求证后再下单，不花冤枉的钱，不走绕远的道。"},{"q":"按作者的建议，凡是涉及改变、干预身体本身的，以及涉及生理调节机制的产品，求证渠道不包括下列哪一项？","o":["看看官方的网站","看看学术平台","问问这个领域的同学、问问医生","问卖货的微商"],"a":3,"e":"具体来说，凡是涉及改变、干预身体本身的，以及涉及生理调节机制的产品，你都需要慎之又慎，多方求证，比如看看官方的网站和一些学术平台，问问这个领域的同学，问问医生。求证后再下单，不花冤枉的钱，不走绕远的道。【原文给出的求证渠道是官方网站、学术平台、领域同学和医生】"},{"q":"关于减肥训练营，书中给出的真相是？","o":["封闭式训练营一定有效","减肥成果，看长期","训练营是唯一的出路","三个月足够改变一生"],"a":1,"e":"04.6 只管三个月的减肥训练营 真相：减肥成果，看长期。"},{"q":"市面上流行的减肥训练营有哪两种？","o":["线上式和线下式","开放式和封闭式","免费式和收费式","个人式和团体式"],"a":1,"e":"市面上流行的减肥训练营有两种，一种是开放式，一种是封闭式。"},{"q":"下列哪一项属于封闭式训练营的特征？","o":["建个微信群，人还在家里住","健身房里规律训练，配餐上门","把你带到某个固定环境中（比如大山里），吃喝住行都由训练营安排","只提供线上课程"],"a":2,"e":"封闭式通常都有一个固定场所，或者把你带到某个固定环境中，比如带进大山里，接下来你的吃喝住行，都由训练营安排。"},{"q":"开放式和封闭式训练营相比，书中怎么说？","o":["开放式效果更好","封闭式管理更加严格，效果自然更好一些","两者效果完全相同","开放式一定反弹"],"a":1,"e":"开放式比较自由，封闭式呢，管理更加严格，效果自然更好一些。"},{"q":"美国有研究指出，由专业减肥机构指导的减肥，成功率大约比普通减肥高多少？","o":["5%~10%","10%~50%","50%~80%","80%~100%"],"a":1,"e":"美国有研究指出，由专业减肥机构指导的减肥，成功率大约比普通减肥高10%~50％。"},{"q":"作者想让你警惕的关键词，不是“训练营”，而是什么？","o":["“高价”","“只管三个月”","“封闭式”","“代餐”"],"a":1,"e":"那么，我们为什么还要批评减肥训练营呢？我想让你警惕的关键词，不是“训练营”，而是“只管三个月”。这在减肥训练营里非常普遍。管三个月都算久的，大部分减肥效果只能保持一个月。"},{"q":"大部分减肥训练营的减肥效果只能保持多久？","o":["一周","一个月","三个月","半年"],"a":1,"e":"我想让你警惕的关键词，不是“训练营”，而是“只管三个月”。这在减肥训练营里非常普遍。管三个月都算久的，大部分减肥效果只能保持一个月。"},{"q":"作者中心的患者，很多在训练营里瘦了10千克，出来一年不到又长回去多少？","o":["5~6千克","8~9千克","12~13千克","20千克"],"a":2,"e":"我们中心的患者，很多都是在训练营里瘦了10千克，出来一年不到，又长回去12~13千克。这部分人再想减肥的话，只会难上加难。"},{"q":"因为体重波动比较大，训练营反弹的这部分人当中，发生率非常高的是？","o":["高血脂、高血糖","骨折","龋齿","近视"],"a":0,"e":"而且，因为体重波动比较大，他们当中高血脂、高血糖的发生率非常高，从长期来看，心脑血管疾病发生率也更高。"},{"q":"从长期来看，体重波动比较大的人群，发生率更高的是？","o":["呼吸系统疾病","心脑血管疾病","消化系统疾病","皮肤病"],"a":1,"e":"而且，因为体重波动比较大，他们当中高血脂、高血糖的发生率非常高，从长期来看，心脑血管疾病发生率也更高。"},{"q":"好训练营“不破坏你的健康”这一条中，最直观的判断标准是？","o":["体重","精力","腰围","食欲"],"a":1,"e":"其中最直观的是精力。好的减肥方案，随着体重越来越轻，精力应该越来越充沛，而不是体重越下降，人越没精打采。"},{"q":"好的减肥方案，随着体重越来越轻，精力应该怎样？","o":["越来越充沛","保持不变","越来越差","先好后差"],"a":0,"e":"其中最直观的是精力。好的减肥方案，随着体重越来越轻，精力应该越来越充沛，而不是体重越下降，人越没精打采。"},{"q":"判断训练营提供的饮食方案是否属于“节食减肥”，最重要的判断标准是？","o":["有没有节食，饥饿感是不是特别重","吃了几种食物","是不是分餐制","有没有配营养师"],"a":0,"e":"好训练营提供的饮食指导应该很适合你，能让你长期坚持。最重要的判断标准就是有没有节食，饥饿感是不是特别重。"},{"q":"无论训练营宣称采取哪种饮食方案，只要怎样，就都是节食减肥？","o":["使用代餐","过度地减少能量","不吃晚餐","限制主食"],"a":1,"e":"无论训练营宣称采取哪种饮食方案，只要过度地减少能量，就都是节食减肥。不要觉得反正只有三个月甚至两周，忍一忍就好。节食既伤害身体又没有长期益处，是不可取的。"},{"q":"封闭式训练营虽然减肥效果更好，但为什么一旦出营反弹就很难避免？","o":["因为食物太难吃","因为每天不上学不上班、进行四个小时高强度运动，或者干脆不吃饭，这些没办法长期坚持","因为管理太严格","因为价格太高"],"a":1,"e":"从这个角度看，封闭式训练营虽然减肥效果更好，但每天不上学、不上班、进行四个小时高强度运动，或者干脆不吃饭，这些都是没办法长期坚持的，所以一旦出了营，反弹就很难避免了。"},{"q":"作者说，在减肥这件事上，你最终能够依靠的只有什么？","o":["专业教练","营养师","你自己","减肥药物"],"a":2,"e":"但是，在减肥这件事上，你最终能够依靠的只有你自己。减肥归根到底要靠生活方式的改变，无论别人给了你多少帮助，你的生活只能由你做主。"},{"q":"减肥开始的那一刻，作者希望你做的一件重要的事是？","o":["买一台体重秤","办一张健身卡","相信自己，相信生命","找一个减肥搭子"],"a":2,"e":"所以，减肥开始的那一刻，我希望你做一件重要的事：相信自己，相信生命。当你完全接受并热爱自己的生命时，你就拥有了融入并改变它的力量。"},{"q":"关于代餐，书中给出的真相是？","o":["代餐都是智商税","代餐的坑很多，吃之前一定要看食品标签","代餐可以替代所有三餐","代餐越贵越好"],"a":1,"e":"4.7 代餐的坑 真相：代餐的坑很多，吃之前一定要看食品标签。"},{"q":"作者在得到App开了一门什么课程，收到最多的留言就是让他推荐、辨别代餐？","o":["营养学通识30讲","科学减肥16讲","心血管健康12讲","体重管理20讲"],"a":1,"e":"我在得到App开了一门名叫“科学减肥16讲”的课程，收到的最多的留言，就是让我推荐代餐，辨别代餐。"},{"q":"《中国超重／肥胖医学营养治疗专家共识》明确指出，配合营养代餐的强化生活方式干预，比什么更能有效降低患者的体重？","o":["单纯的运动干预","单纯的膳食支持和教育","药物治疗","手术治疗"],"a":1,"e":"《中国超重／肥胖医学营养治疗专家共识》明确指出，总的来说，配合营养代餐的强化生活方式干预，比单纯的膳食支持和教育，更能有效降低患者的体重。"},{"q":"书中说“代餐的确不是智商税”，其价值在于？","o":["科技含量非常高","有效解决了既要保证能量不超标、又要保证营养素均衡难以把握的问题，帮人们省脑省时间","比普通食物更好吃","能替代药物"],"a":1,"e":"代餐的确不是智商税。人们普遍对食物能量比较陌生，减肥时既要保证能量不超标，又要保证营养素均衡，实在很难把握。代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间。"},{"q":"像燕麦酸奶这样的健康零食，如果没有添加什么，是不能替代你的一餐饭的？","o":["蛋白质粉","丰富的维生素和矿物质","益生菌","膳食纤维"],"a":1,"e":"比如，像燕麦酸奶这样的健康零食，如果没有添加丰富的维生素和矿物质，是不能替代你的一餐饭的。"},{"q":"很多能量棒打出代餐的旗号，仔细一看食品标签会发现什么？","o":["蛋白质极高","蛋白质几乎没有，全是脂肪和碳水化合物","能量极低","含糖量很高"],"a":1,"e":"再比如，很多能量棒也打出代餐的旗号，仔细一看食品标签，蛋白质几乎没有，全是脂肪和碳水化合物。"},{"q":"不少代餐为了让你相信它有效果，每餐能量只有120大卡，这就成了什么？","o":["科学配餐","变相节食","高蛋白饮食","轻断食"],"a":1,"e":"还有不少代餐，为了让你相信它有效果，每餐能量只有120大卡，这就成了变相节食。"},{"q":"不少商家会混淆代餐减肥和什么的概念，让你以为把它当零食吃就能减肥，事实上那只会增加能量？","o":["保健品","零食","药品","功能饮料"],"a":1,"e":"不少商家会混淆代餐减肥和零食的概念，让你以为把代餐当零食吃就能减肥，事实上那只会增加能量。"},{"q":"作者为帮你搞定代餐选择困难症，准备了哪份文件？","o":["2015年国家卫计委的减重指南","2019年年底中国营养学会发布的代餐食品团体标准","2020年世卫组织的营养建议","2018年中国营养学会的膳食宝塔"],"a":1,"e":"为了帮你轻松搞定选择困难症，我在得到App准备了2019年年底中国营养学会发布的代餐食品团体标准，你可以去看看。"},{"q":"按代餐食品团体标准，每餐代餐食品所提供的能量应为多少？","o":["100~200千卡","200~400千卡","400~600千卡","600~800千卡"],"a":1,"e":"能量：每餐代餐食品所提供的能量应为200~400千卡。"},{"q":"按代餐食品团体标准，代餐中蛋白质提供的能量应占总能量的多少？","o":["10%~20%","15%~25%","25%~50%","50%~70%"],"a":2,"e":"蛋白质：代餐中蛋白质提供的能量应占总能量的25%~50％。"},{"q":"按代餐食品团体标准，代餐中脂肪提供的能量不应超过总能量的多少？","o":["10%","20%","30%","40%"],"a":2,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"按代餐食品团体标准，来源于饱和脂肪酸的能量不应超过总能量的多少？","o":["5%","10%","15%","20%"],"a":1,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"按代餐食品团体标准，亚油酸供能比不应低于多少？","o":["1%","2%","3%","5%"],"a":2,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"按代餐食品团体标准，代餐中不得使用什么？","o":["乳糖","氢化油脂","麦芽糊精","大豆蛋白"],"a":1,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"作者说，今天的代餐已经是一种成熟的减肥产品，其科技含量如何？","o":["非常高","并不是特别高","完全没有","仍在实验室阶段"],"a":1,"e":"今天的代餐，已经是一种成熟的减肥产品，科技含量并不是特别高。科学用无数次的验证，帮我们在真假代餐之间画了一条线，让它们泾渭分明。用科学的力量武装自己，减肥就可以变得更简单。"},{"q":"书中说，用什么力量武装自己，减肥就可以变得更简单？","o":["意志力","科学的力量","金钱","人脉"],"a":1,"e":"今天的代餐，已经是一种成熟的减肥产品，科技含量并不是特别高。科学用无数次的验证，帮我们在真假代餐之间画了一条线，让它们泾渭分明。用科学的力量武装自己，减肥就可以变得更简单。"}],"multis":[{"q":"减肥失败者重新出发的“三步法”包括？","o":["找原因","定目标","考虑新工具","加大运动量"],"a":[0,1,2],"e":"如果曾经减肥失败过，在开启新一轮减肥时，你就不能简单照搬前几章讲的方法了，我有非常实用的'三步法'给到你。……总结一下：找到自己减肥失败的原因，定个小目标，选择好新工具，你就可以再次出发了。"},{"q":"6个月减重10%左右的目标设置有三个好处，包括？","o":["难度适中、努努力就能达到","健康、降低糖尿病等疾病风险","不容易反弹","短期见效最快"],"a":[0,1,2],"e":"这么设定有三个好处：第一，难度适中，努努力就能达到；第二，健康，即使6个月后你还没达到'三体目标'，减少了10%左右的体重，也已经大大降低了糖尿病、心血管疾病、不孕不育等风险；第三，不容易反弹，很多人之所以复胖，问题都出在近期目标的设定上，'欲速则不达'，稳一点，慢慢来，才是减肥成功的保证。"},{"q":"减肥失败后可以借助的新工具包括？","o":["心理评估和心理治疗","饮食日记、餐盘、代餐和轻断食","HIIT、力量训练","抽脂手术"],"a":[0,1,2],"e":"在这里，心理评估和心理治疗，就是我们在心理因素层面借助的新工具。……饮食层面，我们可以借助日记、餐盘，以及超好用的代餐和轻断食。运动层面，我们有HIIT、力量训练，等等。"},{"q":"可以贴上绿色标签的零食包括？","o":["不加盐和糖的烘烤坚果","不调味的鲜牛奶和酸奶","完整水果或不加调味品的水果干","果汁"],"a":[0,1,2],"e":"什么样的零食可以贴上绿色标签呢？主要包括三类，一类是烘烤坚果，不加盐和糖；一类是奶制品，鲜牛奶、酸奶，不调味；还有一类是完整的水果，或者不加调味品的水果干。"},{"q":"需要贴红色标签的零食包括？","o":["每100克能量超过2000千焦的食物","精制碳水化合物占40%以上且脂肪含量不低的食物","所有含糖饮料","无糖苏打水"],"a":[0,1,2],"e":"所以，每100克能量超过2000千焦（477.8大卡）的食物，精制碳水化合物占到40％以上且脂肪含量也不低的食物，以及所有的含糖饮料，都需要贴上红色标签。"},{"q":"属于黄色标签的零食包括？","o":["杂粮饼干","麻辣鸭脖","调味酸奶","不加盐糖的烘烤坚果"],"a":[0,1,2],"e":"没绿色那么健康，也不像红色那么不健康的零食，则可以贴上黄色标签，比如杂粮饼干、麻辣鸭脖、调味酸奶、果汁，等等。"},{"q":"吃火锅时应尽量不选的食材包括？","o":["蟹棒","鱼豆腐","鲜豆腐","虾滑"],"a":[0,1,3],"e":"蟹棒、鱼豆腐、丸子、虾滑、午餐肉、香肠之类，就尽量不要选了；"},{"q":"吃火锅时豆制品应选择？","o":["鲜豆腐","冻豆腐","油豆皮","炸豆泡"],"a":[0,1],"e":"豆制品选鲜豆腐、冻豆腐，不要油豆皮、炸豆泡和腐竹之类。"},{"q":"应酬饮酒的“中量”标准包括？","o":["每天不超过500毫升红酒","两瓶啤酒","3两低度白酒","半斤高度白酒"],"a":[0,1,2],"e":"这里的中量，是每天不超过500毫升红酒，或两瓶啤酒，或3两低度白酒。"},{"q":"述情障碍的化解出口包括？","o":["找到倾诉对象","培养爱好","学会控制进食时的情绪","暴饮暴食"],"a":[0,1,2],"e":"想解决述情障碍，我们就要设法在刚刚产生负面情绪的时候把它化解开，给自己的情绪找一个出口。这个出口有外向的，有内在的。……外向的比较容易上手，就是找到倾诉的对象，煲个电话粥，聊个八卦，或者找个爱好，运动啊，画画啊，唱歌啊，旅游啊，等等。……内在的化解比较高阶……这个方法，就是学会控制进食时的情绪。"},{"q":"“五问反思法”包括哪些问题？","o":["与谁进餐","吃了些什么","何时进餐","何处进餐","为什么要吃"],"a":[0,1,2,3,4],"e":"用餐结束后，你可以通过“五问反思法”来记录自己的饮食，回答“与谁进餐”“吃了些什么”“何时进餐”“何处进餐”“为什么要吃”这五个问题，并把它们记录下来。"},{"q":"情绪化进食的特点包括？","o":["突然出现","只想吃特定食物","感受不到逐渐吃饱","伴随负罪感或羞耻感"],"a":[0,1,2,3],"e":"而情绪化进食则通常是突然出现的，并且可能只是想吃某种特定的食物，比如薯片，吃的时候可能感受不到逐渐吃饱，更可能是一直狂吃，直到有些不舒服才停下来，通常还可能伴随着一些负罪感或羞耻感。"},{"q":"生活作息不规律的表现包括？","o":["进食不规律（24点以后进食）","睡眠不规律（入睡或睡醒时间相差4小时以上）","睡眠时间少于6小时","夜间工作"],"a":[0,1,2,3],"e":"进食不规律（有24点以后进食的习惯）、睡眠不规律（今明两天的入睡时间或睡醒时间，经常相差4小时以上）、睡眠时间少于6个小时、夜间工作（长期工作到24点以后）、长时间夜间光照（24点到凌晨4点），打乱了我们身体最最重要的一个生理时钟-昼夜生物钟。"},{"q":"作息无法规律时，外加“进食-禁食”节律的好处包括？","o":["支持代谢平衡","保护代谢激素","避免增重","可以完全不用睡觉"],"a":[0,1,2],"e":"当我们的昼夜节律乱了，人体就会缺乏内在的行为节律，在这种情况下，可以求助于外加的进食-禁食节律来支持代谢的平衡。也就是说，我们可以主动建立起进食的合理节奏，反过来保护好用来代谢的激素，也就避免了作息不规律导致的增重问题。"},{"q":"低碳水饮食期间需要避开的碳水化合物包括？","o":["油炸碳水化合物主食","红薯、南瓜、土豆等粉糯蔬菜","甜味水果","含糖饮料"],"a":[0,1,2,3],"e":"①油炸碳水化合物主食。……②富含碳水化合物的蔬菜。蔬菜吃起来越粉糯，可吸收的碳水化合物含量就越高，比如红薯、南瓜、土豆、芋头、山药等，都是高碳水化合物蔬菜。③甜味水果。水果越甜，可吸收的碳水化合物越多，比如葡萄、苹果、荔枝等，因此要尽量避免。④各种含糖饮料。"},{"q":"低碳水饮食的注意事项包括？","o":["避免大量剧烈运动","高血脂或心血管疾病患者不能采用","糖尿病人很适合","可以长期使用"],"a":[0,1,2],"e":"配合低碳水饮食，还有几点注意事项：首先，要避免大量剧烈运动。……因为低碳水饮食会降低剧烈运动的耐受能力。其次，高血脂或心血管疾病患者不能采用低碳水饮食方案，因为这会使血脂进一步紊乱。糖尿病人则很适合。"},{"q":"停不下主食的正确应对包括？","o":["保证能量缺口前提下尽可能保留主食","选择低GI食物","一口肉、一口菜、一口饭","彻底戒掉主食"],"a":[0,1,2],"e":"①如果你停不下主食，那就在保证能量缺口的前提下，尽可能保留主食。②选择低GI食物尤为重要。③吃饭时一口肉、一口菜、一口饭。"},{"q":"需要拒绝或警惕的主食包括？","o":["糍粑","油条","薯条薯片","糙米饭"],"a":[0,1,2],"e":"第一，要拒绝油炸类的主食，如糍粑、油条、薯条、薯片等，因为这种食物碳水化合物高，脂肪也高，肚子还没填饱，能量就超标了。"},{"q":"女性减肥的关键时期包括？","o":["青少年时期","孕产期","月经期","围绝经期"],"a":[0,1,2,3],"e":"女性减肥有几个关键时期：青少年时期、孕产期、月经期和围绝经期。"},{"q":"女性BMI在22~24之间时的正确做法包括？","o":["不需要有减肥压力","真想减也可以但要见好就收","重点看体脂率和体型","必须立即减肥"],"a":[0,1,2],"e":"如果你的BMI在22和24之间，你不需要有减肥的压力，但真想减一点也可以，一定要见好就收，可以重点看体脂率和体型。"},{"q":"女性减肥不当可能导致的后果包括？","o":["免疫力下滑","衰老加速","月经停止","骨质疏松"],"a":[0,1,2,3],"e":"女性的储备本来就少，一旦减得不对，要么免疫力下滑，经常感冒，各种慢性疼痛找上身来，莫名其妙就觉得疲乏无力；要么衰老成倍加速，出现皮肤松弛、骨质疏松，甚至月经停止等一系列问题。"},{"q":"娃太胖的三个深远影响包括？","o":["不长个儿","一胖一辈子","危害心理健康","更容易感冒"],"a":[0,1,2],"e":"不好看、行动不灵活这些就不说了，我来说三个深远的影响。第一，不长个儿。……第二，一胖一辈子。……第三，也是最隐蔽的影响，危害孩子的心理健康。"},{"q":"关于脂肪细胞的正确说法包括？","o":["生长发育期只有成年之前","青春期数量达到顶峰","成年后数量固定、变化的是大小","脂肪细胞有“记忆”"],"a":[0,1,2,3],"e":"在我们漫长的一生中，脂肪细胞的生长发育期只有一个，就是成年之前。婴幼儿时期，脂肪细胞就开始大量繁殖；到青春期的时候，数量达到顶峰。从此以后，这个数量就不会再变了。……不管你是胖了还是瘦了，变化的都不是脂肪细胞的数量，而是它们的大小。……此外，脂肪细胞居然还有'记忆'，会长期'记住'营养刺激的信号。"},{"q":"预防孩子肥胖的十招包括？","o":["管好自己的体重再生娃","母乳喂养至少到1周岁","果汁饮料每天封顶","全家11点前熄灯"],"a":[0,1,2,3],"e":"如何防患于未然，避免孩子胖起来呢？我给你总结了十招。第二招，管好自己的体重再生娃。……第四招，母乳喂养，至少到孩子1周岁。……第五招，果汁饮料每天要有封顶。……第十招，全家11点前熄灯，让孩子睡足10个小时。"},{"q":"孕期体重有序增长的推荐运动包括？","o":["骑车","快走","慢跑","瑜伽"],"a":[0,1,2,3],"e":"研究表明，每周3次以上、每次30分钟以上的骑车锻炼，有助于降低孕妇妊娠期体重过度增加的风险和妊娠糖尿病发病率。另外，孕妇还可以在医生的指导下进行快走、慢跑、瑜伽等运动。"},{"q":"产后体重恢复最简单有效的方法包括？","o":["母乳喂养","保持良好情绪","睡眠充足","服用减肥药"],"a":[0,1,2],"e":"②母乳喂养、情绪良好、睡眠充足，是产后体重恢复最简单有效的方法。"},{"q":"增加日常活动量的方案包括？","o":["上班路上安排一段步行或骑车","少乘电梯改爬楼","勤做家务","养狗"],"a":[0,1,2,3],"e":"上班路上安排一段步行、骑车。……在各种日常活动中，爬楼梯是能量消耗最大的一种。……勤做家务。……除此之外，养狗也是一种不错的选择。美国有多篇研究文章显示，由于需要每天遛狗，养狗的人在体重、心脑血管各方面都更健康。"},{"q":"适合在办公室或家里进行的运动包括？","o":["跳绳","有氧操","跑步机","杠铃卧推"],"a":[0,1],"e":"跳绳和有氧操就是两种适合的运动。"},{"q":"“三高”包括？","o":["高血压","高血脂","高血糖","高尿酸"],"a":[0,1,2],"e":"如果你已经有“三高”，也就是高血压、高血脂、高血糖中的一个，甚至多个，那么减肥对你来说，就是一个处方，而不是可减可不减的口号。"},{"q":"高血脂人群降血脂的营养要点包括？","o":["碳水化合物占45%~55%并保证0.5千克蔬菜","脂肪占20%~30%","天然不饱和脂肪酸占脂肪总量一半以上","采用低碳水饮食"],"a":[0,1,2],"e":"想要降低血脂，必须遵循我们前面讲过的营养均衡法则，就是让碳水化合物占摄入总能量的比例维持在45%~55%，其中要有0.5千克的蔬菜；脂肪占20%~30%；剩下是蛋白质。此外，脂肪一定要吃够，并且天然的不饱和脂肪酸要占到脂肪总量一半以上。"},{"q":"强化甲状腺功能的方法包括？","o":["补充硒和锌","规律运动","补充纤维素","大量服用甲状腺素片"],"a":[0,1,2],"e":"医学研究证明，如果只是甲状腺功能弱化，而不是减退，你还有很多其他的方法可用：1.补充硒、锌；2.规律运动；3.补充纤维素。其中，运动可以明显提升各种激素，包括甲状腺素的水平。"},{"q":"富含硒的食物包括？","o":["坚果","金枪鱼和沙丁鱼","蛋黄","牛肉"],"a":[0,1,2,3],"e":"天然食物，比如坚果、金枪鱼、沙丁鱼、蛋黄以及牛肉等都有比较丰富的硒。"},{"q":"阻塞性睡眠呼吸暂停可能引发的疾病包括？","o":["高血压","高血糖","冠心病","大脑功能减退"],"a":[0,1,2,3],"e":"呼吸不畅会导致身体缺氧，从而引发高血压、高血糖、冠心病、大脑功能减退等一系列疾病。"},{"q":"睡眠呼吸暂停的治疗方法包括？","o":["应用呼吸机","采取侧卧位","减肥","大量喝咖啡"],"a":[0,1,2],"e":"确诊之后，你需要根据医生的指导，采取相应的方法，比如应用呼吸机、采取侧卧位、减肥等，改善夜间缺氧的问题。"},{"q":"度过平台期的方法包括？","o":["有点耐心，坚持原有生活方式","交替使用不同方法","增加力量训练并补充蛋白质","极端节食"],"a":[0,1,2],"e":"如果到了平台期，请你做好三件事：有点耐心，方法轮替，以及增加肌肉，让自己的心理和身体做好准备迎接下一轮的减肥。……这时候，建议你比平常增加一倍力量训练，同时补充蛋白质。"},{"q":"关于平台期的正确说法包括？","o":["几乎人人都得经历","是身体开启保护机制","不是因为做错了什么","说明应该放弃"],"a":[0,1,2],"e":"只要减肥，几乎人人都得经历平台期。它的出现不是因为我们做错了什么，而是身体开启了保护自己的机制。"},{"q":"常见的快速减肥方法包括？","o":["辟谷","生酮减肥法","减肥茶","节食+过度运动"],"a":[0,1,2,3],"e":"让我们先来看看具体有哪些方法。1.辟谷……2.生酮减肥法……3.减肥茶……4.节食＋过度运动。其实，以上快速减肥方法的本质都是一样的：让你脱水。"},{"q":"快速减肥的危害包括？","o":["胃肠功能衰退","抵抗力下降","脱发和月经紊乱","增加心梗、脑梗风险"],"a":[0,1,2,3],"e":"除此之外，快速减肥还有很多其他危害，比如常见的胃肠功能衰退；抵抗力下降；月经期延长，月经量变少，甚至停止；皮肤变差；脱发。近年来还有不少研究指出，体重陡然减少或者增加，都会增加心梗、猝死、脑梗的发生率。"},{"q":"人与人之间减肥效果差异的来源包括？","o":["基因差异","血糖效应差异","体脂率差异","生活习惯差异","减肥史差异"],"a":[0,1,2,3,4],"e":"这是因为，减肥的时候，人与人之间的差异实在太大了。第一，基因差异。……第二，血糖效应差异。……第三，体脂率差异。……第四，生活习惯差异。……第五，减肥史差异。"},{"q":"关于“0产品”的正确说法包括？","o":["0蔗糖不等于0糖","0糖不等于0碳水化合物","0脂肪不等于0碳水化合物","0卡路里等于能量安全"],"a":[0,1,2],"e":"0蔗糖≠0糖≠0碳水化合物。……说自己'0蔗糖'的产品，基本都不是0糖。……如果写的是'0糖'，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。……如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上碳水化合物的量，往往它的碳水化合物含量会极高。"},{"q":"大量运动不能带来大幅度减重的原因包括？","o":["运动消耗的卡路里有限","运动后的能量补偿效应","运动效果递减","运动会增加食欲"],"a":[0,1,2],"e":"第一，运动消耗的卡路里有限。身体活动消耗的能量，占人体能量总消耗的15%~30%……第二，运动后的能量补偿效应。……尤其是BMI较高的人，能量补偿比例会达到49%……第三，运动效果递减的影响。这是因为，动作的熟练化、运动模式的固定化，加上体重下降，造成相同运动强度下，单位时间身体消耗的能量在不断下降。"},{"q":"大量运动的副作用包括？","o":["猝死风险增加","过量运动对身体有损伤","关节越来越健康","代谢越来越高"],"a":[0,1],"e":"大量运动除了减肥效果并不会更好之外，还有两点副作用，一定要小心。其一，有风险，执行需谨慎。……近年来，在猝死的案例中，运动中猝死，尤其是大量剧烈运动后猝死，占据了较大的比例。其二，过量运动对身体有损伤。"},{"q":"关于“让脂肪不吸收”的正确说法包括？","o":["吃进去的脂肪没有不吸收的可能","奥利司他只有30%的吸收抑制作用","没有任何食物提取物效率超过30%","保健品可以稳定抑制脂肪吸收"],"a":[0,1,2],"e":"真相：除了生病，吃进去的脂肪没有不吸收的可能。……目前最管用的脂肪吸收抑制剂，奥利司他，也只有30%的吸收抑制作用。……事实上，不要说30%，全球目前的研究中，可以稳定达到5%的都没有，连安慰剂的效果都不如。"},{"q":"好训练营的基本特征包括？","o":["管吃也管动","不破坏你的健康","方法能长期应用","减重速度越快越好"],"a":[0,1,2],"e":"我给你总结一下好训练营的基本特征：1.管吃也管动。最起码饮食和运动都要管理，这样的训练营才能算基础入门级的。2.不破坏你的健康。……好训练营提供的饮食指导应该很适合你，能让你长期坚持。最重要的判断标准就是有没有节食，饥饿感是不是特别重。"},{"q":"判断训练营是否破坏健康的直观标准包括？","o":["脱发","停经","食欲全无、睡不着觉","特别疲劳"],"a":[0,1,2,3],"e":"比如减得脱发、停经、食欲全无、睡不着觉、特别疲劳，都是判断的标准。"},{"q":"代餐常见的“坑”包括？","o":["燕麦酸奶没有丰富维生素矿物质却冒充代餐","能量棒蛋白质几乎没有全是脂肪碳水","每餐只有120大卡变相节食","把代餐当零食吃"],"a":[0,1,2,3],"e":"比如，像燕麦酸奶这样的健康零食，如果没有添加丰富的维生素和矿物质，是不能替代你的一餐饭的。再比如，很多能量棒也打出代餐的旗号，仔细一看食品标签，蛋白质几乎没有，全是脂肪和碳水化合物。还有不少代餐，为了让你相信它有效果，每餐能量只有120大卡，这就成了变相节食。不少商家会混淆代餐减肥和零食的概念，让你以为把代餐当零食吃就能减肥，事实上那只会增加能量。"},{"q":"中国营养学会代餐食品团体标准的技术指标包括？","o":["能量200~400千卡","蛋白质供能占总能量25%~50%","脂肪供能不超过30%","不得使用氢化油脂"],"a":[0,1,2,3],"e":"能量：每餐代餐食品所提供的能量应为200~400千卡。蛋白质：代餐中蛋白质提供的能量应占总能量的25%~50%。脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3%。"},{"q":"关于减肥后复胖，下列正确的说法包括？","o":["肥胖是一种慢性渐进性疾病，具有很高的复发倾向","研究表明在减肥一年后，复胖的比例高达95%以上","把体重反弹归咎于缺乏自控力，是基于“体重完全由意志所控制”这个错误假设","复胖说明你身体的机制不正常，需要愧疚"],"a":[0,1,2],"e":"从医学上来说，肥胖是一种慢性渐进性疾病，具有很高的复发倾向。在绝大多数自发的减肥尝试之后，体重都很容易重新增加。研究表明，在减肥一年后，复胖的比例高达95％以上。人们往往将体重反弹归咎于缺乏自控力，但是，这种简单化的解释其实基于一个错误的假设，即我们的体重完全是由意志所控制的。如果你复胖了，一点也不用感到愧疚，这只能说明你身体的机制属于正常人。"},{"q":"作者在体重坐标图上，会在体重剧烈变化的点标注当时发生的哪些大事？","o":["饮食情况、运动情况","情绪、睡眠、工作压力","吃过的药、得过的病","当天的天气和气温"],"a":[0,1,2],"e":"在每次她的体重发生剧烈变化的点，我都会标注当时在她身上发生的大事，比如饮食情况、运动情况、情绪、睡眠、工作压力、吃过的药、得过的病，等等，能多详细就多详细。"},{"q":"按BMI设定6个月减重目标的正确建议包括？","o":["BMI小于等于35，最好把目标定为6个月内减少现在体重的5%~10%","BMI超过35，可以把目标定为6个月内减少体重的10%~15%","6个月后根据实际情况再设定下一轮的目标","无论BMI多少，都统一定为6个月减少20%"],"a":[0,1,2],"e":"如果你的BMI小于等于35，最好把目标定为6个月内减少现在体重的5%～10%；如果你的BMI超过35，可以把目标定为6个月内减少体重的10%～15%。6个月后，根据实际情况再设定下一轮的目标。"},{"q":"书中给小满做心理层面干预时使用的新工具包括？","o":["抗焦虑的药物","心理治疗师规律做的12次心理治疗","放松、正念进食等","抽脂手术"],"a":[0,1,2],"e":"于是，我给她开了一些抗焦虑的药物，并且让心理治疗师规律地给她做了12次心理治疗，包括放松、正念进食，等等。6个月后，小满的体重稳稳地减掉了8.5千克，目标达成。"},{"q":"关于零食消费与食物渴望的数据，下列正确的说法包括？","o":["今天在美国，所有年龄性别人群20%~25%的能量摄入来自零食","零食为中国人提供了大约10%的总能量摄入","100%的年轻女性和70%的年轻男性在过去一年中至少对一种食物产生过渴望","中国是世界上零食消费最多的国家"],"a":[0,1,2],"e":"今天在美国，所有年龄性别人群20%～25%的能量摄入来自零食，相当于多吃了一顿饭。最新数据显示，中国是仅次于美国、澳大利亚和墨西哥的零食消费国，零食为中国人提供了大约10％的总能量摄入。有报告称，100％的年轻女性和70％的年轻男性在过去一年中至少对一种食物产生过渴望。"},{"q":"研究表明，成瘾性食物存在的共同特点包括？","o":["以碳水化合物为主","混合脂肪","高GI、深加工","低能量、高水分"],"a":[0,1,2],"e":"研究表明，成瘾性食物存在一些共同特点：以碳水化合物为主、混合脂肪、高GI、深加工。所以，每100克能量超过2000千焦（477.8大卡）的食物，精制碳水化合物占到40％以上且脂肪含量也不低的食物，以及所有的含糖饮料，都需要贴上红色标签。"},{"q":"绿色标签零食每天的总量控制建议包括？","o":["坚果一把","水果250克","奶制品250克","坚果500克"],"a":[0,1,2],"e":"绿色标签的零食每天都可以吃，注意一下总量就好－坚果一把，水果250克，奶制品250克，每天加起来不超过这个量。"},{"q":"书中提到的“绿色饮料”包括？","o":["茶、黑咖啡","无糖苏打水","牛奶","含糖碳酸饮料"],"a":[0,1,2],"e":"什么是绿色饮料呢？茶、黑咖啡、无糖苏打水，还有牛奶，都算。有空的时候，你还可以煮一锅绿豆汤、乌梅汤、山楂水、水果茶，或者豆浆，不用放糖，都很好喝。"},{"q":"把天然食物做成绿色零食时，正确的烹饪方法与原则包括？","o":["蒸煮、干炒、烘烤","不加油","不加糖、少加盐","多加糖以提升口感"],"a":[0,1,2],"e":"很多天然食物简单烹饪一下，都可以作为绿色零食。蒸煮、干炒，烘烤，都是不错的烹饪方法，记住，要不加油、不加糖、少加盐。像烤地瓜、煮玉米、蒸山药，都不错。不过它们属于主食类，要计入你一天的碳水化合物总量里。"},{"q":"关于建立对零食的评价性条件反射，下列正确的说法包括？","o":["给薯片打上红色叉号、反复观察图片，就会降低你对薯片的选择概率","接受训练后参与者选择水果而不是黄油曲奇的可能性是原来的三倍","黄色标签零食可以偶尔吃，一周不要超过两次，每次不要超过50克","红色标签零食可以每天吃一次"],"a":[0,1,2],"e":"研究发现，在对食物产生评价性条件反射之后，我们就会做出更好的食物选择。比如，给薯片打上红色叉号，反复观察图片，就会降低你对薯片的选择概率。数据表明，在接受评价性条件反射训练后，参与者选择水果而不是黄油曲奇的可能性，是原来的三倍。黄色标签的零食可以偶尔吃，一周不要超过两次，每次不要超过50克。看见红色标签的零食，就在心里打个叉，不要选也不要碰。"},{"q":"书中提到，与吗啡等成瘾性药物在大脑中的奖励和控制途径有相似之处的食物包括？","o":["巧克力","碳水化合物","咸味零食","白开水"],"a":[0,1,2],"e":"大量的证据表明，巧克力、碳水化合物和咸味零食，与吗啡等成瘾性药物在大脑中的奖励和控制途径有相似之处。所以忍不住总吃零食，并不只是你个人控制力差的问题，更是工业化进程和市场化逐利过程给人类带来的问题。"},{"q":"作者给出的两个点外卖高招包括？","o":["品种尽量丰富，不要光点打卤面、盖浇饭","吃饭顺序：先喝汤，再吃蔬菜，然后吃肉，最后吃主食","只点主食以求省时间","先吃主食再喝汤"],"a":[0,1],"e":"先说外卖，我有两个高招给你。一是品种尽量丰富。不要光点打卤面、盖浇饭这些，不仅蔬菜、蛋白质肯定不够，碳水化合物、油脂也会双双超标。二是吃饭顺序。要先喝汤，再吃蔬菜，然后吃肉，最后吃主食。"},{"q":"关于火锅锅底的选择，下列正确的说法包括？","o":["最合适的是清汤锅，其实就是大葱加水","菌汤锅、番茄锅也可以","尽量不要选浓汤锅，因为它脂肪含量很高，甚至不低于牛油火锅","浓汤锅最健康，可以放心选"],"a":[0,1,2],"e":"选定了吃火锅，再来看锅底。最合适的是清汤锅，其实就是大葱加水；菌汤锅、番茄锅也可以；尽量不要选浓汤锅，因为它脂肪含量很高，甚至不低于牛油火锅。"},{"q":"吃火锅点菜时，肉类应优先选择的包括？","o":["鱼虾","鸡肉、百叶、黄喉","鸭血、鸭肠、猪肚","午餐肉、香肠"],"a":[0,1,2],"e":"关键是要天然，不要选加工食材。肉类多选鱼虾，其次选鸡肉、百叶、黄喉、鸭血、鸭肠、猪肚，最后选瘦一点的牛羊肉；蟹棒、鱼豆腐、丸子、虾滑、午餐肉、香肠之类，就尽量不要选了。"},{"q":"吃火锅时的正确做法包括？","o":["豆制品、肉和蔬菜一起涮","别等肉吃饱了才用蔬菜填个缝","小料建议酱油小米辣，能吃辣的一定要多来点辣椒","后涮菜以吸收汤里的油"],"a":[0,1,2],"e":"吃的时候呢，要豆制品、肉和蔬菜一起涮，别等肉吃饱了，才用蔬菜填个缝。涮完肉的汤，表层都是油，后涮菜的话，就会全被蔬菜给吸收了。小料的选择上，我的建议是酱油小米辣，能吃辣的一定要多来点辣椒。"},{"q":"关于白色脂肪、棕色脂肪和辣椒，下列正确的说法包括？","o":["白色脂肪一旦过多会造成代谢紊乱，最终导致各种疾病","棕色脂肪可以燃烧白色脂肪，并且抵抗肥胖和糖尿病","成年人身体内的脂肪主要是白色脂肪，棕色脂肪含量极少","辣椒素能够促进白色脂肪的分解，使其变成棕色脂肪","多吃辣会促进白色脂肪进一步囤积"],"a":[0,1,2,3],"e":"让我们如临大敌的是白色脂肪，一旦过多，会造成代谢紊乱，最终导致各种疾病。而人体内还有一种“好”脂肪，可以燃烧白色脂肪，并且抵抗肥胖和糖尿病，它就是棕色脂肪。然而，成年人身体内的脂肪主要是白色脂肪，棕色脂肪含量极少。幸运的是，辣椒中所含的辣椒素能够促进白色脂肪的分解，使其变成棕色脂肪。所以，多吃辣，真的能瘦。"},{"q":"实在不能选火锅时，点菜可以采用的做法包括？","o":["给自己单加份沙拉，用油醋汁拌","可以加勺芥末或者小米辣","按四格餐盘法把餐盘一次性装满，然后除了沙拉就不再夹菜","不停夹其他菜以保证营养"],"a":[0,1,2],"e":"如果实在不能选火锅，点菜时，你可以给自己单加份沙拉，用油醋汁拌，也可以加勺芥末或者小米辣。一大盘沙拉单独放在自己面前，既缓解了陪吃的尴尬，也避免了不停夹其他菜导致的能量超标。可以考虑按照我们的四格餐盘法，把你的餐盘一次性装满，然后除了沙拉就不再夹菜了。"},{"q":"关于宵夜与喝酒，下列正确的说法包括？","o":["约饭一定不能约宵夜","最不适合大吃大喝的时间是晚上9点到凌晨5点","酒本身就是粮食酿造的，每克酒精含有7大卡能量","喝酒以后意志力会进一步下降，对于该吃多少就更没谱了","想靠喝酒减肥是可行的，因为酒精能量很低"],"a":[0,1,2,3],"e":"约饭一定不能约宵夜。最不适合大吃大喝的时间，是晚上9点到凌晨5点。这个时间段摄入的能量，大部分都会变成你身上的脂肪。而想靠喝酒减肥是不可能的，酒喝多了不但不会减肥，反而会发胖-因为酒本身就是粮食酿造的，每克酒精含有7大卡能量。而且，喝酒以后，你的意志力会进一步下降，对于该吃多少就更没谱了。"},{"q":"吃火锅时可以搭配的减肥友好主食包括？","o":["煮个玉米","涮盘山药","土豆、红薯","麻酱烧饼、红糖糍粑"],"a":[0,1,2],"e":"最后，再看吃火锅时应该配什么主食。你要是任性，北京的来俩麻酱烧饼，四川的上俩红糖糍粑，那前面的种种就都白费了。对于减肥人群来说，可以考虑煮个玉米、涮盘山药，喜欢的话，土豆、红薯也行。如果一定要搭配点正儿八经的主食，你可以考虑煮一点杂粮面。"},{"q":"情绪化进食的两点判定标准包括？","o":["有负面情绪","停不下来","感到很满足","生理性饥饿逐渐产生"],"a":[0,1],"e":"情绪化进食有两点判定标准。第一，有负面情绪。情绪化进食，是指因消极负面情绪而增加食物摄入。第二，停不下来。自己能叫停的，基本上都不是情绪化进食。"},{"q":"关于情绪化进食的成因，书中重点关注的是？","o":["节食","述情障碍","运动量不足","基因突变"],"a":[0,1],"e":"关于情绪化进食的原因，有不少研究进行过探索。综合来讲，有两点值得我们关注。第一，节食。节食被认为是导致情绪化进食的一个风险因素。第二，述情障碍。"},{"q":"属于生理性饥饿特点的包括？","o":["通常是逐渐产生的","饿的时候什么东西都想吃","吃的时候会感受到慢慢吃饱，也会感到很满足","突然出现，只想吃某种特定食物"],"a":[0,1,2],"e":"生理性的饥饿通常是逐渐产生的，并且饿的时候什么东西都想吃，吃的时候会感受到慢慢吃饱，也会感到很满足。而情绪化进食则通常是突然出现的，并且可能只是想吃某种特定的食物，比如薯片。"},{"q":"节食被认为是导致情绪化进食的风险因素，其依据包括？","o":["面对压力或负面情绪，节食者在各种实验中的食物摄入量都比非节食者更高","节食者与饥饿感持续斗争，完全失去了对饥饿感和饱腹感的判断能力","节食能显著提升自控力","节食有助于稳定情绪"],"a":[0,1],"e":"很多人在减肥期间都会采取节食的手段。面对压力或负面情绪，节食者在各种实验中的食物摄入量都比非节食者更高。因此，节食被认为是导致情绪化进食的一个风险因素。节食者与饥饿感持续斗争的另一个后果是，他们完全失去了对饥饿感和饱腹感的判断能力，这是使他们陷入情绪化进食的一个额外风险因素。"},{"q":"培养进食过程中对身体觉知能力的三个时点自省方法包括？","o":["进食前把注意力集中在胃部，用1到10给饥饿感打个分","进食中采用“三口进食法”，先吃三口然后重新评估饥饿感","用餐结束后通过“五问反思法”记录自己的饮食","进食时看手机以转移注意力"],"a":[0,1,2],"e":"要做到这一点，你可以通过在餐前、餐中、餐后简单地自省，来培养自己在进食过程中对身体的觉知能力，从而控制情绪的波动。进食前，把注意力集中在胃部，用1到10给饥饿感打个分。进食中，如果你抑制不住想要进食，可以采用“三口进食法”。用餐结束后，你可以通过“五问反思法”来记录自己的饮食。"},{"q":"关于进食障碍，下列正确的说法包括？","o":["是所有情绪化进食行为中一种特殊的类型","虽然表现为饮食方面的问题，但其实已经属于精神类疾病","进食障碍人群有的因为进食而胖，有的却因为催吐而极度瘦弱","只是一种不良饮食习惯，不需要找精神科医生"],"a":[0,1,2],"e":"在所有情绪化进食行为中，有一种特殊的类型，叫进食障碍。它虽然表现为饮食方面的问题，但其实已经属于精神类疾病。进食障碍人群有的因为进食而胖，有的却因为催吐而极度瘦弱。如果已经到了进食障碍的程度，请赶紧找精神科医生帮忙。"},{"q":"关于述情障碍，下列正确的说法包括？","o":["简单来说就是有了情绪问题，不愿表达，不会表达，不知道怎样正确表达","对减肥来说，述情障碍比负面情绪更糟糕","化解的出口有外向的，也有内在的","只要压住不说就没事了"],"a":[0,1,2],"e":"什么是述情障碍呢？简单来说，就是有了情绪问题，不愿表达，不会表达，不知道怎样正确表达。对减肥来说，述情障碍比负面情绪更糟糕。想解决述情障碍，我们就要设法在刚刚产生负面情绪的时候把它化解开，给自己的情绪找一个出口。这个出口有外向的，有内在的。"},{"q":"关于夜间工作与肥胖的研究数据，下列正确的说法包括？","o":["一项系统回顾在评估了28项研究之后，观察到夜间工作使肥胖的风险增加了23%","其中腹部肥胖的风险增加了35%","一项涉及2371名护理人员的研究发现，接触夜间工作的年限和BMI之间存在关联","上夜班的时间越短，肥胖风险越高"],"a":[0,1,2],"e":"一项系统回顾在评估了28项研究之后，观察到夜间工作使肥胖的风险增加了23%，其中腹部肥胖的风险增加了35％。一项在18家公立医院进行的、涉及2371名护理人员的研究发现，接触夜间工作的年限和BMI之间存在关联，也就是上夜班的时间越长，肥胖的风险就会越高。"},{"q":"关于昼夜生物钟，下列正确的说法包括？","o":["在葡萄糖和脂类的代谢中起着至关重要的作用","它会引起激素水平的循环变化","褪黑素、皮质醇等激素的产生，取决于中枢神经系统针对光照-黑暗变化进行的节律性活动","胰岛素、瘦素等营养敏感激素在昼夜节律的基础上振荡","昼夜生物钟与葡萄糖和脂类的代谢没有关系"],"a":[0,1,2,3],"e":"昼夜生物钟在葡萄糖和脂类的代谢中，起着至关重要的作用，因为它会引起激素水平的循环变化。褪黑素、皮质醇等激素的产生，取决于中枢神经系统针对光照-黑暗变化进行的节律性活动，而其他一些营养敏感激素，比如胰岛素、瘦素等，则在这个昼夜节律的基础上振荡。"},{"q":"关于禁食与限时饮食（TRE），下列正确的说法包括？","o":["禁食通常被定义为在超过12个小时的时间内，完全禁食含能量的食物和饮料","限时饮食要求将每日的能量摄入限制在4~12个小时内完成","可以将进食窗口限制在白天的12个小时内，比如7~19点或6~18点","把进食窗口缩短到8小时内并尽量早一点（如6~16点），甚至还有减重效果","禁食指在超过6个小时的时间内不吃含能量的食物"],"a":[0,1,2,3],"e":"禁食通常被定义为，在超过12个小时的时间内，完全禁食含能量的食物和饮料。限时饮食（TRE）是一种模拟禁食的形式，它要求将每日的能量摄入限制在4~12个小时内完成。TRE提出了一个解决方案：将进食窗口限制在白天的12个小时内，比如7~19点，或者6~18点。在这个基础上，如果我们把进食窗口缩短到8个小时内，并且尽量早一点，比如6~16点，就不仅可以避免增重，甚至还有减重的效果。"},{"q":"低碳水饮食方案的操作要点包括？","o":["将平时摄入的碳水化合物减少到摄入总能量的25%~40%","剩下的60%~75%都是脂肪和蛋白质的空间","保持充足睡眠","肥肉适当多一些","将碳水化合物增加到摄入总能量的60%~75%"],"a":[0,1,2,3],"e":"（1）将平时摄入的碳水化合物减少到摄入总能量的25%~40％。（2）剩下的60%~75％都是脂肪和蛋白质的空间。（3）保持充足睡眠。（4）肥肉适当多一些。这一方面可以缓解因低碳水饮食纤维素摄入减少造成的便秘，另一方面可以提高代谢，促进燃脂。"},{"q":"书中列为“富含碳水化合物的蔬菜”、低碳水期间要避开的包括？","o":["红薯、南瓜","土豆、芋头","山药","绿叶蔬菜"],"a":[0,1,2],"e":"②富含碳水化合物的蔬菜。蔬菜吃起来越粉糯，可吸收的碳水化合物含量就越高，比如红薯、南瓜、土豆、芋头、山药等，都是高碳水化合物蔬菜。"},{"q":"低碳水饮食期间要避免大量剧烈运动，原因包括？","o":["低碳水饮食会降低剧烈运动的耐受能力","剧烈运动会耗尽肌糖原，在低碳水饮食情况下补充起来很缓慢，不利于肌肉恢复","运动训练时碳水化合物摄入不足，还会导致代谢性酸中毒","剧烈运动会促进脂肪大量分解"],"a":[0,1,2],"e":"首先，要避免大量剧烈运动。肉吃多了，反而运动表现会不好。这是真的，因为低碳水饮食会降低剧烈运动的耐受能力。而且，剧烈运动会耗尽肌糖原，在采取低碳水饮食的情况下，补充起来会很缓慢，不利于肌肉的恢复。此外，运动训练时碳水化合物摄入不足，还会导致代谢性酸中毒。"},{"q":"关于低碳水饮食方案的坚持情况，下列正确的说法包括？","o":["低碳水饮食方案虽然不适合长期使用，但在早期的3~6个月有非常大的优势","一项研究发现到第六个月，低碳水饮食方案仍有大多数人坚持","到第二年，低碳水组失败和退出的发生率最高","这可能是由于低碳水饮食方案的食物选择相对有限","低碳水饮食方案适合长期、终身使用"],"a":[0,1,2,3],"e":"低碳水饮食方案虽然不适合长期使用，但在早期的3~6个月，还是有非常大的优势。最后，一项研究比较了采取低脂肪、低碳水和地中海饮食三种不同方案的群体，发现到第六个月，低碳水饮食方案仍有大多数人坚持，但到第二年，低碳水组失败和退出的发生率最高。这可能是由于低碳水饮食方案的食物选择相对有限。"},{"q":"饮料中添加的下列哪些成分都属于可吸收碳水化合物？","o":["白砂糖、冰糖、红糖、黑糖","果葡糖浆、蔗糖、焦糖","蜂蜜、枫糖、乳糖、麦芽糖","纯净水"],"a":[0,1,2],"e":"④各种含糖饮料。饮料中添加的不管是白砂糖、冰糖、红糖、黑糖、果葡糖浆、蔗糖、焦糖、蜂蜜、枫糖、乳糖，还是麦芽糖，都属于可吸收碳水化合物。"},{"q":"对于停不下主食的人，书中关于能量与营养比例的正确建议包括？","o":["重点依然是你的总能量，在减肥期间需要持续打造能量缺口","在能量缺口的基础上，碳水化合物可以占到总能量的60%甚至70%","同时尽量减少脂肪，并保证最低限度的蛋白质","如果爱吃主食，千万不要刻意降低碳水化合物的比例","应该刻意把碳水化合物的比例降到20%以下"],"a":[0,1,2,3],"e":"首先，重点依然是你的总能量。在能量缺口的基础上，热爱碳水化合物的你，可以让摄入的碳水化合物占到总能量的60％甚至70%，同时尽量减少脂肪，并保证最低限度的蛋白质。只要有能量缺口在，碳水化合物多一点，对于减肥来说并不是问题。事实上，如果你爱吃主食，千万不要刻意降低碳水化合物的比例，因为这样只会让你更快地放弃减肥。"},{"q":"改变碳水化合物质量的具体做法包括？","o":["拒绝油炸类的主食，如糍粑、油条、薯条、薯片","所有高GI的零食能戒都戒掉，尤其要小心标注“低脂肪”的零食","尽量选用低GI食材制作主食，如糙米、荞麦面、全麦面","多选标注“低脂肪”的零食来替代主食"],"a":[0,1,2],"e":"第一，要拒绝油炸类的主食，如糍粑、油条、薯条、薯片等。第二，所有高GI的零食，能戒都戒掉，尤其那些标注“低脂肪”的零食，一定要小心，因为它们很可能碳水化合物含量很高。第三，尽量选用低GI食材来制作主食。你可以把原来大米、白面做的主食都替换成糙米、荞麦面、全麦面。"},{"q":"改变吃饭顺序的正确做法包括？","o":["先吃肉和菜，把肚子的饥饿感驱走一些，然后再吃饭","千万别等肉和菜都吃饱了再吃饭","菜上齐后把想吃的肉、菜和主食都放在餐盘里，一口肉、一口菜、一口饭轮着来","等菜都吃饱了再吃主食"],"a":[0,1,2],"e":"先吃肉和菜，把肚子的饥饿感驱走一些，然后再吃饭。但也千万别等肉和菜都吃饱了再吃饭。所以，无论你是主食爱好者，最简单的做法就是，菜上齐之后，把所有想吃的肉、菜和主食都放在面前的餐盘里，按照比例，吃一口肉，吃一口菜，再吃一口饭，轮着来，不要等菜都吃饱了再吃主食。"},{"q":"关于新中国成立初期的膳食结构，下列正确的说法包括？","o":["碳水化合物供能占比几乎可以达到70%","但当年别说肥胖了，就是想找几个超重的也困难","碳水化合物从来都不是肥胖的对立面","关键是怎么吃，碳水化合物也可以占较大比例","当年的肥胖率和超重比例与今天基本相当"],"a":[0,1,2,3],"e":"碳水化合物从来都不是肥胖的对立面。新中国成立初期，在人们的膳食结构中，碳水化合物供能占比几乎可以达到70％。但当年别说肥胖了，就是想找几个超重的也困难啊。所以，碳水化合物能吃，也可以占到较大的比例，关键是怎么吃。"},{"q":"针对正常亚洲女性BMI（18.5~24之间为正常）的分层建议，正确的包括？","o":["BMI小于18.5，不会给你任何减肥的机会，再减就是拿生命开玩笑","BMI在18.5和22之间，体重一定不要再减了","BMI在22和24之间，不需要有减肥的压力，真想减一点也可以，一定要见好就收","BMI大于24就必须立刻开始减肥"],"a":[0,1,2],"e":"如果你的BMI小于18.5，我不会给你任何减肥的机会，再减就是拿生命开玩笑。如果你的BMI在18.5和22之间，我的建议是，体重一定不要再减了。如果你的BMI在22和24之间，你不需要有减肥的压力，但真想减一点也可以，一定要见好就收，可以重点看体脂率和体型。"},{"q":"BMI大于24的女性，在哪些情况下作者都会强烈建议开始减肥？","o":["已经有了“三高”、糖尿病风险、睡眠呼吸暂停综合征、脂肪肝等任何一种疾病","虽然没查出啥疾病，但BMI已经超过30了","只是觉得身材不好看","体重不再增加"],"a":[0,1],"e":"BMI大于24呢？如果你还挺健康的，既没有“三高”，也没有糖尿病的风险，又没有睡眠呼吸暂停综合征、脂肪肝等肥胖导致的疾病，如果你不是打心底里很想减肥，那你可以再等等，只要体重不再增加就行。如果已经有了上面说的任何一种疾病，或者虽然没查出啥疾病，但BMI已经超过30了，那无论如何，我都会强烈建议你开始减肥。"},{"q":"月经对于减肥的两个重要功能是？","o":["检验功能","代谢重塑","排毒功能","增肌功能"],"a":[0,1],"e":"月经对于减肥来说有两个重要的功能。一是检验功能。月经实际上是我们女性身体对自己的生活方式每月一次的检验。二是代谢重塑。无论是激素水平、代谢水平，还是身体的修复、情绪的调整，都是在一个月经周期里完成的。"},{"q":"月经期想调整好，核心的两点包括？","o":["保证睡眠","月经后的一周确保增加运动量","大幅减少能量摄入","完全停止运动"],"a":[0,1],"e":"想调整好，核心有两点：第一，保证睡眠。有研究显示，月经期饮食结构合理，睡眠充足，会大大降低接下来一个月拖慢代谢的激素的水平。第二，月经后的一周确保增加运动量。这段时间是我们的黄金减肥期。"},{"q":"女性减肥急于求成、需要赶紧停下脚步调整方法的信号包括？","o":["每天的能量摄入还不到1200大卡","有大量运动时也不到1500大卡","营养搭配极不均衡","出现严重的脱发、疲乏、疼痛、停经","每天的能量摄入保持在1800大卡以上"],"a":[0,1,2,3],"e":"开始减肥之后，有一种情况在我的女性患者里非常常见，就是急于求成，或者要求极其严格，每天的能量摄入还不到1200大卡，有大量运动时也不到1500大卡，营养搭配极不均衡。这样的话，用不了两个月，你可能还没达到标准的体重范围，就已经出现了严重的脱发、疲乏、疼痛、停经等情况。针对这些情况，我们要赶紧停下脚步，调整减肥方法。"},{"q":"关于围绝经期，下列正确的说法包括？","o":["是指女性绝经前后的一段时期","到了这个时期，肥胖及心脑血管疾病风险都在成倍地增加","围绝经期可以对女性身体代谢进行一次重塑","必然衰老、必然肥胖，无法改变"],"a":[0,1,2],"e":"接下来看看围绝经期。围绝经期是指女性绝经前后的一段时期，到了这个时期，肥胖及心脑血管疾病风险都在成倍地增加，减肥变得更加重要。二是重塑。围绝经期可以对女性身体代谢进行一次重塑，千万不要对这个阶段抱持必然衰老、必然肥胖的成见。"},{"q":"女性一旦减得不对，脂类不足会导致无法合成哪些女性必需的激素？","o":["雌激素","孕激素","胰岛素","生长激素"],"a":[0,1],"e":"这是因为，脂类是合成雌激素和孕激素的原料之一，如果没有了脂肪来源，身体就无法生产出这些女性必需的激素。"},{"q":"关于用BMI判断孩子是否肥胖，下列正确的说法包括？","o":["世界卫生组织也是通过计算BMI来判断孩子体重是否正常的","算出来的BMI需要和相同性别的同龄孩子进行对比","85th和15th中间部分属于正常体重","超过85th那根线就是超重，超过97th那根线就是肥胖","直接用成人的BMI标准24和28来判定孩子"],"a":[0,1,2,3],"e":"世界卫生组织也是通过计算BMI来判断孩子体重是否正常的，不过稍微复杂一点，算出来的BMI需要和相同性别的同龄孩子进行对比。图3.3～图3.6就是不同年龄段男孩女孩的标准BMI范围-85th和15th中间部分属于正常体重，超过85th那根线就是超重，超过97th那根线就是肥胖。"},{"q":"关于“一胖一辈子”的数据，下列正确的说法包括？","o":["肥胖的儿童在成年后，有42%~63%的概率会继续肥胖","肥胖的青少年在成年后，继续肥胖的概率更是高达70%~80%","小时候体重过高对未来肥胖的影响，贯穿从胎儿期到18岁的所有人生阶段","只要18岁之前胖，后半辈子大概率也会继续胖","小时候胖属于“婴儿肥”“青春肥”，长身体自然会瘦回去"],"a":[0,1,2,3],"e":"调查显示，肥胖的儿童在成年后，有42%~63％的概率会继续肥胖；肥胖的青少年在成年后，继续肥胖的概率更是高达70%~80％。这种小时候体重过高对未来肥胖的影响，发生在胎儿期、婴儿期、儿童期和青少年时期。说得更直白一点，只要18岁之前胖，后半辈子大概率也会继续胖。"},{"q":"在脂肪细胞生长发育阶段，身体会向脂肪细胞发出过度生长信号的营养刺激包括？","o":["长时间饥饿","经常吃得特别撑","短时间内吃进去很多能量特别高的食物","三餐规律、七八分饱"],"a":[0,1,2],"e":"如果一个人在成年之前，也就是在脂肪细胞生长发育的阶段，受到了营养刺激，比如长时间饥饿、经常吃得特别撑、短时间内吃进去很多能量特别高的食物等，不管是营养不良还是营养过剩，身体都会向脂肪细胞发出过度生长的信号。"},{"q":"关于父母体重与孩子肥胖风险的研究数据，正确的包括？","o":["父母双方都胖的，孩子肥胖的风险是父母双方体重都正常的孩子的4倍","如果父亲一方胖，这个风险是3.1倍","仅有母亲一方胖的，这个风险是2.7倍","父母体重对孩子肥胖风险没有影响"],"a":[0,1,2],"e":"研究显示，父母双方都胖的，孩子肥胖的风险是父母双方体重都正常的孩子的4倍；如果父亲一方胖，这个风险是3.1倍；仅有母亲一方胖的，这个风险是2.7倍。为了备孕，你知道要戒烟戒酒，现在得再加一条-把体重减到正常范围，尤其是当爸爸的。"},{"q":"关于新生儿体重，下列正确的说法包括？","o":["出生时的体重正常范围是2.5~4千克","高于4千克，孩子成年后变胖以及患肥胖相关疾病的概率都会明显增加","低于2.5千克，同样会明显增加上述概率","准妈妈在孕期要及时监控胎儿发育情况，对自己的饮食做出相应调整","新生儿出生体重越重越好，超过4.5千克更健康"],"a":[0,1,2,3],"e":"新生儿出生时的体重，正常范围是2.5~4千克。医学研究发现，出生时的体重不管是高于4千克，还是低于2.5千克，孩子成年后变胖，以及患上肥胖相关疾病的概率都会明显增加。所以，准妈妈在孕期要及时监控胎儿发育情况，对自己的饮食做出相应的调整。"},{"q":"关于母乳喂养，下列正确的说法包括？","o":["与奶粉喂养相比，母乳喂养时婴儿摄入的能量较低，体重更轻，成长速度更合理","母乳有自己的调节机制：孩子吃得多，母乳产量大，能量密度就会下降","母乳喂养的学龄期儿童，肥胖风险会降低15%~20%","母乳喂养还与成年后慢性病风险的降低相关","母乳喂养会让婴儿摄入的能量更高，体重增长更快"],"a":[0,1,2,3],"e":"与奶粉喂养相比，母乳喂养时，婴儿摄入的能量较低，所以体重更轻，成长速度更合理。母乳有自己的调节机制，孩子吃得多，母乳产量大，能量密度就会下降，算下来，孩子吃进去的能量并不会增加。大多数观察性研究都发现，母乳喂养的学龄期儿童，肥胖风险会降低15%~20％。而且，母乳喂养还与成年后慢性病风险的降低相关。"},{"q":"根据美国儿科学会推荐的儿童每日果汁上限，正确的包括？","o":["1~3岁的孩子每天最多喝120毫升果汁","4~6岁每天120~180毫升","6岁后每天可以喝240毫升","1~3岁的孩子每天可以喝240毫升"],"a":[0,1,2],"e":"根据美国儿科学会的推荐，1~3岁的孩子每天最多喝120毫升果汁；4~6岁每天120~180毫升；6岁后每天可以喝240毫升。"},{"q":"关于果汁与水果的区别，下列正确的说法包括？","o":["一杯240毫升的苹果汁和一个苹果的分量差不多，但需要3~4个苹果才能榨成","孩子吃一个苹果小肚子就饱了，三四个肯定吃不完","喝这么一杯果汁，不到2分钟就能下肚","这一杯果汁所含的能量，远远超过一个苹果","一杯果汁所含的能量与一个苹果基本相同"],"a":[0,1,2,3],"e":"我们做个简单的数学题，你就明白果汁和水果的区别了-一杯240毫升的苹果汁和一个苹果的分量差不多，但需要3~4个苹果才能榨成。孩子吃一个苹果，小肚子就饱饱的了，三四个肯定吃不完，而喝这么一杯果汁，不到2分钟就能下肚。但这一杯果汁所含的能量，可是要远远超过一个苹果。"},{"q":"“三分饥与寒，少穿一件衣服”这一招的科学依据包括？","o":["棕色脂肪组织与BMI呈负相关","棕色脂肪组织越多，体重就越低","适度的寒冷，会促进棕色脂肪细胞的增长","寒冷会促进白色脂肪细胞的增长"],"a":[0,1,2],"e":"第七招，三分饥与寒，少穿一件衣服。我们在前面讲过白色脂肪和棕色脂肪的区别。其中，棕色脂肪组织与BMI呈负相关。也就是说，棕色脂肪组织越多，体重就越低。而适度的寒冷，会促进棕色脂肪细胞的增长。"},{"q":"关于孩子吃正餐，正确的做法包括？","o":["三餐让孩子自己吃","自己吃饭有助于培养孩子的专注力，让他更好地感知自己有没有吃饱","千万不能养成一会儿吃一点这种“牛羊放牧式”的进食习惯","如果孩子忙着玩正餐没吃饱，就给他零食"],"a":[0,1,2],"e":"第六招，三餐让孩子自己吃，没吃饱也不给零食。自己吃饭有助于培养孩子的专注力，让他更好地感知自己有没有吃饱。注意，千万不能养成一会儿吃一点、一会儿吃一点这种“牛羊放牧式”的进食习惯。如果孩子忙着玩，正餐没吃饱，也不要给他零食。他饿了，下一顿自然会好好吃。"},{"q":"各年龄段孩子的推荐睡眠时长，正确的包括？","o":["1~2岁的小宝贝，每天要睡13~14个小时","2~4岁，要睡够12个小时","4~7岁，大概是11个小时","学龄期和青春期（7~15岁），每天要睡足8~11个小时","7~15岁每天睡足5~6个小时就足够了"],"a":[0,1,2,3],"e":"充足的睡眠有助于体重的自我调节。1~2岁的小宝贝，每天要睡13~14个小时；2~4岁，要睡够12个小时；4~7岁，大概是11个小时；到了学龄期和青春期，也就是7∼15岁，每天要睡足8~11个小时。"},{"q":"关于限制孩子玩电子产品与运动，下列正确的说法包括？","o":["限制孩子玩电子产品，每天不超过1个小时","只要限制玩手机、玩平板电脑的时间，运动时间就会自然而然地大大增加","对青少年来说，每天20分钟到1小时的中等强度有氧运动，不仅能预防肥胖","也能帮小胖墩们减肥","孩子玩电子产品的时间不需要做任何限制"],"a":[0,1,2,3],"e":"第九招，限制孩子玩电子产品，每天不超过1个小时。孩子天性好动，只要限制玩手机、玩平板电脑的时间，他的运动时间就会自然而然地大大增加。对青少年来说，每天20分钟到1小时的中等强度有氧运动，不仅能预防肥胖，也能帮小胖墩们减肥。"},{"q":"按2009年美国国家科学院的建议，孕期总增重范围正确的包括？","o":["体重过低（BMI<18.5）：12.5~18千克","标准（BMI 18.5~23.9）：11.5~16千克","超重（BMI 24~29.9）：7~11.5千克","肥胖（BMI≥30）：5~9千克","肥胖（BMI≥30）的孕期总增重应达到11.5~16千克"],"a":[0,1,2,3],"e":"2009年，美国国家科学院对女性孕期的体重增长值给出了以下建议（见表3-1）。孕前体重分类／BMI／孕期总增重范围（千克）：体重过低 <18.5 12.5~18；标准 18.5~23.9 11.5~16；超重 24~29.9 7~11.5；肥胖 ≥30 5~9。【原书表格该行因排版显示为“125~18”，实为12.5~18千克】"},{"q":"关于产后体重恢复的三点建议，下列正确的说法包括？","o":["母乳喂养越充分、时间越久，母亲产后的体重下降就越快","在怀孕期间和产后6个月、18个月时感到抑郁、焦虑或痛苦的女性，复胖的风险最高","女性产后6个月每天睡眠时间不超过5个小时，与一年后的体重增加密切相关","产后应立即开始高强度节食"],"a":[0,1,2],"e":"（1）母乳喂养：母乳喂养越充分，时间越久，母亲产后的体重下降就越快。（2）保持良好的情绪：佩德森等人发现，在怀孕期间和产后6个月、18个月时感到抑郁、焦虑或痛苦的女性，复胖的风险最高。（3）维持正常的睡眠时间：数据表明，女性产后6个月每天睡眠时间不超过5个小时，与一年后的体重增加密切相关。"},{"q":"关于孕期控制体重，下列正确的说法包括？","o":["孕期确实是控制体重的关键所在","这个时候控制好了，要远远胜过将来辛辛苦苦减肥","更加有利于孩子的全方位健康，降低母婴两代人患糖尿病、心脑血管疾病的风险","一些日本学者推荐亚洲人将孕前BMI控制在23以内","孕期应遵循“一人吃，两人补”，不必控制体重增长速度"],"a":[0,1,2,3],"e":"但是，孕期确实是控制体重的关键所在。这个时候控制好了，要远远胜过将来辛辛苦苦减肥，同时也更加有利于孩子的全方位健康，降低母婴两代人患糖尿病、心脑血管疾病的风险。一些日本学者认为，新生儿体重在很大程度上取决于妈妈的孕前BMI，并推荐亚洲人将孕前BMI控制在23以内。"},{"q":"关于孕期运动，下列正确的说法包括？","o":["研究表明，每周3次以上、每次30分钟以上的骑车锻炼，有助于降低孕妇妊娠期体重过度增加的风险","上述骑车锻炼还有助于降低妊娠糖尿病发病率","孕妇还可以在医生的指导下进行快走、慢跑、瑜伽等运动","孕期应当完全避免任何形式的运动"],"a":[0,1,2],"e":"除此之外，适量的运动也是一个重要手段。研究表明，每周3次以上、每次30分钟以上的骑车锻炼，有助于降低孕妇妊娠期体重过度增加的风险和妊娠糖尿病发病率。另外，孕妇还可以在医生的指导下进行快走、慢跑、瑜伽等运动。"},{"q":"关于备孕期的体重管理，下列正确的说法包括？","o":["备孕期尽量将体重减到正常范围","准妈妈完全可以和准爸爸一起开启减肥生活","这既可以为宝宝未来的健康身体打好基础，也可以营造良好的家庭氛围","如果在这一时间段不能减到正常范围，请不用着急，接下来才是关键","中国人备孕只需戒烟戒酒吃维生素，体重完全不重要"],"a":[0,1,2,3],"e":"第一，备孕期，尽量将体重减到正常范围。因此，如果体重超标的话，在备孕期，准妈妈完全可以和准爸爸一起开启减肥生活。这既可以为宝宝未来的健康身体打好基础，也可以营造良好的家庭氛围。不过，如果在这一时间段不能减到正常范围，请不用着急，接下来才是关键。"},{"q":"关于我们每天耗能构成的数据，下列正确的说法包括？","o":["基础代谢占70%左右","日常活动的耗能大约占20%","一般的运动耗能只占1%~5%","日常活动代表你醒着的16个小时","一般的运动耗能占每天总耗能的40%以上"],"a":[0,1,2,3],"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。这是因为，日常活动是由你每天的生活习惯和工作方式共同构成的，它代表你醒着的16个小时。"},{"q":"增加日常活动量的好处包括？","o":["能够直接消耗能量","还能促进运动过程中新陈代谢的消耗","长此以往可以提高基础代谢率，使减肥效果事半功倍","会大量消耗肌肉"],"a":[0,1,2],"e":"所以，如果可以增加日常活动量，你不仅能够直接消耗能量，还能促进运动过程中新陈代谢的消耗。长此以往，你就可以提高基础代谢率，使减肥效果事半功倍。"},{"q":"关于爬楼梯，下列正确的说法包括？","o":["在各种日常活动中，爬楼梯是能量消耗最大的一种","它的运动强度可以达到中等，与慢跑差不多","上台阶还可以显著提高心率，使其达到有利于脂肪燃烧的区间（最大心率的60%左右）","楼层不高时可以直接爬楼梯上去，在高层也可以爬几层楼梯再换乘电梯","爬楼梯的能量消耗在所有日常活动中是最小的"],"a":[0,1,2,3],"e":"在各种日常活动中，爬楼梯是能量消耗最大的一种。它的运动强度可以达到中等，与慢跑差不多。而且，上台阶还可以显著提高你的心率，使其达到有利于脂肪燃烧的区间（最大心率的60％左右）。如果楼层不高，你可以直接爬楼梯上去。如果家或办公室在高层，你也可以爬几层楼梯再换乘电梯。"},{"q":"关于做家务的消耗与好处，下列正确的说法包括？","o":["做饭、洗碗、买菜、洗车、照顾小孩、扫地、拖地、搬重物等都算在内","数据显示，普通家务和娱乐性活动每天可以额外消耗100~200大卡的能量","大约相当于半个小时中等强度的运动量","还能增加肌肉，锻炼身体的协调性、平衡性","普通家务和娱乐性活动每天消耗的能量不足10大卡"],"a":[0,1,2,3],"e":"做饭、洗碗、买菜、洗车、照顾小孩、扫地、拖地、搬重物，等等，都是我们日常生活中常干的家务。别小看了这些活动，数据显示，普通家务和娱乐性活动，每天可以额外消耗100~200大卡的能量，大约相当于半个小时中等强度的运动量。此外，做家务还能增加肌肉，锻炼身体的协调性、平衡性。"},{"q":"关于跳绳和有氧操，下列正确的说法包括？","o":["跳绳如果每天跳10分钟，能够燃烧将近200大卡的能量","跳绳在减脂的同时还可以强化肌力，优化线条","有氧操一般伴随着节奏感强的音乐，适合晨起、午休或晚间闲暇时利用碎片时间进行","有氧操包含开合跳、高抬腿、波比跳、深蹲跳等全身运动","跳绳每天跳10分钟只能燃烧约50大卡的能量"],"a":[0,1,2,3],"e":"跳绳是一种非常不错的有氧运动，可以在任何时间、任何地点进行。如果每天跳10分钟，能够燃烧将近200大卡的能量。而且，在减脂的同时，跳绳还可以强化肌力，优化线条。有氧操是另一种常见的居家有氧运动，一般伴随着节奏感强的音乐。它包含多种全身运动，比如开合跳、高抬腿、波比跳、深蹲跳等。"},{"q":"关于步行出行，下列正确的说法包括？","o":["调查显示，步行是最好坚持的减肥运动，长远来看减肥效果相当不错","公司距离较近的情况下可以步行上下班","稍远的情况下可以骑单车绿色出行","距离较远也可以提前几站下车再步行到目的地","步行很难坚持，长远来看减肥效果很差"],"a":[0,1,2,3],"e":"调查显示，步行是最好坚持的减肥运动，长远来看减肥效果相当不错。比如，上班族可以在公司距离较近的情况下步行上下班，在稍远的情况下骑单车绿色出行，如果距离较远，也可以提前几站下车再步行到目的地。"},{"q":"关于高血压与减肥，下列正确的说法包括？","o":["全球的高血压指南，都将减肥明确纳入了高血压规范管理","美国最新的高血压指南指出，体重减少1千克，相当于收缩压或舒张压下降1毫米汞柱","这个效果可以一直累加到5千克，也就是血压下降5毫米汞柱","仅靠减肥，你就可以获得半片降压药的效果","体重减少1千克，相当于血压下降5毫米汞柱"],"a":[0,1,2,3],"e":"全球的高血压指南，都将减肥明确纳入了高血压规范管理。美国最新的高血压指南指出，体重减少1千克，相当于收缩压或舒张压下降1毫米汞柱，这个效果可以一直累加到5千克，也就是血压下降5毫米汞柱。这意味着，仅靠减肥，你就可以获得半片降压药的效果。"},{"q":"对于高血压患者，书中推荐的减肥方案及其降压效果包括？","o":["推荐采用地中海饮食方案","结合每周不少于150分钟的持续中等强度有氧运动","地中海饮食在减肥的基础上，还能再为你降低8~10毫米汞柱的血压","有氧运动则额外又有5~6毫米汞柱的降压效果","地中海饮食在减肥基础上还能再降低30毫米汞柱的血压"],"a":[0,1,2,3],"e":"如果你患有高血压，我推荐你在减肥时采用我们前面讲过的地中海饮食方案，结合每周不少于150分钟的持续中等强度有氧运动。地中海饮食在减肥的基础上，还能再为你降低8~10毫米汞柱的血压，而有氧运动则额外又有5~6毫米汞柱的降压效果，加在一起，效果接近两片降压药。"},{"q":"关于高血脂与减肥，下列正确的说法包括？","o":["肥胖是高血脂的重要诱因，尤其是腹型肥胖","想要靠减肥来降低血脂，并不像降低血压一样，只要有能量缺口就行","低碳水饮食、低脂肪饮食反而会进一步加重血脂紊乱","必须遵循营养均衡法则","低碳水饮食、低脂肪饮食有助于改善血脂紊乱"],"a":[0,1,2,3],"e":"肥胖是高血脂的重要诱因，尤其是腹型肥胖。但是想要靠减肥来降低血脂，并不像降低血压一样，只要有能量缺口就行，甚至有些饮食方案，如低碳水饮食、低脂肪饮食，反而会进一步加重血脂紊乱。想要降低血脂，必须遵循我们前面讲过的营养均衡法则。"},{"q":"关于高血糖人群的减肥，下列正确的说法包括？","o":["如果还没达到糖尿病的程度，仅仅靠减肥这一条，就有逆转局面、让血糖恢复正常的可能","如果已经患上了糖尿病，减肥也可以帮助你减少降糖药物或胰岛素的使用量","书中郑重推荐低碳水饮食方案","低碳水饮食方案不仅减肥见效快，而且可以很好地中和掉身体里分泌过多的胰岛素","高血糖人群应当避免采用低碳水饮食方案"],"a":[0,1,2,3],"e":"如果你有高血糖，但还没达到糖尿病的程度，那恭喜你，因为仅仅靠减肥这一条，你就有逆转局面、让血糖恢复正常的可能。如果你已经患上了糖尿病，减肥也可以帮助你减少降糖药物或胰岛素的使用量。关于高血糖人群的减肥，我郑重推荐低碳水饮食方案。低碳水饮食方案不仅减肥见效快，而且可以很好地中和掉你身体里分泌过多的胰岛素。"},{"q":"关于“三高”与减肥的关系，下列正确的说法包括？","o":["如果你已经有三高中的一个甚至多个，减肥对你来说就是一个处方，而不是可减可不减的口号","幸运的是，你还有肥可以减，即便不吃药也有改善的空间","如果三高还处于早期，因为减肥彻底改变了生活方式，就有可能不用药物治疗","已经患上三高后只需调整饮食，不必听医生的"],"a":[0,1,2],"e":"如果你已经有“三高”，那么减肥对你来说，就是一个处方，而不是可减可不减的口号。“幸运的是，你还有肥可以减，也就是即便不吃药，你也有改善的空间。”如果你的三高还处于早期，如果你因为减肥而彻底改变了生活方式，那么你就有可能不用药物治疗，便扳回这一局。当然，如果已经患上了“三高”，除了对饮食进行调整外，你还需要听医生的，进行相应的治疗。"},{"q":"书中那位40岁女士身上提示甲减的症状包括？","o":["皮肤特别爱干燥","手脚很怕冷","经常犯困，打不起精神","月经只有两天，量也很少","皮肤湿润多汗，手脚发热"],"a":[0,1,2,3],"e":"我再三追问，发现她皮肤特别爱干燥，手脚很怕冷，经常犯困，打不起精神，月经只有两天，量也很少。我告诉她，你需要仔细检查一下甲状腺功能，我怀疑你有甲减。"},{"q":"发现甲状腺功能减退之后，正确的处理要点包括？","o":["首先要做的是补充甲状腺素，甲状腺功能调正常了，基础代谢才能正常","要特别强调减盐，避免水肿加重","减肥过程中不推荐使用低碳水高脂肪饮食方案，避免脂代谢进一步紊乱","应立即开始大量剧烈运动"],"a":[0,1,2],"e":"如果发现甲状腺功能减退，首先要做的是补充甲状腺素。甲状腺功能调正常了，基础代谢才能正常。其次，因为甲状腺功能减退会使身体储水增加，脂代谢紊乱，所以对于甲状腺功能减退患者，要特别强调减盐，避免水肿加重，并且在减肥过程中也不推荐使用低碳水高脂肪饮食方案，避免脂代谢进一步紊乱。"},{"q":"天然食物中含锌比较多的包括？","o":["牡蛎","贝壳类","坚果种子以及牛肉","精制白糖"],"a":[0,1,2],"e":"锌同硒的作用差不多，是调节甲状腺激素的重要矿物质。天然食物中含锌比较多的是牡蛎、贝壳类、坚果种子以及牛肉等。尽量食补，实在不行再考虑吃补充剂。"},{"q":"甲状腺素缺乏一旦出现贫血，需要补充富含铁和叶酸的食物，包括？","o":["动物血制品","红枣、桂圆、枸杞","海带、木耳、香菇","黄豆","精制白糖和含糖饮料"],"a":[0,1,2,3],"e":"此外，甲状腺素缺乏会影响血红蛋白合成，同时影响肠道对铁和叶酸的吸收。所以一旦出现贫血，就需要补充富含铁和叶酸的食物，如动物血制品、红枣、桂圆、枸杞、海带、木耳、香菇、黄豆等。"},{"q":"关于肥胖与甲状腺功能，下列正确的说法包括？","o":["越来越多的研究证明，肥胖本身就可以引起你甲状腺功能的弱化","所有肥胖人群如果想减肥，都要尽力强化甲状腺功能，尤其是自检超过4分的","如果只是甲状腺功能弱化而不是减退，还有很多其他方法可用，不一定都去吃甲状腺素片","甲状腺功能自检超过7分，建议赶紧去医院检查","肥胖本身可以增强甲状腺功能，所以不需要刻意强化"],"a":[0,1,2,3],"e":"越来越多的研究证明，肥胖本身就可以引起你甲状腺功能的弱化。这就意味着，所有肥胖人群，如果想减肥，都要尽力强化甲状腺功能，尤其是自检超过4分的。医学研究证明，如果只是甲状腺功能弱化，而不是减退，你还有很多其他的方法可用。如果自检超过7分，建议你赶紧去医院检查。"},{"q":"补充纤维素对甲状腺功能减退患者的作用包括？","o":["缓解甲状腺功能减退带来的胃肠蠕动减慢、便秘等问题","改善脾虚湿盛、五谷不化导致的肥胖","直接强化甲状腺素功能","替代甲状腺素补充剂"],"a":[0,1],"e":"3．补充纤维素 多吃蔬菜和薯类等食物。这并不会强化甲状腺素功能，却能缓解甲状腺功能减退带来的胃肠蠕动减慢、便秘等问题，同时改善脾虚湿盛、五谷不化导致的肥胖。"},{"q":"肥胖与阻塞性睡眠呼吸暂停“死循环”的环节包括？","o":["胖了脖子就粗，会使打呼噜的时候喉部塌陷更严重，从而导致睡眠呼吸暂停","呼吸暂停后人缺氧了，就会使身体里的胰岛素过度分泌，反过来又增加了肥胖的程度","更胖之后，阻塞就更严重，人就愈加肥胖","缺氧会直接分解脂肪，使体重下降"],"a":[0,1,2],"e":"胖了，脖子就粗，就会使打呼噜的时候喉部塌陷更严重，从而导致睡眠呼吸暂停。呼吸暂停后，人缺氧了，就会使身体里的胰岛素过度分泌，反过来又增加了肥胖的程度。更胖之后，阻塞就更严重，人就愈加肥胖。所以，肥胖和阻塞性睡眠呼吸暂停就是个死循环。"},{"q":"为什么要把阻塞性睡眠呼吸暂停单拎出来讲？","o":["因为这个病发病率很高，在中国有23.6%的成年人罹患","因为一旦得了这个病，光按第二章的方法减肥，是减不下来的","因为这个病只发生在老年人身上","因为这个病目前无法治疗"],"a":[0,1],"e":"为什么要把这个病单拎出来讲？一是因为这个病发病率很高，在中国有23.6％的成年人罹患；二是因为一旦得了这个病，光按第二章的方法减肥，是减不下来的。"},{"q":"关于阻塞性睡眠呼吸暂停的自评与就诊，下列正确的说法包括？","o":["如果自评达到3分，那你就要去医院了","可以找呼吸科、心内科或者睡眠科的医生","一般只需要做一个睡眠监测，医生就可以帮你做出明确的诊断","缺氧得到纠正后，各种代谢因素都会好转","自评要达到10分才需要去医院"],"a":[0,1,2,3],"e":"如果自评达到3分，那你就要去医院了，找呼吸科、心内科或者睡眠科的医生都行。一般只需要做一个睡眠监测，医生就可以帮你做出明确的诊断。确诊之后，你需要根据医生的指导，采取相应的方法，改善夜间缺氧的问题。缺氧得到纠正后，各种代谢因素都会好转。"},{"q":"关于呼吸机治疗，下列正确的说法包括？","o":["很多病人用上呼吸机后，高血压、高血糖和肥胖都发生了逆转","因为不胖了，最终阻塞性睡眠呼吸暂停也消失了","最近一项非随机的小研究中，86名接受呼吸机治疗的患者均出现了BMI的降低和内脏脂肪的减少","该研究中11人所患疾病出现好转","用上呼吸机后，高血压和高血糖通常会进一步升高"],"a":[0,1,2,3],"e":"不要抗拒医生可能采用的呼吸机治疗。事实上，我的经验是很多病人用上呼吸机后，高血压、高血糖和肥胖都发生了逆转，而因为不胖了，最终阻塞性睡眠呼吸暂停也消失了。最近一项非随机的小研究也印证了我的这个经验：86名接受呼吸机治疗的患者均出现了BMI的降低和内脏脂肪的减少，其中11人所患疾病出现好转。"},{"q":"关于减肥平台期的定义与特征，下列正确的说法包括？","o":["连续两周以上体重不下降甚至有反弹趋势的阶段","平台期的长短会因个体差异、调整方法、原方法而不同","在减肥训练营的微信群里，短则两周、长则两个月，这个画风就要循环一轮","并不是谁的方法错了，也不是谁不努力了","连续三天体重不下降就一定进入了平台期"],"a":[0,1,2,3],"e":"在我们中心减肥训练营的微信群里，短则两周，长则两个月，这个画风就要循环一轮。其实，这并不是谁的方法错了，也不是谁不努力了，而是我们的减肥进入平台期了。减肥过程中，连续两周以上体重不下降甚至有反弹趋势的阶段，被一些医学家定义为减肥平台期。平台期的长短会因个体差异、调整方法、原方法而不同。"},{"q":"体重不再继续下降的原因包括？","o":["体重减少必然会带来基础代谢的降低，体重减少得越多，基础代谢越低，原来的能量缺口就不管用了","身体面对体重的减少，会启动一系列机制来维持代谢的平衡，努力不让体重继续减少","一定是方法错了","一定是运动量不够"],"a":[0,1],"e":"体重不再继续下降，原因无外乎两点，都涉及你内在的生理平衡：一是体重减少，必然会带来基础代谢的降低，体重减少得越多，基础代谢越低，原来的能量缺口就不管用了；二是身体面对体重的减少，会启动一系列机制来维持代谢的平衡，努力不让体重继续减少。"},{"q":"关于真实的减肥体重曲线，下列正确的说法包括？","o":["绝不是设定了能量缺口，就可以一路减到底","体重并不会以稳定的速度持续直线下降","第一个月减重4千克，并不意味着两个月可以减重8千克、四个月可以减重16千克","体重下降速度往往在初期最快，而后会逐渐放缓甚至停滞","只要设定了能量缺口，体重就可以一路匀速减到底"],"a":[0,1,2,3],"e":"真实的减肥，绝不是设定了能量缺口，就可以一路减到底。现实中，体重并不会以稳定的速度持续直线下降。第一个月减重4千克，并不意味着两个月可以减重8千克、四个月可以减重16千克。减肥过程中的体重下降速度往往在初期最快，而后会逐渐放缓甚至停滞。"},{"q":"“交替使用不同方法”的具体做法包括？","o":["开启一个月的轻断食，就可以很容易地骗过身体的记忆","运动上不同的方法轮番用","这个月以中等持续有氧运动为主，下个月以高强间歇运动为主","身体会对它们做出不同的反馈","始终只用同一种方法，让身体充分适应"],"a":[0,1,2,3],"e":"第二，交替使用不同方法。身体对原有的方法可能会逐渐适应。这时候，如果你换个花样，比如开启一个月的轻断食，就可以很容易地骗过身体的记忆，还会带来其他意想不到的好处。在运动上也可以这样，不同的方法轮番用，这个月以中等持续有氧运动为主，下个月以高强间歇运动为主，身体会对它们做出不同的反馈。"},{"q":"关于平台期增加肌肉，下列正确的说法包括？","o":["平台期是长肌肉的好时候","这个阶段身体进入了修复的过程，既不会让你更瘦，也不会让你更胖","建议你比平常增加一倍力量训练，同时补充蛋白质","两周后即使体重不掉，别人也会夸你看起来瘦了一圈","平台期应当避免力量训练，以免体重上升"],"a":[0,1,2,3],"e":"第三，增加肌肉。平台期是长肌肉的好时候。这个阶段，我们的身体进入了修复的过程，既不会让你更瘦，也不会让你更胖。这时候，建议你比平常增加一倍力量训练，同时补充蛋白质。你会发现，两周后，即使体重不掉，别人也会夸你看起来瘦了一圈。"},{"q":"关于快速减肥方法的脱水机制，下列正确的说法包括？","o":["辟谷和生酮减肥法由于身体没了碳水化合物作为能量来源，正好消耗所有的肌糖原以及它储存的水分","医用泻药和利尿剂属于比较直接的排水","节食＋过度运动则两种脱水方法都包括","水分占了身体成分的70%","水分只占身体成分的30%左右"],"a":[0,1,2,3],"e":"水分分布在人体每一个器官的细胞内外和血液中，而肌肉中的肌糖原正是储水大户。辟谷和生酮减肥法的共同点，是由于身体没了碳水化合物作为能量来源，正好消耗所有的肌糖原以及它储存的水分，从而达到脱水的效果。医用泻药和利尿剂属于比较直接的排水，节食＋过度运动则两种脱水方法都包括。无论你是胖还是瘦，水分都占了你身体成分的70％。"},{"q":"关于快速减肥反弹快且更难再减的原因，下列正确的说法包括？","o":["因为它们都是短期的，一旦停下来，水分很快就会补充回来","反弹之后如果想重新减，尤其是还想用这一类方法，肯定是减不下去的","因为我们的身体长记性了","身体会节能减排，这回绝不轻易掉肉","这类方法都可以长期执行，不会反弹"],"a":[0,1,2,3],"e":"用这些方法，体重减少确实快，但是恢复起来也特别快。因为它们都是短期的。一旦停下来，水分很快就会补充回来，体重也随之快速反弹。除此之外，反弹之后如果想重新减，尤其是还想用这一类方法，肯定是减不下去的。因为，我们的身体长记性了！身体说，你那么长时间都没吃饭，营养极度不良，幸亏我节能减排，才没丢了小命。这回又来？我绝不轻易掉肉了。"},{"q":"书中列举的快速减肥对女性的影响包括？","o":["月经期延长","月经量变少，甚至停止","脱发","月经更加规律"],"a":[0,1,2],"e":"除此之外，快速减肥还有很多其他危害，比如常见的胃肠功能衰退；抵抗力下降；月经期延长，月经量变少，甚至停止；皮肤变差；脱发。"},{"q":"关于“基因差异”，下列正确的说法包括？","o":["这种先天差异是不能忽视的，也很难改变","不同基因型的个体，对碳水化合物、脂肪、蛋白质、维生素、矿物质等营养素的代谢、吸收和转化过程都不同","这直接造成了减肥效果的差异","基因差异可以通过短期训练完全改变"],"a":[0,1,2],"e":"第一，基因差异。这种先天差异是不能忽视的，也很难改变。不同基因型的个体，对碳水化合物、脂肪、蛋白质、维生素、矿物质等营养素的代谢、吸收和转化过程都不同，这直接造成了减肥效果的差异。"},{"q":"关于“血糖效应差异”，下列正确的说法包括？","o":["同样的食物，在不同个体身上引起的血糖效应不一样","原因可能是肠道微生物构成的不同","某种低GI食物可能早上闺蜜吃了到中午也不饿，而你吃了不到两小时就饿了","究竟哪种食物适合自己，要多试一试","同样的食物在所有人身上引起的血糖效应完全一致"],"a":[0,1,2,3],"e":"第二，血糖效应差异。同样的食物，在不同个体身上引起的血糖效应不一样，原因可能是肠道微生物构成的不同。举个例子，我为你推荐的某种低GI食物，可能早上你闺蜜吃了，到中午也不饿，而你吃了，不到两小时就饿了。所以究竟哪种食物适合自己，要多试一试。"},{"q":"关于“生活习惯差异”，下列正确的说法包括？","o":["别人通过减少主食摄入量瘦了下来，但你本身吃主食就很少，这个方法对你就没作用了","别人通过增加运动量瘦了下来，但你平时就有运动习惯，这个方法对你也是无用的","别人每天心情愉悦、睡眠时长足够质量也高，稍微调整一下饮食和运动，体重自然就下去了","你精神高度紧张、焦虑抑郁、每天都睡不好，即使采取更严格的减肥方案，体重也不见得会降下去","别人用过有效的方法，换到你身上一定同样有效"],"a":[0,1,2,3],"e":"别人通过减少主食摄入量瘦了下来，但你本身吃主食就很少，对你来说，这个方法肯定就没作用了。别人通过增加运动量瘦了下来，但你平时就有运动习惯，对你来说，这个方法也是无用的。别人每天心情愉悦，睡眠时长足够、质量也高，稍微调整一下饮食和运动，体重自然就下去了，但你精神高度紧张、焦虑抑郁，每天都睡不好，即使比别人采取了更严格的减肥方案，体重也不见得会降下去。"},{"q":"判断别人的方法对你是否好用，书中的两个前提包括？","o":["朋友推荐给你的，一定是一个具体方法，而不是一个原则","原则可能适合你或者大多数人，但具体方法就不一定了","这个方法不一定是坑，我们只是在判断它好不好用","朋友推荐的一定是经过临床验证的药物"],"a":[0,1,2],"e":"这里有两个前提。一是朋友推荐给你的，一定是一个具体方法，而不是一个原则。原则可能适合你或者大多数人，但具体方法就不一定了。二是这个方法不一定是坑，我们只是在判断它好不好用。"},{"q":"关于糖的种类与“0蔗糖”产品，下列正确的说法包括？","o":["不加蔗糖，还可以添加麦芽糖、白砂糖、果糖、葡萄糖、果葡糖浆、椰子糖等","麦芽糖的GI比蔗糖还要高","很多医学研究发现，果葡糖浆、人工添加的果糖，都会明显增加体重","拿到0蔗糖的产品，应翻到食品标签看成分里有什么其他糖","麦芽糖的GI比蔗糖更低"],"a":[0,1,2,3],"e":"糖的种类很多，不加蔗糖，还可以添加其他糖，比如麦芽糖、白砂糖、果糖、葡萄糖、果葡糖浆、椰子糖等。麦芽糖的GI比蔗糖还要高，很多医学研究也都发现，果葡糖浆、人工添加的果糖，都会明显增加体重。所以，拿到所谓0蔗糖的产品，你可以翻到食品标签，看一下成分里有什么其他糖。"},{"q":"关于代糖和甜味剂，下列正确的说法包括？","o":["虽然没有能量，却会干扰我们大脑内能量代谢的传递过程","当舌头尝到“甜”时，大脑会认为人体摄入了“糖”，就会告诉胰岛分泌胰岛素来降糖","这种刺激虽然不会升高体内的血糖，但也会使胰岛素增加分泌，促进脂肪生成","最近的研究显示，这在减肥和预防糖尿病上没有任何作用，而且比起不添加，糖尿病风险更高","添加代糖和甜味剂能显著帮助减肥并预防糖尿病"],"a":[0,1,2,3],"e":"代糖和甜味剂虽然没有能量，却会干扰我们大脑内能量代谢的传递过程。当我们的舌头尝到“甜”时，大脑会认为人体摄入了“糖”，就会告诉胰岛分泌胰岛素来降糖。这种刺激虽然不会升高体内的血糖，但对大脑来说，和吃了真正的糖是差不多的，也会使胰岛素增加分泌，促进脂肪生成。所以，最近的研究显示，这在减肥和预防糖尿病上没有任何作用，而且比起不添加，糖尿病风险更高。"},{"q":"关于“0糖”“0脂肪”产品，下列正确的说法包括？","o":["“0糖”顶多就是没有额外添加糖","“0糖”不等于这种食品本身不含糖，或者不含碳水化合物","无糖酸奶里本身有乳糖，也有碳水化合物","宣称0脂肪的食品，要注意看标签上碳水化合物的量，往往会极高","宣称0脂肪的食品，其碳水化合物含量通常也很低"],"a":[0,1,2,3],"e":"如果写的是“0糖”，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。比如无糖酸奶，奶制品里本身有乳糖，也有碳水化合物。0脂肪≠0碳水化合物 如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上碳水化合物的量，往往它的碳水化合物含量会极高。"},{"q":"关于身体活动消耗的能量，下列正确的说法包括？","o":["身体活动消耗的能量，占人体能量总消耗的15%~30%","身体活动还包括日常劳动等一切行为活动，走路、做家务、伸个懒腰都算在其中","这些日常活动消耗的能量，占据了30%这个数值的最大比例","大量剧烈运动之后，其他活动消耗的能量往往会相应减少","身体活动消耗的能量约占人体能量总消耗的70%"],"a":[0,1,2,3],"e":"身体活动消耗的能量，占人体能量总消耗的15%~30%，但这并不意味着大量剧烈运动就能达到消耗值的上限。事实上，身体活动还包括日常劳动等一切行为活动，走路、做家务、伸个懒腰，都算在其中。这些活动消耗的能量，占据了30％这个数值的最大比例。所以，大量剧烈运动之后，其他活动消耗的能量往往会相应减少，一增一减，总的来说，消耗的能量是有限的。"},{"q":"关于运动后的能量补偿效应，下列正确的说法包括？","o":["我们的身体经过百万年的进化，其实是为节约能量而设计的","身体会十分恐惧能量不足，希望你能用最少的能量干最大的事","在规律的大量剧烈运动后期，身体的基础代谢会比之前下降","尤其是BMI较高的人，能量补偿比例会达到49%","规律大量剧烈运动后期，身体的基础代谢会明显上升"],"a":[0,1,2,3],"e":"我们的身体经过百万年的进化，其实是为节约能量而设计的。身体会十分恐惧能量不足，希望你能用最少的能量干最大的事，把大部分能量留存下来应对各种紧急情况。一些新的研究发现，在规律的大量剧烈运动后期，身体的基础代谢会比之前下降；尤其是BMI较高的人，能量补偿比例会达到49%。"},{"q":"造成相同运动强度下单位时间身体消耗能量不断下降的原因包括？","o":["动作的熟练化","运动模式的固定化","体重下降","基础代谢升高"],"a":[0,1,2],"e":"这是因为，动作的熟练化、运动模式的固定化，加上体重下降，造成相同运动强度下，单位时间身体消耗的能量在不断下降。"},{"q":"让运动效果持续的方法包括？","o":["加快速度","增加训练重量或是组数","去发现并体验一种新的运动方式","彻底停止运动"],"a":[0,1,2],"e":"当然，有很多方法可以解决这个问题，比如加快速度，增加训练重量或是组数，或者去发现并体验一种新的运动方式，都能让运动效果持续。"},{"q":"关于书中提到的为期四周的过量运动研究，下列正确的说法包括？","o":["前三周逐渐加量，每周分别做36分钟、90分钟和152分钟的高强间歇运动","第四周减少到52分钟","对受试者进行血糖监测和葡萄糖耐量试验，并测定线粒体的呼吸功能","第三周运动量最大的时候各项指标反而变差，第四周减量后仍然无法完全恢复","第三周运动量最大的时候，各项指标反而是最好的"],"a":[0,1,2,3],"e":"一项为期四周的最新研究，让受试者在前三周逐渐加量，每周分别做36分钟、90分钟和152分钟的高强间歇运动，并在第四周减少到52分钟，同时对受试者进行血糖监测和葡萄糖耐量试验，并测定线粒体的呼吸功能。结果发现，在第三周运动量最大的时候，受试者的上述各项指标反而变差，到第四周运动减量后仍然无法完全恢复。"},{"q":"关于大量剧烈运动的风险提示，下列正确的说法包括？","o":["不建议明明熬夜工作、疲惫不堪，还要在健身房里完成自己的训练计划","近年来在猝死的案例中，运动中猝死尤其是大量剧烈运动后猝死占据了较大比例","如果要进行大量剧烈运动，请一定避开自己的重度疲劳期和高压期","运动越多、越疲劳时运动效果越好"],"a":[0,1,2],"e":"其一，有风险，执行需谨慎。一些特别“自律”的人，明明熬夜工作、疲惫不堪，还要在健身房里完成自己的训练计划，这是我特别不建议的。近年来，在猝死的案例中，运动中猝死，尤其是大量剧烈运动后猝死，占据了较大的比例。所以，如果要进行大量剧烈运动，请一定避开自己的重度疲劳期和高压期。"},{"q":"关于奥利司他与脂肪吸收抑制剂，下列正确的说法包括？","o":["让脂肪不吸收，是一个全球性的医学难题","目前最管用的脂肪吸收抑制剂奥利司他，也只有30%的吸收抑制作用","即使用奥利司他，你吃下去的脂肪也会有70%顺利进入你的体内","在抑制脂肪吸收这件事上，没有任何食物提取物的效率会比30%高","奥利司他可以阻断90%以上的脂肪吸收"],"a":[0,1,2,3],"e":"第一，坦白地说，让脂肪不吸收，是一个全球性的医学难题。目前最管用的脂肪吸收抑制剂，奥利司他，也只有30％的吸收抑制作用。这就是说，即使用奥利司他，你吃下去的脂肪也会有70％顺利进入你的体内。第二，在抑制脂肪吸收这件事上，没有任何食物提取物的效率会比30％高。"},{"q":"关于左旋肉碱、咖啡因、辣椒素这类“燃脂”成分，下列正确的说法包括？","o":["医学上有一定证据证明它们可以加速脂肪燃烧","核心原理是可以协助身体把脂肪运送到其燃烧场所——线粒体，相当于搬运工","这些搬运工我们人体自身就能产生，食物中也天然含有","只有在增加到极大运动量时，才有可能出现搬运工短缺","这些搬运工人体无法自身产生，必须靠外源补充"],"a":[0,1,2,3],"e":"第四，有些产品添加了左旋肉碱啊，咖啡因啊，辣椒素啊，医学上有一定证据证明它们可以加速脂肪燃烧。这一功能的核心原理是，它们可以协助身体把脂肪运送到其燃烧场所-线粒体，相当于搬运工。但事实上，这些搬运工我们人体自身就能产生，食物中也天然含有，应对一般运动和日常生活足够了。第五，只有在增加到极大运动量时，才有可能出现搬运工短缺。"},{"q":"关于伪科学，下列正确的说法包括？","o":["伪科学一定会用科学当幌子","借用科学的概念和研究方向","在科研成果的基础上杜撰、篡改、夸大","有时即便是做医生的，也要查阅多篇文献才能搞清楚真相","伪科学通常完全不借用任何科学概念和研究方向"],"a":[0,1,2,3],"e":"伪科学一定会用科学当幌子，借用科学的概念和研究方向，在科研成果的基础上杜撰、篡改、夸大。有时即便是做医生的我，也要查阅多篇文献才能搞清楚真相。所以，“听起来很科学”并不稀奇，重要的是我们如何炼成一双火眼金睛。"},{"q":"按作者“敬畏生命”的办法，面对涉及改变、干预身体本身以及生理调节机制的产品，应该怎么做？","o":["慎之又慎，多方求证","看看官方的网站和一些学术平台","问问这个领域的同学，问问医生","求证后再下单，不花冤枉的钱，不走绕远的道","只要产品销量高、评价好，就可以直接下单"],"a":[0,1,2,3],"e":"我有一个简单的办法：敬畏生命。具体来说，凡是涉及改变、干预身体本身的，以及涉及生理调节机制的产品，你都需要慎之又慎，多方求证，比如看看官方的网站和一些学术平台，问问这个领域的同学，问问医生。求证后再下单，不花冤枉的钱，不走绕远的道。"},{"q":"关于“让脂肪加速燃烧”，下列正确的说法包括？","o":["在医学上更是难上加难，目前没有任何医学产品在这个领域上市","我们的身体只要营养均衡，本身就可以生产出燃烧脂肪的酶","在需要时身体会自动完成燃脂这个步骤，不需要额外补充什么物质","吃了这类保健品后抱着脂肪不会吸收的心态大吃大喝，比不吃更糟糕","目前已经有不少加速脂肪燃烧的医学产品上市"],"a":[0,1,2,3],"e":"第三，让脂肪加速燃烧，在医学上更是难上加难，目前没有任何医学产品在这个领域上市。事实上，我们的身体只要营养均衡，本身就可以生产出燃烧脂肪的酶，在需要时自动完成燃脂这个步骤，不需要额外补充什么物质。所以，如果吃了这类保健品，你就抱着脂肪不会吸收的心态，放心地大吃大喝，那比不吃这类保健品更糟糕。"},{"q":"关于开放式与封闭式减肥训练营，下列正确的说法包括？","o":["开放式的通常是建个微信群，或者是健身房里规律训练，人还在家里住","开放式通过课程、代餐，甚至配餐上门等方式指导你减肥","封闭式通常都有一个固定场所，或者把你带到某个固定环境中，比如带进大山里","封闭式的吃喝住行都由训练营安排，管理更加严格，效果自然更好一些","封闭式训练营完全自由，管理比开放式更宽松"],"a":[0,1,2,3],"e":"开放式的通常是建个微信群，或者是健身房里规律训练，人还在家里住，只是通过课程、代餐，甚至配餐上门等方式，指导你减肥。封闭式通常都有一个固定场所，或者把你带到某个固定环境中，比如带进大山里，接下来你的吃喝住行，都由训练营安排。开放式比较自由，封闭式呢，管理更加严格，效果自然更好一些。"},{"q":"训练营反弹带来的长期健康风险包括？","o":["这部分人再想减肥的话，只会难上加难","因为体重波动比较大，他们当中高血脂、高血糖的发生率非常高","从长期来看，心脑血管疾病发生率也更高","反弹只是外观问题，不影响健康"],"a":[0,1,2],"e":"我们中心的患者，很多都是在训练营里瘦了10千克，出来一年不到，又长回去12~13千克。这部分人再想减肥的话，只会难上加难。而且，因为体重波动比较大，他们当中高血脂、高血糖的发生率非常高，从长期来看，心脑血管疾病发生率也更高。"},{"q":"关于好训练营“方法能长期应用”这一特征，下列正确的说法包括？","o":["提供的饮食指导应该很适合你，能让你长期坚持","最重要的判断标准就是有没有节食，饥饿感是不是特别重","无论宣称哪种饮食方案，只要过度地减少能量，就都是节食减肥","节食既伤害身体又没有长期益处，是不可取的","饥饿感越重，说明这个饮食方案越有效"],"a":[0,1,2,3],"e":"好训练营提供的饮食指导应该很适合你，能让你长期坚持。最重要的判断标准就是有没有节食，饥饿感是不是特别重。无论训练营宣称采取哪种饮食方案，只要过度地减少能量，就都是节食减肥。不要觉得反正只有三个月甚至两周，忍一忍就好。节食既伤害身体又没有长期益处，是不可取的。"},{"q":"封闭式训练营难以长期坚持的表现包括？","o":["每天不上学、不上班","进行四个小时高强度运动","干脆不吃饭","每天正常工作学习，只调整饮食"],"a":[0,1,2],"e":"从这个角度看，封闭式训练营虽然减肥效果更好，但每天不上学、不上班、进行四个小时高强度运动，或者干脆不吃饭，这些都是没办法长期坚持的，所以一旦出了营，反弹就很难避免了。"},{"q":"关于代餐的价值与《中国超重／肥胖医学营养治疗专家共识》，下列正确的说法包括？","o":["配合营养代餐的强化生活方式干预，比单纯的膳食支持和教育，更能有效降低患者的体重","人们普遍对食物能量比较陌生","减肥时既要保证能量不超标，又要保证营养素均衡，实在很难把握","代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间","代餐的科技含量极高，普通消费者无法判断真伪"],"a":[0,1,2,3],"e":"《中国超重／肥胖医学营养治疗专家共识》明确指出，总的来说，配合营养代餐的强化生活方式干预，比单纯的膳食支持和教育，更能有效降低患者的体重。代餐的确不是智商税。人们普遍对食物能量比较陌生，减肥时既要保证能量不超标，又要保证营养素均衡，实在很难把握。代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间。"},{"q":"关于如何分清真假代餐，下列正确的说法包括？","o":["今天的代餐已经是一种成熟的减肥产品，科技含量并不是特别高","科学用无数次的验证，帮我们在真假代餐之间画了一条线，让它们泾渭分明","用科学的力量武装自己，减肥就可以变得更简单","代餐科技含量非常高，普通人根本无法判断"],"a":[0,1,2],"e":"今天的代餐，已经是一种成熟的减肥产品，科技含量并不是特别高。科学用无数次的验证，帮我们在真假代餐之间画了一条线，让它们泾渭分明。用科学的力量武装自己，减肥就可以变得更简单。"},{"q":"关于代餐食品团体标准中的脂肪指标，下列正确的说法包括？","o":["来源于饱和脂肪酸的能量不应超过总能量的10%","不得使用氢化油脂","亚油酸供能比不应低于3%","脂肪提供的能量不应超过总能量的60%"],"a":[0,1,2],"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"}]};var curQ=null,ans={},done=false;function shf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){var b=a.slice();shf(b);return b.slice(0,n);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
done=false;
curQ={s:pick(QB.singles,40),m:pick(QB.multis,20)};
ans={};
document.getElementById('submitBtn').disabled=false;
document.getElementById('submitBtn').textContent='📩 提交';
document.getElementById('answeredCount').textContent='0';
document.getElementById('scoreDisplay').textContent='0';
document.getElementById('resultBox').classList.remove('show');
document.getElementById('resultBox').style.display='none';
var app=document.getElementById('app');app.style.display='block';
var h='',n=0;
h+='<div class="sec-title"><span>一、单选题</span><span class="pt">40题×1分=40分</span></div>';
curQ.s.forEach(function(q,i){
n++;var id='s_'+i;
h+='<div class="q-card"><div class="q-text"><span class="q-num">'+n+'.</span>'+esc(q.q)+'<span class="q-pts">(1分)</span></div><div class="opts" id="o_'+id+'">';
q.o.forEach(function(o,oi){var l=String.fromCharCode(65+oi);h+='<label onclick="selS('+i+','+oi+')"><input type="radio" name="'+id+'" value="'+oi+'"><span>'+l+'. '+esc(o)+'</span></label>';});
h+='</div></div>';
});
h+='<div class="sec-title"><span>二、多选题</span><span class="pt">20题×3分=60分</span></div>';
curQ.m.forEach(function(q,i){
n++;var id='m_'+i;
h+='<div class="q-card"><div class="q-text"><span class="q-num">'+n+'.</span>'+esc(q.q)+'<span class="q-pts">(3分)</span></div><div class="opts" id="o_'+id+'">';
q.o.forEach(function(o,oi){var l=String.fromCharCode(65+oi);h+='<label><input type="checkbox" onchange="togM('+i+','+oi+')"><span>'+l+'. '+esc(o)+'</span></label>';});
h+='</div></div>';
});
app.innerHTML=h;
}
function selS(i,oi){if(done)return;ans['s_'+i]=[oi];var ls=document.querySelectorAll('#o_s_'+i+' label');ls.forEach(function(el,idx){el.classList.toggle('sel',idx===oi);});upd();}
function togM(i,oi){if(done)return;if(!ans['m_'+i])ans['m_'+i]=[];var a=ans['m_'+i];var idx=a.indexOf(oi);if(idx===-1)a.push(oi);else a.splice(idx,1);var ls=document.querySelectorAll('#o_m_'+i+' label');ls.forEach(function(el,idx2){el.classList.toggle('sel',a.indexOf(idx2)!==-1);});upd();}
function upd(){
var n=0,sc=0;
curQ.s.forEach(function(x,i){if(ans['s_'+i]&&ans['s_'+i].length>0){n++;sc+=1;}});
curQ.m.forEach(function(x,i){if(ans['m_'+i]&&ans['m_'+i].length>0){n++;sc+=3;}});
document.getElementById('answeredCount').textContent=n;
document.getElementById('scoreDisplay').textContent=Math.min(sc,100);
}
function submitQuiz(){
if(done)return;done=true;
var btn=document.getElementById('submitBtn');
btn.disabled=true;btn.textContent='✅ 已提交';
try{var total=0;var dt=[];
curQ.s.forEach(function(q,i){
var ua=ans['s_'+i]||[];
var ok=ua.length>0&&ua[0]===q.a;
if(ok)total+=1;
var ls=document.querySelectorAll('#o_s_'+i+' label');
var userPick=ua.length>0?String.fromCharCode(65+ua[0])+'. '+q.o[ua[0]]:'(未选)';
var correctAns=String.fromCharCode(65+q.a)+'. '+q.o[q.a];
ls.forEach(function(el,oi){if(oi===q.a)el.classList.add('c');if(ua.length>0&&ua[0]===oi&&oi!==q.a)el.classList.add('w');});
dt.push({t:'s',q:q.q,e:q.e||'',ok:ok,pt:ok?1:0,mp:1,ua:userPick,ca:correctAns});
});
curQ.m.forEach(function(q,i){
var ua=ans['m_'+i]||[];
var hit=0,wrong=false;
if(ua.length>0){ua.forEach(function(v){if(q.a.indexOf(v)!==-1){hit++;}else{wrong=true;}});}
var sc=wrong?0:Math.round(300*hit/Math.max(q.a.length,1))/100;
if(sc>3)sc=3;
total+=sc;
var ls=document.querySelectorAll('#o_m_'+i+' label');
var userPick=ua.length>0?ua.map(function(v){return String.fromCharCode(65+v)+'. '+q.o[v]}).join('; '):'(未选)';
var correctAns=q.a.map(function(v){return String.fromCharCode(65+v)+'. '+q.o[v]}).join('; ');
ls.forEach(function(el,oi){if(q.a.indexOf(oi)!==-1)el.classList.add('c');if(ua.indexOf(oi)!==-1&&q.a.indexOf(oi)===-1)el.classList.add('w');});
dt.push({t:'m',q:q.q,e:q.e||'',ok:sc>=3,pt:sc,mp:3,ua:userPick,ca:correctAns});
});
showResults(total,dt);
}catch(e){alert('提交出错：'+e.message);done=false;btn.disabled=false;btn.textContent='📩 重新提交';}
}
function showResults(total,dt){
document.getElementById('app').style.display='none';
var rb=document.getElementById('resultBox');
rb.style.display='block';rb.classList.add('show');
var pass=total>=70;
var h='';
h+='<div class="result-hdr">';
h+='<div class="big-score'+(pass?'':' w')+'">'+total+'<span style="font-size:18px;font-weight:400;color:#6b7280">/100</span></div>';
h+='<div class="score-label">'+(pass?'🎉 恭喜通过！':'😅 未通过，再接再厉！')+'</div>';
var ss=0,ms=0;
dt.forEach(function(d){if(d.t==='s')ss+=d.pt;if(d.t==='m')ms+=d.pt;});
h+='<div class="score-detail"><span>单选: '+ss+'/40</span><span>多选: '+ms+'/60</span></div>';
h+='</div><div class="analysis-section">';
dt.forEach(function(d,i){
h+='<div class="analysis-item">';
h+='<div class="aq">'+(i+1)+'. '+esc(d.q)+' <span class="'+(d.ok?'correct-txt':'wrong-txt')+'">('+d.pt+'/'+d.mp+'分)</span></div>';
if(d.t==='s'||d.t==='m'){
h+='<div class="ad">你的答案：<span class="user-ans">'+esc(d.ua)+'</span>';
if(!d.ok)h+=' | 正确答案：<span class="corr-ans">'+esc(d.ca)+'</span>';
h+='</div>';
if(d.e)h+='<div class="ex"><div class="ex-t">📖 解析（书本原文）</div><div class="ex-b">'+esc(d.e)+'</div></div>';
}
h+='</div>';
});
h+='</div>';
document.getElementById('resultContent').innerHTML=h;
}
function reshuffle(){render();window.scrollTo(0,0);}
render();
</script></body></html>
